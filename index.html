<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Fan Racing</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="hud">

    <div id="title">
      GITHUB FAN RACING
      <span id="trackName">Forest Run</span>
    </div>

    <div id="topButtons">
      <button id="nextTrackBtn">NEXT TRACK</button>
      <button id="exitBtn">EXIT</button>
    </div>

    <div id="timer">00:00.000</div>

    <div id="message"></div>

    <div id="speed">
      <span id="speedValue">0</span> KM/H
    </div>

    <div id="checkpoint">
      0/0
    </div>

    <div id="controls">
      W — ACCELERATE<br>
      S — BRAKE / REVERSE<br>
      A / D — STEER<br>
      R — RESET<br>
      SPACE — RACE AGAIN
    </div>

  </div>


  <div id="customization">

    <h3>CAR COLORS</h3>

    <label>
      BODY
      <input type="color" id="bodyColor" value="#e10600">
    </label>

    <label>
      FRONT WING
      <input type="color" id="frontWingColor" value="#111111">
    </label>

    <label>
      REAR WING
      <input type="color" id="rearWingColor" value="#111111">
    </label>

  </div>


  <div id="finishScreen">

    <div class="panel">

      <h1>FINISH!</h1>

      <p id="finishTime">
        TIME: 00:00.000
      </p>

      <button id="raceAgainBtn">
        RACE AGAIN
      </button>

      <button id="finishNextBtn">
        NEXT TRACK
      </button>

      <button id="finishExitBtn">
        EXIT
      </button>

    </div>

  </div>


  <div id="exitScreen">

    <div class="panel">
