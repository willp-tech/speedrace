<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Turbo Track</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071018;
    font-family:Arial,Helvetica,sans-serif;
}
canvas{
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#topLeft{
    position:absolute;
    top:18px;
    left:20px;
}

#logo{
    font-size:28px;
    font-weight:900;
    letter-spacing:3px;
    text-shadow:0 3px 8px #000;
}

#trackName{
    margin-top:4px;
    font-size:13px;
    opacity:.75;
}

#timer{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:32px;
    font-weight:900;
    text-shadow:0 3px 8px #000;
}

#speed{
    position:absolute;
    left:24px;
    bottom:24px;
    font-size:31px;
    font-weight:900;
    text-shadow:0 3px 8px #000;
}

#speed small{
    font-size:13px;
    opacity:.7;
}

#checkpoint{
    position:absolute;
    right:24px;
    bottom:24px;
    font-size:26px;
    font-weight:900;
    text-shadow:0 3px 8px #000;
}

#message{
    position:absolute;
    top:95px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    font-size:20px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
}

#buttons{
    position:absolute;
    top:15px;
    right:15px;
    pointer-events:auto;
}

button{
    border:0;
    border-radius:7px;
    background:#171d25;
    color:white;
    padding:10px 14px;
    margin-left:5px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#303946;
}

#controls{
    position:absolute;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    opacity:.55;
}

.overlay{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.72);
    z-index:5;
}

.panel{
    min-width:340px;
    padding:40px;
    text-align:center;
    background:#10151c;
    border:1px solid rgba(255,255,255,.16);
    border-radius:15px;
    box-shadow:0 25px 80px #000;
}

.panel h1{
    margin:0 0 8px;
    font-size:46px;
}

.panel p{
    opacity:.7;
}

.bigButton{
    font-size:16px;
    padding:13px 20px;
}
</style>
</head>

<body>

<div id="hud">

    <div id="topLeft">
        <div id="logo">TURBO TRACK</div>
        <div id="trackName">TRACK 01</div>
    </div>

    <div id="timer">00:00.000</div>

    <div id="message">PRESS W TO START</div>

    <div id="speed">
        0 <small>KM/H</small>
    </div>

    <div id="checkpoint">0 / 10</div>

    <div id="buttons">
        <button id="newTrack">NEW TRACK</button>
        <button id="reset">RESET</button>
    </div>

    <div id="controls">
        W / ↑ ACCELERATE &nbsp;&nbsp;
        S / ↓ BRAKE &nbsp;&nbsp;
        A D / ← → STEER &nbsp;&nbsp;
        R RESET
    </div>
</div>

<div id="finishScreen" class="overlay">
    <div class="panel">
        <h1>FINISH!</h1>
        <p id="finalTime">00:00.000</p>
        <button class="bigButton" id="raceAgain">RACE AGAIN</button>
        <button class="bigButton" id="finishNewTrack">NEW TRACK</button>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";


// ============================================================
// SCENE
// ============================================================

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x77b4df);

scene.fog =
    new THREE.Fog(
        0x77b4df,
        250,
        1200
    );


const camera =
    new THREE.PerspectiveCamera(
        72,
        innerWidth/innerHeight,
        .1,
        2500
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

const ambient =
    new THREE.HemisphereLight(
        0xffffff,
        0x35424f,
        1.7
    );

scene.add(ambient);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.2
    );

sun.position.set(
    200,
    350,
    100
);

sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

scene.add(sun);


// ============================================================
// STATE
// ============================================================

const game={

    trackNumber:1,

    track:null,

    car:null,

    speed:0,

    steering:0,

    yaw:0,

    yawVelocity:0,

    airborne:false,

    verticalVelocity:0,

    started:false,

    finished:false,

    startTime:0,

    checkpoint:0,

    ghost:[],

    ghostCar:null,

    recordTimer:0,

    particles:[],

    cameraShake:0
};


// ============================================================
// INPUT
// ============================================================

const keys={};

addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if([
            "KeyW",
            "KeyA",
            "KeyS",
            "KeyD",
            "ArrowUp",
            "ArrowDown",
            "ArrowLeft",
            "ArrowRight",
            "Space"
        ].includes(e.code)){
            e.preventDefault();
        }

        if(e.code==="KeyR"){
            resetCar();
        }

    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


// ============================================================
// MATH
// ============================================================

function clamp(x,a,b){
    return Math.max(
        a,
        Math.min(b,x)
    );
}

function smooth(current,target,rate,dt){

    return current+
        (target-current)*
        (
            1-
            Math.exp(-rate*dt)
        );
}

function lerp(a,b,t){
    return a+(b-a)*t;
}


// ============================================================
// TRACK TYPES
// ============================================================

const environments=[

    {
        name:"GREEN VALLEY",
        sky:0x72b4dc,
        ground:0x3d803d,
        road:0x34373b
    },

    {
        name:"RED CANYON",
        sky:0xd59c78,
        ground:0x85553e,
        road:0x343236
    },

    {
        name:"FROZEN PASS",
        sky:0xa8cbe0,
        ground:0xc9d2d8,
        road:0x41454b
    },

    {
        name:"SUNSET DESERT",
        sky:0xe1a166,
        ground:0xa8754c,
        road:0x39363a
    }
];


// ============================================================
// PROCEDURAL TRACK
// ============================================================

function createTrack(){

    const environment =
        environments[
            (game.trackNumber-1)%
            environments.length
        ];

    scene.background.set(
        environment.sky
    );

    scene.fog.color.set(
        environment.sky
    );


    const group =
        new THREE.Group();

    const points=[];

    let position =
        new THREE.Vector3(
            0,
            0,
            0
        );

    let direction=0;

    const pointCount=38;


    for(let i=0;i<pointCount;i++){

        if(i>0){

            direction +=
                (Math.random()-.5)*.75;

            // Keep track flowing instead of creating
            // impossible hairpins everywhere.

            direction +=
                Math.sin(i*.47)*
                .12;

            const distance =
                24+
                Math.random()*18;

            position =
                position.clone().add(
                    new THREE.Vector3(
                        Math.sin(direction),
                        0,
                        Math.cos(direction)
                    ).multiplyScalar(
                        distance
                    )
                );

            // Rolling hills.

            position.y =
                Math.sin(i*.55)*5+
                Math.sin(i*1.13)*2+
                (Math.random()-.5)*3;

        }

        points.push(
            position.clone()
        );
    }


    const curve =
        new THREE.CatmullRomCurve3(
            points,
            false,
            "catmullrom",
            .5
        );


    game.track={

        curve,

        width:
            18+
            Math.random()*3,

        samples:900,

        checkpoints:[],

        finish:.985,

        environment
    };


    buildGround(group);

    buildTrack(group);

    buildTrackFeatures(group);

    buildCheckpoints(group);

    buildScenery(group);


    scene.add(group);
}


// ============================================================
// TRACK MATH
// ============================================================

function pointAt(t){

    return game.track.curve
        .getPointAt(
            clamp(t,0,1)
        );
}

function tangentAt(t){

    return game.track.curve
        .getTangentAt(
            clamp(t,0,1)
        )
        .normalize();
}

function headingAt(t){

    const tangent =
        tangentAt(t);

    return Math.atan2(
        tangent.x,
        tangent.z
    );
}


// ============================================================
// GROUND
// ============================================================

function buildGround(parent){

    const material =
        new THREE.MeshStandardMaterial({
            color:
                game.track.environment.ground,
            roughness:1
        });

    const ground =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                3000,
                3000
            ),
            material
        );

    ground.rotation.x=
        -Math.PI/2;

    ground.position.y=-9;

    ground.receiveShadow=true;

    parent.add(ground);
}


// ============================================================
// TRACK SURFACE
// ============================================================

function buildTrack(parent){

    const width=
        game.track.width;

    const segments=
        game.track.samples;

    const positions=[];
    const indices=[];


    for(let i=0;i<=segments;i++){

        const t=i/segments;

        const p=pointAt(t);

        const tangent=
            tangentAt(t);

        const side=
            new THREE.Vector3(
                tangent.z,
                0,
                -tangent.x
            ).normalize();


        // Track banking.
        //
        // The bank changes smoothly along
        // the course.

        const bank =
            Math.sin(
                t*Math.PI*9+
                game.trackNumber
            )*
            .12;


        const up =
            new THREE.Vector3(
                0,
                1,
                0
            );


        const left =
            p.clone()
            .addScaledVector(
                side,
                width/2
            );

        const right =
            p.clone()
            .addScaledVector(
                side,
                -width/2
            );


        left.y +=
            Math.sin(bank)*
            width/2;

        right.y -=
            Math.sin(bank)*
            width/2;


        positions.push(
            left.x,left.y,left.z,
            right.x,right.y,right.z
        );


        if(i<segments){

            const n=i*2;

            indices.push(
                n,n+1,n+2,
                n+1,n+3,n+2
            );
        }
    }


    const geometry =
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setIndex(indices);

    geometry.computeVertexNormals();


    const material =
        new THREE.MeshStandardMaterial({
            color:
                game.track.environment.road,
            roughness:.88,
            metalness:.05
        });


    const road =
        new THREE.Mesh(
            geometry,
            material
        );

    road.receiveShadow=true;

    parent.add(road);


    // EDGE STRIPES

    const stripeMaterial =
        new THREE.MeshBasicMaterial({
            color:0xf5f5f5
        });


    for(const sideSign of [-1,1]){

        const pts=[];

        for(let i=0;i<=segments;i+=2){

            const t=i/segments;

            const p=pointAt(t);

            const tangent=
                tangentAt(t);

            const side=
                new THREE.Vector3(
                    tangent.z,
                    0,
                    -tangent.x
                ).normalize();


            pts.push(
                p.clone()
                .addScaledVector(
                    side,
                    sideSign*
                    (width/2-.25)
                )
                .add(
                    new THREE.Vector3(
                        0,
                        .12,
                        0
                    )
                )
            );
        }


        const lineGeometry =
            new THREE.BufferGeometry()
            .setFromPoints(pts);


        parent.add(
            new THREE.Line(
                lineGeometry,
                stripeMaterial
            )
        );
    }
}


// ============================================================
// TRACK FEATURES
// ============================================================

function buildTrackFeatures(parent){

    const width=
        game.track.width;


    // Red/white curb blocks.

    for(let i=0;i<game.track.samples;i+=7){

        const t=
            i/game.track.samples;

        const p=
            pointAt(t);

        const tangent=
            tangentAt(t);

        const side=
            new THREE.Vector3(
                tangent.z,
                0,
                -tangent.x
            ).normalize();


        const material =
            new THREE.MeshStandardMaterial({
                color:
                    (Math.floor(i/7)%2===0)
                    ?0xf2f2f2
                    :0xd91d2b
            });


        for(const s of [-1,1]){

            const curb =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        2.0,
                        .16,
                        3.2
                    ),
                    material
                );


            curb.position.copy(p)
                .addScaledVector(
                    side,
                    s*(width/2+.8)
                );


            curb.position.y+=.08;

            curb.rotation.y=
                headingAt(t);

            curb.receiveShadow=true;

            parent.add(curb);
        }
    }


    // BOOST PADS

    for(let i=0;i<10;i++){

        const t=
            .10+
            i*.075;

        const p=pointAt(t);

        const tangent=
            tangentAt(t);

        const boost=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width*.55,
                    .08,
                    7
                ),
                new THREE.MeshStandardMaterial({
                    color:0x28d9ff,
                    emissive:0x0088aa,
                    emissiveIntensity:2
                })
            );


        boost.position.copy(p);

        boost.position.y+=.12;

        boost.rotation.y=
            headingAt(t);

        parent.add(boost);
    }


    // RAMPS / JUMPS

    const jumpLocations=[
        .27,
        .58,
        .78
    ];


    for(const t of jumpLocations){

        const p=pointAt(t);

        const tangent=
            tangentAt(t);


        const ramp =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    width*.8,
                    .8,
                    9
                ),
                new THREE.MeshStandardMaterial({
                    color:0x454a52,
                    roughness:.7
                })
            );


        ramp.position.copy(p);

        ramp.position.y+=.45;

        ramp.rotation.y=
            headingAt(t);


        // Make the ramp point upward.

        ramp.rotation.x=
            -.12;


        ramp.castShadow=true;

        parent.add(ramp);
    }
}


// ============================================================
// CHECKPOINT GATES
// ============================================================

function buildCheckpoints(parent){

    const count=10;

    game.track.checkpoints=[];


    for(let i=1;i<=count;i++){

        const t=
            .055+
            i*
            (.87/(count+1));

        game.track.checkpoints.push(t);

        makeGate(
            parent,
            t,
            false
        );
    }


    makeGate(
        parent,
        game.track.finish,
        true
    );
}


function makeGate(parent,t,finish){

    const p=pointAt(t);

    const color=
        finish
        ?0xff2727
        :0xffd900;


    const material =
        new THREE.MeshStandardMaterial({
            color,
            emissive:color,
            emissiveIntensity:.35
        });


    const gate=
        new THREE.Group();


    const left=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .65,
                8,
                .65
            ),
            material
        );


    const right=
        left.clone();


    const top=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                game.track.width,
                .65,
                .65
            ),
            material
        );


    left.position.x=
        -game.track.width/2;

    right.position.x=
        game.track.width/2;

    top.position.y=8;


    gate.add(
        left,
        right,
        top
    );


    gate.position.copy(p);

    gate.rotation.y=
        headingAt(t);


    parent.add(gate);
}


// ============================================================
// SCENERY
// ============================================================

function buildScenery(parent){

    const environment=
        game.track.environment;


    for(let i=0;i<170;i++){

        const t=Math.random();

        const p=pointAt(t);

        const tangent=
            tangentAt(t);

        const side=
            new THREE.Vector3(
                tangent.z,
                0,
                -tangent.x
            ).normalize();


        const distance=
            40+
            Math.random()*130;

        const sign=
            Math.random()<.5
            ?-1
            :1;


        const object=
            new THREE.Group();


        if(
            environment.name==="GREEN VALLEY"
        ){

            const trunk=
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .4,
                        .7,
                        7,
                        7
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x65432d
                    })
                );

            trunk.position.y=3.5;


            const crown=
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        4.5,
                        10,
                        7
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x27662d
                    })
                );

            crown.position.y=9;


            object.add(
                trunk,
                crown
            );

        }else{

            const rock=
                new THREE.Mesh(
                    new THREE.DodecahedronGeometry(
                        3+
                        Math.random()*6
                    ),
                    new THREE.MeshStandardMaterial({
                        color:
                            environment.name==="FROZEN PASS"
                            ?0xdce3e7
                            :0x78503d
                    })
                );

            rock.position.y=2;

            object.add(rock);
        }


        object.position.copy(p)
            .addScaledVector(
                side,
                sign*distance
            );


        parent.add(object);
    }
}


// ============================================================
// CAR
// ============================================================

function createCar(){

    const root=
        new THREE.Group();


    // IMPORTANT:
    // The car itself faces +Z.
    // No backwards physics.
    // No hidden 180° physics correction.

    const bodyGroup=
        new THREE.Group();

    root.add(bodyGroup);


    const red=
        new THREE.MeshStandardMaterial({
            color:0xd71920,
            metalness:.35,
            roughness:.3
        });


    const black=
        new THREE.MeshStandardMaterial({
            color:0x101217,
            metalness:.65,
            roughness:.22
        });


    const white=
        new THREE.MeshStandardMaterial({
            color:0xe8e8e8,
            metalness:.25,
            roughness:.3
        });


    // BODY

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.3,
                .62,
                5.2
            ),
            red
        );

    body.position.y=.95;

    body.castShadow=true;

    bodyGroup.add(body);


    // NOSE POINTS FORWARD +Z

    const nose=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                1.05,
                3.1,
                4
            ),
            red
        );

    nose.rotation.x=
        Math.PI/2;

    nose.position.set(
        0,
        .98,
        3.8
    );

    nose.castShadow=true;

    bodyGroup.add(nose);


    // SIDE PODS

    for(const x of [-1.25,1.25]){

        const pod=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1,
                    .7,
                    2.6
                ),
                red
            );

        pod.position.set(
            x,
            .92,
            .3
        );

        pod.castShadow=true;

        bodyGroup.add(pod);
    }


    // COCKPIT

    const cockpit=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.25,
                .5,
                1.5
            ),
            black
        );

    cockpit.position.set(
        0,
        1.55,
        -.1
    );

    bodyGroup.add(cockpit);


    // DRIVER

    const helmet=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .43,
                16,
                12
            ),
            white
        );

    helmet.position.set(
        0,
        1.98,
        -.15
    );

    helmet.castShadow=true;

    bodyGroup.add(helmet);


    // FRONT WING

    const frontWing=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                4.1,
                .13,
                .65
            ),
            white
        );

    frontWing.position.set(
        0,
        .5,
        5.2
    );

    bodyGroup.add(frontWing);


    // REAR WING

    const rearWing=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.8,
                .16,
                .55
            ),
            white
        );

    rearWing.position.set(
        0,
        2.15,
        -2.45
    );

    bodyGroup.add(rearWing);


    // WHEELS

    const wheels=[];


    function wheel(x,z,front){

        const steering=
            new THREE.Group();

        steering.position.set(
            x,
            .52,
            z
        );

        bodyGroup.add(steering);


        const roll=
            new THREE.Group();

        steering.add(roll);


        const tire=
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .57,
                    .57,
                    .42,
                    18
                ),
                black
            );

        tire.rotation.z=
            Math.PI/2;

        tire.castShadow=true;

        roll.add(tire);


        const hub=
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .25,
                    .25,
                    .44,
                    12
                ),
                white
            );

        hub.rotation.z=
            Math.PI/2;

        roll.add(hub);


        wheels.push({
            steering,
            roll,
            front
        });
    }


    wheel(-1.38,2.05,true);
    wheel(1.38,2.05,true);

    wheel(-1.38,-1.95,false);
    wheel(1.38,-1.95,false);


    // BRAKE LIGHTS

    const brakeMaterial=
        new THREE.MeshBasicMaterial({
            color:0x550000
        });


    const brakeLights=[];


    for(const x of [-.75,.75]){

        const light=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .5,
                    .18,
                    .08
                ),
                brakeMaterial
            );

        light.position.set(
            x,
            1.15,
            -2.7
        );

        bodyGroup.add(light);

        brakeLights.push(light);
    }


    root.userData={
        wheels,
        brakeLights
    };


    return root;
}


// ============================================================
// RESET
// ============================================================

function resetCar(){

    if(!game.car)return;


    const startT=.01;

    const p=
        pointAt(startT);

    game.car.position.copy(p);

    game.car.position.y+=1;


    // CAR'S +Z POINTS DIRECTLY ALONG
    // THE START OF THE TRACK.

    game.car.rotation.y=
        headingAt(startT);


    game.speed=0;

    game.steering=0;

    game.yawVelocity=0;

    game.verticalVelocity=0;

    game.airborne=false;

    game.started=false;

    game.finished=false;

    game.checkpoint=0;

    game.ghost=[];

    game.recordTimer=0;


    document.getElementById(
        "message"
    ).textContent=
        "PRESS W TO START";

    document.getElementById(
        "checkpoint"
    ).textContent=
        "0 / "+
        game.track.checkpoints.length;
}


// ============================================================
// TRACK POSITION
// ============================================================

function closestTrackT(position){

    let bestT=0;
    let best=Infinity;


    // Dense enough for smooth gameplay.

    for(
        let i=0;
        i<=game.track.samples;
        i+=3
    ){

        const t=
            i/game.track.samples;

        const p=
            pointAt(t);

        const dx=
            position.x-p.x;

        const dz=
            position.z-p.z;

        const distance=
            dx*dx+
            dz*dz;


        if(distance<best){

            best=distance;
            bestT=t;
        }
    }


    return bestT;
}


// ============================================================
// GHOST
// ============================================================

function saveGhost(){

    if(!game.ghost.length)return;

    try{

        localStorage.setItem(
            "turboGhost"+
            game.trackNumber,

            JSON.stringify(
                game.ghost
            )
        );

    }catch(e){}
}


function loadGhost(){

    game.ghost=[];


    try{

        const data=
            localStorage.getItem(
                "turboGhost"+
                game.trackNumber
            );

        if(data){

            game.ghost=
                JSON.parse(data);
        }

    }catch(e){}
}


function createGhost(){

    if(game.ghostCar){

        scene.remove(
            game.ghostCar
        );
    }


    if(!game.ghost.length){

        game.ghostCar=null;
        return;
    }


    const ghost=
        createCar();


    ghost.traverse(
        object=>{

            if(object.isMesh){

                object.material=
                    object.material.clone();

                object.material.transparent=true;

                object.material.opacity=.22;
            }
        }
    );


    scene.add(ghost);

    game.ghostCar=ghost;
}


function updateGhost(){

    if(
        !game.ghostCar ||
        !game.ghost.length ||
        !game.started
    )return;


    const time=
        (
            performance.now()-
            game.startTime
        )/1000;


    let a=null;
    let b=null;


    for(
        let i=0;
        i<game.ghost.length-1;
        i++
    ){

        if(
            game.ghost[i].time<=time &&
            game.ghost[i+1].time>=time
        ){

            a=game.ghost[i];
            b=game.ghost[i+1];

            break;
        }
    }


    if(!a || !b)return;


    const amount=
        (time-a.time)/
        Math.max(
            .001,
            b.time-a.time
        );


    game.ghostCar.position.lerpVectors(
        new THREE.Vector3(
            a.x,a.y,a.z
        ),
        new THREE.Vector3(
            b.x,b.y,b.z
        ),
        amount
    );


    game.ghostCar.rotation.y=
        THREE.MathUtils.lerp(
            a.rotation,
            b.rotation,
            amount
        );
}


// ============================================================
// CHECKPOINTS
// ============================================================

function updateCheckpoints(){

    const t=
        closestTrackT(
            game.car.position
        );


    if(
        game.checkpoint<
        game.track.checkpoints.length
    ){

        const target=
            game.track.checkpoints[
                game.checkpoint
            ];


        if(
            t>
            target-.018
        ){

            game.checkpoint++;

            game.cameraShake=.12;
        }
    }


    document.getElementById(
        "checkpoint"
    ).textContent=
        game.checkpoint+
        " / "+
        game.track.checkpoints.length;
}


// ============================================================
// FINISH
// ============================================================

function checkFinish(){

    if(game.finished)return;


    const t=
        closestTrackT(
            game.car.position
        );


    if(
        game.checkpoint>=
        game.track.checkpoints.length &&

        t>
        game.track.finish-.02
    ){

        game.finished=true;

        game.speed=0;

        const elapsed=
            performance.now()-
            game.startTime;


        document.getElementById(
            "finalTime"
        ).textContent=
            formatTime(elapsed);


        document.getElementById(
            "finishScreen"
        ).style.display="flex";


        saveGhost();
    }
}


// ============================================================
// TIME
// ============================================================

function formatTime(ms){

    const seconds=
        ms/1000;

    const minutes=
        Math.floor(
            seconds/60
        );

    const sec=
        Math.floor(
            seconds%60
        );

    const milli=
        Math.floor(
            (seconds%1)*1000
        );


    return (
        String(minutes).padStart(2,"0")
        +":"+
        String(sec).padStart(2,"0")
        +"."+
        String(milli).padStart(3,"0")
    );
}


// ============================================================
// BOOST / JUMP PHYSICS
// ============================================================

function checkBoostAndJump(){

    const t=
        closestTrackT(
            game.car.position
        );


    // BOOST STRIPS

    const boostIndex=
        Math.floor(
            (t-.1)/.075
        );


    const boostT=
        .1+
        boostIndex*.075;


    if(
        Math.abs(t-boostT)<.009 &&
        game.speed>20
    ){

        game.speed=
            Math.min(
                145,
                game.speed+28
            );
    }


    // JUMPS

    const jumps=[
        .27,
        .58,
        .78
    ];


    for(const jump of jumps){

        if(
            Math.abs(t-jump)<.008 &&
            !game.airborne &&
            game.speed>35
        ){

            game.airborne=true;

            game.verticalVelocity=
                8+
                game.speed*.075;

            game.cameraShake=.3;
        }
    }
}


// ============================================================
// PHYSICS
// ============================================================

function updatePhysics(dt){

    if(game.finished)return;


    const throttle=
        keys["KeyW"] ||
        keys["ArrowUp"];


    const brake=
        keys["KeyS"] ||
        keys["ArrowDown"];


    const left=
        keys["KeyA"] ||
        keys["ArrowLeft"];


    const right=
        keys["KeyD"] ||
        keys["ArrowRight"];


    // START

    if(
        throttle &&
        !game.started
    ){

        game.started=true;

        game.startTime=
            performance.now();

        document.getElementById(
            "message"
        ).textContent="";
    }


    // STEERING

    let input=0;

    if(left)input=-1;
    if(right)input=1;


    game.steering=
        smooth(
            game.steering,
            input,
            input===0
            ?10
            :7,
            dt
        );


    // ACCELERATION

    if(throttle){

        const acceleration=
            game.speed<80
            ?55
            :34;


        game.speed+=
            acceleration*dt;
    }


    // BRAKING

    if(brake){

        if(game.speed>5){

            game.speed-=
                95*dt;

        }else{

            game.speed-=
                25*dt;
        }
    }


    // DRAG

    if(
        !throttle &&
        !brake
    ){

        game.speed=
            smooth(
                game.speed,
                0,
                .65,
                dt
            );
    }


    game.speed=
        clamp(
            game.speed,
            0,
            145
        );


    // ========================================================
    // NATURAL HIGH-SPEED STEERING
    // ========================================================

    const speedRatio=
        clamp(
            game.speed/145,
            0,
            1
        );


    const maxSteering=
        THREE.MathUtils.degToRad(
            lerp(
                34,
                12,
                speedRatio
            )
        );


    const steeringAngle=
        game.steering*
        maxSteering;


    // Front wheels physically steer.

    for(
        const wheel of
        game.car.userData.wheels
    ){

        if(wheel.front){

            wheel.steering.rotation.y=
                smooth(
                    wheel.steering.rotation.y,
                    steeringAngle,
                    12,
                    dt
                );
        }
    }


    // Arcade bicycle steering.

    const wheelBase=4.6;


    const desiredYaw=
        Math.tan(
            steeringAngle
        )*
        (
            game.speed/
            Math.max(
                1,
                wheelBase
            )
        );


    // Reduce twitchiness at very high speed.

    const stability=
        lerp(
            1,
            .62,
            speedRatio
        );


    const targetYaw=
        desiredYaw*
        stability;


    game.yawVelocity=
        smooth(
            game.yawVelocity,
            targetYaw,
            7,
            dt
        );


    game.car.rotation.y+=
        game.yawVelocity*dt;


    // ========================================================
    // FORWARD VECTOR
    // ========================================================

    const forward=
        new THREE.Vector3(
            0,
            0,
            1
        ).applyQuaternion(
            game.car.quaternion
        );


    // ========================================================
    // AIRBORNE
    // ========================================================

    if(game.airborne){

        game.verticalVelocity -=
            22*dt;

        game.car.position.y +=
            game.verticalVelocity*dt;


        if(
            game.car.position.y<=
            pointAt(
                closestTrackT(
                    game.car.position
                )
            ).y+1
        ){

            game.airborne=false;

            game.verticalVelocity=0;

            game.car.position.y=
                pointAt(
                    closestTrackT(
                        game.car.position
                    )
                ).y+1;

            game.cameraShake=.18;
        }

    }else{

        const t=
            closestTrackT(
                game.car.position
            );

        const trackY=
            pointAt(t).y+1;

        game.car.position.y=
            smooth(
                game.car.position.y,
                trackY,
                9,
                dt
            );
    }


    // ========================================================
    // MOVE
    // ========================================================

    game.car.position.add(
        forward.multiplyScalar(
            game.speed*dt
        )
    );


    // ========================================================
    // OFF TRACK
    // ========================================================

    const t=
        closestTrackT(
            game.car.position
        );


    const trackPoint=
        pointAt(t);


    const distance=
        Math.hypot(
            game.car.position.x-
            trackPoint.x,

            game.car.position.z-
            trackPoint.z
        );


    if(
        distance>
        game.track.width*.72
    ){

        game.speed=
            smooth(
                game.speed,
                0,
                2.5,
                dt
            );
    }


    // ========================================================
    // WHEEL ROTATION
    // ========================================================

    const wheelRotation=
        game.speed*
        dt/
        .57;


    for(
        const wheel of
        game.car.userData.wheels
    ){

        wheel.roll.rotation.x-=
            wheelRotation;
    }


    // ========================================================
    // BRAKE LIGHTS
    // ========================================================

    for(
        const light of
        game.car.userData.brakeLights
    ){

        light.material.color.set(
            brake
            ?0xff0000
            :0x550000
        );
    }


    // ========================================================
    // CAMERA SHAKE
    // ========================================================

    game.cameraShake=
        Math.max(
            0,
            game.cameraShake-
            dt
        );


    checkBoostAndJump();

    updateCheckpoints();

    checkFinish();


    // ========================================================
    // RECORD GHOST
    // ========================================================

    if(game.started){

        game.recordTimer-=dt;

        if(game.recordTimer<=0){

            game.recordTimer=.06;

            const elapsed=
                (
                    performance.now()-
                    game.startTime
                )/1000;


            game.ghost.push({

                time:elapsed,

                x:game.car.position.x,

                y:game.car.position.y,

                z:game.car.position.z,

                rotation:
                    game.car.rotation.y
            });
        }
    }
}


// ============================================================
// CAMERA
// ============================================================

function updateCamera(dt){

    if(!game.car)return;


    const forward=
        new THREE.Vector3(
            0,
            0,
            1
        ).applyQuaternion(
            game.car.quaternion
        );


    const speedRatio=
        clamp(
            game.speed/145,
            0,
            1
        );


    // Camera pulls farther away as speed increases.

    const distance=
        lerp(
            9,
            15,
            speedRatio
        );


    const height=
        lerp(
            4.5,
            6.5,
            speedRatio
        );


    const desired=
        game.car.position.clone()
        .addScaledVector(
            forward,
            -distance
        );


    desired.y+=height;


    // Camera shake from jumps/checkpoints.

    if(game.cameraShake>0){

        desired.x+=
            (Math.random()-.5)*
            game.cameraShake;

        desired.y+=
            (Math.random()-.5)*
            game.cameraShake;
    }


    camera.position.lerp(
        desired,
        1-
        Math.exp(-7*dt)
    );


    const lookAt=
        game.car.position.clone()
        .addScaledVector(
            forward,
            12+
            speedRatio*8
        );


    lookAt.y+=.7;


    const direction=
        lookAt.clone()
        .sub(camera.position)
        .normalize();


    const targetQuaternion=
        new THREE.Quaternion()
        .setFromUnitVectors(
            new THREE.Vector3(
                0,
                0,
                -1
            ),
            direction
        );


    camera.quaternion.slerp(
        targetQuaternion,
        1-
        Math.exp(-8*dt)
    );
}


// ============================================================
// LOAD GAME
// ============================================================

function loadGame(){

    // Remove old track.

    for(
        let i=scene.children.length-1;
        i>=0;
        i--
    ){

        const object=
            scene.children[i];

        if(
            object!==ambient &&
            object!==sun
        ){

            scene.remove(object);
        }
    }


    game.track=null;


    createTrack();


    game.car=
        createCar();


    scene.add(
        game.car
    );


    resetCar();


    loadGhost();

    createGhost();


    document.getElementById(
        "trackName"
    ).textContent=
        "TRACK "+
        String(game.trackNumber)
        .padStart(2,"0")+
        " — "+
        game.track.environment.name;
}


// ============================================================
// NEW TRACK
// ============================================================

function newTrack(){

    document.getElementById(
        "finishScreen"
    ).style.display="none";

    game.trackNumber++;

    loadGame();
}


// ============================================================
// RACE AGAIN
// ============================================================

function raceAgain(){

    document.getElementById(
        "finishScreen"
    ).style.display="none";

    resetCar();

    game.started=true;

    game.startTime=
        performance.now();

    game.ghost=[];

    document.getElementById(
        "message"
    ).textContent="";
}


// ============================================================
// BUTTONS
// ============================================================

document.getElementById(
    "newTrack"
).onclick=newTrack;


document.getElementById(
    "reset"
).onclick=resetCar;


document.getElementById(
    "raceAgain"
).onclick=raceAgain;


document.getElementById(
    "finishNewTrack"
).onclick=newTrack;


// ============================================================
// RESIZE
// ============================================================

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


// ============================================================
// MAIN LOOP
// ============================================================

let lastTime=
    performance.now();


function animate(){

    requestAnimationFrame(
        animate
    );


    const now=
        performance.now();


    let dt=
        (now-lastTime)/1000;


    lastTime=now;


    dt=
        Math.min(
            dt,
            .035
        );


    updatePhysics(dt);

    updateGhost();

    updateCamera(dt);


    // HUD

    document.getElementById(
        "speed"
    ).innerHTML=
        Math.round(
            game.speed*3.6
        )+
        ' <small>KM/H</small>';


    if(
        game.started &&
        !game.finished
    ){

        document.getElementById(
            "timer"
        ).textContent=
            formatTime(
                now-game.startTime
            );
    }


    renderer.render(
        scene,
        camera
    );
}


// ============================================================
// GO
// ============================================================

loadGame();

animate();

</script>
