<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HyperTrack Racing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#79a9c9;font-family:Arial,Helvetica,sans-serif;color:#fff}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}

#hud{position:fixed;inset:0;pointer-events:none;user-select:none}
.panel{
    background:rgba(5,8,12,.74);
    border:1px solid rgba(255,255,255,.15);
    border-radius:9px;
    backdrop-filter:blur(7px);
    box-shadow:0 8px 30px rgba(0,0,0,.28)
}
.top{
    position:absolute;
    top:17px;
    left:17px;
    right:17px;
    display:flex;
    justify-content:space-between
}
#raceInfo{padding:11px 15px;min-width:230px}
#trackName{font-size:12px;letter-spacing:2px;opacity:.68;margin-bottom:4px}
#difficulty{font-size:10px;letter-spacing:1.5px;opacity:.45}
#position{font-size:34px;font-weight:900;line-height:1;margin-top:4px}
#position small{font-size:14px;opacity:.55}
#timeBox{padding:11px 17px;min-width:190px;text-align:right}
#time{font-size:25px;font-weight:900;font-variant-numeric:tabular-nums}
#best{font-size:11px;opacity:.55;margin-top:3px}
#speedBox{position:absolute;left:18px;bottom:18px;padding:13px 18px;min-width:215px}
#speed{font-size:44px;font-weight:900;line-height:.9;font-variant-numeric:tabular-nums}
#speedUnit{font-size:10px;letter-spacing:2px;opacity:.5;margin-top:4px}
#gear{
    position:absolute;
    right:19px;
    bottom:19px;
    width:82px;
    height:82px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:39px;
    font-weight:900
}
#controls{
    position:absolute;
    bottom:17px;
    left:50%;
    transform:translateX(-50%);
    padding:7px 13px;
    font-size:10px;
    opacity:.72;
    white-space:nowrap
}
#countdown{
    position:absolute;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    font-size:115px;
    font-weight:1000;
    font-style:italic;
    text-shadow:0 8px 30px #000
}
#message{
    position:absolute;
    left:50%;
    top:38%;
    transform:translate(-50%,-50%);
    text-align:center;
    font-size:43px;
    font-weight:1000;
    text-shadow:0 5px 25px #000
}
#message small{
    display:block;
    font-size:13px;
    opacity:.7;
    letter-spacing:2px;
    margin-top:7px
}
#minimap{
    position:absolute;
    top:106px;
    right:17px;
    width:190px;
    height:145px;
    overflow:hidden;
    border-radius:8px;
    border:1px solid rgba(255,255,255,.12);
    background:rgba(5,8,11,.72)
}
#mapCanvas{width:100%;height:100%}
#speedLines{
    position:absolute;
    inset:0;
    opacity:0;
    background:
      linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);
    mix-blend-mode:screen
}
#flash{position:absolute;inset:0;background:white;opacity:0}
#trackSelect{
    position:absolute;
    left:50%;
    top:13%;
    transform:translateX(-50%);
    padding:7px 13px;
    font-size:11px;
    letter-spacing:1px;
    opacity:.65
}
</style>
</head>

<body>
<div id="game"></div>

<div id="hud">

    <div class="top">
        <div id="raceInfo" class="panel">
            <div id="trackName">SUNSET GRAND PRIX</div>
            <div id="difficulty">MEDIUM</div>
            <div id="position">1<small> / 11</small></div>
        </div>

        <div id="timeBox" class="panel">
            <div id="time">00:00.000</div>
            <div id="best">BEST --:--.---</div>
        </div>
    </div>

    <div id="trackSelect" class="panel">
        N = NEXT TRACK
    </div>

    <div id="minimap">
        <canvas id="mapCanvas" width="380" height="290"></canvas>
    </div>

    <div id="countdown">3</div>
    <div id="message"></div>

    <div id="speedBox" class="panel">
        <div id="speed">0</div>
        <div id="speedUnit">KM/H</div>
    </div>

    <div id="gear" class="panel">N</div>

    <div id="controls" class="panel">
        W / ↑ THROTTLE &nbsp; A / ← LEFT &nbsp; D / → RIGHT &nbsp;
        S / ↓ BRAKE &nbsp; SPACE HANDBRAKE &nbsp; R RESET &nbsp; N NEXT TRACK
    </div>

    <div id="speedLines"></div>
    <div id="flash"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* ============================================================
   RENDERER
============================================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x82b0d0);
scene.fog = new THREE.Fog(0x82b0d0,700,5000);

const camera = new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    .05,
    6000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.08;

document.getElementById("game").appendChild(renderer.domElement);


/* ============================================================
   LIGHTING
============================================================ */

scene.add(
    new THREE.HemisphereLight(
        0xeaf6ff,
        0x30372b,
        2.0
    )
);

const sun = new THREE.DirectionalLight(0xffffff,3.3);
sun.position.set(-600,900,-500);
sun.castShadow=true;
sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;
sun.shadow.camera.left=-1400;
sun.shadow.camera.right=1400;
sun.shadow.camera.top=1400;
sun.shadow.camera.bottom=-1400;
sun.shadow.camera.near=1;
sun.shadow.camera.far=3500;
scene.add(sun);


/* ============================================================
   MATERIALS
============================================================ */

function material(color,rough=.6,metal=.05){
    return new THREE.MeshStandardMaterial({
        color,
        roughness:rough,
        metalness:metal
    });
}

const MAT = {
    asphalt:material(0x55585b,.92,.02),
    asphalt2:material(0x4b4e51,.94,.01),
    asphaltPatch:material(0x414447,.98,.01),
    grass:material(0x456c3e,1,0),
    curbRed:material(0xc82e32,.72,.04),
    curbWhite:material(0xf2f0e7,.7,.03),
    barrier:material(0xd6d9dc,.52,.25),
    barrierDark:material(0x202326,.35,.5),
    black:material(0x08090b,.3,.65),
    carbon:material(0x17191c,.4,.55),
    glass:new THREE.MeshStandardMaterial({
        color:0x06131d,
        roughness:.08,
        metalness:.75,
        transparent:true,
        opacity:.86
    }),
    white:material(0xf0f1ed,.38,.12),
    concrete:material(0x777b7e,.92),
    stand:material(0x34383d,.85),
    seat:material(0x1b1d21,.8),
    red:material(0xd51f2b,.55),
    yellow:material(0xe7bb2e,.6),
    blue:material(0x2365a5,.58)
};


/* ============================================================
   GROUND
============================================================ */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(9000,9000),
    MAT.grass
);

ground.rotation.x=-Math.PI/2;
ground.position.y=-.12;
ground.receiveShadow=true;
scene.add(ground);


/* ============================================================
   TRACK DEFINITIONS
============================================================ */

const TRACKS = [

{
    name:"SUNSET GRAND PRIX",
    difficulty:"EASY",
    points:[
        [0,-700],[360,-700],[640,-610],[790,-400],
        [800,-120],[720,100],[510,230],[230,240],
        [70,140],[30,-20],[-110,-65],[-280,20],
        [-470,190],[-730,170],[-880,0],[-880,-250],
        [-730,-450],[-480,-580],[-220,-660]
    ]
},

{
    name:"COASTAL GP",
    difficulty:"MEDIUM",
    points:[
        [0,-760],[420,-760],[690,-680],[850,-500],
        [890,-270],[820,-80],[650,0],[410,-10],
        [290,-120],[170,-170],[60,-80],[-70,50],
        [-290,100],[-520,30],[-690,-100],[-850,-70],
        [-940,100],[-880,300],[-680,420],[-390,390],
        [-170,250],[-20,100],[-120,-80],[-350,-250],
        [-500,-430],[-300,-600]
    ]
},

{
    name:"MOUNTAIN RING",
    difficulty:"HARD",
    points:[
        [0,-800],[420,-800],[720,-690],[850,-480],
        [850,-250],[760,-80],[600,-10],[390,-30],
        [270,-140],[190,-300],[50,-390],[-110,-350],
        [-220,-230],[-300,-40],[-480,60],[-700,30],
        [-900,-80],[-1010,-280],[-980,-500],
        [-820,-650],[-570,-760],[-290,-820]
    ]
},

{
    name:"APEX NIGHTMARE",
    difficulty:"EXTREME",
    points:[
        [0,-900],[330,-900],[610,-820],[790,-650],
        [900,-430],[880,-250],[780,-150],[620,-130],
        [510,-220],[470,-380],[360,-470],[210,-430],
        [130,-300],[30,-230],[-80,-280],[-140,-410],
        [-270,-500],[-450,-470],[-560,-330],[-530,-170],
        [-400,-80],[-410,80],[-550,170],[-770,150],
        [-930,30],[-1010,-150],[-980,-350],[-850,-520],
        [-650,-690],[-390,-820]
    ]
},

{
    name:"GRAND TOURING LOOP",
    difficulty:"MEDIUM",
    points:[
        [0,-850],[500,-850],[820,-700],[950,-450],
        [920,-180],[760,20],[500,90],[270,40],
        [170,-100],[200,-250],[80,-350],[-100,-340],
        [-210,-220],[-260,-50],[-410,70],[-650,80],
        [-850,-20],[-930,-210],[-880,-400],[-700,-560],
        [-470,-680],[-220,-760]
    ]
},

{
    name:"HAIRPIN VALLEY",
    difficulty:"HARD",
    points:[
        [0,-820],[480,-820],[730,-690],[820,-480],
        [760,-310],[600,-230],[410,-270],[310,-400],
        [350,-550],[210,-650],[20,-610],[-70,-470],
        [-10,-320],[-160,-190],[-380,-160],[-600,-250],
        [-720,-410],[-670,-570],[-500,-690],[-270,-780]
    ]
}

];

let currentTrack=0;
let trackCurve;
let trackPoints=[];
let trackTangents=[];
let trackDistances=[];
let trackLength=0;

const trackGroup=new THREE.Group();
scene.add(trackGroup);


/* ============================================================
   TRACK GENERATION
============================================================ */

const TRACK_SAMPLES=1100;
const ROAD_WIDTH=40;
const CURB_WIDTH=3.4;

function buildTrack(){

    while(trackGroup.children.length)
        trackGroup.remove(trackGroup.children[0]);

    const definition=TRACKS[currentTrack];

    const controls=definition.points.map(
        p=>new THREE.Vector3(p[0],0,p[1])
    );

    trackCurve=new THREE.CatmullRomCurve3(
        controls,
        true,
        "centripetal",
        .42
    );

    trackPoints=[];
    trackTangents=[];
    trackDistances=[];

    let distance=0;

    for(let i=0;i<TRACK_SAMPLES;i++){

        const t=i/TRACK_SAMPLES;

        const p=trackCurve.getPointAt(t);
        const tangent=
            trackCurve.getTangentAt(t).normalize();

        trackPoints.push(p);
        trackTangents.push(tangent);
        trackDistances.push(distance);

        if(i>0)
            distance+=
                p.distanceTo(trackPoints[i-1]);
    }

    distance+=
        trackPoints[TRACK_SAMPLES-1]
        .distanceTo(trackPoints[0]);

    trackLength=distance;

    buildRoad();
    buildCurbs();
    buildBarriers();
    buildStartFinish();
    buildTrackFurniture();
    buildGrandstands();
    buildDistantScenery();
}


/* ============================================================
   ROAD
============================================================ */

function buildRoad(){

    const positions=[];
    const indices=[];

    for(let i=0;i<TRACK_SAMPLES;i++){

        const p=trackPoints[i];
        const t=trackTangents[i];

        const right=new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        const left=
            p.clone().addScaledVector(
                right,-ROAD_WIDTH/2
            );

        const r=
            p.clone().addScaledVector(
                right,ROAD_WIDTH/2
            );

        positions.push(
            left.x,0,left.z,
            r.x,0,r.z
        );

        const n=(i+1)%TRACK_SAMPLES;

        indices.push(
            i*2,n*2,i*2+1,
            i*2+1,n*2,n*2+1
        );
    }

    const geo=new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,3
        )
    );

    geo.setIndex(indices);
    geo.computeVertexNormals();

    const road=new THREE.Mesh(
        geo,
        MAT.asphalt
    );

    road.receiveShadow=true;
    trackGroup.add(road);


    /* subtle asphalt patches */

    const patches=new THREE.Group();

    for(let i=0;i<TRACK_SAMPLES;i+=18){

        if(Math.random()>.45)continue;

        const p=trackPoints[i];
        const t=trackTangents[i];

        const patch=new THREE.Mesh(
            new THREE.BoxGeometry(
                4+Math.random()*10,
                .018,
                3+Math.random()*8
            ),
            MAT.asphaltPatch
        );

        patch.position.copy(p);
        patch.position.y=.014;

        patch.rotation.y=
            Math.atan2(-t.x,-t.z)+
            (Math.random()-.5)*.8;

        patches.add(patch);
    }

    trackGroup.add(patches);


    /* racing line rubber */

    const rubber=new THREE.Group();

    for(let i=0;i<TRACK_SAMPLES;i+=7){

        const p=trackPoints[i];
        const t=trackTangents[i];

        const mark=new THREE.Mesh(
            new THREE.BoxGeometry(
                1.2,.012,4.5
            ),
            new THREE.MeshStandardMaterial({
                color:0x303235,
                roughness:1
            })
        );

        mark.position.copy(p);
        mark.position.y=.025;
        mark.position.x+=
            (Math.random()-.5)*7;

        mark.position.z+=
            (Math.random()-.5)*7;

        mark.rotation.y=
            Math.atan2(-t.x,-t.z);

        rubber.add(mark);
    }

    trackGroup.add(rubber);
}


/* ============================================================
   CURBS
============================================================ */

function buildCurbs(){

    const group=new THREE.Group();

    for(let i=0;i<TRACK_SAMPLES;i+=3){

        const p=trackPoints[i];
        const t=trackTangents[i];

        const right=new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        const rotation=
            Math.atan2(-t.x,-t.z);

        for(const side of [-1,1]){

            const curb=new THREE.Mesh(
                new THREE.BoxGeometry(
                    CURB_WIDTH,.17,6.5
                ),
                Math.floor(i/3)%2===0
                    ? MAT.curbRed
                    : MAT.curbWhite
            );

            curb.position.copy(p);
            curb.position.y=.085;

            curb.position.addScaledVector(
                right,
                side*(ROAD_WIDTH/2+CURB_WIDTH/2)
            );

            curb.rotation.y=rotation;

            curb.castShadow=true;
            curb.receiveShadow=true;

            group.add(curb);
        }
    }

    trackGroup.add(group);
}


/* ============================================================
   BARRIERS
============================================================ */

function buildBarriers(){

    const group=new THREE.Group();

    for(let i=0;i<TRACK_SAMPLES;i+=8){

        const p=trackPoints[i];
        const t=trackTangents[i];

        const right=new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        for(const side of [-1,1]){

            const barrier=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .55,1.15,12
                ),
                MAT.barrier
            );

            barrier.position.copy(p);
            barrier.position.y=.62;

            barrier.position.addScaledVector(
                right,
                side*(ROAD_WIDTH/2+7)
            );

            barrier.rotation.y=
                Math.atan2(-t.x,-t.z);

            barrier.castShadow=true;

            group.add(barrier);

            /* dark support */

            if(i%24===0){

                const support=new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .28,1.5,.35
                    ),
                    MAT.barrierDark
                );

                support.position.copy(barrier.position);
                support.position.y=.75;

                group.add(support);
            }
        }
    }

    trackGroup.add(group);
}


/* ============================================================
   START / FINISH
============================================================ */

function buildStartFinish(){

    const p=trackPoints[0];
    const t=trackTangents[0];

    const right=new THREE.Vector3(
        -t.z,0,t.x
    ).normalize();

    const lineGroup=new THREE.Group();

    for(let i=0;i<10;i++){

        const tile=new THREE.Mesh(
            new THREE.BoxGeometry(
                ROAD_WIDTH/10,
                .035,
                7
            ),
            i%2===0
                ? MAT.white
                : MAT.black
        );

        tile.position.copy(p);
        tile.position.y=.035;

        tile.position.addScaledVector(
            right,
            -ROAD_WIDTH/2+
            ROAD_WIDTH/20+
            i*ROAD_WIDTH/10
        );

        tile.rotation.y=
            Math.atan2(-t.x,-t.z);

        lineGroup.add(tile);
    }

    trackGroup.add(lineGroup);


    /* gantry */

    const gantry=new THREE.Group();

    const leftPost=new THREE.Mesh(
        new THREE.BoxGeometry(.8,10,.8),
        MAT.black
    );

    const rightPost=leftPost.clone();

    leftPost.position.copy(p)
        .addScaledVector(
            right,-ROAD_WIDTH/2-3
        );

    rightPost.position.copy(p)
        .addScaledVector(
            right,ROAD_WIDTH/2+3
        );

    leftPost.position.y=5;
    rightPost.position.y=5;

    const beam=new THREE.Mesh(
        new THREE.BoxGeometry(
            ROAD_WIDTH+7,1.15,1
        ),
        MAT.black
    );

    beam.position.copy(p);
    beam.position.y=9.5;
    beam.rotation.y=
        Math.atan2(-t.x,-t.z);

    gantry.add(
        leftPost,
        rightPost,
        beam
    );


    for(let i=0;i<8;i++){

        const light=new THREE.Mesh(
            new THREE.SphereGeometry(
                .43,16,12
            ),
            new THREE.MeshBasicMaterial({
                color:0xff2020
            })
        );

        light.position.copy(p);

        light.position.addScaledVector(
            right,
            -ROAD_WIDTH/2-2+
            i*(ROAD_WIDTH+4)/7
        );

        light.position.y=9.3;

        gantry.add(light);
    }

    trackGroup.add(gantry);
}


/* ============================================================
   TRACK FURNITURE
============================================================ */

function buildTrackFurniture(){

    const group=new THREE.Group();

    for(let i=0;i<TRACK_SAMPLES;i+=20){

        const p=trackPoints[i];
        const t=trackTangents[i];

        const right=new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        const side=Math.random()<.5?-1:1;

        const distance=
            ROAD_WIDTH/2+
            18+
            Math.random()*20;

        if(Math.random()<.6){

            const board=new THREE.Mesh(
                new THREE.BoxGeometry(
                    9,.08,2.8
                ),
                i%2===0
                    ? MAT.yellow
                    : MAT.blue
            );

            board.position.copy(p);
            board.position.addScaledVector(
                right,
                side*distance
            );

            board.position.y=2.2;

            board.rotation.y=
                Math.atan2(-t.x,-t.z);

            group.add(board);
        }
    }

    trackGroup.add(group);
}


/* ============================================================
   GRANDSTANDS
============================================================ */

function buildGrandstands(){

    const group=new THREE.Group();

    /*
       Large stands near the circuit.
    */

    for(let i=0;i<TRACK_SAMPLES;i+=75){

        const p=trackPoints[i];
        const t=trackTangents[i];

        const right=new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        const side=i%150===0?1:-1;

        const distance=72;

        createGrandstand(
            group,
            p,
            t,
            right,
            side,
            distance,
            2.0
        );
    }

    /*
       Additional stands farther away.
    */

    for(let i=35;i<TRACK_SAMPLES;i+=130){

        const p=trackPoints[i];
        const t=trackTangents[i];

        const right=new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        const side=i%260===0?-1:1;

        createGrandstand(
            group,
            p,
            t,
            right,
            side,
            150+Math.random()*45,
            .72
        );
    }

    trackGroup.add(group);
}


function createGrandstand(
    group,
    trackPoint,
    tangent,
    right,
    side,
    distance,
    scale
){

    const stand=new THREE.Group();

    const width=38*scale;
    const depth=14*scale;
    const height=14*scale;

    /* concrete base */

    const base=new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            2.5*scale,
            depth
        ),
        MAT.concrete
    );

    base.position.y=1.25*scale;
    stand.add(base);

    /* stepped seating */

    for(let row=0;row<7;row++){

        const rowMesh=new THREE.Mesh(
            new THREE.BoxGeometry(
                width,
                1.3*scale,
                depth/7
            ),
            MAT.stand
        );

        rowMesh.position.set(
            0,
            3*scale+row*1.55*scale,
            -depth/2+
            row*(depth/7)+
            depth/14
        );

        stand.add(rowMesh);

        /* fans */

        for(let f=0;f<12;f++){

            const fan=createFan(scale);

            fan.position.x=
                -width/2+
                2*scale+
                f*(width-4*scale)/11;

            fan.position.z=
                rowMesh.position.z;

            fan.position.y=
                4.2*scale+
                row*1.55*scale;

            stand.add(fan);
        }
    }

    /* roof */

    const roof=new THREE.Mesh(
        new THREE.BoxGeometry(
            width+5*scale,
            .8*scale,
            depth+3*scale
        ),
        MAT.barrierDark
    );

    roof.position.y=
        height+.5*scale;

    roof.position.z=
        -1.5*scale;

    stand.add(roof);

    /* advertising strip */

    const banner=new THREE.Mesh(
        new THREE.BoxGeometry(
            width,
            2*scale,
            .25*scale
        ),
        Math.random()<.5
            ? MAT.red
            : MAT.blue
    );

    banner.position.y=3.1*scale;
    banner.position.z=depth/2+.2*scale;

    stand.add(banner);


    /* orient stand toward circuit */

    stand.position.copy(trackPoint);

    stand.position.addScaledVector(
        right,
        side*distance
    );

    stand.position.y=0;

    stand.rotation.y=
        Math.atan2(
            -tangent.x,
            -tangent.z
        );

    /*
       Flip the stand's facing direction if necessary.
    */

    if(side<0)
        stand.rotation.y+=Math.PI;

    group.add(stand);
}

/* ============================================================
   WEDGE GEOMETRY
============================================================ */

function wedgeGeometry(
    length,
    height,
    frontWidth,
    rearWidth
){

    const z1=-length/2;
    const z2=length/2;

    const v=[
        -frontWidth/2,0,z1,
         frontWidth/2,0,z1,
        -rearWidth/2,0,z2,
         rearWidth/2,0,z2,

        -frontWidth/2,height,z1,
         frontWidth/2,height,z1,
        -rearWidth/2,height*.78,z2,
         rearWidth/2,height*.78,z2
    ];

    const indices=[
        0,2,1,1,2,3,
        4,5,6,5,7,6,
        0,4,2,2,4,6,
        1,3,5,3,7,5,
        0,1,4,1,5,4,
        2,6,3,3,6,7
    ];

    const g=new THREE.BufferGeometry();

    g.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(v,3)
    );

    g.setIndex(indices);
    g.computeVertexNormals();

    return g;
}

/* ============================================================
   TRACK DISTANCE HELPERS
============================================================ */

function distanceAtIndex(index){
    return trackDistances[index];
}

function pointAtDistance(distance){

    distance=
        ((distance%trackLength)+trackLength)
        %trackLength;

    let low=0;
    let high=TRACK_SAMPLES-1;

    while(low<=high){

        const mid=(low+high)>>1;

        if(trackDistances[mid]<distance)
            low=mid+1;
        else
            high=mid-1;
    }

    const i=Math.max(
        0,
        Math.min(
            TRACK_SAMPLES-1,
            low
        )
    );

    const prev=
        i===0
            ? TRACK_SAMPLES-1
            : i-1;

    const d1=
        i===0
            ? 0
            : trackDistances[prev];

    const d2=
        i===0
            ? trackLength
            : trackDistances[i];

    const f=
        d2===d1
            ? 0
            : (distance-d1)/(d2-d1);

    return new THREE.Vector3().lerpVectors(
        trackPoints[prev],
        trackPoints[i],
        THREE.MathUtils.clamp(f,0,1)
    );
}


/* ============================================================
   NEAREST TRACK POINT
============================================================ */

function nearestTrackIndex(position){

    /*
       Search around the last known index first.
       This makes the AI stable and prevents it jumping
       to a distant part of the circuit.
    */

    let best=0;
    let bestDist=Infinity;

    const candidates=[];

    if(position.__trackIndex!==undefined){

        const base=position.__trackIndex;

        for(let o=-80;o<=80;o+=2)
            candidates.push(
                (base+o+TRACK_SAMPLES)%
                TRACK_SAMPLES
            );
    }else{

        for(let i=0;i<TRACK_SAMPLES;i+=4)
            candidates.push(i);
    }

    for(const i of candidates){

        const p=trackPoints[i];

        const dx=p.x-position.x;
        const dz=p.z-position.z;

        const d=dx*dx+dz*dz;

        if(d<bestDist){

            bestDist=d;
            best=i;
        }
    }

    position.__trackIndex=best;

    return best;
}


/* ============================================================
   RESET
============================================================ */

function resetRace(){

    raceStarted=false;
    raceFinished=false;

    countdownTimer=0;
    raceTime=0;

    const start=trackPoints[0];
    const tangent=trackTangents[0];

    const yaw=
        Math.atan2(
            -tangent.x,
            -tangent.z
        );

    player.root.position.copy(start);
    player.root.position.y=.03;
    player.root.position.__trackIndex=0;

    player.yaw=yaw;
    player.root.rotation.y=yaw;
    player.velocity.set(0,0,0);
    player.speed=0;
    player.raceDistance=0;

    /*
       P1.
       AI starts behind in a proper staggered grid.
    */

    for(let i=1;i<cars.length;i++){

        const ai=cars[i];

        const row=Math.floor((i-1)/2);
        const side=(i%2===1)?-1:1;

        const distanceBehind=
            32+
            row*28;

        const pos=
            pointAtDistance(
                trackLength-distanceBehind
            );

        const idx=nearestTrackIndex(pos);

        const tangentAt=
            trackTangents[idx];

        const right=new THREE.Vector3(
            -tangentAt.z,
            0,
            tangentAt.x
        ).normalize();

        pos.addScaledVector(
            right,
            side*5.7
        );

        ai.root.position.copy(pos);
        ai.root.position.y=.03;
        ai.root.position.__trackIndex=idx;

        ai.yaw=
            Math.atan2(
                -tangentAt.x,
                -tangentAt.z
            );

        ai.root.rotation.y=ai.yaw;

        ai.velocity.set(0,0,0);
        ai.speed=0;
        ai.raceDistance=
            trackLength-distanceBehind;

        /*
           Different cars use slightly different
           positions on the ideal line.
        */

        ai.aiOffset=
            (Math.random()-.5)*2.4;

        ai.lastIndex=idx;
    }

    document.getElementById("message")
        .innerHTML="";

    document.getElementById("countdown")
        .textContent="3";

    updatePosition();
}

/* ============================================================
   INPUT
============================================================ */

const keys={};

window.addEventListener("keydown",e=>{

    keys[e.code]=true;

    initAudio();

    if([
        "ArrowUp",
        "ArrowDown",
        "ArrowLeft",
        "ArrowRight",
        "Space"
    ].includes(e.code))
        e.preventDefault();

    if(e.code==="KeyR")
        resetRace();

    if(e.code==="KeyN")
        nextTrack();
});

window.addEventListener("keyup",e=>{
    keys[e.code]=false;
});

window.addEventListener("pointerdown",initAudio);


function throttleInput(){

    return(
        keys.KeyW||
        keys.ArrowUp
    )?1:0;
}

function brakeInput(){

    return(
        keys.KeyS||
        keys.ArrowDown
    )?1:0;
}

function steerInput(){

    /*
       A = LEFT
       D = RIGHT

       This is intentionally kept identical to the
       previous mechanics.
    */

    let value=0;

    if(
        keys.KeyA||
        keys.ArrowLeft
    )
        value+=1;

    if(
        keys.KeyD||
        keys.ArrowRight
    )
        value-=1;

    return THREE.MathUtils.clamp(
        value,-1,1
    );
}


/* ============================================================
   PLAYER PHYSICS
============================================================ */

function updatePlayer(dt){

    if(!raceStarted||raceFinished)
        return;

    const throttle=throttleInput();
    const brake=brakeInput();
    const steer=steerInput();

    let forward=new THREE.Vector3(
        -Math.sin(player.yaw),
        0,
        -Math.cos(player.yaw)
    );

    let right=new THREE.Vector3(
        Math.cos(player.yaw),
        0,
        -Math.sin(player.yaw)
    );

    let forwardSpeed=
        player.velocity.dot(forward);

    let lateralSpeed=
        player.velocity.dot(right);

    /* engine */

    forwardSpeed+=
        (throttle?92:-8)*dt;

    /* brake */

    if(brake){

        forwardSpeed*=
            Math.pow(.10,dt);

        player.velocity.multiplyScalar(
            Math.pow(.88,dt)
        );
    }

    /* handbrake */

    if(keys.Space){

        forwardSpeed*=
            Math.pow(.35,dt);

        lateralSpeed*=
            Math.pow(.95,dt);
    }

    /* steering */

    const speedRatio=
        THREE.MathUtils.clamp(
            Math.abs(forwardSpeed)/MAX_SPEED,
            0,1
        );

    const steerRate=
        THREE.MathUtils.lerp(
            2.5,
            .95,
            speedRatio
        );

    player.yaw+=
        steer*
        steerRate*
        dt*
        THREE.MathUtils.clamp(
            Math.abs(forwardSpeed)/25,
            .18,
            1
        );

    /* lateral grip */

    lateralSpeed*=
        Math.pow(
            keys.Space?.72:.16,
            dt
        );

    forward.set(
        -Math.sin(player.yaw),
        0,
        -Math.cos(player.yaw)
    );

    right.set(
        Math.cos(player.yaw),
        0,
        -Math.sin(player.yaw)
    );

    player.velocity.copy(
        forward.multiplyScalar(forwardSpeed)
        .add(
            right.multiplyScalar(lateralSpeed)
        )
    );

    if(player.velocity.length()>MAX_SPEED)
        player.velocity.setLength(MAX_SPEED);

    if(
        !throttle&&
        !brake&&
        forwardSpeed<0
    )
        forwardSpeed+=15*dt;

    /* track edge */

    const idx=
        nearestTrackIndex(
            player.root.position
        );

    const center=trackPoints[idx];

    const distance=
        Math.hypot(
            player.root.position.x-center.x,
            player.root.position.z-center.z
        );

    if(
        distance>
        ROAD_WIDTH/2+CURB_WIDTH+2
    ){

        player.velocity.multiplyScalar(
            Math.pow(.35,dt)
        );

    }else if(
        distance>
        ROAD_WIDTH/2-1
    ){

        player.velocity.multiplyScalar(
            Math.pow(.96,dt)
        );
    }

    player.root.position.addScaledVector(
        player.velocity,
        dt
    );

    player.root.rotation.y=player.yaw;

    player.speed=
        player.velocity.length();

    updateWheels(
        player,
        dt,
        steer
    );
}


/* ============================================================
   OPTIMAL RACING LINE
============================================================ */

/*
   The AI does NOT simply drive down the center.

   We calculate a line using:
   - track curvature
   - inside/outside position
   - upcoming corner
   - exit direction

   For a corner:
     entry -> outside
     apex  -> inside
     exit  -> outside
*/

function racingLineOffset(index){

    const lookBehind=18;
    const lookAhead=28;

    const t0=trackTangents[
        (index-lookBehind+TRACK_SAMPLES)
        %TRACK_SAMPLES
    ];

    const t1=trackTangents[index];

    const t2=trackTangents[
        (index+lookAhead)
        %TRACK_SAMPLES
    ];

    const cross=
        t1.x*t2.z-
        t1.z*t2.x;

    const curvature=
        THREE.MathUtils.clamp(
            cross*14,
            -1,
            1
        );

    /*
       Offset away from the inside on entry,
       then toward the apex.
    */

    const phase=
        Math.sin(
            index/TRACK_SAMPLES*
            Math.PI*18
        );

    const cornerStrength=
        Math.min(
            1,
            Math.abs(curvature)*1.7
        );

    let offset=
        -curvature*
        ROAD_WIDTH*.30*
        cornerStrength;

    /*
       Mild dynamic movement keeps AI from
       forming one perfect train.
    */

    offset+=
        phase*
        Math.abs(curvature)*
        1.5;

    return THREE.MathUtils.clamp(
        offset,
        -ROAD_WIDTH*.34,
        ROAD_WIDTH*.34
    );
}


/* ============================================================
   AI
============================================================ */

function updateAI(ai,dt){

    if(!raceStarted||raceFinished)
        return;

    const idx=
        nearestTrackIndex(
            ai.root.position
        );

    ai.lastIndex=idx;

    const tangent=trackTangents[idx];

    const currentPoint=trackPoints[idx];

    /*
       Determine curvature far enough ahead.
    */

    const ahead1=
        trackTangents[
            (idx+22)%TRACK_SAMPLES
        ];

    const ahead2=
        trackTangents[
            (idx+52)%TRACK_SAMPLES
        ];

    const curvature1=
        tangent.x*ahead1.z-
        tangent.z*ahead1.x;

    const curvature2=
        tangent.x*ahead2.z-
        tangent.z*ahead2.x;

    const curvature=Math.abs(
        curvature1*.7+
        curvature2*.3
    );

    /*
       Optimal line.
    */

    const offset=
        racingLineOffset(idx)+
        ai.aiOffset;

    const right=new THREE.Vector3(
        -tangent.z,
        0,
        tangent.x
    ).normalize();

    /*
       Look further ahead when fast.
    */

    const lookAhead=
        28+
        ai.speed*.42;

    const targetIndex=
        (idx+
        Math.floor(lookAhead/4))
        %TRACK_SAMPLES;

    const targetTangent=
        trackTangents[targetIndex];

    const targetPoint=
        trackPoints[targetIndex]
        .clone();

    const targetOffset=
        racingLineOffset(targetIndex)+
        ai.aiOffset;

    const targetRight=new THREE.Vector3(
        -targetTangent.z,
        0,
        targetTangent.x
    ).normalize();

    targetPoint.addScaledVector(
        targetRight,
        targetOffset
    );

    /*
       Steering target is smoothed so the AI
       does not snap from point to point.
    */

    const desiredDirection=
        new THREE.Vector3()
        .subVectors(
            targetPoint,
            ai.root.position
        )
        .normalize();

    const desiredYaw=
        Math.atan2(
            -desiredDirection.x,
            -desiredDirection.z
        );

    let yawDifference=
        normalizeAngle(
            desiredYaw-ai.yaw
        );

    /*
       AI steering gets slightly stronger for
       harder circuits, but mechanics stay the same.
    */

    const turnRate=
        1.55+
        ai.aiSkill*.55;

    const maximumTurn=
        turnRate*dt;

    yawDifference=
        THREE.MathUtils.clamp(
            yawDifference,
            -maximumTurn,
            maximumTurn
        );

    ai.yaw+=yawDifference;


    /* ========================================================
       CORNER BRAKING
    ======================================================== */

    const baseTopSpeed=
        MAX_SPEED*
        (.72+
        ai.aiSkill*.19);

    let targetSpeed=baseTopSpeed;

    const corner=
        THREE.MathUtils.clamp(
            curvature*5.2,
            0,
            1
        );

    /*
       AI brakes before the corner rather than
       slowing in the middle of it.
    */

    if(corner>.08){

        targetSpeed*=
            THREE.MathUtils.lerp(
                1,
                .42,
                corner
            );
    }

    /*
       Extreme curvature requires stronger braking.
    */

    if(Math.abs(curvature2)>.12){

        targetSpeed*=
            .76;
    }

    /*
       Never ask an AI to go backwards.
    */

    targetSpeed=Math.max(
        32,
        targetSpeed
    );

    ai.targetSpeed=targetSpeed;


    /* ========================================================
       ACCELERATION / BRAKING
    ======================================================== */

    const currentSpeed=ai.velocity.length();

    let newSpeed=currentSpeed;

    if(currentSpeed<targetSpeed){

        newSpeed+=
            72*
            ai.aiSkill*
            dt;

    }else{

        newSpeed-=
            105*
            dt;
    }

    newSpeed=
        THREE.MathUtils.clamp(
            newSpeed,
            0,
            MAX_SPEED
        );


    /* ========================================================
       AI FOLLOWING / AVOIDANCE
    ======================================================== */

    let avoidance=0;

    for(const other of cars){

        if(other===ai)
            continue;

        const dx=
            other.root.position.x-
            ai.root.position.x;

        const dz=
            other.root.position.z-
            ai.root.position.z;

        const dist=Math.hypot(dx,dz);

        if(dist>13||dist<.1)
            continue;

        const forward=
            new THREE.Vector3(
                -Math.sin(ai.yaw),
                0,
                -Math.cos(ai.yaw)
            );

        const toOther=
            new THREE.Vector3(
                dx,0,dz
            ).normalize();

        const ahead=
            forward.dot(toOther);

        if(ahead>.45){

            const side=
                forward.x*toOther.z-
                forward.z*toOther.x;

            /*
               Move toward the other side of the
               track to make room.
            */

            avoidance+=
                side>0?-2.4:2.4;

            /*
               Brake slightly if blocked.
            */

            newSpeed*=
                THREE.MathUtils.lerp(
                    .78,
                    1,
                    Math.min(1,dist/13)
                );
        }
    }

    const finalOffset=
        offset+
        avoidance;

    const desiredRight=new THREE.Vector3(
        -tangent.z,
        0,
        tangent.x
    ).normalize();

    const correctedTarget=
        targetPoint.clone()
        .addScaledVector(
            desiredRight,
            THREE.MathUtils.clamp(
                avoidance,
                -5,
                5
            )
        );

    const correctedDirection=
        new THREE.Vector3()
        .subVectors(
            correctedTarget,
            ai.root.position
        )
        .normalize();

    const correctedYaw=
        Math.atan2(
            -correctedDirection.x,
            -correctedDirection.z
        );

    const correctedDifference=
        normalizeAngle(
            correctedYaw-ai.yaw
        );

    ai.yaw+=
        THREE.MathUtils.clamp(
            correctedDifference,
            -1.1*dt,
            1.1*dt
        );


    /* ========================================================
       VELOCITY
    ======================================================== */

    const forward=new THREE.Vector3(
        -Math.sin(ai.yaw),
        0,
        -Math.cos(ai.yaw)
    );

    const desiredVelocity=
        forward.multiplyScalar(newSpeed);

    ai.velocity.lerp(
        desiredVelocity,
        1-Math.pow(.055,dt)
    );

    /*
       Lateral grip.
       This keeps the AI ON the tarmac.
    */

    const lateral=new THREE.Vector3(
        Math.cos(ai.yaw),
        0,
        -Math.sin(ai.yaw)
    );

    const lateralVelocity=
        ai.velocity.dot(lateral);

    ai.velocity.addScaledVector(
        lateral,
        -lateralVelocity*
        Math.min(1,8*dt)
    );


    /* ========================================================
       TRACK BOUNDARY CORRECTION
    ======================================================== */

    const center=trackPoints[idx];

    const distanceFromCenter=
        Math.hypot(
            ai.root.position.x-center.x,
            ai.root.position.z-center.z
        );

    const safeHalfWidth=
        ROAD_WIDTH/2-2.0;

    if(distanceFromCenter>safeHalfWidth){

        const directionToCenter=
            new THREE.Vector3()
            .subVectors(
                center,
                ai.root.position
            )
            .normalize();

        ai.velocity.lerp(
            directionToCenter.multiplyScalar(
                Math.max(
                    ai.velocity.length(),
                    30
                )
            ),
            Math.min(1,dt*4.5)
        );

        /*
           Strongly prevents the AI leaving the track.
        */

        if(
            distanceFromCenter>
            ROAD_WIDTH/2+CURB_WIDTH
        ){

            ai.root.position.lerp(
                center,
                Math.min(1,dt*2.8)
            );
        }
    }


    ai.root.position.addScaledVector(
        ai.velocity,
        dt
    );

    ai.root.rotation.y=ai.yaw;

    ai.speed=
        ai.velocity.length();

    updateWheels(
        ai,
        dt,
        THREE.MathUtils.clamp(
            yawDifference*7,
            -1,
            1
        )
    );
}


/* ============================================================
   COLLISIONS
============================================================ */

function resolveCarCollisions(){

    for(let pass=0;pass<3;pass++){

        for(let i=0;i<cars.length;i++){

            for(let j=i+1;j<cars.length;j++){

                const a=cars[i];
                const b=cars[j];

                const dx=
                    b.root.position.x-
                    a.root.position.x;

                const dz=
                    b.root.position.z-
                    a.root.position.z;

                let distance=
                    Math.hypot(dx,dz);

                const minDistance=
                    a.collisionRadius+
                    b.collisionRadius;

                if(distance>=minDistance)
                    continue;

                if(distance<.001)
                    distance=.001;

                const nx=dx/distance;
                const nz=dz/distance;

                const overlap=
                    minDistance-distance;

                const aMove=
                    a.isPlayer?.45:.5;

                const bMove=
                    b.isPlayer?.45:.5;

                a.root.position.x-=
                    nx*overlap*aMove;

                a.root.position.z-=
                    nz*overlap*aMove;

                b.root.position.x+=
                    nx*overlap*bMove;

                b.root.position.z+=
                    nz*overlap*bMove;

                const rvx=
                    b.velocity.x-
                    a.velocity.x;

                const rvz=
                    b.velocity.z-
                    a.velocity.z;

                const closing=
                    rvx*nx+
                    rvz*nz;

                if(closing<0){

                    const restitution=.24;

                    const impulse=
                        -(1+restitution)*
                        closing/
                        2;

                    a.velocity.x-=
                        nx*impulse;

                    a.velocity.z-=
                        nz*impulse;

                    b.velocity.x+=
                        nx*impulse;

                    b.velocity.z+=
                        nz*impulse;
                }

                /*
                   Small tangential contact friction.
                */

                const tx=-nz;
                const tz=nx;

                const tangentSpeed=
                    rvx*tx+
                    rvz*tz;

                const friction=
                    THREE.MathUtils.clamp(
                        tangentSpeed*.035,
                        -2.2,
                        2.2
                    );

                a.velocity.x+=
                    tx*friction;

                a.velocity.z+=
                    tz*friction;

                b.velocity.x-=
                    tx*friction;

                b.velocity.z-=
                    tz*friction;
            }
        }
    }
}


/* ============================================================
   WHEELS
============================================================ */

function updateWheels(car,dt,steer){

    const steeringAngle=
        steer*.34;

    for(const wheel of car.wheels){

        if(wheel.front){

            wheel.steeringPivot.rotation.y=
                steeringAngle;
        }

        /*
           Separate spin pivot means steering does
           NOT make the wheels wobble.
        */

        wheel.spinPivot.rotation.x+=
            car.speed*dt/.49;
    }
}


/* ============================================================
   NORMALIZE ANGLE
============================================================ */

function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}


/* ============================================================
   RACE PROGRESS
============================================================ */

function updateRaceProgress(car){

    const idx=
        nearestTrackIndex(
            car.root.position
        );

    const distance=
        trackDistances[idx];

    /*
       Detect crossing from late lap to early lap.
    */

    if(
        car.lastIndex>
        TRACK_SAMPLES*.85 &&
        idx<
        TRACK_SAMPLES*.15
    ){

        if(car.isPlayer){

            if(raceTime>5)
                finishRace();

        }else{

            car.raceDistance+=trackLength;
        }
    }

    car.raceDistance=
        Math.max(
            car.raceDistance,
            distance
        );

    car.lastIndex=idx;

    car.progress=
        car.raceDistance/trackLength;
}


/* ============================================================
   POSITION
============================================================ */

function updatePosition(){

    for(const car of cars)
        updateRaceProgress(car);

    const sorted=
        [...cars].sort(
            (a,b)=>
                b.raceDistance-
                a.raceDistance
        );

    const position=
        sorted.indexOf(player)+1;

    document.getElementById("position")
        .innerHTML=
        position+
        "<small> / "+cars.length+"</small>";
}


/* ============================================================
   FINISH
============================================================ */

function finishRace(){

    if(raceFinished)
        return;

    if(raceTime<5)
        return;

    raceFinished=true;

    document.getElementById("message")
        .innerHTML=
        "FINISH!<small>"+
        formatTime(raceTime)+
        "</small>";

    const key=
        "best_"+currentTrack;

    const old=
        localStorage.getItem(key);

    if(
        !old||
        raceTime<Number(old)
    )
        localStorage.setItem(
            key,
            raceTime
        );

    flashScreen();
}


/* ============================================================
   TIME
============================================================ */

function formatTime(time){

    const minutes=
        Math.floor(time/60);

    const seconds=
        Math.floor(time%60);

    const milliseconds=
        Math.floor(
            (time%1)*1000
        );

    return(
        String(minutes).padStart(2,"0")+
        ":"+
        String(seconds).padStart(2,"0")+
        "."+
        String(milliseconds).padStart(3,"0")
    );
}

function updateTimer(){

    document.getElementById("time")
        .textContent=
        formatTime(raceTime);

    const key=
        "best_"+currentTrack;

    const best=
        localStorage.getItem(key);

    document.getElementById("best")
        .textContent=
        best
            ?"BEST "+formatTime(Number(best))
            :"BEST --:--.---";
}


/* ============================================================
   COUNTDOWN
============================================================ */

let raceStarted=false;
let raceFinished=false;
let countdownTimer=0;
let raceTime=0;

function updateCountdown(dt){

    if(raceStarted)
        return;

    countdownTimer+=dt;

    if(countdownTimer<1){

        document.getElementById("countdown")
            .textContent="3";

    }else if(countdownTimer<2){

        document.getElementById("countdown")
            .textContent="2";

    }else if(countdownTimer<3){

        document.getElementById("countdown")
            .textContent="1";

    }else if(countdownTimer<3.7){

        document.getElementById("countdown")
            .textContent="GO!";

    }else{

        document.getElementById("countdown")
            .textContent="";

        raceStarted=true;
    }
}


/* ============================================================
   SPEED HUD
============================================================ */

function updateSpeedHUD(){

    const kmh=
        Math.round(
            player.speed*3.6
        );

    document.getElementById("speed")
        .textContent=kmh;

    let gear="N";

    if(kmh>=5&&kmh<55)
        gear="1";
    else if(kmh<105)
        gear="2";
    else if(kmh<165)
        gear="3";
    else if(kmh<240)
        gear="4";
    else if(kmh<330)
        gear="5";
    else if(kmh<450)
        gear="6";
    else if(kmh>=450)
        gear="7";

    document.getElementById("gear")
        .textContent=gear;

    const ratio=
        THREE.MathUtils.clamp(
            player.speed/MAX_SPEED,
            0,1
        );

    document.getElementById("speedLines")
        .style.opacity=
            THREE.MathUtils.clamp(
                (ratio-.42)*1.7,
                0,
                .65
            );
}


/* ============================================================
   CLOSE CHASE CAMERA
============================================================ */

const cameraLook=new THREE.Vector3();

function updateCamera(dt){

    const speedRatio=
        THREE.MathUtils.clamp(
            player.speed/MAX_SPEED,
            0,1
        );

    const forward=new THREE.Vector3(
        -Math.sin(player.yaw),
        0,
        -Math.cos(player.yaw)
    );

    /*
       Much closer than the previous camera.
    */

    const desired=
        player.root.position.clone()
        .addScaledVector(
            forward,
            -6.4
        );

    desired.y=
        player.root.position.y+
        2.55+
        speedRatio*.65;

    camera.position.lerp(
        desired,
        1-Math.pow(.0008,dt)
    );

    const lookTarget=
        player.root.position.clone()
        .addScaledVector(
            forward,
            11
        );

    lookTarget.y+=.65;

    cameraLook.lerp(
        lookTarget,
        1-Math.pow(.0004,dt)
    );

    camera.lookAt(cameraLook);

    camera.fov=
        THREE.MathUtils.lerp(
            69,
            91,
            speedRatio
        );

    camera.updateProjectionMatrix();
}


/* ============================================================
   MINIMAP
============================================================ */

const mapCanvas=
    document.getElementById("mapCanvas");

const mapCtx=
    mapCanvas.getContext("2d");

function updateMinimap(){

    mapCtx.clearRect(
        0,0,
        mapCanvas.width,
        mapCanvas.height
    );

    mapCtx.fillStyle="#080b0f";
    mapCtx.fillRect(
        0,0,
        mapCanvas.width,
        mapCanvas.height
    );

    let minX=Infinity;
    let maxX=-Infinity;
    let minZ=Infinity;
    let maxZ=-Infinity;

    for(const p of trackPoints){

        minX=Math.min(minX,p.x);
        maxX=Math.max(maxX,p.x);

        minZ=Math.min(minZ,p.z);
        maxZ=Math.max(maxZ,p.z);
    }

    const pad=28;

    const scale=Math.min(
        (mapCanvas.width-pad*2)/
            (maxX-minX),
        (mapCanvas.height-pad*2)/
            (maxZ-minZ)
    );

    function map(p){

        return{
            x:
                pad+
                (p.x-minX)*scale+
                (
                    mapCanvas.width-
                    pad*2-
                    (maxX-minX)*scale
                )/2,

            y:
                pad+
                (p.z-minZ)*scale+
                (
                    mapCanvas.height-
                    pad*2-
                    (maxZ-minZ)*scale
                )/2
        };
    }

    mapCtx.lineCap="round";
    mapCtx.lineJoin="round";

    mapCtx.lineWidth=12;
    mapCtx.strokeStyle="#25292d";
    mapCtx.beginPath();

    trackPoints.forEach((p,i)=>{
        const m=map(p);

        if(i===0)
            mapCtx.moveTo(m.x,m.y);
        else
            mapCtx.lineTo(m.x,m.y);
    });

    mapCtx.closePath();
    mapCtx.stroke();

    mapCtx.lineWidth=4;
    mapCtx.strokeStyle="#ddd";
    mapCtx.beginPath();

    trackPoints.forEach((p,i)=>{
        const m=map(p);

        if(i===0)
            mapCtx.moveTo(m.x,m.y);
        else
            mapCtx.lineTo(m.x,m.y);
    });

    mapCtx.closePath();
    mapCtx.stroke();

    for(const car of cars){

        const m=map(car.root.position);

        mapCtx.beginPath();

        mapCtx.arc(
            m.x,
            m.y,
            car.isPlayer?5:3,
            0,
            Math.PI*2
        );

        mapCtx.fillStyle=
            car.isPlayer
                ?"#ff7818"
                :"#ffffff";

        mapCtx.fill();
    }
}

/* ============================================================
   AUDIO
============================================================ */

let audioCtx=null;

let engineOsc1;
let engineOsc2;
let engineGain;
let engineFilter;

let brakeNoise;
let brakeGain;
let brakeFilter;

function initAudio(){

    if(audioCtx){

        if(audioCtx.state==="suspended")
            audioCtx.resume();

        return;
    }

    try{

        audioCtx=
            new(
                window.AudioContext||
                window.webkitAudioContext
            )();

        /* engine */

        engineOsc1=
            audioCtx.createOscillator();

        engineOsc2=
            audioCtx.createOscillator();

        engineGain=
            audioCtx.createGain();

        engineFilter=
            audioCtx.createBiquadFilter();

        engineOsc1.type="sawtooth";
        engineOsc2.type="triangle";

        engineFilter.type="lowpass";
        engineFilter.frequency.value=1500;

        engineGain.gain.value=.0001;

        engineOsc1.connect(engineFilter);
        engineOsc2.connect(engineFilter);
        engineFilter.connect(engineGain);
        engineGain.connect(audioCtx.destination);

        engineOsc1.start();
        engineOsc2.start();

        /* brake / tire noise */

        const buffer=
            audioCtx.createBuffer(
                1,
                audioCtx.sampleRate*2,
                audioCtx.sampleRate
            );

        const data=
            buffer.getChannelData(0);

        for(let i=0;i<data.length;i++)
            data[i]=Math.random()*2-1;

        brakeNoise=
            audioCtx.createBufferSource();

        brakeNoise.buffer=buffer;
        brakeNoise.loop=true;

        brakeFilter=
            audioCtx.createBiquadFilter();

        brakeFilter.type="bandpass";
        brakeFilter.frequency.value=1500;
        brakeFilter.Q.value=.8;

        brakeGain=
            audioCtx.createGain();

        brakeGain.gain.value=.0001;

        brakeNoise
            .connect(brakeFilter)
            .connect(brakeGain)
            .connect(audioCtx.destination);

        brakeNoise.start();

    }catch(error){

        console.warn(
            "Audio unavailable",
            error
        );
    }
}


function updateAudio(){

    if(!audioCtx)
        return;

    const ratio=
        THREE.MathUtils.clamp(
            player.speed/MAX_SPEED,
            0,1
        );

    const throttle=
        throttleInput();

    const brake=
        brakeInput();

    const rpm=
        .08+
        ratio*.92+
        throttle*.14;

    const now=
        audioCtx.currentTime;

    engineOsc1.frequency.setTargetAtTime(
        65+
        rpm*720,
        now,
        .035
    );

    engineOsc2.frequency.setTargetAtTime(
        130+
        rpm*980,
        now,
        .035
    );

    engineFilter.frequency.setTargetAtTime(
        700+
        rpm*1900,
        now,
        .04
    );

    engineGain.gain.setTargetAtTime(
        player.speed>1
            ? .045+
              ratio*.12+
              throttle*.055
            : .012,
        now,
        .05
    );

    brakeGain.gain.setTargetAtTime(
        brake&&player.speed>15
            ? .07+ratio*.18
            : .0001,
        now,
        .025
    );
}

   MAIN LOOP
============================================================ */

const clock=new THREE.Clock();

function animate(){

    requestAnimationFrame(animate);

    const dt=Math.min(
        clock.getDelta(),
        .033
    );

    updateCountdown(dt);

    if(raceStarted&&!raceFinished){

        raceTime+=dt;

        updatePlayer(dt);

        for(let i=1;i<cars.length;i++)
            updateAI(cars[i],dt);

        /*
           All 11 cars collide with each other.
        */

        resolveCarCollisions();

        updatePosition();
    }

    updateTimer();
    updateSpeedHUD();
    updateCamera(dt);
    updateMinimap();
    updateAudio();

    renderer.render(
        scene,
        camera
    );
}

   RESIZE
============================================================ */

window.addEventListener("resize",()=>{

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,1.7)
    );
});
</script>
</body>
