<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrackRush 3D — Wide Track Time Trial</title>

<style>

}

html,body{

  width:100%;
  height:100%;
  overflow:hidden;
  background:#101318;
  font-family:Arial,sans-serif;
  color:white
}

canvas{
  display:block
}

#hud{

  inset:0;
  pointer-events:none
}

#top{

}

#time{

}

#best{

}

  position:absolute;

#checkpoint{
  position:absolute;
  right:18px;
  bottom:18px;
  font-size:15px
}

#speed{

  right:18px;
  bottom:61px;
  font-size:18px;
  font-weight:800
}

#help{
  position:absolute;
  left:18px;
  bottom:18px;

}

}

  border:1px solid #ffffff2b;
  border-radius:14px;
  padding:28px;
  box-shadow:0 20px 60px #0009
}

h1{
  margin:0 0 8px;
  font-size:34px
}

p{
  margin:8px 0 18px;
  opacity:.8
}

button{

  margin:4px;
  font-weight:800;

}

  transform:translateY(-1px)
}

  top:48%;

  font-size:78px;
  font-weight:900;
  text-shadow:0 5px 20px #000;
  display:none
}
</style>
</head>

<body>

<div id="hud">

  <div id="top">

    <div class="card">
      <div id="time">00:00.000</div>
      <div id="best">BEST —</div>
    </div>

    <div class="card">
      TRACK <span id="trackNo">1</span>
    </div>

  </div>

  <div id="status">READY</div>

  <div id="speed">0 km/h</div>

  <div id="checkpoint" class="card">
    CHECKPOINT 0 / 7
  </div>

  <div id="help">
    WASD / ARROWS drive · R reset · N new track · SPACE race again
  </div>

  <div id="count">3</div>

  <div id="message">

    <div class="panel">

      <h1 id="finishTitle">
        FINISHED!
      </h1>

      <p id="finishText"></p>

      <button id="again">
        RACE AGAIN
      </button>

      <button id="new">
        NEW TRACK
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>


<script>

"use strict";


/* ============================================================
   TRACKRUSH 3D
   Original single-file arcade time-trial racer.
   Designed for GitHub Pages.
   ============================================================ */


/* ============================================================
   THREE.JS SETUP
   ============================================================ */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8fc6e8);

scene.fog = new THREE.Fog(
  0x8fc6e8,
  90,
  520
);


const camera = new THREE.PerspectiveCamera(
  70,
  innerWidth / innerHeight,
  .05,
  1500
);

camera.position.set(
  0,
  7,
  -13
);


const renderer = new THREE.WebGLRenderer({
  antialias:true
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled=true;

renderer.shadowMap.type=
  THREE.PCFSoftShadowMap;

renderer.outputColorSpace=
  THREE.SRGBColorSpace;

document.body.appendChild(
  renderer.domElement
);


/* ============================================================
   LIGHTING
   ============================================================ */

scene.add(
  new THREE.HemisphereLight(
    0xffffff,
    0x40505a,
    2.2
  )
);


const sun =
  new THREE.DirectionalLight(
    0xffffff,
    3.2
  );

sun.position.set(
  -80,
  130,
  60
);

sun.castShadow=true;

sun.shadow.mapSize.set(
  2048,
  2048
);

sun.shadow.camera.left=-180;
sun.shadow.camera.right=180;
sun.shadow.camera.top=180;
sun.shadow.camera.bottom=-180;

scene.add(sun);


/* ============================================================
   MATERIALS
   ============================================================ */

const mat={

  road:
    new THREE.MeshStandardMaterial({
      color:0x34383d,
      roughness:.95
    }),

  roadEdge:
    new THREE.MeshStandardMaterial({
      color:0x202328,
      roughness:.9
    }),

  barrier:
    new THREE.MeshStandardMaterial({
      color:0xdfe5e8,
      roughness:.75
    }),

  stripe:
    new THREE.MeshStandardMaterial({
      color:0xe23a34,
      roughness:.7
    }),

  support:
    new THREE.MeshStandardMaterial({
      color:0x242a30,
      roughness:1
    }),

  yellow:
    new THREE.MeshStandardMaterial({
      color:0xffd21c,
      roughness:.65
    }),

  red:
    new THREE.MeshStandardMaterial({
      color:0xf13a32,
      roughness:.65
    }),

  boost:
    new THREE.MeshStandardMaterial({
      color:0x31e9ff,
      emissive:0x087f99,
      emissiveIntensity:1.8
    }),

  grass:
    new THREE.MeshStandardMaterial({
      color:0x6c9a55,
      roughness:1
    }),

  rock:
    new THREE.MeshStandardMaterial({
      color:0x68716b,
      roughness:1
    }),

  white:
    new THREE.MeshStandardMaterial({
      color:0xf4f4f4,
      roughness:.5
    }),

  black:
    new THREE.MeshStandardMaterial({
      color:0x111419,
      roughness:.6
    }),

  car:
    new THREE.MeshStandardMaterial({
      color:0xd9232e,
      metalness:.2,
      roughness:.35
    }),

  glass:
    new THREE.MeshStandardMaterial({
      color:0x172733,
      metalness:.1,
      roughness:.15
    }),

  cyan:
    new THREE.MeshStandardMaterial({
      color:0x43f2ff,
      transparent:true,
      opacity:.42,
      emissive:0x137c85,
      emissiveIntensity:1
    })

};


/* ============================================================
   GAME STATE
   ============================================================ */

const game={

  points:[],
  tangents:[],
  frames:[],

  /* WIDE TRACK */
  width:21,

  checkpoints:[],
  checkpointIndex:0,

  started:false,
  finished:false,

  trackId:1,

  startTime:0,
  elapsed:0,
  best:Infinity,

  ghost:[],
  ghostEnabled:true,
  record:[],

  boostZones:[],
  ramps:[],
  objects:[],

  speed:0,
  yaw:0,
  steer:0,

  rng:1

};


/* ============================================================
   INPUT
   ============================================================ */

const keys={};


addEventListener(
  "keydown",
  e=>{

    keys[e.code]=true;

    if([
      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight",
      "Space"
    ].includes(e.code)){
      e.preventDefault();
    }

    if(e.code==="KeyR"){
      resetCar();
    }

    if(e.code==="KeyN"){
      newTrack();
    }

    if(
      e.code==="Space" &&
      game.finished
    ){
      raceAgain();
    }

  }
);


addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );

  }
);


/* ============================================================
   HUD REFERENCES
   ============================================================ */

const timeEl =
  document.getElementById("time");

const bestEl =
  document.getElementById("best");

const statusEl =
  document.getElementById("status");

const cpEl =
  document.getElementById("checkpoint");

const speedEl =
  document.getElementById("speed");

const countEl =
  document.getElementById("count");

const message =
  document.getElementById("message");

const finishText =
  document.getElementById("finishText");

const trackNo =
  document.getElementById("trackNo");


/* ============================================================
   UTILITY FUNCTIONS
   ============================================================ */

function box(
  w,
  h,
  d,
  m
){

  const g =
    new THREE.BoxGeometry(
      w,
      h,
      d
    );

  const o =
    new THREE.Mesh(
      g,
      m
    );

  o.castShadow=true;
  o.receiveShadow=true;

  return o;
}


function cyl(
  r,
  h,
  m,
  radial=12
){

  const o =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        r,
        r,
        h,
        radial
      ),
      m
    );

  o.castShadow=true;
  o.receiveShadow=true;

  return o;
}


function clamp(
  x,
  a,
  b
){

  return Math.max(
    a,
    Math.min(b,x)
  );

}


function fmt(t){

  if(!isFinite(t)){
    return "—";
  }

  const m =
    Math.floor(t/60);

  const s =
    t-m*60;

  return String(m).padStart(2,"0")
    +":"
    +s.toFixed(3).padStart(6,"0");

}


function seeded(n){

  game.rng =
    (n*1664525+1013904223)>>>0;

  return game.rng/4294967296;

}


function rnd(){

  game.rng =
    (game.rng*1664525+1013904223)>>>0;

  return game.rng/4294967296;

}


/* ============================================================
   WORLD CLEAR
   ============================================================ */

function clearWorld(){

  while(scene.children.length>0){

    const o =
      scene.children[
        scene.children.length-1
      ];

    if(o===sun){
      scene.remove(o);
    }else{
      scene.remove(o);
    }

  }

  scene.add(
    new THREE.HemisphereLight(
      0xffffff,
      0x40505a,
      2.2
    )
  );

  scene.add(sun);

  game.points=[];
  game.tangents=[];
  game.frames=[];
  game.checkpoints=[];

  game.boostZones=[];
  game.ramps=[];
  game.objects=[];
  game.record=[];

}


/* ============================================================
   GROUND
   ============================================================ */

function addGround(){

  const ground =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1800,
        1800
      ),
      mat.grass
    );

  ground.rotation.x=
    -Math.PI/2;

  ground.position.y=-4;

  ground.receiveShadow=true;

  scene.add(ground);

}


/* ============================================================
   TRACK GENERATION
   ============================================================ */

function makeTrack(){

  clearWorld();

  addGround();


  const controls=[];

  let x=0;
  let z=0;
  let y=7;


  controls.push(
    new THREE.Vector3(
      x,
      y,
      z
    )
  );


  const pattern =
    game.trackId%4;


  const count=19;


  for(
    let i=1;
    i<count;
    i++
  ){

    const a =
      i/(count-1);

    let dx =
      22+rnd()*25;

    let dz =
      28+rnd()*38;


    if(pattern===1){
      dx*=.75;
    }


    if(pattern===2){
      dz*=1.2;
    }


    if(
      i===4 ||
      i===11 ||
      i===16
    ){

      dx*=1.6;

    }


    if(i%5===0){

      y +=
        5+rnd()*7;

    }


    if(i%5===2){

      y -=
        3+rnd()*3;

    }


    x +=
      (rnd()<.5?-1:1)*dx;

    z += dz;


    controls.push(
      new THREE.Vector3(
        x,
        y,
        z
      )
    );

  }


  const curve =
    new THREE.CatmullRomCurve3(
      controls,
      false,
      "catmullrom",
      .58
    );


  const samples=720;


  for(
    let i=0;
    i<=samples;
    i++
  ){

    const t =
      i/samples;

    const p =
      curve.getPoint(t);

    const tan =
      curve.getTangent(t)
        .normalize();

    game.points.push(p);
    game.tangents.push(tan);

  }


  for(
    let i=0;
    i<=samples;
    i++
  ){

    const p =
      game.points[i];

    const t =
      game.tangents[i]
        .clone();

    t.y=0;
    t.normalize();


    const side =
      new THREE.Vector3(
        t.z,
        0,
        -t.x
      ).normalize();


    game.frames.push({
      p,
      t,
      side
    });

  }


  buildRoad();

  buildCheckpoints();

  buildBoosts();

  buildScenery();

  buildCar();

  loadGhost();

  resetCar();

  startCountdown();

}


/* ============================================================
   ROAD
   ============================================================ */

function buildRoad(){

  for(
    let i=0;
    i<game.points.length-1;
    i++
  ){

    const a =
      game.points[i];

    const b =
      game.points[i+1];

    const mid =
      a.clone()
        .add(b)
        .multiplyScalar(.5);

    const len =
      a.distanceTo(b);

    const fr =
      game.frames[i];


    /* ROAD */

    const road =
      box(
        game.width,
        .55,
        len+1.2,
        mat.road
      );

    road.position.copy(mid);

    road.lookAt(
      b.x,
      mid.y,
      b.z
    );

    scene.add(road);


    /* SUPPORT UNDER ROAD */

    const support =
      box(
        game.width+5,
        2.8,
        len+2.8,
        mat.support
      );

    support.position.set(
      mid.x,
      mid.y-1.55,
      mid.z
    );

    support.lookAt(
      b.x,
      support.position.y,
      b.z
    );

    scene.add(support);


    /* SOLID WALLS */

    for(
      const sideSign of [-1,1]
    ){

      const p =
        mid.clone()
          .addScaledVector(
            fr.side,
            sideSign*
            (game.width/2+.55)
          );


      const wall =
        box(
          1.35,
          3.8,
          len+4.8,
          mat.barrier
        );


      wall.position.copy(p);

      wall.position.y+=1.15;


      wall.lookAt(
        b.x,
        wall.position.y,
        b.z
      );


      scene.add(wall);


      /* RED WALL STRIPES */

      if(i%7===0){

        const stripe =
          box(
            1.42,
            .42,
            4.5,
            mat.stripe
          );

        stripe.position.copy(p);

        stripe.position.y+=1.15;


        stripe.lookAt(
          b.x,
          stripe.position.y,
          b.z
        );


        scene.add(stripe);

      }

    }


    /* ROAD MARKINGS */

    if(i%6===0){

      const stripe =
        box(
          game.width*.9,
          .035,
          1.1,
          mat.white
        );

      stripe.position.copy(mid);

      stripe.position.y+=.3;

      stripe.lookAt(
        b.x,
        stripe.position.y,
        b.z
      );

      scene.add(stripe);

    }

  }

}


/* ============================================================
   CHECKPOINT GATES
   ============================================================ */

function gate(
  index,
  color,
  finish=false
){

  const p =
    game.points[index];

  const fr =
    game.frames[index];


  const g =
    new THREE.Group();


  const h=8.5;
  const w=game.width*.72;


  const left =
    box(
      .65,
      h,
      .65,
      color
    );


  const right =
    box(
      .65,
      h,
      .65,
      color
    );


  const top =
    box(
      w,
      .65,
      .65,
      color
    );


  left.position.set(
    -w/2,
    h/2,
    0
  );

  right.position.set(
    w/2,
    h/2,
    0
  );

  top.position.set(
    0,
    h,
    0
  );


  g.add(
    left,
    right,
    top
  );


  g.position.copy(p);


  g.quaternion.setFromUnitVectors(
    new THREE.Vector3(0,0,1),
    fr.t
  );


  g.position.y+=.35;


  scene.add(g);

}


function buildCheckpoints(){

  const arr=[
    .13,
    .26,
    .39,
    .52,
    .65,
    .78,
    .9
  ];


  for(
    const q of arr
  ){

    const i =
      Math.floor(
        q*(game.points.length-1)
      );

    game.checkpoints.push(i);

    gate(
      i,
      mat.yellow
    );

  }


  gate(
    game.points.length-1,
    mat.red,
    true
  );

}


/* ============================================================
   BOOST PADS
   ============================================================ */

function buildBoosts(){

  const candidates=[
    .075,
    .205,
    .335,
    .47,
    .59,
    .715,
    .845
  ];


  for(
    let k=0;
    k<candidates.length;
    k++
  ){

    const i =
      Math.floor(
        candidates[k]*
        (game.points.length-1)
      );


    game.boostZones.push(i);


    const p =
      game.points[i];

    const fr =
      game.frames[i];


    for(
      let row=-1;
      row<=1;
      row++
    ){

      const pad =
        box(
          3.3,
          .08,
          7.2,
          mat.boost
        );


      pad.position.copy(p);

      pad.position.y+=.36;


      pad.position.addScaledVector(
        fr.side,
        row*3.4
      );


      pad.lookAt(
        p.x+fr.t.x,
        pad.position.y,
        p.z+fr.t.z
      );


      scene.add(pad);

    }

  }

}


/* ============================================================
   SCENERY
   ============================================================ */

function buildScenery(){

  for(
    let i=12;
    i<game.points.length;
    i+=16
  ){

    const p =
      game.points[i];

    const fr =
      game.frames[i];


    for(
      const s of [-1,1]
    ){

      const q =
        p.clone()
          .addScaledVector(
            fr.side,
            s*(24+rnd()*34)
          );


      q.y=-3;


      const rock =
        cyl(
          2+rnd()*3,
          3+rnd()*5,
          mat.rock,
          7
        );


      rock.position.copy(q);

      rock.rotation.y=
        rnd()*6;


      scene.add(rock);

    }

  }


  /* LOW-POLY TOWERS */

  for(
    let i=35;
    i<game.points.length;
    i+=55
  ){

    const p =
      game.points[i];

    const fr =
      game.frames[i];


    const q =
      p.clone()
        .addScaledVector(
          fr.side,
          (rnd()<.5?-1:1)*18
        );


    const tower =
      new THREE.Group();


    const base =
      box(
        2,
        10,
        2,
        mat.support
      );

    base.position.y=3;


    const top =
      box(
        5,
        .7,
        5,
        mat.yellow
      );

    top.position.y=8.4;


    tower.add(
      base,
      top
    );


    tower.position.copy(q);

    scene.add(tower);

  }

}


/* ============================================================
   CAR
   ============================================================ */

const car =
  new THREE.Group();

let wheels=[];

let carBody;


function buildCar(){

  car.clear();

  wheels=[];


  /* MAIN BODY */

  carBody =
    box(
      2.18,
      .58,
      4.35,
      mat.car
    );

  carBody.position.y=1.05;

  car.add(carBody);


  /* NOSE */

  const nose =
    box(
      1.28,
      .32,
      1.85,
      mat.car
    );

  nose.position.set(
    0,
    1.00,
    2.62
  );

  car.add(nose);


  /* CENTRAL SPINE */

  const spine =
    box(
      .72,
      .30,
      2.85,
      mat.car
    );

  spine.position.set(
    0,
    1.34,
    .35
  );

  car.add(spine);


  /* COCKPIT */

  const cockpit =
    box(
      1.28,
      .56,
      1.52,
      mat.glass
    );

  cockpit.position.set(
    0,
    1.57,
    .42
  );

  car.add(cockpit);


  /* HALO */

  const halo =
    box(
      .12,
      .55,
      1.18,
      mat.black
    );

  halo.position.set(
    0,
    1.95,
    .38
  );

  car.add(halo);


  /* REAR BODY */

  const rear =
    box(
      2.85,
      .25,
      .44,
      mat.black
    );

  rear.position.set(
    0,
    1.48,
    -2.12
  );

  car.add(rear);


  /* REAR WING */

  const rearWing =
    box(
      3.35,
      .20,
      .28,
      mat.white
    );

  rearWing.position.set(
    0,
    2.00,
    -1.92
  );

  car.add(rearWing);


  const rearWingLower =
    box(
      2.65,
      .16,
      .26,
      mat.black
    );

  rearWingLower.position.set(
    0,
    1.72,
    -1.92
  );

  car.add(rearWingLower);


  /* FRONT WING */

  const frontWing =
    box(
      3.75,
      .14,
      .34,
      mat.white
    );

  frontWing.position.set(
    0,
    .73,
    3.18
  );

  car.add(frontWing);


  const frontWing2 =
    box(
      3.15,
      .12,
      .27,
      mat.black
    );

  frontWing2.position.set(
    0,
    .84,
    2.82
  );

  car.add(frontWing2);


  /* SIDE PODS */

  for(
    const s of [-1,1]
  ){

    const pod =
      box(
        .42,
        .43,
        2.35,
        mat.black
      );

    pod.position.set(
      s*1.18,
      .91,
      0
    );

    car.add(pod);


    const sidepod =
      box(
        .48,
        .34,
        1.65,
        mat.car
      );

    sidepod.position.set(
      s*1.03,
      1.08,
      -.15
    );

    car.add(sidepod);


    const fin =
      box(
        .12,
        .55,
        1.35,
        mat.white
      );

    fin.position.set(
      s*.82,
      1.36,
      -.75
    );

    car.add(fin);

  }


  /* EXHAUSTS */

  for(
    const s of [-1,1]
  ){

    const exhaust =
      cyl(
        .12,
        .32,
        mat.white,
        10
      );

    exhaust.rotation.z=
      Math.PI/2;

    exhaust.position.set(
      s*.62,
      1.17,
      -2.18
    );

    car.add(exhaust);

  }


  /* BRAKE LIGHT */

  const brakeLight =
    box(
      .48,
      .12,
      .12,
      mat.red
    );

  brakeLight.position.set(
    0,
    1.18,
    -2.28
  );

  car.add(brakeLight);


  /* WHEELS */

  const wheelPos=[

    [
      -1.34,
      .67,
      1.58,
      true
    ],

    [
      1.34,
      .67,
      1.58,
      true
    ],

    [
      -1.34,
      .67,
      -1.58,
      false
    ],

    [
      1.34,
      .67,
      -1.58,
      false
    ]

  ];


  for(
    const [x,y,z,front]
    of wheelPos
  ){

    const pivot =
      new THREE.Group();

    pivot.position.set(
      x,
      y,
      z
    );


    const w =
      cyl(
        .52,
        .40,
        mat.black,
        18
      );

    w.rotation.z=
      Math.PI/2;

    pivot.add(w);


    const hub =
      cyl(
        .19,
        .43,
        mat.white,
        12
      );

    hub.rotation.z=
      Math.PI/2;

    pivot.add(hub);


    car.add(pivot);


    wheels.push({
      pivot,
      w,
      front
    });

  }


  /* DRIVER HELMET */

  const helmet =
    cyl(
      .34,
      .5,
      mat.white,
      16
    );

  helmet.position.set(
    0,
    1.9,
    .25
  );

  car.add(helmet);


  scene.add(car);

}


/* ============================================================
   FIND NEAREST TRACK POINT
   ============================================================ */

function nearestTrack(pos){

  let best=0;
  let bd=Infinity;


  const step=4;


  for(
    let i=0;
    i<game.points.length;
    i+=step
  ){

    const d =
      pos.distanceToSquared(
        game.points[i]
      );


    if(d<bd){

      bd=d;
      best=i;

    }

  }


  const lo =
    Math.max(
      0,
      best-step
    );


  const hi =
    Math.min(
      game.points.length-1,
      best+step
    );


  for(
    let i=lo;
    i<=hi;
    i++
  ){

    const d =
      pos.distanceToSquared(
        game.points[i]
      );


    if(d<bd){

      bd=d;
      best=i;

    }

  }


  return best;

}


/* ============================================================
   RESET CAR
   ============================================================ */

function resetCar(){

  if(!game.points.length){
    return;
  }


  const i=3;


  const p =
    game.points[i];

  const t =
    game.tangents[i];


  car.position.copy(p);

  car.position.y+=1.05;


  game.yaw =
    Math.atan2(
      t.x,
      t.z
    );


  car.rotation.set(
    0,
    game.yaw,
    0
  );


  game.speed=0;

  game.steer=0;

  game.checkpointIndex=0;


  if(
    game.started &&
    !game.finished
  ){

    game.startTime=
      performance.now();

  }

}


/* ============================================================
   COUNTDOWN
   ============================================================ */

function startCountdown(){

  game.started=false;

  game.finished=false;

  message.style.display="none";

  countEl.style.display="block";


  let n=3;


  countEl.textContent=n;

  statusEl.textContent=
    "GET READY";


  const timer =
    setInterval(
      ()=>{

        n--;


        if(n>0){

          countEl.textContent=n;

        }

        else if(n===0){

          countEl.textContent="GO!";

          statusEl.textContent="GO!";

        }

        else{

          clearInterval(timer);

          countEl.style.display="none";

          game.started=true;

          game.finished=false;

          game.startTime=
            performance.now();

          statusEl.textContent=
            "RACE";

        }

      },
      700
    );

}


/* ============================================================
   RACE CONTROLS
   ============================================================ */

function raceAgain(){

  resetCar();

  startCountdown();

}


function newTrack(){

  game.trackId++;


  if(game.trackId>9999){
    game.trackId=1;
  }


  trackNo.textContent=
    game.trackId;


  makeTrack();

}


function crashReset(){

  resetCar();

}


/* ============================================================
   PHYSICS
   ============================================================ */

function updatePhysics(dt){

  if(
    !game.started ||
    game.finished
  ){

    return;

  }


  const throttle =
    keys.KeyW ||
    keys.ArrowUp;


  const brake =
    keys.KeyS ||
    keys.ArrowDown;


  /*
    A = RIGHT
    D = LEFT
  */

  let requested =
    (
      keys.KeyA ||
      keys.ArrowLeft
    ? 1 : 0
    )
    +
    (
      keys.KeyD ||
      keys.ArrowRight
    ? -1 : 0
    );


  game.steer +=
    (
      requested-
      game.steer
    )
    *
    Math.min(
      1,
      dt*10
    );


  const forward =
    new THREE.Vector3(
      Math.sin(game.yaw),
      0,
      Math.cos(game.yaw)
    );


  const idx =
    nearestTrack(
      car.position
    );


  const fr =
    game.frames[idx];


  /* TRACK DIRECTION */

  const targetYaw =
    Math.atan2(
      fr.t.x,
      fr.t.z
    );


  const yawDiff =
    Math.atan2(
      Math.sin(
        targetYaw-game.yaw
      ),
      Math.cos(
        targetYaw-game.yaw
      )
    );


  const speedRatio =
    clamp(
      Math.abs(game.speed)/85,
      0,
      1
    );


  /* ACCELERATION */

  if(throttle){

    game.speed +=
      72*dt;

  }


  if(brake){

    game.speed -=
      105*dt;

  }


  if(
    !throttle &&
    !brake
  ){

    game.speed *=
      Math.pow(
        .985,
        dt*60
      );

  }


  game.speed =
    clamp(
      game.speed,
      -18,
      92
    );


  /* STEERING */

  const steerPower =
    (
      .52+
      speedRatio*2.25
    )
    *
    game.steer;


  game.yaw +=
    steerPower*dt;


  game.yaw +=
    yawDiff*
    dt*
    (
      .8+
      speedRatio*1.2
    );


  const moveForward =
    new THREE.Vector3(
      Math.sin(game.yaw),
      0,
      Math.cos(game.yaw)
    );


  car.position.addScaledVector(
    moveForward,
    game.speed*dt
  );


  car.position.y +=
    -5.5*dt;


  /* TRACK HEIGHT */

  const trackY =
    game.points[idx].y+.8;


  const verticalDiff =
    trackY-
    car.position.y;


  if(verticalDiff>0){

    car.position.y +=
      Math.min(
        verticalDiff,
        16*dt
      );

  }


  /* ==========================================================
     SOLID WALL COLLISION
     ========================================================== */

  {

    const half =
      game.width/2;


    const wallCenter =
      half+.68;


    const carHalf =
      1.45;


    const wallLimit =
      wallCenter-carHalf;


    const lateralNow =
      car.position
        .clone()
        .sub(game.points[idx])
        .dot(fr.side);


    if(
      lateralNow>
      wallLimit
    ){

      car.position.addScaledVector(
        fr.side,
        wallLimit-lateralNow
      );


      const sideVelocity =
        game.speed*
        moveForward.dot(
          fr.side
        );


      if(sideVelocity>0){

        game.speed =
          Math.min(
            game.speed,
            Math.max(
              0,
              game.speed-
              sideVelocity*.9
            )
          );

      }


      game.yaw -=
        game.steer*
        dt*
        .9;

    }


    else if(
      lateralNow<
      -wallLimit
    ){

      car.position.addScaledVector(
        fr.side,
        -wallLimit-lateralNow
      );


      const sideVelocity =
        game.speed*
        moveForward.dot(
          fr.side
        );


      if(sideVelocity<0){

        game.speed =
          Math.min(
            game.speed,
            Math.max(
              0,
              game.speed+
              sideVelocity*.9
            )
          );

      }


      game.yaw -=
        game.steer*
        dt*
        .9;

    }


    /* WALL HEIGHT */

    const wallTop =
      game.points[idx].y+
      3.05;


    if(
      car.position.y>
      wallTop
    ){

      car.position.y=
        wallTop;

      game.speed*=.72;

    }

  }


  /* ==========================================================
     BOOSTS
     ========================================================== */

  for(
    const bi of game.boostZones
  ){

    if(
      Math.abs(idx-bi)<5 &&
      Math.abs(
        car.position
          .clone()
          .sub(
            game.points[bi]
          )
          .dot(
            game.frames[bi].side
          )
      )<5
    ){

      game.speed =
        Math.min(
          108,
          game.speed+
          42*dt
        );

    }

  }


  /* ==========================================================
     EXTRA EDGE SAFETY
     ========================================================== */

  const side =
    fr.side;


  const lateral =
    car.position
      .clone()
      .sub(game.points[idx])
      .dot(side);


  const safe =
    game.width/2-1.35;


  if(
    Math.abs(lateral)>safe
  ){

    car.position.addScaledVector(
      side,
      -Math.sign(lateral)*
      (
        Math.abs(lateral)-safe
      )
    );


    const outward =
      game.speed*
      moveForward.dot(side);


    if(
      Math.sign(outward)===
      Math.sign(lateral)
    ){

      game.speed*=.82;

    }

  }


  /* ==========================================================
     NEVER FALL BELOW TRACK
     ========================================================== */

  if(
    car.position.y<
    game.points[idx].y-1.0
  ){

    car.position.y=
      game.points[idx].y+.9;

    game.speed*=.45;

  }


  /* CAR ROTATION */

  car.rotation.y=
    game.yaw;


  const pitch =
    clamp(
      (
        game.points[
          Math.min(
            idx+3,
            game.points.length-1
          )
        ].y
        -
        game.points[
          Math.max(
            0,
            idx-3
          )
        ].y
      )*.06,
      -.24,
      .24
    );


  car.rotation.x=
    pitch;


  /* WHEEL ANIMATION */

  for(
    const item of wheels
  ){

    item.w.rotation.x -=
      game.speed*
      dt*
      1.8;


    if(item.front){

      item.pivot.rotation.y =
        game.steer*.42;

    }

  }


  checkProgress(idx);

}


/* ============================================================
   CHECKPOINTS
   ============================================================ */

function checkProgress(idx){

  const next =
    game.checkpoints[
      game.checkpointIndex
    ];


  if(
    next!==undefined &&
    Math.abs(idx-next)<12
  ){

    const side =
      game.frames[next].side;


    const lateral =
      car.position
        .clone()
        .sub(
          game.points[next]
        )
        .dot(side);


    if(
      Math.abs(lateral)<
      game.width*.47
    ){

      game.checkpointIndex++;

      statusEl.textContent=
        "CHECKPOINT!";

    }

  }


  if(
    game.checkpointIndex>=
      game.checkpoints.length &&
    idx>
      game.points.length-18
  ){

    finishRace();

  }

}


/* ============================================================
   FINISH
   ============================================================ */

function finishRace(){

  game.finished=true;


  game.elapsed =
    (
      performance.now()-
      game.startTime
    )/1000;


  game.record.push({
    t:game.elapsed,
    p:car.position.clone(),
    r:car.rotation.y
  });


  saveGhost();


  if(
    game.elapsed<
    game.best
  ){

    game.best=
      game.elapsed;


    localStorage.setItem(
      "trackrush_best_"+
      game.trackId,
      String(game.best)
    );

  }


  bestEl.textContent =
    "BEST "+
    fmt(game.best);


  finishText.textContent =
    "Time: "+
    fmt(game.elapsed)
    +
    (
      game.best===
      game.elapsed
      ?
      "  •  NEW BEST!"
      :
      ""
    );


  document.getElementById(
    "finishTitle"
  ).textContent=
    "FINISHED!";


  message.style.display=
    "block";


  statusEl.textContent=
    "FINISH";

}


/* ============================================================
   GHOST
   ============================================================ */

function saveGhost(){

  const data =
    game.record.map(
      x=>[
        +x.t.toFixed(3),
        +x.p.x.toFixed(2),
        +x.p.y.toFixed(2),
        +x.p.z.toFixed(2),
        +x.r.toFixed(4)
      ]
    );


  localStorage.setItem(
    "trackrush_ghost_"+
    game.trackId,
    JSON.stringify(data)
  );

}


let ghostCar=null;


function makeGhostCar(){

  const g =
    car.clone(true);


  g.traverse(
    o=>{

      if(o.isMesh){

        o.material=
          mat.cyan;

        o.castShadow=false;

        o.receiveShadow=false;

      }

    }
  );


  g.scale.setScalar(.99);

  scene.add(g);

  return g;

}


function loadGhost(){

  if(ghostCar){

    scene.remove(
      ghostCar
    );

    ghostCar=null;

  }


  const raw =
    localStorage.getItem(
      "trackrush_ghost_"+
      game.trackId
    );


  if(!raw){

    return;

  }


  try{

    game.ghost=
      JSON.parse(raw);

    ghostCar=
      makeGhostCar();

  }

  catch(e){

    game.ghost=[];

  }

}


function updateGhost(){

  if(
    !ghostCar ||
    !game.started ||
    game.finished ||
    !game.ghost.length
  ){

    return;

  }


  const t =
    (
      performance.now()-
      game.startTime
    )/1000;


  if(
    t<0 ||
    t>
      game.ghost[
        game.ghost.length-1
      ][0]
  ){

    ghostCar.visible=false;

    return;

  }


  ghostCar.visible=true;


  let lo=0;

  let hi=
    game.ghost.length-1;


  while(lo<hi){

    const m =
      (lo+hi)>>1;


    if(
      game.ghost[m][0]<t
    ){

      lo=m+1;

    }

    else{

      hi=m;

    }

  }


  const a =
    game.ghost[
      Math.max(
        0,
        lo-1
      )
    ];


  const b =
    game.ghost[lo];


  const f =
    clamp(
      (
        t-a[0]
      )/
      Math.max(
        .0001,
        b[0]-a[0]
      ),
      0,
      1
    );


  ghostCar.position.set(

    THREE.MathUtils.lerp(
      a[1],
      b[1],
      f
    ),

    THREE.MathUtils.lerp(
      a[2],
      b[2],
      f
    ),

    THREE.MathUtils.lerp(
      a[3],
      b[3],
      f
    )

  );


  const dy =
    Math.atan2(
      Math.sin(
        b[4]-a[4]
      ),
      Math.cos(
        b[4]-a[4]
      )
    );


  ghostCar.rotation.y =
    a[4]+dy*f;

}


/* ============================================================
   CAMERA
   ============================================================ */

function updateCamera(dt){

  const forward =
    new THREE.Vector3(
      Math.sin(game.yaw),
      0,
      Math.cos(game.yaw)
    );


  const speed =
    Math.abs(
      game.speed
    );


  const distance =
    12+
    Math.min(
      8,
      speed*.075
    );


  const height =
    5.4+
    Math.min(
      3.5,
      speed*.025
    );


  const desired =
    car.position
      .clone()
      .addScaledVector(
        forward,
        -distance
      );


  desired.y+=height;


  camera.position.lerp(
    desired,
    1-
    Math.pow(
      .0005,
      dt
    )
  );


  const target =
    car.position
      .clone()
      .addScaledVector(
        forward,
        9
      );


  target.y+=1.15;


  camera.up.set(
    0,
    1,
    0
  );


  camera.lookAt(
    target
  );


  camera.fov +=
    (
      70+
      Math.min(
        13,
        speed*.1
      )
      -
      camera.fov
    )
    *
    Math.min(
      1,
      dt*4
    );


  camera.updateProjectionMatrix();

}


/* ============================================================
   HUD UPDATE
   ============================================================ */

function updateHUD(){

  if(
    game.started &&
    !game.finished
  ){

    game.elapsed =
      (
        performance.now()-
        game.startTime
      )/1000;

  }


  timeEl.textContent =
    fmt(game.elapsed);


  speedEl.textContent =
    Math.round(
      Math.abs(
        game.speed
      )*3.6
    )
    +
    " km/h";


  cpEl.textContent =
    "CHECKPOINT "+
    game.checkpointIndex+
    " / "+
    game.checkpoints.length;


  if(
    game.best<Infinity
  ){

    bestEl.textContent =
      "BEST "+
      fmt(game.best);

  }

}


/* ============================================================
   BEST TIME
   ============================================================ */

function loadBest(){

  const v =
    Number(
      localStorage.getItem(
        "trackrush_best_"+
        game.trackId
      )
    );


  game.best =
    isFinite(v)&&v>0
    ?
    v
    :
    Infinity;

}


/* ============================================================
   BUTTONS
   ============================================================ */

document.getElementById(
  "again"
).onclick=
  raceAgain;


document.getElementById(
  "new"
).onclick=
  newTrack;


/* ============================================================
   START GAME
   ============================================================ */

loadBest();

trackNo.textContent=
  game.trackId;

makeTrack();

loadBest();


/* ============================================================
   MAIN LOOP
   ============================================================ */

let last =
  performance.now();

let ghostClock=0;


function loop(now){

  const dt =
    Math.min(
      .033,
      (now-last)/1000
    );


  last=now;


  updatePhysics(dt);

  updateGhost();

  updateCamera(dt);

  updateHUD();


  if(
    game.started &&
    !game.finished
  ){

    ghostClock+=dt;


    if(
      ghostClock>.035
    ){

      ghostClock=0;


      game.record.push({

        t:
          (now-game.startTime)/1000,

        p:
          car.position.clone(),

        r:
          car.rotation.y

      });

    }

  }


  renderer.render(
    scene,
    camera
  );


  requestAnimationFrame(
    loop
  );

}


requestAnimationFrame(
  loop
);

</script>
