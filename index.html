<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TrackRush 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#87b8df;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
  text-shadow:0 2px 5px #000;
}

#top{
  position:absolute;
  top:18px;
  left:18px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.card{
  min-width:120px;
  padding:9px 13px;
  border-radius:12px;
  background:rgba(8,12,22,.72);
  border:1px solid rgba(255,255,255,.2);
  box-shadow:0 5px 20px rgba(0,0,0,.2);
  backdrop-filter:blur(5px);
}

.label{
  font-size:10px;
  opacity:.65;
  text-transform:uppercase;
  letter-spacing:1px;
}

.value{
  font-size:20px;
  font-weight:800;
}

#help{
  position:absolute;
  bottom:18px;
  left:18px;
  padding:10px 14px;
  border-radius:12px;
  background:rgba(8,12,22,.68);
  font-size:13px;
}

#countdown{
  position:absolute;
  left:50%;
  top:44%;
  transform:translate(-50%,-50%);
  font-size:100px;
  font-weight:900;
  font-style:italic;
  text-align:center;
  display:none;
}

#message{
  position:absolute;
  left:50%;
  top:22%;
  transform:translateX(-50%);
  font-size:22px;
  font-weight:900;
  text-align:center;
}

#finish{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(430px,90vw);
  padding:28px;
  border-radius:22px;
  background:rgba(7,11,20,.92);
  border:2px solid rgba(255,255,255,.2);
  box-shadow:0 20px 80px rgba(0,0,0,.5);
  text-align:center;
  display:none;
  pointer-events:auto;
}

#finish h1{
  margin:0 0 5px;
  font-size:42px;
}

#finish p{
  margin:7px 0;
  opacity:.8;
}

button{
  margin-top:18px;
  padding:13px 24px;
  border:0;
  border-radius:12px;
  background:#ff6a00;
  color:white;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}

#speed{
  font-size:28px;
}

.small{
  font-size:12px;
  opacity:.7;
}
</style>
</head>

<body>

<div id="hud">

  <div id="top">

    <div class="card">
      <div class="label">Time</div>
      <div class="value" id="timer">0:00.000</div>
    </div>

    <div class="card">
      <div class="label">Best</div>
      <div class="value" id="best">--:---.---</div>
    </div>

    <div class="card">
      <div class="label">Track</div>
      <div class="value" id="track">Track 1</div>
    </div>

    <div class="card">
      <div class="label">Checkpoint</div>
      <div class="value" id="checkpoint">0 / 7</div>
    </div>

    <div class="card">
      <div class="label">Speed</div>
      <div class="value" id="speed">0 km/h</div>
    </div>

  </div>

  <div id="message"></div>

  <div id="countdown">3</div>

  <div id="help">
    <b>A / D</b> steer &nbsp; • &nbsp;
    <b>W / S</b> accelerate/brake &nbsp; • &nbsp;
    <b>R</b> reset &nbsp; • &nbsp;
    <b>N</b> new track
  </div>

  <div id="finish">
    <h1>FINISH!</h1>
    <p id="finishTime"></p>
    <p id="finishBest"></p>
    <p class="small">Press SPACE to race again</p>
    <button id="again">Race Again</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

"use strict";

/* =========================================================
   TRACKRUSH 3D
   Original browser-based 3D arcade racing game
   ========================================================= */


/* =========================================================
   DOM
   ========================================================= */

const timerEl =
  document.getElementById("timer");

const bestEl =
  document.getElementById("best");

const trackEl =
  document.getElementById("track");

const checkpointEl =
  document.getElementById("checkpoint");

const speedEl =
  document.getElementById("speed");

const countdownEl =
  document.getElementById("countdown");

const messageEl =
  document.getElementById("message");

const finishEl =
  document.getElementById("finish");

const finishTimeEl =
  document.getElementById("finishTime");

const finishBestEl =
  document.getElementById("finishBest");

const againButton =
  document.getElementById("again");


/* =========================================================
   THREE.JS SETUP
   ========================================================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x8bbbe0);

scene.fog =
  new THREE.Fog(0x8bbbe0,90,420);


const camera =
  new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    .1,
    1000
  );


const renderer =
  new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
  });

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.setPixelRatio(
  Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

document.body.appendChild(
  renderer.domElement
);


/* =========================================================
   LIGHTING
   ========================================================= */

const hemi =
  new THREE.HemisphereLight(
    0xbfe4ff,
    0x45603b,
    1.5
  );

scene.add(hemi);


const sun =
  new THREE.DirectionalLight(
    0xffffff,
    2.0
  );

sun.position.set(
  -80,
  150,
  100
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -180;
sun.shadow.camera.right = 180;
sun.shadow.camera.top = 180;
sun.shadow.camera.bottom = -180;

scene.add(sun);


/* =========================================================
   MATERIALS
   ========================================================= */

const mat = {

  road:
    new THREE.MeshStandardMaterial({
      color:0x353943,
      roughness:.92
    }),

  roadEdge:
    new THREE.MeshStandardMaterial({
      color:0x171a20,
      roughness:.9
    }),

  support:
    new THREE.MeshStandardMaterial({
      color:0x60656d,
      roughness:.95
    }),

  grass:
    new THREE.MeshStandardMaterial({
      color:0x4e9145,
      roughness:1
    }),

  barrier:
    new THREE.MeshStandardMaterial({
      color:0xe5e8ec,
      roughness:.7
    }),

  barrierRed:
    new THREE.MeshStandardMaterial({
      color:0xd82027,
      roughness:.7
    }),

  yellow:
    new THREE.MeshStandardMaterial({
      color:0xffd400,
      emissive:0x503900,
      roughness:.35
    }),

  finish:
    new THREE.MeshStandardMaterial({
      color:0xf02030,
      emissive:0x400000,
      roughness:.35
    }),

  boost:
    new THREE.MeshStandardMaterial({
      color:0x00d8ff,
      emissive:0x006b91,
      emissiveIntensity:2,
      roughness:.3
    }),

  black:
    new THREE.MeshStandardMaterial({
      color:0x080a0d,
      roughness:.7
    }),

  glass:
    new THREE.MeshStandardMaterial({
      color:0x071a2b,
      metalness:.5,
      roughness:.15,
      transparent:true,
      opacity:.8
    }),

  white:
    new THREE.MeshStandardMaterial({
      color:0xffffff,
      roughness:.4
    }),

  rock:
    new THREE.MeshStandardMaterial({
      color:0x6c7375,
      roughness:1
    }),

  orange:
    new THREE.MeshStandardMaterial({
      color:0xff6a00,
      roughness:.3
    })
};


/* =========================================================
   GAME STATE
   ========================================================= */

const game = {

  width:21,

  segments:110,

  segmentLength:9,

  steer:.9,

  speed:0,

  started:false,

  racing:false,

  finished:false,

  time:0,

  countdown:0,

  checkpoint:0,

  trackNumber:1,

  points:[],

  frames:[],

  checkpoints:[],

  boosts:[],

  startZ:0

};


/* =========================================================
   CAR
   ========================================================= */

const car =
  new THREE.Group();

scene.add(car);

let carBody = null;

let wheels = [];


/* =========================================================
   TRACK ROOT
   ========================================================= */

const trackRoot =
  new THREE.Group();

scene.add(trackRoot);


/* =========================================================
   HELPERS
   ========================================================= */

function box(
  x,
  y,
  z,
  material
){

  const mesh =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        x,
        y,
        z
      ),
      material
    );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  return mesh;
}


function cyl(
  radius,
  depth,
  material,
  segments=16
){

  const mesh =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        depth,
        segments
      ),
      material
    );

  mesh.castShadow = true;
  mesh.receiveShadow = true;

  return mesh;
}


/* =========================================================
   MAX VERSTAPPEN-INSPIRED CAR
   ========================================================= */

function buildCar(){

  car.clear();

  wheels=[];


  const maxBlue =
    new THREE.MeshStandardMaterial({
      color:0x101b4d,
      metalness:.25,
      roughness:.3
    });


  const maxRed =
    new THREE.MeshStandardMaterial({
      color:0xd71920,
      metalness:.2,
      roughness:.3
    });


  const maxOrange =
    new THREE.MeshStandardMaterial({
      color:0xff6a00,
      metalness:.15,
      roughness:.32
    });


  const maxGold =
    new THREE.MeshStandardMaterial({
      color:0xf5c542,
      metalness:.4,
      roughness:.25
    });


  /* Main body */

  carBody =
    box(
      2.18,
      .58,
      4.35,
      maxBlue
    );

  carBody.position.y=1.05;

  car.add(carBody);


  /* Orange center stripe */

  const orangeStripe =
    box(
      .32,
      .08,
      4.0,
      maxOrange
    );

  orangeStripe.position.set(
    0,
    1.36,
    .05
  );

  car.add(orangeStripe);


  /* Red side sections */

  for(const s of [-1,1]){

    const redSide =
      box(
        .16,
        .38,
        3.2,
        maxRed
      );

    redSide.position.set(
      s*1.06,
      1.18,
      -.05
    );

    car.add(redSide);
  }


  /* Front nose */

  const nose =
    box(
      1.28,
      .32,
      1.9,
      maxBlue
    );

  nose.position.set(
    0,
    1.00,
    2.62
  );

  car.add(nose);


  const noseStripe =
    box(
      .34,
      .08,
      1.55,
      maxOrange
    );

  noseStripe.position.set(
    0,
    1.19,
    2.65
  );

  car.add(noseStripe);


  /* Center spine */

  const spine =
    box(
      .72,
      .30,
      2.85,
      maxBlue
    );

  spine.position.set(
    0,
    1.34,
    .35
  );

  car.add(spine);


  /* Cockpit */

  const cockpit =
    box(
      1.28,
      .56,
      1.52,
      mat.glass
    );

  cockpit.position.set(
    0,
    1.57,
    .42
  );

  car.add(cockpit);


  /* Halo */

  const halo =
    box(
      .12,
      .55,
      1.18,
      maxOrange
    );

  halo.position.set(
    0,
    1.95,
    .38
  );

  car.add(halo);


  /* Helmet */

  const helmet =
    cyl(
      .34,
      .5,
      maxOrange,
      16
    );

  helmet.position.set(
    0,
    1.9,
    .25
  );

  car.add(helmet);


  const visor =
    box(
      .55,
      .12,
      .28,
      maxBlue
    );

  visor.position.set(
    0,
    1.99,
    .45
  );

  car.add(visor);


  /* Sidepods */

  for(const s of [-1,1]){

    const pod =
      box(
        .48,
        .43,
        2.35,
        maxBlue
      );

    pod.position.set(
      s*1.18,
      .91,
      0
    );

    car.add(pod);


    const sidepod =
      box(
        .48,
        .34,
        1.65,
        maxRed
      );

    sidepod.position.set(
      s*1.03,
      1.08,
      -.15
    );

    car.add(sidepod);


    const orangeSide =
      box(
        .12,
        .12,
        1.45,
        maxOrange
      );

    orangeSide.position.set(
      s*1.30,
      1.18,
      -.15
    );

    car.add(orangeSide);


    const fin =
      box(
        .12,
        .55,
        1.35,
        maxOrange
      );

    fin.position.set(
      s*.82,
      1.36,
      -.75
    );

    car.add(fin);
  }


  /* Rear body */

  const rear =
    box(
      2.85,
      .25,
      .44,
      maxRed
    );

  rear.position.set(
    0,
    1.48,
    -2.12
  );

  car.add(rear);


  /* Rear wing */

  const rearWing =
    box(
      3.35,
      .20,
      .28,
      maxBlue
    );

  rearWing.position.set(
    0,
    2.00,
    -1.92
  );

  car.add(rearWing);


  const rearWingOrange =
    box(
      2.7,
      .12,
      .18,
      maxOrange
    );

  rearWingOrange.position.set(
    0,
    2.12,
    -1.92
  );

  car.add(rearWingOrange);


  const rearWingLower =
    box(
      2.65,
      .16,
      .26,
      maxRed
    );

  rearWingLower.position.set(
    0,
    1.72,
    -1.92
  );

  car.add(rearWingLower);


  /* Front wing */

  const frontWing =
    box(
      3.75,
      .14,
      .34,
      maxBlue
    );

  frontWing.position.set(
    0,
    .73,
    3.18
  );

  car.add(frontWing);


  const frontWingOrange =
    box(
      3.15,
      .10,
      .22,
      maxOrange
    );

  frontWingOrange.position.set(
    0,
    .84,
    2.82
  );

  car.add(frontWingOrange);


  /* Exhausts */

  for(const s of [-1,1]){

    const exhaust =
      cyl(
        .12,
        .32,
        maxGold,
        10
      );

    exhaust.rotation.z =
      Math.PI/2;

    exhaust.position.set(
      s*.62,
      1.17,
      -2.18
    );

    car.add(exhaust);
  }


  /* Brake light */

  const brakeLight =
    box(
      .48,
      .12,
      .12,
      maxOrange
    );

  brakeLight.position.set(
    0,
    1.18,
    -2.28
  );

  car.add(brakeLight);


  /* Wheels */

  const wheelPos = [

    [-1.34,.67,1.58,true],

    [1.34,.67,1.58,true],

    [-1.34,.67,-1.58,false],

    [1.34,.67,-1.58,false]

  ];


  for(
    const [x,y,z,front]
    of wheelPos
  ){

    const pivot =
      new THREE.Group();

    pivot.position.set(
      x,y,z
    );


    const w =
      cyl(
        .52,
        .40,
        mat.black,
        18
      );

    w.rotation.z =
      Math.PI/2;

    pivot.add(w);


    const hub =
      cyl(
        .19,
        .43,
        maxOrange,
        12
      );

    hub.rotation.z =
      Math.PI/2;

    pivot.add(hub);


    car.add(pivot);


    wheels.push({
      pivot,
      w,
      front
    });

  }


  /* Number 3 */

  const numberTexture =
    createNumberTexture("3");


  const numberMaterial =
    new THREE.MeshBasicMaterial({
      map:numberTexture,
      transparent:true
    });


  const numberPlane =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1.15,
        .75
      ),
      numberMaterial
    );


  numberPlane.rotation.x =
    -Math.PI/2;

  numberPlane.position.set(
    0,
    1.37,
    .65
  );

  car.add(numberPlane);


  /* Dutch flag */

  const flagTexture =
    createDutchFlagTexture();


  const flagMaterial =
    new THREE.MeshBasicMaterial({
      map:flagTexture
    });


  const flag =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        .8,
        .45
      ),
      flagMaterial
    );


  flag.rotation.x =
    -Math.PI/2;

  flag.position.set(
    0,
    1.39,
    -1.05
  );

  car.add(flag);


  scene.add(car);
}


/* =========================================================
   NUMBER TEXTURE
   ========================================================= */

function createNumberTexture(number){

  const canvas =
    document.createElement("canvas");

  canvas.width=256;
  canvas.height=128;

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,0,256,128
  );

  ctx.font =
    "bold 110px Arial";

  ctx.textAlign="center";

  ctx.textBaseline="middle";

  ctx.fillStyle="#ffffff";

  ctx.strokeStyle="#101b4d";

  ctx.lineWidth=10;

  ctx.strokeText(
    number,
    128,
    64
  );

  ctx.fillText(
    number,
    128,
    64
  );

  return new THREE.CanvasTexture(
    canvas
  );
}


/* =========================================================
   DUTCH FLAG TEXTURE
   ========================================================= */

function createDutchFlagTexture(){

  const canvas =
    document.createElement("canvas");

  canvas.width=256;
  canvas.height=128;

  const ctx =
    canvas.getContext("2d");


  ctx.fillStyle="#ae1c28";

  ctx.fillRect(
    0,
    0,
    256,
    42
  );


  ctx.fillStyle="#ffffff";

  ctx.fillRect(
    0,
    42,
    256,
    43
  );


  ctx.fillStyle="#21468b";

  ctx.fillRect(
    0,
    85,
    256,
    43
  );


  return new THREE.CanvasTexture(
    canvas
  );
}


/* =========================================================
   TRACK GENERATION
   ========================================================= */

function clearTrack(){

  while(trackRoot.children.length){

    trackRoot.remove(
      trackRoot.children[
        trackRoot.children.length-1
      ]
    );

  }

  game.points=[];
  game.frames=[];
  game.checkpoints=[];
  game.boosts=[];
}


/* =========================================================
   GENERATE TRACK POINTS
   ========================================================= */

function generateTrack(){

  clearTrack();


  const count =
    game.segments;


  let x=0;
  let y=0;
  let z=0;

  let heading=0;


  for(let i=0;i<=count;i++){

    const t =
      i/count;


    if(i>0){

      heading +=
        Math.sin(i*.105) * .030 +
        Math.sin(i*.043) * .018;


      const turn =
        Math.sin(i*.075) * .55 +
        Math.sin(i*.19) * .18;


      heading += turn*.012;


      x +=
        Math.sin(heading) *
        game.segmentLength;


      z +=
        Math.cos(heading) *
        game.segmentLength;


      y +=
        Math.sin(i*.105)*.09 +
        Math.sin(i*.043)*.12;


      if(y>12)
        y=12;

      if(y<-3)
        y=-3;
    }


    game.points.push(
      new THREE.Vector3(
        x,
        y,
        z
      )
    );
  }


  buildRoad();

  buildCheckpoints();

  buildBoosts();

  buildScenery();

  positionCarAtStart();
}


/* =========================================================
   TRACK FRAMES
   ========================================================= */

function getFrame(i){

  const p =
    game.points[i];


  const prev =
    game.points[
      Math.max(0,i-1)
    ];


  const next =
    game.points[
      Math.min(
        game.points.length-1,
        i+1
      )
    ];


  const forward =
    new THREE.Vector3()
      .subVectors(next,prev)
      .normalize();


  const side =
    new THREE.Vector3(
      forward.z,
      0,
      -forward.x
    ).normalize();


  return {
    point:p,
    forward,
    side
  };
}


/* =========================================================
   ROAD
   ========================================================= */

function buildRoad(){

  const roadMaterial =
    mat.road;


  for(
    let i=0;
    i<game.points.length-1;
    i++
  ){

    const a =
      game.points[i];

    const b =
      game.points[i+1];


    const center =
      new THREE.Vector3()
        .addVectors(a,b)
        .multiplyScalar(.5);


    const direction =
      new THREE.Vector3()
        .subVectors(b,a);


    const length =
      direction.length();


    const road =
      box(
        game.width,
        .55,
        length+1.2,
        roadMaterial
      );


    road.position.copy(center);

    road.lookAt(
      center.clone().add(direction)
    );


    trackRoot.add(road);


    /* Road support */

    const support =
      box(
        game.width+5,
        2.8,
        length+2.8,
        mat.support
      );


    support.position.set(
      center.x,
      center.y-1.55,
      center.z
    );


    support.lookAt(
      center.clone().add(direction)
    );


    trackRoot.add(support);


    /* Continuous side walls */

    const frame =
      getFrame(i);


    for(const sideSign of [-1,1]){

      const wall =
        box(
          1.35,
          3.8,
          length+4.8,
          i%7===0
            ? mat.barrierRed
            : mat.barrier
        );


      wall.position.copy(center);

      wall.position.add(
        frame.side.clone()
          .multiplyScalar(
            sideSign *
            (game.width/2+.55)
          )
      );

      wall.position.y += 1.15;


      wall.lookAt(
        center.clone().add(direction)
      );


      trackRoot.add(wall);
    }


    /* Road stripe */

    if(i%7===0){

      for(
        const sideSign of [-1,1]
      ){

        const stripe =
          box(
            .32,
            .04,
            length+1.2,
            mat.barrierRed
          );


        stripe.position.copy(center);


        stripe.position.add(
          frame.side.clone()
            .multiplyScalar(
              sideSign *
              (game.width/2-.35)
            )
        );


        stripe.position.y += .31;


        stripe.lookAt(
          center.clone().add(direction)
        );


        trackRoot.add(stripe);
      }
    }
  }
}


/* =========================================================
   CHECKPOINTS
   ========================================================= */

function buildCheckpoints(){

  const count=7;


  for(
    let i=1;
    i<=count;
    i++
  ){

    const index =
      Math.floor(
        game.points.length *
        (i/(count+1))
      );


    const frame =
      getFrame(index);


    const gate =
      new THREE.Group();


    const postL =
      box(
        .32,
        5.2,
        .32,
        mat.yellow
      );


    const postR =
      postL.clone();


    postL.position.x =
      -game.width/2+.5;

    postR.position.x =
      game.width/2-.5;


    postL.position.y=2.6;
    postR.position.y=2.6;


    const top =
      box(
        game.width,
        .34,
        .34,
        mat.yellow
      );


    top.position.y=5.05;


    gate.add(
      postL,
      postR,
      top
    );


    gate.position.copy(
      frame.point
    );


    gate.lookAt(
      frame.point.clone()
        .add(frame.forward)
    );


    trackRoot.add(gate);


    game.checkpoints.push({
      index,
      gate
    });
  }


  /* Finish gate */

  const finishIndex =
    game.points.length-4;


  const frame =
    getFrame(finishIndex);


  const gate =
    new THREE.Group();


  const left =
    box(
      .42,
      6,
      .42,
      mat.finish
    );


  const right =
    left.clone();


  left.position.x =
    -game.width/2+.5;

  right.position.x =
    game.width/2-.5;


  left.position.y=3;
  right.position.y=3;


  const top =
    box(
      game.width,
      .45,
      .45,
      mat.finish
    );


  top.position.y=5.75;


  gate.add(
    left,
    right,
    top
  );


  gate.position.copy(
    frame.point
  );


  gate.lookAt(
    frame.point.clone()
      .add(frame.forward)
  );


  trackRoot.add(gate);
}


/* =========================================================
   BOOST PADS
   ========================================================= */

function buildBoosts(){

  const positions=[
    .12,
    .25,
    .39,
    .51,
    .63,
    .76,
    .87
  ];


  for(
    const fraction of positions
  ){

    const index =
      Math.floor(
        game.points.length *
        fraction
      );


    const frame =
      getFrame(index);


    for(
      const lane of [-.32,0,.32]
    ){

      const pad =
        box(
          4.2,
          .08,
          1.15,
          mat.boost
        );


      pad.position.copy(
        frame.point
      );


      pad.position.y += .34;


      pad.position.add(
        frame.side.clone()
          .multiplyScalar(
            lane*game.width
          )
      );


      pad.lookAt(
        pad.position.clone()
          .add(frame.forward)
      );


      trackRoot.add(pad);


      game.boosts.push({
        mesh:pad,
        index
      });
    }
  }
}


/* =========================================================
   SCENERY
   ========================================================= */

function buildScenery(){

  for(
    let i=5;
    i<game.points.length;
    i+=6
  ){

    const frame =
      getFrame(i);


    for(
      const sideSign of [-1,1]
    ){

      const distance =
        game.width/2 +
        13 +
        Math.random()*18;


      const rock =
        cyl(
          1.5+
          Math.random()*2,
          2+
          Math.random()*4,
          mat.rock,
          7
        );


      rock.position.copy(
        frame.point
      );


      rock.position.add(
        frame.side.clone()
          .multiplyScalar(
            sideSign*distance
          )
      );


      rock.position.y =
        frame.point.y-1;


      rock.rotation.y =
        Math.random()*Math.PI;


      trackRoot.add(rock);
    }
  }


  /* Distant pylons */

  for(
    let i=15;
    i<game.points.length;
    i+=18
  ){

    const frame =
      getFrame(i);


    const tower =
      new THREE.Group();


    const pole =
      box(
        .35,
        13,
        .35,
        mat.support
      );


    pole.position.y=6.5;


    const top =
      box(
        3,
        .25,
        .25,
        mat.support
      );


    top.position.y=12;


    tower.add(
      pole,
      top
    );


    tower.position.copy(
      frame.point
    );


    tower.position.add(
      frame.side.clone()
        .multiplyScalar(
          30
        )
    );


    trackRoot.add(tower);
  }
}


/* =========================================================
   POSITION CAR
   ========================================================= */

function positionCarAtStart(){

  const frame =
    getFrame(2);


  car.position.copy(
    frame.point
  );


  car.position.y += .38;


  car.rotation.y =
    Math.atan2(
      frame.forward.x,
      frame.forward.z
    );


  game.speed=0;
}


/* =========================================================
   INPUT
   ========================================================= */

const keys={};


window.addEventListener(
  "keydown",
  e=>{

    keys[e.code]=true;


    if(
      e.code==="KeyR"
    ){
      resetRace();
    }


    if(
      e.code==="KeyN"
    ){
      newTrack();
    }


    if(
      e.code==="Space" &&
      game.finished
    ){

      e.preventDefault();

      resetRace();
    }
  }
);


window.addEventListener(
  "keyup",
  e=>{
    keys[e.code]=false;
  }
);


/* =========================================================
   TRACK POSITION
   ========================================================= */

function nearestTrack(){

  let best=Infinity;

  let index=0;


  const start =
    Math.max(
      0,
      game.currentIndex-15
    );


  const end =
    Math.min(
      game.points.length-1,
      game.currentIndex+25
    );


  for(
    let i=start;
    i<=end;
    i++
  ){

    const d =
      car.position.distanceToSquared(
        game.points[i]
      );


    if(d<best){

      best=d;
      index=i;
    }
  }


  return index;
}


/* =========================================================
   PHYSICS
   ========================================================= */

function updatePhysics(dt){

  if(
    !game.racing ||
    game.finished
  ){

    return;
  }


  const throttle =
    keys.KeyW ||
    keys.ArrowUp;


  const brake =
    keys.KeyS ||
    keys.ArrowDown;


  if(throttle){

    game.speed +=
      52*dt;
  }
  else{

    game.speed -=
      8*dt;
  }


  if(brake){

    game.speed -=
      72*dt;
  }


  game.speed =
    THREE.MathUtils.clamp(
      game.speed,
      -18,
      92
    );


  const speedRatio =
    Math.abs(game.speed)/92;


  /* A = RIGHT, D = LEFT */

  let requested=0;


  if(
    keys.KeyA ||
    keys.ArrowLeft
  ){

    requested += 1;
  }


  if(
    keys.KeyD ||
    keys.ArrowRight
  ){

    requested -= 1;
  }


  const steerPower =
    (.52+
      speedRatio*2.25) *
    game.steer;


  car.rotation.y +=
    requested *
    steerPower *
    dt;


  const forward =
    new THREE.Vector3(
      Math.sin(car.rotation.y),
      0,
      Math.cos(car.rotation.y)
    );


  car.position.add(
    forward.multiplyScalar(
      game.speed*dt
    )
  );


  /* Gravity / track following */

  const idx =
    nearestTrack();


  game.currentIndex =
    idx;


  const frame =
    getFrame(idx);


  const lateral =
    car.position.clone()
      .sub(frame.point)
      .dot(frame.side);


  /* Hard wall collision */

  const half =
    game.width/2;


  const wallCenter =
    half+.68;


  const carHalf =
    1.45;


  const wallLimit =
    wallCenter-carHalf;


  if(lateral>wallLimit){

    car.position.add(
      frame.side.clone()
        .multiplyScalar(
          wallLimit-lateral
        )
    );

    game.speed *= .72;
  }


  if(lateral<-wallLimit){

    car.position.add(
      frame.side.clone()
        .multiplyScalar(
          -wallLimit-lateral
        )
    );

    game.speed *= .72;
  }


  /* Safe road boundary */

  const safe =
    game.width/2-1.35;


  if(lateral>safe){

    car.position.add(
      frame.side.clone()
        .multiplyScalar(
          safe-lateral
        )
    );

    game.speed *= .86;
  }


  if(lateral<-safe){

    car.position.add(
      frame.side.clone()
        .multiplyScalar(
          -safe-lateral
        )
    );

    game.speed *= .86;
  }


  /* Follow elevation */

  const targetY =
    frame.point.y+.38;


  car.position.y +=
    (targetY-car.position.y) *
    Math.min(
      1,
      dt*8
    );


  /* Prevent falling */

  if(
    car.position.y <
    frame.point.y-.5
  ){

    car.position.y =
      frame.point.y+.38;

    game.speed *= .6;
  }


  /* Align slightly to road */

  const targetYaw =
    Math.atan2(
      frame.forward.x,
      frame.forward.z
    );


  let yawDifference =
    targetYaw-car.rotation.y;


  while(
    yawDifference>Math.PI
  )
    yawDifference -=
      Math.PI*2;


  while(
    yawDifference<-Math.PI
  )
    yawDifference +=
      Math.PI*2;


  car.rotation.y +=
    yawDifference *
    dt *
    .8;


  /* Wheel spin */

  for(
    const wheel of wheels
  ){

    wheel.w.rotation.x -=
      game.speed*dt*1.8;


    if(wheel.front){

      wheel.pivot.rotation.y =
        requested*.35;
    }
  }


  /* Boosts */

  for(
    const boost of game.boosts
  ){

    if(
      Math.abs(
        idx-boost.index
      )<2
    ){

      const d =
        car.position.distanceTo(
          boost.mesh.position
        );


      if(d<3.2){

        game.speed +=
          45*dt;
      }
    }
  }


  /* Checkpoints */

  const nextCheckpoint =
    game.checkpoint;


  if(
    nextCheckpoint <
    game.checkpoints.length
  ){

    const target =
      game.checkpoints[
        nextCheckpoint
      ];


    if(
      Math.abs(
        idx-target.index
      )<3
    ){

      game.checkpoint++;

      checkpointEl.textContent =
        game.checkpoint+
        " / "+
        game.checkpoints.length;

      messageEl.textContent =
        "CHECKPOINT "+game.checkpoint;


      setTimeout(
        ()=>{
          if(
            !game.finished
          ){
            messageEl.textContent="";
          }
        },
        900
      );
    }
  }


  /* Finish */

  if(
    idx>=game.points.length-5 &&
    game.checkpoint>=
      game.checkpoints.length
  ){

    finishRace();
  }
}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(dt){

  const forward =
    new THREE.Vector3(
      Math.sin(car.rotation.y),
      0,
      Math.cos(car.rotation.y)
    );


  const target =
    car.position.clone()
      .add(
        forward.clone()
          .multiplyScalar(2.2)
      );


  const desired =
    car.position.clone()
      .add(
        forward.clone()
          .multiplyScalar(-10)
      );


  desired.y += 5.7;


  camera.position.lerp(
    desired,
    1-Math.pow(
      .001,
      dt
    )
  );


  camera.up.set(
    0,
    1,
    0
  );


  camera.lookAt(
    target
  );
}


/* =========================================================
   COUNTDOWN
   ========================================================= */

function startCountdown(){

  game.racing=false;

  game.started=false;

  game.countdown=3;


  countdownEl.style.display =
    "block";


  const interval =
    setInterval(
      ()=>{

        if(
          game.countdown>0
        ){

          countdownEl.textContent =
            game.countdown;

          game.countdown--;

        }
        else{

          countdownEl.textContent =
            "GO!";

          game.racing=true;

          game.started=true;

          clearInterval(interval);


          setTimeout(
            ()=>{
              countdownEl.style.display=
                "none";
            },
            700
          );
        }

      },
      800
    );
}


/* =========================================================
   RESET
   ========================================================= */

function resetRace(){

  finishEl.style.display=
    "none";


  game.time=0;

  game.checkpoint=0;

  game.finished=false;

  game.started=false;

  game.currentIndex=2;

  checkpointEl.textContent=
    "0 / 7";

  messageEl.textContent="";


  positionCarAtStart();

  startCountdown();
}


/* =========================================================
   NEW TRACK
   ========================================================= */

function newTrack(){

  game.trackNumber++;

  trackEl.textContent =
    "Track "+
    game.trackNumber;


  generateTrack();

  resetRace();
}


/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(seconds){

  const minutes =
    Math.floor(
      seconds/60
    );


  const secs =
    seconds%60;


  return (
    minutes+
    ":"+
    secs
      .toFixed(3)
      .padStart(6,"0")
  );
}


/* =========================================================
   BEST TIME
   ========================================================= */

function bestKey(){

  return (
    "trackrush-best-"+game.trackNumber
  );
}


function getBest(){

  const value =
    localStorage.getItem(
      bestKey()
    );


  return value
    ? Number(value)
    : null;
}


function updateBestDisplay(){

  const best =
    getBest();


  bestEl.textContent =
    best===null
      ? "--:---.---"
      : formatTime(best);
}


/* =========================================================
   FINISH
   ========================================================= */

function finishRace(){

  if(game.finished)
    return;


  game.finished=true;

  game.racing=false;


  const finalTime =
    game.time;


  const oldBest =
    getBest();


  let newBest=false;


  if(
    oldBest===null ||
    finalTime<oldBest
  ){

    localStorage.setItem(
      bestKey(),
      finalTime.toString()
    );

    newBest=true;
  }


  updateBestDisplay();


  finishTimeEl.textContent =
    "Your time: "+
    formatTime(finalTime);


  finishBestEl.textContent =
    newBest
      ? "NEW PERSONAL BEST!"
      : "Best: "+
        formatTime(
          getBest()
        );


  finishEl.style.display =
    "block";
}


/* =========================================================
   FINISH BUTTON
   ========================================================= */

againButton.addEventListener(
  "click",
  ()=>{
    resetRace();
  }
);


/* =========================================================
   HUD
   ========================================================= */

function updateHUD(){

  timerEl.textContent =
    formatTime(game.time);


  speedEl.textContent =
    Math.round(
      Math.abs(game.speed)*3.6
    )+
    " km/h";


  updateBestDisplay();
}


/* =========================================================
   WORLD GROUND
   ========================================================= */

function buildGround(){

  const ground =
    new THREE.Mesh(
      new THREE.PlaneGeometry(
        1500,
        1500
      ),
      mat.grass
    );


  ground.rotation.x =
    -Math.PI/2;


  ground.position.y=-4;


  ground.receiveShadow=true;


  scene.add(ground);
}


/* =========================================================
   STARTUP
   ========================================================= */

buildGround();

buildCar();

generateTrack();

trackEl.textContent =
  "Track "+
  game.trackNumber;

updateBestDisplay();

camera.position.set(
  0,
  7,
  -12
);


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
  "resize",
  ()=>{
    camera.aspect =
      innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);


/* =========================================================
   MAIN LOOP
   ========================================================= */

let last =
  performance.now();


function animate(now){

  requestAnimationFrame(
    animate
  );


  let dt =
    (now-last)/1000;


  last=now;


  dt =
    Math.min(
      dt,
      .05
    );


  if(
    game.racing &&
    !game.finished
  ){

    game.time += dt;
  }


  updatePhysics(dt);

  updateCamera(dt);

  updateHUD();


  renderer.render(
    scene,
    camera
  );
}


requestAnimationFrame(
  animate
);


/* =========================================================
   START
   ========================================================= */

setTimeout(
  ()=>{
    resetRace();
  },
  400
);

</script>
