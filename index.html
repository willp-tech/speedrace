<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>F1 Fan Racing</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07090d;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
}

#title{
    position:absolute;
    top:18px;
    left:22px;
    font-size:27px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 3px 10px #000;
}

#trackName{
    position:absolute;
    top:55px;
    left:24px;
    font-size:13px;
    opacity:.8;
}

#timer{
    position:absolute;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    font-size:28px;
    font-weight:900;
    font-variant-numeric:tabular-nums;
    text-shadow:0 3px 10px #000;
}

#buttons{
    position:absolute;
    top:18px;
    right:18px;
    display:flex;
    gap:8px;
    pointer-events:auto;
}

button{
    border:1px solid rgba(255,255,255,.18);
    border-radius:7px;
    padding:11px 15px;
    color:white;
    background:rgba(13,16,22,.9);
    font-weight:800;
    cursor:pointer;
}

button:hover{
    background:rgba(55,60,70,.95);
}

#speed{
    position:absolute;
    right:25px;
    bottom:25px;
    font-size:31px;
    font-weight:900;
    text-shadow:0 3px 10px #000;
}

#checkpoints{
    position:absolute;
    right:27px;
    bottom:68px;
    font-size:18px;
    font-weight:900;
    text-shadow:0 3px 10px #000;
}

#message{
    position:absolute;
    top:105px;
    left:50%;
    transform:translateX(-50%);
    padding:12px 22px;
    background:rgba(0,0,0,.5);
    border-radius:8px;
    font-weight:900;
    opacity:0;
    transition:opacity:.2s;
}

#controls{
    position:absolute;
    left:22px;
    bottom:20px;
    font-size:13px;
    line-height:1.7;
    opacity:.75;
}

#finishScreen,
#exitScreen{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.73);
    z-index:50;
}

.panel{
    width:min(520px,90vw);
    padding:36px;
    text-align:center;
    color:white;
    background:rgba(13,16,23,.97);
    border:1px solid rgba(255,255,255,.18);
    border-radius:18px;
    box-shadow:0 20px 90px #000;
}

.panel h1{
    font-size:43px;
    margin-top:0;
}
</style>
</head>

<body>

<div id="hud">

    <div id="title">F1 FAN RACING</div>
    <div id="trackName"></div>

    <div id="timer">00:00.000</div>

    <div id="buttons">
        <button id="nextTrack">NEXT TRACK</button>
        <button id="exitButton">EXIT</button>
    </div>

    <div id="message"></div>

    <div id="checkpoints">0 / 0</div>
    <div id="speed">0 KM/H</div>

    <div id="controls">
        <b>W</b> Accelerate&nbsp;&nbsp;
        <b>S</b> Brake / Reverse&nbsp;&nbsp;
        <b>A</b> Left&nbsp;&nbsp;
        <b>D</b> Right&nbsp;&nbsp;
        <b>R</b> Reset
    </div>
</div>

<div id="finishScreen">
    <div class="panel">
        <h1>FINISHED!</h1>
        <div id="finishTime" style="font-size:25px;margin-bottom:25px"></div>
        <button id="raceAgain">RACE AGAIN</button>
        <button id="finishNext">NEXT TRACK</button>
        <button id="finishExit">EXIT</button>
    </div>
</div>

<div id="exitScreen">
    <div class="panel">
        <h1>RACE PAUSED</h1>
        <button id="returnRace">RETURN TO RACE</button>
        <button id="exitNext">NEXT TRACK</button>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x83bde8);

scene.fog =
    new THREE.Fog(
        0x83bde8,
        180,
        1300
    );


const camera =
    new THREE.PerspectiveCamera(
        66,
        innerWidth / innerHeight,
        .1,
        3500
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x394550,
        2.1
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        3.4
    );

sun.position.set(
    250,
    400,
    150
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -700;
sun.shadow.camera.right = 700;
sun.shadow.camera.top = 700;
sun.shadow.camera.bottom = -700;

scene.add(sun);


/* =========================================================
   GAME
========================================================= */

const game = {

    trackNumber:1,

    theme:"FOREST",

    track:null,

    road:null,
    ground:null,
    scenery:null,
    barriers:null,
    gates:null,

    car:null,
    ghost:null,

    ghostData:[],

    started:false,
    finished:false,

    startTime:0,

    speed:0,

    /*
       steering:
       -1 = full left
       +1 = full right
    */
    steering:0,

    steeringVelocity:0,

    checkpointIndex:0,

    carTrackIndex:0,

    recording:[],

    keys:{
        w:false,
        s:false,
        a:false,
        d:false
    },

    /*
       More natural racing physics
    */
    maxForwardSpeed:125,
    maxReverseSpeed:22,

    acceleration:32,
    braking:75,
    reverseAcceleration:17,

    rollingResistance:3.5,

    yaw:0,

    lateralVelocity:0,

    lastFrame:performance.now(),

    skidTimer:0
};


/* =========================================================
   UI
========================================================= */

const timerEl =
    document.getElementById("timer");

const speedEl =
    document.getElementById("speed");

const checkpointEl =
    document.getElementById("checkpoints");

const trackNameEl =
    document.getElementById("trackName");

const messageEl =
    document.getElementById("message");


function message(text,time=1400){

    messageEl.textContent = text;

    messageEl.style.opacity = 1;

    clearTimeout(
        messageEl._timer
    );

    messageEl._timer =
        setTimeout(()=>{
            messageEl.style.opacity=0;
        },time);
}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
"keydown",
e=>{

    if(e.code==="KeyW"){

        game.keys.w=true;

        if(
            !game.started &&
            !game.finished
        ){
            startRace();
        }
    }

    if(e.code==="KeyS")
        game.keys.s=true;

    if(e.code==="KeyA")
        game.keys.a=true;

    if(e.code==="KeyD")
        game.keys.d=true;

    if(e.code==="KeyR")
        resetCar();

    if(e.code==="Space" &&
       game.finished){

        resetCar();
        startRace();
    }
});


window.addEventListener(
"keyup",
e=>{

    if(e.code==="KeyW")
        game.keys.w=false;

    if(e.code==="KeyS")
        game.keys.s=false;

    if(e.code==="KeyA")
        game.keys.a=false;

    if(e.code==="KeyD")
        game.keys.d=false;
});


/* =========================================================
   TRACK GENERATION
========================================================= */

const themes=[
    "FOREST",
    "DESERT",
    "ALPINE",
    "CANYON",
    "COAST"
];


function randomRange(a,b){
    return a+
        Math.random()*(b-a);
}


function randomChoice(arr){
    return arr[
        Math.floor(
            Math.random()*arr.length
        )
    ];
}


function generateTrack(){

    const points=[];

    let x=0;
    let z=0;

    let heading=0;

    /*
       More points = longer and more elaborate track.
    */

    const count=34;

    for(
        let i=0;
        i<count;
        i++
    ){

        const progress =
            i/(count-1);

        /*
           Stronger corners in the middle
           of the track.
        */

        let turn =
            randomRange(
                -.55,
                .55
            );

        if(
            progress<.08 ||
            progress>.92
        ){
            turn*=.25;
        }

        heading += turn;

        /*
           Occasional sweeping section.
        */

        if(
            i%7===0 &&
            i>3 &&
            i<count-4
        ){

            heading +=
                randomChoice([
                    -.45,
                    .45
                ]);
        }

        const distance =
            randomRange(
                55,
                92
            );

        x +=
            Math.sin(heading)*
            distance;

        z +=
            Math.cos(heading)*
            distance;

        let y=0;

        if(game.theme==="ALPINE"){

            y =
                Math.sin(i*.45)*18+
                Math.sin(i*1.15)*6;
        }

        if(game.theme==="CANYON"){

            y =
                Math.sin(i*.5)*10+
                Math.cos(i*.22)*13;
        }

        if(game.theme==="DESERT"){

            y =
                Math.sin(i*.35)*3;
        }

        if(game.theme==="COAST"){

            y =
                Math.sin(i*.42)*6;
        }

        if(game.theme==="FOREST"){

            y =
                Math.sin(i*.7)*5+
                Math.cos(i*.25)*3;
        }

        points.push(
            new THREE.Vector3(
                x,y,z
            )
        );
    }


    const curve =
        new THREE.CatmullRomCurve3(
            points,
            false,
            "centripetal",
            .5
        );

    curve.arcLengthDivisions=2500;

    return{
        curve,
        width:randomRange(16,20)
    };
}


/* =========================================================
   TRACK HELPERS
========================================================= */

function getTrackPoint(t){

    return game.track.curve
        .getPointAt(
            THREE.MathUtils.clamp(
                t,0,1
            )
        );
}


function getTrackTangent(t){

    return game.track.curve
        .getTangentAt(
            THREE.MathUtils.clamp(
                t,0,1
            )
        )
        .normalize();
}


/*
   This calculates the exact starting heading.
*/
function getTrackHeading(t=.005){

    const tangent =
        getTrackTangent(t);

    return Math.atan2(
        tangent.x,
        tangent.z
    );
}


/* =========================================================
   ROAD
========================================================= */

function createRoad(){

    const group =
        new THREE.Group();

    const segments=700;

    const vertices=[];
    const uvs=[];
    const indices=[];

    for(
        let i=0;
        i<=segments;
        i++
    ){

        const t=i/segments;

        const p=
            getTrackPoint(t);

        const tangent=
            getTrackTangent(t);

        const side=
            new THREE.Vector3(
                tangent.z,
                0,
                -tangent.x
            ).normalize();

        const width=
            game.track.width;

        const left=
            p.clone()
            .addScaledVector(
                side,
                width/2
            );

        const right=
            p.clone()
            .addScaledVector(
                side,
                -width/2
            );

        left.y+=.05;
        right.y+=.05;

        vertices.push(
            left.x,left.y,left.z,
            right.x,right.y,right.z
        );

        uvs.push(
            0,t*45,
            1,t*45
        );

        if(i<segments){

            const a=i*2;
            const b=a+1;
            const c=a+2;
            const d=a+3;

            indices.push(
                a,b,c,
                b,d,c
            );
        }
    }


    const geo =
        new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,3
        )
    );

    geo.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,2
        )
    );

    geo.setIndex(indices);

    geo.computeVertexNormals();


    const mat =
        new THREE.MeshStandardMaterial({
            color:0x24272b,
            roughness:.88,
            metalness:.04
        });


    const road =
        new THREE.Mesh(
            geo,
            mat
        );

    road.receiveShadow=true;

    group.add(road);


    /*
       Road center dashed line.
    */

    for(
        let i=0;
        i<180;
        i++
    ){

        const t=
            (i+.5)/180;

        const p=
            getTrackPoint(t);

        const tangent=
            getTrackTangent(t);

        const dash=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .18,
                    .025,
                    4.2
                ),
                new THREE.MeshStandardMaterial({
                    color:0xd8d8d8
                })
            );

        dash.position.copy(p);

        dash.position.y+=.12;

        dash.rotation.y=
            Math.atan2(
                tangent.x,
                tangent.z
            );

        group.add(dash);
    }


    createEdgeLines(group);

    createCurbs(group);


    game.road=group;

    scene.add(group);
}


function createEdgeLines(group){

    for(
        const amount of [-1,1]
    ){

        const pts=[];

        for(
            let i=0;
            i<=700;
            i++
        ){

            const t=i/700;

            const p=
                getTrackPoint(t);

            const tangent=
                getTrackTangent(t);

            const side=
                new THREE.Vector3(
                    tangent.z,
                    0,
                    -tangent.x
                ).normalize();

            p.addScaledVector(
                side,
                amount*
                game.track.width/2
            );

            p.y+=.13;

            pts.push(p);
        }


        const geo =
            new THREE.BufferGeometry()
            .setFromPoints(pts);

        const line =
            new THREE.Line(
                geo,
                new THREE.LineBasicMaterial({
                    color:0xffffff
                })
            );

        group.add(line);
    }
}


function createCurbs(group){

    /*
       Red/white curbs in corners and selected
       sections instead of covering every part.
    */

    for(
        let i=0;
        i<240;
        i++
    ){

        const t=i/240;

        if(
            i%2===1 &&
            Math.random()<.25
        )
            continue;

        const p=
            getTrackPoint(t);

        const tangent=
            getTrackTangent(t);

        const side=
            new THREE.Vector3(
                tangent.z,
                0,
                -tangent.x
            ).normalize();

        for(
            const s of [-1,1]
        ){

            const curb=
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        2.7,
                        .18,
                        1.5
                    ),
                    new THREE.MeshStandardMaterial({
                        color:
                            i%2===0
                            ?0xf0f0f0
                            :0xd32424
                    })
                );

            curb.position.copy(p);

            curb.position.addScaledVector(
                side,
                s*
                (game.track.width/2+1.35)
            );

            curb.position.y+=.13;

            curb.rotation.y=
                Math.atan2(
                    tangent.x,
                    tangent.z
                );

            curb.castShadow=true;

            group.add(curb);
        }
    }
}


/* =========================================================
   TRACKSIDE BARRIERS
========================================================= */

function createBarriers(){

    const group =
        new THREE.Group();

    /*
       Small repeating safety barriers.
    */

    for(
        let i=0;
        i<420;
        i++
    ){

        const t=
            (i+.2)/420;

        /*
           Don't put barriers directly at
           start/finish gates.
        */

        if(
            t<.025 ||
            t>.985
        )
            continue;

        const p=
            getTrackPoint(t);

        const tangent=
            getTrackTangent(t);

        const side=
            new THREE.Vector3(
                tangent.z,
                0,
                -tangent.x
            ).normalize();

        const distance =
            game.track.width/2+
            3.0;

        const s =
            i%2===0
            ?1
            :-1;

        const barrier=
            new THREE.Group();

        barrier.position.copy(p);

        barrier.position.addScaledVector(
            side,
            s*distance
        );

        barrier.position.y+=.55;

        barrier.rotation.y=
            Math.atan2(
                tangent.x,
                tangent.z
            );


        /*
           Main guard rail.
        */

        const rail=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    4.4,
                    .75,
                    .25
                ),
                new THREE.MeshStandardMaterial({
                    color:
                        i%4===0
                        ?0xd5d7da
                        :0x8b8f94,
                    metalness:.65,
                    roughness:.35
                })
            );

        rail.position.y=.45;

        rail.castShadow=true;


        /*
           Support posts.
        */

        const post1=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .18,
                    1.1,
                    .18
                ),
                new THREE.MeshStandardMaterial({
                    color:0x55595d,
                    metalness:.7
                })
            );

        const post2=
            post1.clone();

        post1.position.set(
            -1.65,
            0,
            0
        );

        post2.position.set(
            1.65,
            0,
            0
        );


        barrier.add(
            rail,
            post1,
            post2
        );

        group.add(barrier);
    }


    game.barriers=group;

    scene.add(group);
}


/* =========================================================
   GROUND
========================================================= */

function createGround(){

    let color=0x34733a;

    if(game.theme==="DESERT")
        color=0xb88a4c;

    if(game.theme==="ALPINE")
        color=0xdfe7eb;

    if(game.theme==="CANYON")
        color=0x955b3e;

    if(game.theme==="COAST")
        color=0x67a05a;


    const ground=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                5000,
                5000
            ),
            new THREE.MeshStandardMaterial({
                color,
                roughness:1
            })
        );

    ground.rotation.x=
        -Math.PI/2;

    ground.position.y=-1;

    ground.receiveShadow=true;

    game.ground=ground;

    scene.add(ground);
}


/* =========================================================
   SCENERY
========================================================= */

function createScenery(){

    const group=
        new THREE.Group();

    for(
        let i=0;
        i<220;
        i++
    ){

        const t=
            Math.random();

        const p=
            getTrackPoint(t);

        const tangent=
            getTrackTangent(t);

        const side=
            new THREE.Vector3(
                tangent.z,
                0,
                -tangent.x
            ).normalize();

        const distance=
            game.track.width/2+
            randomRange(35,130);

        const object=
            new THREE.Group();

        object.position.copy(p);

        object.position.addScaledVector(
            side,
            Math.random()<.5
            ?distance
            :-distance
        );

        if(game.theme==="FOREST"){

            const trunk=
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        1,
                        1.4,
                        8,
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x573721
                    })
                );

            trunk.position.y=4;

            const crown=
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        5.5,
                        13,
                        9
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x174d27
                    })
                );

            crown.position.y=11;

            trunk.castShadow=true;
            crown.castShadow=true;

            object.add(
                trunk,
                crown
            );
        }


        else if(game.theme==="DESERT"){

            const cactus=
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .7,
                        1,
                        randomRange(3,8),
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x397847
                    })
                );

            cactus.position.y=3;

            object.add(cactus);
        }


        else if(game.theme==="ALPINE"){

            const mountain=
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        randomRange(6,14),
                        randomRange(18,40),
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x9da6ab
                    })
                );

            mountain.position.y=10;

            object.add(mountain);
        }


        else if(game.theme==="CANYON"){

            const rock=
                new THREE.Mesh(
                    new THREE.DodecahedronGeometry(
                        randomRange(4,10),
                        1
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x73402e
                    })
                );

            rock.position.y=4;

            object.add(rock);
        }


        else{

            const tree=
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        4,
                        12,
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color:0x2d693a
                    })
                );

            tree.position.y=6;

            object.add(tree);
        }


        group.add(object);
    }


    game.scenery=group;

    scene.add(group);
}


/* =========================================================
   GATES
========================================================= */

function createGate(t,color){

    const group=
        new THREE.Group();

    const p=
        getTrackPoint(t);

    const tangent=
        getTrackTangent(t);

    group.position.copy(p);

    group.position.y+=6;

    group.rotation.y=
        Math.atan2(
            tangent.x,
            tangent.z
        );


    const mat=
        new THREE.MeshStandardMaterial({
            color,
            emissive:color,
            emissiveIntensity:.2
        });


    const postGeo=
        new THREE.BoxGeometry(
            .7,
            12,
            .7
        );


    const left=
        new THREE.Mesh(
            postGeo,
            mat
        );

    const right=
        new THREE.Mesh(
            postGeo,
            mat
        );

    left.position.x=
        -game.track.width/2;

    right.position.x=
        game.track.width/2;


    const top=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                game.track.width+1,
                .7,
                .7
            ),
            mat
        );


    group.add(
        left,
        right,
        top
    );

    game.gates.add(group);
}


/* =========================================================
   CAR
========================================================= */

function createCar(){

    const car=
        new THREE.Group();


    const bodyMat=
        new THREE.MeshStandardMaterial({
            color:0xd71920,

        );

    for(
        const [x,y,z,front]

        /*
           Separate steering pivot.

                })

            Math.PI/2;

        car.userData.wheels.push({
            steeringGroup,

            front
        });

    car.userData.brakeLights=[];

    for(

        glow.visible=false;

        car.add(glow);

        car.userData.exhaust.push(
            glow
        );
    }


    return car;
}


/* =========================================================
   PHYSICS
========================================================= */

function updateCar(dt){

    if(
        !game.car ||
        game.finished
    )
        return;


    const car=
        game.car;


    /*
       READ STEERING

       A = -1
       D = +1
    */

    let input=0;

    if(game.keys.a)
        input-=1;

    if(game.keys.d)
        input+=1;


    /*
       PROGRESSIVE STEERING

       Instead of instantly changing the wheel angle,
       the steering velocity gradually moves toward
       the desired input.

       This is what makes the car feel less abrupt.
    */

    const steeringAcceleration=8.5;

    game.steeringVelocity +=
        (
            input -
            game.steering
        )*
        steeringAcceleration*
        dt;


    /*
       Steering damping.
    */

    game.steeringVelocity *=
        Math.pow(
            .035,
            dt
        );


    game.steering +=
        game.steeringVelocity*
        dt;


    game.steering=
        THREE.MathUtils.clamp(
            game.steering,
            -1,
            1
        );


    /*
       ACCELERATION
    */

    if(game.keys.w){

        const throttleEffect=
            1-
            Math.min(
                Math.abs(game.speed)/
                game.maxForwardSpeed,
                1
            )*.55;

        game.speed +=
            game.acceleration*
            throttleEffect*
            dt;
    }


    /*
       NATURAL ROLLING
    */

    if(
        !game.keys.w &&
        !game.keys.s
    ){

        const amount=
            game.rollingResistance*
            dt;

        if(game.speed>0){

            game.speed=
                Math.max(
                    0,
                    game.speed-amount
                );
        }

        if(game.speed<0){

            game.speed=
                Math.min(
                    0,
                    game.speed+amount
                );
        }
    }


    /*
       BRAKING
    */

    const braking=
        game.keys.s &&
        game.speed>0;


    if(braking){

        game.speed -=
            game.braking*dt;

        if(game.speed<0)
            game.speed=0;
    }


    /*
       REVERSE
    */

    if(
        game.keys.s &&
        Math.abs(game.speed)<.5 &&
        !game.keys.w
    ){

        game.speed -=
            game.reverseAcceleration*
            dt;
    }


    /*
       Clamp speed.
    */

    game.speed=
        THREE.MathUtils.clamp(
            game.speed,
            -game.maxReverseSpeed,
            game.maxForwardSpeed
        );


    /*
       SPEED FACTORS
    */

    const speed=
        Math.abs(game.speed);

    const speedFactor=
        THREE.MathUtils.clamp(
            speed/30,
            0,
            1
        );


    /*
       Steering angle.

       At low speed:
       more steering.

       At high speed:
       less steering.

       This prevents the car from suddenly
       snapping around.
    */

    const maxSteeringAngle=
        THREE.MathUtils.lerp(
            34,
            13,
            THREE.MathUtils.clamp(
                speed/110,
                0,
                1
            )
        );


    const wheelAngle=
        THREE.MathUtils.degToRad(
            maxSteeringAngle
        )*
        game.steering;


    /*
       STEERING WHEELS

       Only the steering pivots rotate.
       The wheel cylinders NEVER rotate their
       steering axis, preventing the wiggle.
    */

    for(
        const wheel
        of game.car.userData.wheels
    ){

        if(wheel.front){

            wheel.steeringGroup.rotation.y=
                wheelAngle;
        }


        /*
           Wheel rolling.
        */

        wheel.wheel.rotation.x -=
            game.speed*
            dt*
            1.65;
    }


    /*
       NATURAL YAW

       Rather than rotating instantly,
       steering gradually generates yaw.
    */

    const steeringAuthority=
        THREE.MathUtils.lerp(
            .35,
            1.8,
            speedFactor
        );


    /*
       Reverse steering.
    */

    const direction=
        game.speed>=0
        ?1
        :-1;


    const targetYawRate=
        game.steering*
        steeringAuthority*
        direction;


    /*
       Smooth yaw response.
    */

    game.yaw +=
        (
            targetYawRate -
            game.yaw
        )*
        Math.min(
            1,
            dt*4.5
        );


    /*
       Reduce yaw while stopped.
    */

    if(speed<1){

        game.yaw *=
            Math.max(
                0,
                1-dt*8
            );
    }


    car.rotation.y +=
        game.yaw*
        dt;


    /*
       FORWARD VECTOR
    */

    const forward=
        new THREE.Vector3(
            0,
            0,
            1
        );

    forward.applyQuaternion(
        car.quaternion
    );

    forward.y=0;

    forward.normalize();


    /*
       LATERAL VELOCITY / GRIP

       This gives the car a small amount of
       natural slip instead of making it follow
       the nose exactly.
    */

    const right=
        new THREE.Vector3(
            forward.z,
            0,
            -forward.x
        );


    /*
       More grip when not drifting.
    */

    let grip=10.5;

    if(
        braking &&
        Math.abs(game.steering)>.25
    ){

        grip=6.2;
    }


    /*
       At high speed the car remains planted.
    */

    if(speed>90)
        grip=12.5;


    game.lateralVelocity *=
        Math.max(
            0,
            1-grip*dt
        );


    /*
       Controlled lateral movement.
    */

    if(
        speed>12 &&
        Math.abs(game.steering)>.08
    ){

        const driftAmount=
            game.steering*
            speed*
            .006;

        game.lateralVelocity +=
            driftAmount*
            dt*
            60;
    }


    /*
       Move forward.
    */

    car.position.addScaledVector(
        forward,
        game.speed*dt
    );


    /*
       Apply lateral movement.
    */

    car.position.addScaledVector(
        right,
        game.lateralVelocity*dt
    );


    /*
       FIND TRACK.
    */

    const nearest=
        closestTrackPoint(
            car.position
        );

    game.carTrackIndex=
        nearest.index;


    const trackPoint=
        nearest.point;

    const distance=
        nearest.distance;


    /*
       Soft road attraction.

       This keeps the game playable without making
       the car feel glued to the road.
    */

    if(
        distance<
        game.track.width*.65
    ){

        const correction=
            trackPoint.clone()
            .sub(car.position);

        correction.y=0;

        const correctionStrength=
            Math.min(
                1,
                dt*3
            );

        car.position.addScaledVector(
            correction,
            correctionStrength*
            .18
        );
    }


    /*
       ROAD HEIGHT
    */

    const targetY=
        trackPoint.y+.65;

    car.position.y +=
        (
            targetY-
            car.position.y
        )*
        Math.min(
            1,
            dt*8
        );


    /*
       OFF TRACK
    */

    if(
        distance>
        game.track.width*.66
    ){

        game.speed *=
            Math.pow(
                .91,
                dt
            );

        message(
            "OFF TRACK — PRESS R",
            100
        );
    }


    /*
       BRAKE LIGHTS
    */

    for(
        const light
        of game.car.userData.brakeLights
    ){

        if(braking){

            light.material.color
                .setHex(0xff2222);

            light.material.emissive
                .setHex(0xff0000);

            light.material
                .emissiveIntensity=4;

        }else{

            light.material.color
                .setHex(0x220000);

            light.material.emissive
                .setHex(0x000000);

            light.material
                .emissiveIntensity=0;
        }
    }


    /*
       EXHAUST
    */

    for(
        const glow
        of game.car.userData.exhaust
    ){

        glow.visible=
            game.keys.w &&
            speed>25;
    }


    /*
       SKIDS
    */

    if(
        braking &&
        Math.abs(game.steering)>.5 &&
        speed>35
    ){

        createSkidMark();
    }


    /*
       CHECKPOINTS
    */

    updateCheckpoints();


    /*
       GHOST RECORDING
    */

    if(game.started){

        game.recording.push({

            t:
                performance.now()-
                game.startTime,

            x:car.position.x,
            y:car.position.y,
            z:car.position.z,

            r:car.rotation.y
        });
    }
}


/* =========================================================
   CLOSEST TRACK POINT
========================================================= */

function closestTrackPoint(position){

    let best=Infinity;
    let point=null;
    let index=0;

    const samples=700;

    /*
       Search a larger neighborhood around
       the car's current track position.
    */

    let start=
        Math.max(
            0,
            game.carTrackIndex-40
        );

    let end=
        Math.min(
            samples,
            game.carTrackIndex+40
        );


    for(
        let i=start;
        i<=end;
        i++
    ){

        const p=
            getTrackPoint(
                i/samples
            );

        const dx=
            p.x-position.x;

        const dz=
            p.z-position.z;

        const d=
            dx*dx+dz*dz;

        if(d<best){

            best=d;
            point=p;
            index=i;
        }
    }


    /*
       If we somehow went far from the
       expected section, search everything.
    */

    if(best>12000){

        for(
            let i=0;
            i<=samples;
            i++
        ){

            const p=
                getTrackPoint(
                    i/samples
                );

            const dx=
                p.x-position.x;

            const dz=
                p.z-position.z;

            const d=
                dx*dx+dz*dz;

            if(d<best){

                best=d;
                point=p;
                index=i;
            }
        }
    }


    return{
        point,
        distance:Math.sqrt(best),
        index
    };
}


/* =========================================================
   SKID MARKS
========================================================= */

function createSkidMark(){

    if(game.skidTimer>0)
        return;

    game.skidTimer=.045;


    const nearest=
        closestTrackPoint(
            game.car.position
        );


    const tangent=
        getTrackTangent(
            nearest.index/700
        );


    const side=
        new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();


    for(
        const s of [-1,1]
    ){

        const mark=
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    .23,
                    2.2
                ),
                new THREE.MeshBasicMaterial({
                    color:0x050505,
                    transparent:true,
                    opacity:.42,
                    depthWrite:false
                })
            );


        mark.rotation.x=
            -Math.PI/2;

        mark.rotation.z=
            Math.atan2(
                tangent.x,
                tangent.z
            );


        mark.position.copy(
            game.car.position
        );

        mark.position.addScaledVector(
            side,
            s*.78
        );

        mark.position.y+=.08;


        scene.add(mark);


        setTimeout(()=>{

            scene.remove(mark);

            mark.geometry.dispose();
            mark.material.dispose();

        },9000);
    }
}


/* =========================================================
   CHECKPOINTS
========================================================= */

function updateCheckpoints(){

    if(game.finished)
        return;


    const total=
        game.track.checkpoints.length;


    if(
        game.checkpointIndex<
        total
    ){

        const t=
            game.track.checkpoints[
                game.checkpointIndex
            ];


        const p=
            getTrackPoint(t);


        if(
            game.car.position
            .distanceTo(p)<17
        ){

            game.checkpointIndex++;


            checkpointEl.textContent=
                game.checkpointIndex+
                " / "+
                total;


            message(
                "CHECKPOINT "+
                game.checkpointIndex,
                750
            );
        }
    }


    /*
       Finish only works after every checkpoint.
    */

    if(
        game.checkpointIndex>=total
    ){

        const finish=
            getTrackPoint(.99);


        if(
            game.car.position
            .distanceTo(finish)<19
        ){

            finishRace();
        }
    }
}


/* =========================================================
   RACE
========================================================= */

function startRace(){

    if(game.started)
        return;

    game.started=true;

    game.startTime=
        performance.now();

    game.recording=[];

    message(
        "GO!",
        800
    );
}


function finishRace(){

    if(game.finished)
        return;

    game.finished=true;

    const time=
        performance.now()-
        game.startTime;


    document.getElementById(
        "finishTime"
    ).textContent=
        "TIME: "+
        formatTime(time);


    timerEl.textContent=
        formatTime(time);


    document.getElementById(
        "finishScreen"
    ).style.display="flex";


    saveGhost();
}


/* =========================================================
   RESET
========================================================= */

function resetCar(){

    if(!game.car)
        return;


    game.started=false;
    game.finished=false;

    game.speed=0;

    game.steering=0;
    game.steeringVelocity=0;

    game.yaw=0;

    game.lateralVelocity=0;

    game.checkpointIndex=0;

    game.carTrackIndex=0;

    game.recording=[];


    /*
       Track direction.

       The +PI is deliberate: the requested
       starting orientation is 180 degrees
       from the raw track heading.
    */

    const heading=
        getTrackHeading(.005);

    game.car.rotation.set(
        0,
        heading+Math.PI,
        0
    );


    /*
       Place the car at the starting point.
    */

    const p=
        getTrackPoint(.005);

    game.car.position.copy(p);

    game.car.position.y+=.65;


    /*
       Reset wheel steering.
    */

    for(
        const wheel
        of game.car.userData.wheels
    ){

        wheel.steeringGroup.rotation.y=0;
        wheel.wheel.rotation.x=0;
    }


    checkpointEl.textContent=
        "0 / "+
        game.track.checkpoints.length;


    timerEl.textContent=
        "00:00.000";


    document.getElementById(
        "finishScreen"
    ).style.display="none";


    message(
        "READY — PRESS W",
        1000
    );
}


/* =========================================================
   TIME
========================================================= */

function formatTime(ms){

    const minutes=
        Math.floor(
            ms/60000
        );

    const seconds=
        Math.floor(
            (ms%60000)/1000
        );

    const millis=
        Math.floor(
            ms%1000
        );


    return(
        String(minutes)
        .padStart(2,"0")+
        ":"+
        String(seconds)
        .padStart(2,"0")+
        "."+
        String(millis)
        .padStart(3,"0")
    );
}


/* =========================================================
   GHOST
========================================================= */

function saveGhost(){

    if(
        game.recording.length<2
    )
        return;


    try{

        localStorage.setItem(
            "f1ghost_"+
            game.trackNumber,

            JSON.stringify(
                game.recording
            )
        );

    }catch(e){}
}


function loadGhost(){

    if(game.ghost){

        scene.remove(
            game.ghost
        );

        game.ghost=null;
    }


    let data;

    try{

        data=
            localStorage.getItem(
                "f1ghost_"+
                game.trackNumber
            );

    }catch(e){

        return;
    }


    if(!data)
        return;


    try{

        game.ghostData=
            JSON.parse(data);

    }catch(e){

        return;
    }


    const ghost=
        createCar();


    /*
       Turn the ghost into a transparent
       blue racing car.
    */

    ghost.traverse(
    obj=>{

        if(!obj.material)
            return;

        if(
            Array.isArray(
                obj.material
            )
        ){

            obj.material=
                obj.material.map(
                material=>{

                    const m=
                        material.clone();

                    m.transparent=true;
                    m.opacity=.22;

                    return m;
                });

        }else{

            obj.material=
                obj.material.clone();

            obj.material.transparent=true;
            obj.material.opacity=.22;
        }
    });


    ghost.visible=false;

    game.ghost=ghost;

    scene.add(ghost);
}


function updateGhost(){

    if(
        !game.ghost ||
        !game.started ||
        game.finished ||
        !game.ghostData.length
    )
        return;


    const elapsed=
        performance.now()-
        game.startTime;


    let a=
        game.ghostData[0];

    let b=
        game.ghostData[
            game.ghostData.length-1
        ];


    for(
        let i=0;
        i<game.ghostData.length-1;
        i++
    ){

        if(
            game.ghostData[i].t<=elapsed &&
            game.ghostData[i+1].t>=elapsed
        ){

            a=game.ghostData[i];
            b=game.ghostData[i+1];

            break;
        }
    }


    if(elapsed<a.t){

        game.ghost.visible=false;

        return;
    }


    game.ghost.visible=true;


    const span=
        Math.max(
            1,
            b.t-a.t
        );


    const f=
        THREE.MathUtils.clamp(
            (elapsed-a.t)/span,
            0,
            1
        );


    game.ghost.position.set(

        THREE.MathUtils.lerp(
            a.x,b.x,f
        ),

        THREE.MathUtils.lerp(
            a.y,b.y,f
        ),

        THREE.MathUtils.lerp(
            a.z,b.z,f
        )
    );


    game.ghost.rotation.y=
        THREE.MathUtils.lerp(
            a.r,b.r,f
        );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    if(!game.car)
        return;


    const car=
        game.car;


    const forward=
        new THREE.Vector3(
            0,0,1
        );

    forward.applyQuaternion(
        car.quaternion
    );

    forward.y=0;
    forward.normalize();


    const speed=
        Math.abs(game.speed);


    /*
       Dynamic camera distance.
    */

    const distance=
        THREE.MathUtils.lerp(
            9.5,
            14.5,
            THREE.MathUtils.clamp(
                speed/125,
                0,
                1
            )
        );


    const desired=
        car.position.clone()
        .addScaledVector(
            forward,
            -distance
        );


    desired.y+=
        THREE.MathUtils.lerp(
            4.3,
            5.7,
            THREE.MathUtils.clamp(
                speed/125,
                0,
                1
            )
        );


    camera.position.lerp(
        desired,
        1-
        Math.pow(
            .0008,
            dt
        )
    );


    const look=
        car.position.clone();

    look.addScaledVector(
        forward,
        7
    );

    look.y+=1;


    camera.lookAt(look);
}


/* =========================================================
   LOAD TRACK
========================================================= */

function clearWorld(){

    const objects=[
        "road",
        "ground",
        "scenery",
        "barriers",
        "gates"
    ];


    for(
        const key of objects
    ){

        if(game[key]){

            scene.remove(
                game[key]
            );

            game[key]=null;
        }
    }


    if(game.ghost){

        scene.remove(
            game.ghost
        );

        game.ghost=null;
    }
}


function loadTrack(){

    clearWorld();


    game.theme=
        randomChoice(
            themes
        );


    game.track=
        generateTrack();


    /*
       8–12 checkpoints.
    */

    game.track.checkpoints=[];


    const checkpointCount=
        Math.floor(
            randomRange(
                8,
                12
            )
        );


    for(
        let i=1;
        i<=checkpointCount;
        i++
    ){

        game.track.checkpoints.push(
            i/
            (checkpointCount+1)
        );
    }


    game.gates=
        new THREE.Group();

    scene.add(
        game.gates
    );


    createGround();

    createRoad();

    createBarriers();

    createScenery();


    /*
       Yellow checkpoints.
    */

    for(
        const t
        of game.track.checkpoints
    ){

        createGate(
            t,
            0xffd400
        );
    }


    /*
       Red finish.
    */

    createGate(
        .99,
        0xff2020
    );


    /*
       Create car.
    */

    game.car=
        createCar();

    scene.add(
        game.car
    );


    /*
       IMPORTANT:

       The car is deliberately rotated 180°
       relative to the raw curve direction,
       as requested.
    */

    resetCar();


    trackNameEl.textContent=
        "TRACK "+
        game.trackNumber+
        " • "+
        game.theme;


    loadGhost();
}


/* =========================================================
   BUTTONS
========================================================= */

document.getElementById(
"nextTrack"
).onclick=()=>{

    game.trackNumber++;

    loadTrack();
};


document.getElementById(
"finishNext"
).onclick=()=>{

    document.getElementById(
        "finishScreen"
    ).style.display="none";

    game.trackNumber++;

    loadTrack();
};


document.getElementById(
"raceAgain"
).onclick=()=>{

    document.getElementById(
        "finishScreen"
    ).style.display="none";

    resetCar();

    startRace();
};


document.getElementById(
"exitButton"
).onclick=()=>{

    document.getElementById(
        "exitScreen"
    ).style.display="flex";
};


document.getElementById(
"finishExit"
).onclick=()=>{

    document.getElementById(
        "finishScreen"
    ).style.display="none";

    document.getElementById(
        "exitScreen"
    ).style.display="flex";
};


document.getElementById(
"returnRace"
).onclick=()=>{

    document.getElementById(
        "exitScreen"
    ).style.display="none";
};


document.getElementById(
"exitNext"
).onclick=()=>{

    document.getElementById(
        "exitScreen"
    ).style.display="none";

    game.trackNumber++;

    loadTrack();
};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

    camera.aspect=
        innerWidth/
        innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );
});


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(now){

    requestAnimationFrame(
        animate
    );


    const dt=
        Math.min(
            .033,
            (now-game.lastFrame)/1000
        );


    game.lastFrame=now;


    if(game.skidTimer>0)
        game.skidTimer-=dt;


    updateCar(dt);

    updateGhost();

    updateCamera(dt);


    speedEl.textContent=
        Math.round(
            Math.abs(game.speed)*3.6
        )+
        " KM/H";


    if(
        game.started &&
        !game.finished
    ){

        timerEl.textContent=
            formatTime(
                performance.now()-
                game.startTime
            );
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

loadTrack();

animate(
    performance.now()
);

</script>
