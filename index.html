/* ========================================================= AUDIO ENGINE ========================================================= */
let audioCtx = null;
let engineOsc = null, engineGain = null;

function initAudio() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    engineOsc = audioCtx.createOscillator();
    engineOsc.type = 'sawtooth';
    engineOsc.frequency.setValueAtTime(80, audioCtx.currentTime);
    
    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(500, audioCtx.currentTime);

    engineGain = audioCtx.createGain();
    engineGain.gain.setValueAtTime(0.06, audioCtx.currentTime);

    engineOsc.connect(filter);
    filter.connect(engineGain);
    engineGain.connect(audioCtx.destination);
    engineOsc.start();
  } catch(e) { console.log("Audio disabled"); }
}

function updateAudio(speed, throttle) {
  if (!audioCtx || !engineOsc) return;
  const targetFreq = 75 + (speed / 190) * 350 + (throttle ? 60 : 0);
  engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
}

let trackCurve; let trackPoints = []; let trackTangents = []; let trackLength = 0;
const trackGroup = new THREE.Group();
scene.add(trackGroup);

/* ========================================================= TRACK GENERATION ========================================================= */
function buildTrack(index){
  while(trackGroup.children.length){ trackGroup.remove(trackGroup.children[0]); }
  const data = tracks[index];
  document.getElementById("trackName").innerText = data.name;
  
  const controlPoints = data.points.map(p => new THREE.Vector3(p[0], 0, p[1]));
  trackCurve = new THREE.CatmullRomCurve3(controlPoints, true, "centripetal", .45);
  trackPoints = []; trackTangents = [];
  for(let i=0; i<TRACK_SAMPLES; i++){
    const t = i / TRACK_SAMPLES;
    trackPoints.push(trackCurve.getPointAt(t));
    trackTangents.push(trackCurve.getTangentAt(t).normalize());
  }

  trackLength = 0;
  for(let i=0; i<TRACK_SAMPLES; i++){
    trackLength += trackPoints[i].distanceTo(trackPoints[(i+1)%TRACK_SAMPLES]);
  }

  // ROAD MESH
  const roadPositions = []; const roadIndices = [];
  for(let i=0; i<TRACK_SAMPLES; i++){
    const p = trackPoints[i], t = trackTangents[i];
    const right = new THREE.Vector3(-t.z, 0, t.x).normalize();
    const leftP = p.clone().addScaledVector(right, -ROAD_WIDTH/2);
    const rightP = p.clone().addScaledVector(right, ROAD_WIDTH/2);
    const base = i*2;
    roadPositions.push(leftP.x, ROAD_HEIGHT, leftP.z, rightP.x, ROAD_HEIGHT, rightP.z);
    roadIndices.push(base, ((i+1)%TRACK_SAMPLES)*2, base+1, base+1, ((i+1)%TRACK_SAMPLES)*2, ((i+1)%TRACK_SAMPLES)*2+1);
  }
  const roadGeo = new THREE.BufferGeometry();
  roadGeo.setAttribute("position", new THREE.Float32BufferAttribute(roadPositions, 3));
  roadGeo.setIndex(roadIndices);
  roadGeo.computeVertexNormals();
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.receiveShadow = true;
  trackGroup.add(road);

  // CURBS
  const curbGroup = new THREE.Group();
  for(let i=0; i<TRACK_SAMPLES; i+=3){
    const p = trackPoints[i], t = trackTangents[i];
    const right = new THREE.Vector3(-t.z, 0, t.x).normalize();
    for(const side of [-1, 1]){
      const curb = new THREE.Mesh(new THREE.BoxGeometry(CURB_WIDTH, .16, 6.8), (Math.floor(i/3)%2===0) ? curbRed : curbWhite);
      curb.position.copy(p).addScaledVector(right, side*(ROAD_WIDTH/2 + CURB_WIDTH/2));
      curb.position.y = ROAD_HEIGHT + .08;
      curb.rotation.y = Math.atan2(-t.x, -t.z);
      curbGroup.add(curb);
    }
  }
  trackGroup.add(curbGroup);

  // START LINE
  const start = trackPoints[0], tangent = trackTangents[0];
  const startLine = new THREE.Mesh(new THREE.PlaneGeometry(ROAD_WIDTH, 8), new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide}));
  startLine.rotation.x = -Math.PI/2;
  startLine.rotation.z = Math.atan2(tangent.z, tangent.x);
  startLine.position.copy(start);
  startLine.position.y = ROAD_HEIGHT + .07;
  trackGroup.add(startLine);

  buildScenery();
}

/* ========================================================= SCENERY ========================================================= */
function buildScenery(){
  const scenery = new THREE.Group();
  for(let i=0; i<100; i++){
    const index = Math.floor(Math.random()*TRACK_SAMPLES);
    const p = trackPoints[index], t = trackTangents[index];
    const right = new THREE.Vector3(-t.z, 0, t.x).normalize();
    const side = Math.random() < .5 ? -1 : 1;
    const distance = ROAD_WIDTH/2 + 35 + Math.random()*200;
    
    const obj = new THREE.Group();
    const building = new THREE.Mesh(
      new THREE.BoxGeometry(12+Math.random()*15, 8+Math.random()*18, 12+Math.random()*15),
      mat([0x7c8589, 0xa29b87, 0x5e6469][Math.floor(Math.random()*3)])
    );
    building.position.y = building.geometry.parameters.height/2;
    obj.add(building);
    obj.position.copy(p).addScaledVector(right, side*distance);
    scenery.add(obj);
  }
  trackGroup.add(scenery);
}

function wedgeGeometry(length, height, frontWidth, rearWidth){
  const z1 = -length/2, z2 = length/2;
  const verts =
