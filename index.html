<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>F1 Fan Racing</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05070a;
    font-family: Arial, Helvetica, sans-serif;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    inset: 0;
    pointer-events: none;
    color: white;
}

#title {
    position: absolute;
    top: 18px;
    left: 22px;
    font-size: 26px;
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 3px 8px #000;
}

#trackName {
    position: absolute;
    top: 53px;
    left: 24px;
    font-size: 13px;
    opacity: .8;
}

#buttons {
    position: absolute;
    top: 18px;
    right: 18px;
    display: flex;
    gap: 8px;
    pointer-events: auto;
}

button {
    border: 0;
    border-radius: 7px;
    padding: 11px 15px;
    background: rgba(15,18,25,.88);
    color: white;
    font-weight: 800;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.18);
}

button:hover {
    background: rgba(50,55,65,.95);
}

#timer {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 27px;
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 3px 8px #000;
}

#speed {
    position: absolute;
    right: 25px;
    bottom: 25px;
    font-size: 30px;
    font-weight: 900;
    text-shadow: 0 3px 8px #000;
}

#checkpoints {
    position: absolute;
    right: 28px;
    bottom: 67px;
    font-size: 18px;
    font-weight: 800;
    text-shadow: 0 3px 8px #000;
}

#message {
    position: absolute;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 20px;
    border-radius: 8px;
    background: rgba(0,0,0,.45);
    font-weight: 900;
    opacity: 0;
    transition: opacity .2s;
}

#controls {
    position: absolute;
    left: 22px;
    bottom: 20px;
    font-size: 13px;
    line-height: 1.6;
    opacity: .75;
}

#finishScreen,
#exitScreen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,.72);
    z-index: 20;
}

.panel {
    width: min(500px, 90vw);
    padding: 35px;
    border-radius: 18px;
    background: rgba(15,18,25,.96);
    border: 1px solid rgba(255,255,255,.18);
    text-align: center;
    color: white;
    box-shadow: 0 20px 80px #000;
}

.panel h1 {
    margin-top: 0;
    font-size: 42px;
}

.panel button {
    margin: 7px;
}
</style>
</head>

<body>

<div id="hud">

    <div id="title">F1 FAN RACING</div>
    <div id="trackName"></div>

    <div id="timer">00:00.000</div>

    <div id="buttons">
        <button id="nextTrack">NEXT TRACK</button>
        <button id="exitButton">EXIT</button>
    </div>

    <div id="message"></div>

    <div id="checkpoints">0 / 0</div>
    <div id="speed">0 KM/H</div>

    <div id="controls">
        <b>W</b> Accelerate &nbsp;
        <b>S</b> Brake / Reverse &nbsp;
        <b>A</b> Turn Left &nbsp;
        <b>D</b> Turn Right &nbsp;
        <b>R</b> Reset
    </div>
</div>

<div id="finishScreen">
    <div class="panel">
        <h1>FINISHED!</h1>
        <div id="finishTime" style="font-size:25px;margin-bottom:25px;"></div>
        <button id="raceAgain">RACE AGAIN</button>
        <button id="finishNext">NEXT TRACK</button>
        <button id="finishExit">EXIT</button>
    </div>
</div>

<div id="exitScreen">
    <div class="panel">
        <h1>RACE PAUSED</h1>
        <button id="returnRace">RETURN TO RACE</button>
        <button id="exitNext">NEXT TRACK</button>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";

/* =========================================================
   BASIC THREE.JS SETUP
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x82bce8);

scene.fog = new THREE.Fog(
    0x82bce8,
    180,
    1200
);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    .1,
    3000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

document.body.appendChild(renderer.domElement);


/* =========================================================
   LIGHTING
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xffffff,
    0x405060,
    2.0
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    3.2
);

sun.position.set(
    200,
    350,
    100
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -600;
sun.shadow.camera.right = 600;
sun.shadow.camera.top = 600;
sun.shadow.camera.bottom = -600;

scene.add(sun);


/* =========================================================
   GAME STATE
========================================================= */

const game = {

    trackNumber: 1,

    theme: "FOREST",

    track: null,
    road: null,
    ground: null,
    scenery: null,
    gates: null,

    car: null,

    ghost: null,
    ghostData: [],

    started: false,
    finished: false,

    startTime: 0,
    finishTime: 0,

    checkpointIndex: 0,

    keys: {
        w: false,
        s: false,
        a: false,
        d: false
    },

    speed: 0,

    steering: 0,

    maxSpeed: 125,

    /* Physics tuning */
    acceleration: 40,
    reverseAcceleration: 20,
    braking: 90,

    grip: 7.5,

    steeringRate: 5.5,

    lateralGrip: 8.5,

    carTrackIndex: 0,

    recording: [],

    lastFrame: performance.now()
};


/* =========================================================
   UI
========================================================= */

const timerEl = document.getElementById("timer");
const speedEl = document.getElementById("speed");
const checkpointEl = document.getElementById("checkpoints");
const trackNameEl = document.getElementById("trackName");
const messageEl = document.getElementById("message");

function message(text, time = 1800) {

    messageEl.textContent = text;
    messageEl.style.opacity = 1;

    clearTimeout(messageEl._timer);

    messageEl._timer = setTimeout(() => {
        messageEl.style.opacity = 0;
    }, time);
}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener("keydown", e => {

    if (e.code === "KeyW") {
        game.keys.w = true;

        if (!game.started && !game.finished) {
            startRace();
        }
    }

    if (e.code === "KeyS") {
        game.keys.s = true;
    }

    if (e.code === "KeyA") {
        game.keys.a = true;
    }

    if (e.code === "KeyD") {
        game.keys.d = true;
    }

    if (e.code === "KeyR") {
        resetCar();
    }

    if (e.code === "Space") {

        if (game.finished) {
            resetCar();
            startRace();
        }
    }
});

window.addEventListener("keyup", e => {

    if (e.code === "KeyW") game.keys.w = false;
    if (e.code === "KeyS") game.keys.s = false;
    if (e.code === "KeyA") game.keys.a = false;
    if (e.code === "KeyD") game.keys.d = false;
});


/* =========================================================
   TRACK GENERATION
========================================================= */

const themes = [
    "FOREST",
    "DESERT",
    "ALPINE",
    "CANYON",
    "COAST"
];

function randomRange(a, b) {
    return a + Math.random() * (b - a);
}

function randomChoice(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
}


function generateTrack() {

    const points = [];

    let x = 0;
    let z = 0;

    let heading = 0;

    const count = 22;

    for (let i = 0; i < count; i++) {

        const progress = i / (count - 1);

        heading += randomRange(
            -0.42,
            0.42
        );

        /* Keep first and last portions fairly straight */
        if (i < 3) {
            heading *= .45;
        }

        if (i > count - 4) {
            heading *= .55;
        }

        const distance =
            randomRange(65, 105);

        x += Math.sin(heading) * distance;
        z += Math.cos(heading) * distance;

        let y = 0;

        if (game.theme === "ALPINE") {
            y =
                Math.sin(i * .8) * 18 +
                Math.sin(i * 1.7) * 8;
        }

        if (game.theme === "CANYON") {
            y =
                Math.sin(i * .7) * 8 +
                Math.cos(i * .35) * 10;
        }

        if (game.theme === "DESERT") {
            y =
                Math.sin(i * .6) * 3;
        }

        if (game.theme === "COAST") {
            y =
                Math.sin(i * .55) * 5;
        }

        if (game.theme === "FOREST") {
            y =
                Math.sin(i * .9) * 4;
        }

        points.push(
            new THREE.Vector3(x, y, z)
        );
    }

    const curve =
        new THREE.CatmullRomCurve3(
            points,
            false,
            "centripetal",
            .45
        );

    curve.arcLengthDivisions = 2000;

    curve.getLength();

    return {
        curve,
        width: randomRange(15, 19)
    };
}


/* =========================================================
   TRACK POSITION HELPERS
========================================================= */

function getTrackPoint(t) {

    return game.track.curve.getPointAt(
        THREE.MathUtils.clamp(t, 0, 1)
    );
}


function getTrackTangent(t) {

    return game.track.curve.getTangentAt(
        THREE.MathUtils.clamp(t, 0, 1)
    ).normalize();
}


/*
   IMPORTANT:
   This is what makes the car START facing the direction
   that the track actually goes.
*/
function alignCarToTrackStart() {

    const p = getTrackPoint(.008);

    const tangent =
        getTrackTangent(.008);

    game.car.position.copy(p);

    game.car.position.y += .65;

    const angle =
        Math.atan2(
            tangent.x,
            tangent.z
        );

    game.car.rotation.set(
        0,
        angle,
        0
    );
}


/* =========================================================
   ROAD
========================================================= */

function createRoad() {

    const group = new THREE.Group();

    const segments = 500;

    const vertices = [];
    const uvs = [];
    const indices = [];

    for (let i = 0; i <= segments; i++) {

        const t = i / segments;

        const p = getTrackPoint(t);
        const tangent = getTrackTangent(t);

        const side = new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();

        const width = game.track.width;

        const left =
            p.clone().addScaledVector(
                side,
                width / 2
            );

        const right =
            p.clone().addScaledVector(
                side,
                -width / 2
            );

        left.y += .05;
        right.y += .05;

        vertices.push(
            left.x, left.y, left.z,
            right.x, right.y, right.z
        );

        uvs.push(
            0, t * 30,
            1, t * 30
        );

        if (i < segments) {

            const a = i * 2;
            const b = i * 2 + 1;
            const c = i * 2 + 2;
            const d = i * 2 + 3;

            indices.push(
                a, b, c,
                b, d, c
            );
        }
    }

    const geo = new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            vertices,
            3
        )
    );

    geo.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );

    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
        color: 0x25282b,
        roughness: .85,
        metalness: .05
    });

    const mesh =
        new THREE.Mesh(geo, mat);

    mesh.receiveShadow = true;

    group.add(mesh);


    /* White road edge lines */

    createRoadLine(group, .48);
    createRoadLine(group, -.48);


    /* Curbs */

    createCurbs(group);

    game.road = group;

    scene.add(group);
}


function createRoadLine(group, sideAmount) {

    const pts = [];

    for (let i = 0; i <= 500; i++) {

        const t = i / 500;

        const p = getTrackPoint(t);
        const tangent = getTrackTangent(t);

        const side = new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();

        p.addScaledVector(
            side,
            game.track.width / 2 * sideAmount
        );

        p.y += .12;

        pts.push(p);
    }

    const geo =
        new THREE.BufferGeometry()
        .setFromPoints(pts);

    const line =
        new THREE.Line(
            geo,
            new THREE.LineBasicMaterial({
                color: 0xffffff
            })
        );

    group.add(line);
}


function createCurbs(group) {

    for (let i = 0; i < 160; i++) {

        const t = i / 160;

        const p = getTrackPoint(t);
        const tangent = getTrackTangent(t);

        const side = new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();

        for (const s of [-1, 1]) {

            const curb = new THREE.Mesh(
                new THREE.BoxGeometry(
                    3.3,
                    .18,
                    1.5
                ),
                new THREE.MeshStandardMaterial({
                    color:
                        i % 2 === 0
                        ? 0xdedede
                        : 0xc42020
                })
            );

            curb.position.copy(p);

            curb.position.addScaledVector(
                side,
                s * (game.track.width / 2 + 1.4)
            );

            curb.position.y += .12;

            curb.rotation.y =
                Math.atan2(
                    tangent.x,
                    tangent.z
                );

            curb.castShadow = true;
            curb.receiveShadow = true;

            group.add(curb);
        }
    }
}


/* =========================================================
   GROUND
========================================================= */

function createGround() {

    let color = 0x2f6e34;

    if (game.theme === "DESERT")
        color = 0xb88a48;

    if (game.theme === "ALPINE")
        color = 0xdfe7ed;

    if (game.theme === "CANYON")
        color = 0x9b5c3c;

    if (game.theme === "COAST")
        color = 0x72a35b;

    const ground =
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                4000,
                4000
            ),
            new THREE.MeshStandardMaterial({
                color,
                roughness: 1
            })
        );

    ground.rotation.x =
        -Math.PI / 2;

    ground.position.y = -1;

    ground.receiveShadow = true;

    game.ground = ground;

    scene.add(ground);
}


/* =========================================================
   SCENERY
========================================================= */

function createScenery() {

    const group = new THREE.Group();

    for (let i = 0; i < 160; i++) {

        const t =
            Math.random();

        const p =
            getTrackPoint(t);

        const tangent =
            getTrackTangent(t);

        const side =
            new THREE.Vector3(
                tangent.z,
                0,
                -tangent.x
            ).normalize();

        const distance =
            game.track.width / 2 +
            randomRange(20, 100);

        const obj =
            new THREE.Group();

        obj.position.copy(p);

        obj.position.addScaledVector(
            side,
            Math.random() < .5
                ? distance
                : -distance
        );

        obj.position.y -= .5;

        if (game.theme === "FOREST") {

            const trunk =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        1,
                        1.5,
                        9,
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x5b3822
                    })
                );

            trunk.position.y = 4.5;

            const leaves =
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        5,
                        12,
                        9
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x174c24
                    })
                );

            leaves.position.y = 11;

            trunk.castShadow = true;
            leaves.castShadow = true;

            obj.add(trunk, leaves);
        }

        else if (game.theme === "DESERT") {

            const cactus =
                new THREE.Mesh(
                    new THREE.CylinderGeometry(
                        .7,
                        1,
                        randomRange(3, 8),
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x377c42
                    })
                );

            cactus.position.y = 3;

            cactus.castShadow = true;

            obj.add(cactus);
        }

        else if (game.theme === "ALPINE") {

            const mountain =
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        randomRange(5, 12),
                        randomRange(15, 35),
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x9da5aa
                    })
                );

            mountain.position.y = 10;

            mountain.castShadow = true;

            obj.add(mountain);
        }

        else if (game.theme === "CANYON") {

            const rock =
                new THREE.Mesh(
                    new THREE.DodecahedronGeometry(
                        randomRange(3, 8),
                        1
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x74402e
                    })
                );

            rock.position.y = 3;

            rock.castShadow = true;

            obj.add(rock);
        }

        else {

            const tree =
                new THREE.Mesh(
                    new THREE.ConeGeometry(
                        4,
                        12,
                        8
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0x29663a
                    })
                );

            tree.position.y = 6;

            obj.add(tree);
        }

        group.add(obj);
    }

    game.scenery = group;

    scene.add(group);
}


/* =========================================================
   GATES
========================================================= */

function createGate(t, color, text) {

    const group = new THREE.Group();

    const p = getTrackPoint(t);
    const tangent = getTrackTangent(t);

    const angle =
        Math.atan2(
            tangent.x,
            tangent.z
        );

    group.position.copy(p);

    group.position.y += 6;

    group.rotation.y = angle;

    const material =
        new THREE.MeshStandardMaterial({
            color,
            emissive: color,
            emissiveIntensity: .15
        });

    const postGeo =
        new THREE.BoxGeometry(
            .7,
            12,
            .7
        );

    const post1 =
        new THREE.Mesh(
            postGeo,
            material
        );

    const post2 =
        new THREE.Mesh(
            postGeo,
            material
        );

    post1.position.x =
        -game.track.width / 2;

    post2.position.x =
        game.track.width / 2;

    const top =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                game.track.width + 1,
                .7,
                .7
            ),
            material
        );

    group.add(
        post1,
        post2,
        top
    );

    game.gates.add(group);
}


/* =========================================================
   CAR
========================================================= */

function createCar(color = 0xd71920) {

    const car =
        new THREE.Group();

    /* Main body */

    const bodyMat =
        new THREE.MeshStandardMaterial({
            color,
            metalness: .45,
            roughness: .28
        });

    const darkMat =
        new THREE.MeshStandardMaterial({
            color: 0x111318,
            metalness: .5,
            roughness: .25
        });

    const carbonMat =
        new THREE.MeshStandardMaterial({
            color: 0x090a0c,
            metalness: .3,
            roughness: .55
        });

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.0,
                .55,
                4.7
            ),
            bodyMat
        );

    body.position.y = .85;
    body.castShadow = true;

    car.add(body);


    /* Sidepods */

    for (const x of [-1, 1]) {

        const pod =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .55,
                    .48,
                    2.25
                ),
                bodyMat
            );

        pod.position.set(
            x * .95,
            .82,
            .15
        );

        pod.castShadow = true;

        car.add(pod);
    }


    /* Nose */

    const nose =
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .72,
                3.0,
                4
            ),
            bodyMat
        );

    nose.rotation.x =
        Math.PI / 2;

    nose.position.set(
        0,
        .83,
        -3.0
    );

    nose.scale.set(
        1,
        1,
        .7
    );

    nose.castShadow = true;

    car.add(nose);


    /* Cockpit */

    const cockpit =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .72,
                20,
                12
            ),
            darkMat
        );

    cockpit.scale.set(
        .85,
        .42,
        1.15
    );

    cockpit.position.set(
        0,
        1.3,
        .35
    );

    car.add(cockpit);


    /* Driver helmet */

    const helmet =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .32,
                16,
                12
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffffff,
                metalness: .25,
                roughness: .25
            })
        );

    helmet.position.set(
        0,
        1.55,
        .25
    );

    car.add(helmet);


    /* Halo */

    const halo =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .38,
                .055,
                8,
                20,
                Math.PI
            ),
            carbonMat
        );

    halo.rotation.x =
        Math.PI / 2;

    halo.position.set(
        0,
        1.62,
        .15
    );

    car.add(halo);


    /* Front wing */

    const frontWing =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.5,
                .12,
                .42
            ),
            carbonMat
        );

    frontWing.position.set(
        0,
        .48,
        -4.25
    );

    car.add(frontWing);


    /* Rear wing */

    const rearWing =
        new THREE.Group();

    const wing =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.5,
                .18,
                .35
            ),
            bodyMat
        );

    wing.position.y = 1.65;

    const supports =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .15,
                .9,
                .15
            ),
            carbonMat
        );

    supports.position.set(
        -.75,
        1.2,
        1.9
    );

    const supports2 =
        supports.clone();

    supports2.position.x = .75;

    rearWing.add(
        wing,
        supports,
        supports2
    );

    rearWing.position.z = 1.9;

    car.add(rearWing);


    /* Exhaust */

    for (const x of [-.42, .42]) {

        const exhaust =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .13,
                    .13,
                    .35,
                    12
                ),
                carbonMat
            );

        exhaust.rotation.x =
            Math.PI / 2;

        exhaust.position.set(
            x,
            .8,
            2.45
        );

        car.add(exhaust);
    }


    /* Wheels */

    car.userData.wheels = [];

    const wheelPositions = [
        [-1.15, .55, -2.35, true],
        [1.15, .55, -2.35, true],
        [-1.15, .55, 1.65, false],
        [1.15, .55, 1.65, false]
    ];

    for (const [x,y,z,front] of wheelPositions) {

        const steeringGroup =
            new THREE.Group();

        steeringGroup.position.set(
            x,
            y,
            z
        );

        car.add(steeringGroup);

        const wheel =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .55,
                    .55,
                    .38,
                    24
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x08090b,
                    roughness: .9
                })
            );

        wheel.rotation.z =
            Math.PI / 2;

        wheel.castShadow = true;

        steeringGroup.add(wheel);

        /* Rim */

        const rim =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .28,
                    .28,
                    .4,
                    20
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x70757c,
                    metalness: .8,
                    roughness: .2
                })
            );

        rim.rotation.z =
            Math.PI / 2;

        steeringGroup.add(rim);

        car.userData.wheels.push({
            wheel,
            steeringGroup,
            front
        });
    }


    /* Brake lights */

    car.userData.brakeLights = [];

    for (const x of [-.65, .65]) {

        const light =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .55,
                    .12,
                    .08
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x220000,
                    emissive: 0x000000
                })
            );

        light.position.set(
            x,
            1.05,
            2.38
        );

        car.add(light);

        car.userData.brakeLights.push(light);
    }


    /* Smoke */

    car.userData.smoke = [];

    for (let i = 0; i < 15; i++) {

        const smoke =
            new THREE.Mesh(
                new THREE.SphereGeometry(
                    randomRange(.06,.13),
                    8,
                    8
                ),
                new THREE.MeshBasicMaterial({
                    color: 0x555555,
                    transparent: true,
                    opacity: 0
                })
            );

        smoke.visible = false;

        scene.add(smoke);

        car.userData.smoke.push({
            mesh: smoke,
            life: 0
        });
    }

    return car;
}


/* =========================================================
   CAR PHYSICS
========================================================= */

function updateCar(dt) {

    if (!game.car || game.finished)
        return;

    const car = game.car;

    /*
       A = -1
       D = +1

       This is intentionally NOT based on the car's
       current wheel angle, which prevents the wheels
       from rapidly flipping/wiggling.
    */

    let steerInput = 0;

    if (game.keys.a)
        steerInput -= 1;

    if (game.keys.d)
        steerInput += 1;


    /*
       Smooth steering input.
       This makes A/D feel controlled instead of twitchy.
    */

    const steeringResponse =
        Math.min(1, dt * game.steeringRate);

    game.steering +=
        (steerInput - game.steering) *
        steeringResponse;


    /* Speed */

    if (game.keys.w) {

        game.speed +=
            game.acceleration * dt;

    } else {

        /*
           Natural rolling resistance.
        */

        game.speed *=
            Math.pow(.985, dt * 60);
    }


    /* Brake */

    const braking =
        game.keys.s && game.speed > 0;

    if (braking) {

        game.speed -=
            game.braking * dt;

        if (game.speed < 0)
            game.speed = 0;
    }


    /*
       Reverse.
       S becomes reverse when the car is basically stopped.
    */

    if (
        game.keys.s &&
        game.speed < .5 &&
        !game.keys.w
    ) {

        game.speed -=
            game.reverseAcceleration * dt;
    }


    /*
       Speed limit.
    */

    game.speed =
        THREE.MathUtils.clamp(
            game.speed,
            -25,
            game.maxSpeed
        );


    /*
       Steering becomes less aggressive at very low speed
       and naturally gets heavier at very high speed.
    */

    const absSpeed =
        Math.abs(game.speed);

    const speedFactor =
        THREE.MathUtils.clamp(
            absSpeed / 35,
            0,
            1
        );

    const highSpeedFactor =
        THREE.MathUtils.clamp(
            1 - Math.max(0, absSpeed - 95) / 100,
            .35,
            1
        );


    /*
       Actual yaw physics.

       A turns LEFT.
       D turns RIGHT.
    */

    const turnStrength =
        1.9 *
        speedFactor *
        highSpeedFactor;

    const direction =
        game.speed >= 0 ? 1 : -1;

    car.rotation.y +=
        game.steering *
        turnStrength *
        dt *
        direction;


    /*
       Small amount of natural yaw damping.
       Prevents the car from continuing to rotate forever.
    */

    car.rotation.y *= 1;


    /*
       Forward vector.
    */

    const forward =
        new THREE.Vector3(
            0,
            0,
            1
        );

    forward.applyQuaternion(
        car.quaternion
    );

    forward.y = 0;

    forward.normalize();


    /*
       Move the car.
    */

    car.position.addScaledVector(
        forward,
        game.speed * dt
    );


    /*
       Track following.

       Find the nearest point on the track and keep
       the car at the track's terrain height.
    */

    const nearest =
        closestTrackPoint(
            car.position
        );

    game.carTrackIndex =
        nearest.index;


    const trackPoint =
        nearest.point;

    const distance =
        nearest.distance;


    /*
       Lateral grip.

       If the car is turning hard, it can slide slightly
       instead of behaving like it is on rails.
    */

    if (Math.abs(game.steering) > .05) {

        const lateral =
            new THREE.Vector3(
                forward.z,
                0,
                -forward.x
            );

        const slip =
            game.speed *
            game.steering *
            .025;

        car.position.addScaledVector(
            lateral,
            slip * dt * 60
        );
    }


    /*
       Better track grip.
    */

    if (
        distance <
        game.track.width * .55
    ) {

        const grip =
            Math.min(
                1,
                game.lateralGrip * dt
            );

        const correction =
            trackPoint.clone()
            .sub(car.position);

        correction.y = 0;

        /*
           Don't snap hard to the track.
           Smooth correction makes physics much better.
        */

        car.position.addScaledVector(
            correction,
            grip * .12
        );
    }


    /*
       Height follows track.
    */

    const targetY =
        trackPoint.y + .65;

    car.position.y +=
        (targetY - car.position.y) *
        Math.min(1, dt * 9);


    /*
       Off-track handling.
    */

    if (
        distance >
        game.track.width * .62
    ) {

        game.speed *=
            Math.pow(.965, dt * 60);

        message(
            "OFF TRACK — PRESS R TO RESET",
            100
        );
    }


    /*
       Wheel steering.

       ONLY the front wheel steering groups rotate.
       The actual wheel cylinders rotate independently
       for rolling.

       This eliminates the old wheel wiggle.
    */

    const maxWheelAngle =
        THREE.MathUtils.degToRad(28);

    for (const data of car.userData.wheels) {

        if (data.front) {

            data.steeringGroup.rotation.y =
                game.steering *
                maxWheelAngle;
        }

        /*
           Wheel rolling.
        */

        data.wheel.rotation.x -=
            game.speed * dt * 1.7;
    }


    /*
       Brake lights.
    */

    for (
        const light of
        car.userData.brakeLights
    ) {

        const material =
            light.material;

        if (braking) {

            material.color.setHex(
                0xff2222
            );

            material.emissive.setHex(
                0xff0000
            );

            material.emissiveIntensity = 4;

        } else {

            material.color.setHex(
                0x220000
            );

            material.emissive.setHex(
                0x000000
            );

            material.emissiveIntensity = 0;
        }
    }


    /*
       Smoke on the OUTER FRONT wheel.
    */

    if (
        Math.abs(game.steering) > .45 &&
        Math.abs(game.speed) > 30
    ) {

        spawnSmoke();
    }


    /*
       Skid effect while braking + turning.
    */

    if (
        braking &&
        Math.abs(game.steering) > .45 &&
        game.speed > 25
    ) {

        createSkidMark();
    }


    /*
       Checkpoints.
    */

    updateCheckpoints();


    /*
       Recording for ghost.
    */

    if (game.started) {

        game.recording.push({
            t: performance.now() - game.startTime,
            x: car.position.x,
            y: car.position.y,
            z: car.position.z,
            r: car.rotation.y
        });
    }
}


/* =========================================================
   CLOSEST TRACK POINT
========================================================= */

function closestTrackPoint(position) {

    let bestDistance = Infinity;
    let bestPoint = null;
    let bestIndex = 0;

    const samples = 500;

    /*
       Search near the previous index first for performance.
       Also include the entire track if needed.
    */

    const start =
        Math.max(
            0,
            game.carTrackIndex - 25
        );

    const end =
        Math.min(
            samples,
            game.carTrackIndex + 25
        );

    for (
        let i = start;
        i <= end;
        i++
    ) {

        const p =
            getTrackPoint(i / samples);

        const dx =
            p.x - position.x;

        const dz =
            p.z - position.z;

        const d =
            dx * dx +
            dz * dz;

        if (d < bestDistance) {

            bestDistance = d;
            bestPoint = p;
            bestIndex = i;
        }
    }


    /*
       If the car is far away, search everything.
    */

    if (bestDistance > 10000) {

        for (
            let i = 0;
            i <= samples;
            i++
        ) {

            const p =
                getTrackPoint(i / samples);

            const dx =
                p.x - position.x;

            const dz =
                p.z - position.z;

            const d =
                dx * dx +
                dz * dz;

            if (d < bestDistance) {

                bestDistance = d;
                bestPoint = p;
                bestIndex = i;
            }
        }
    }

    return {
        point: bestPoint,
        distance: Math.sqrt(bestDistance),
        index: bestIndex
    };
}


/* =========================================================
   SMOKE
========================================================= */

function spawnSmoke() {

    const front =
        game.car.userData.wheels
        .filter(w => w.front);

    /*
       Outer wheel:
       turning left -> right side is outer
       turning right -> left side is outer
    */

    let wheel;

    if (game.steering < 0)
        wheel = front[1];

    else
        wheel = front[0];

    if (!wheel)
        return;

    for (
        const s of game.car.userData.smoke
    ) {

        if (s.life <= 0) {

            const world =
                new THREE.Vector3();

            wheel.steeringGroup
                .getWorldPosition(world);

            s.mesh.position.copy(world);

            s.mesh.position.y += .15;

            s.mesh.visible = true;
            s.life = 1;

            break;
        }
    }
}


function updateSmoke(dt) {

    for (
        const s of game.car.userData.smoke
    ) {

        if (s.life > 0) {

            s.life -= dt;

            s.mesh.material.opacity =
                Math.max(0, s.life * .35);

            s.mesh.scale.multiplyScalar(
                1 + dt * .9
            );

            s.mesh.position.y +=
                dt * .6;

            if (s.life <= 0) {

                s.mesh.visible = false;

                s.mesh.scale.set(
                    1,1,1
                );
            }
        }
    }
}


/* =========================================================
   SKID MARKS
========================================================= */

function createSkidMark() {

    if (!game.skidTimer)
        game.skidTimer = 0;

    if (game.skidTimer > 0)
        return;

    game.skidTimer = .045;

    const nearest =
        closestTrackPoint(
            game.car.position
        );

    const tangent =
        getTrackTangent(
            nearest.index / 500
        );

    const side =
        new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();

    for (const sideAmount of [-1,1]) {

        const mark =
            new THREE.Mesh(
                new THREE.PlaneGeometry(
                    .22,
                    1.8
                ),
                new THREE.MeshBasicMaterial({
                    color: 0x080808,
                    transparent: true,
                    opacity: .45,
                    depthWrite: false
                })
            );

        mark.rotation.x =
            -Math.PI / 2;

        mark.rotation.z =
            Math.atan2(
                tangent.x,
                tangent.z
            );

        mark.position.copy(
            game.car.position
        );

        mark.position.addScaledVector(
            side,
            sideAmount * .8
        );

        mark.position.y += .08;

        scene.add(mark);

        setTimeout(() => {

            scene.remove(mark);

            mark.geometry.dispose();
            mark.material.dispose();

        }, 9000);
    }
}


/* =========================================================
   CHECKPOINTS
========================================================= */

function updateCheckpoints() {

    if (game.finished)
        return;

    const total =
        game.track.checkpoints.length;

    if (
        game.checkpointIndex <
        total
    ) {

        const checkpoint =
            game.track.checkpoints[
                game.checkpointIndex
            ];

        const p =
            getTrackPoint(checkpoint);

        const distance =
            game.car.position.distanceTo(p);

        if (distance < 16) {

            game.checkpointIndex++;

            checkpointEl.textContent =
                game.checkpointIndex +
                " / " +
                total;

            message(
                "CHECKPOINT " +
                game.checkpointIndex,
                800
            );
        }
    }


    if (
        game.checkpointIndex >= total
    ) {

        const finish =
            getTrackPoint(.99);

        const distance =
            game.car.position.distanceTo(
                finish
            );

        if (distance < 18) {

            finishRace();
        }
    }
}


/* =========================================================
   RACE START
========================================================= */

function startRace() {

    if (game.started)
        return;

    game.started = true;

    game.startTime =
        performance.now();

    game.recording = [];

    message(
        "GO!",
        900
    );
}


/* =========================================================
   FINISH
========================================================= */

function finishRace() {

    if (game.finished)
        return;

    game.finished = true;

    game.finishTime =
        performance.now() -
        game.startTime;

    timerEl.textContent =
        formatTime(
            game.finishTime
        );

    document.getElementById(
        "finishTime"
    ).textContent =
        "TIME: " +
        formatTime(game.finishTime);

    document.getElementById(
        "finishScreen"
    ).style.display = "flex";

    saveGhost();

    message(
        "FINISH!",
        2000
    );
}


/* =========================================================
   RESET
========================================================= */

function resetCar() {

    if (!game.car)
        return;

    game.started = false;
    game.finished = false;

    game.speed = 0;
    game.steering = 0;

    game.checkpointIndex = 0;
    game.carTrackIndex = 0;

    game.recording = [];

    alignCarToTrackStart();

    /*
       Reset ALL wheel steering angles.
       This guarantees no steering wiggle after reset.
    */

    for (
        const w of game.car.userData.wheels
    ) {

        w.steeringGroup.rotation.y = 0;
        w.wheel.rotation.x = 0;
    }

    checkpointEl.textContent =
        "0 / " +
        game.track.checkpoints.length;

    timerEl.textContent =
        "00:00.000";

    document.getElementById(
        "finishScreen"
    ).style.display = "none";

    message(
        "READY — PRESS W",
        1000
    );
}


/* =========================================================
   TIME
========================================================= */

function formatTime(ms) {

    const total =
        Math.max(0, ms);

    const minutes =
        Math.floor(
            total / 60000
        );

    const seconds =
        Math.floor(
            (total % 60000) / 1000
        );

    const millis =
        Math.floor(
            total % 1000
        );

    return (
        String(minutes).padStart(2,"0") +
        ":" +
        String(seconds).padStart(2,"0") +
        "." +
        String(millis).padStart(3,"0")
    );
}


/* =========================================================
   GHOST
========================================================= */

function saveGhost() {

    if (
        !game.recording ||
        game.recording.length < 2
    )
        return;

    try {

        localStorage.setItem(
            "f1ghost_" + game.trackNumber,
            JSON.stringify(
                game.recording
            )
        );

    } catch(e) {}
}


function loadGhost() {

    if (game.ghost) {

        scene.remove(game.ghost);
        game.ghost = null;
    }

    try {

        const data =
            localStorage.getItem(
                "f1ghost_" +
                game.trackNumber
            );

        if (!data)
            return;

        game.ghostData =
            JSON.parse(data);

    } catch(e) {

        return;
    }

    const ghost =
        createCar(
            0x70aaff
        );

    ghost.traverse(obj => {

        if (obj.material) {

            if (Array.isArray(obj.material)) {

                obj.material =
                    obj.material.map(m => {

                        const clone =
                            m.clone();

                        clone.transparent = true;
                        clone.opacity = .22;

                        return clone;
                    });

            } else {

                obj.material =
                    obj.material.clone();

                obj.material.transparent = true;
                obj.material.opacity = .22;
            }
        }
    });

    ghost.visible = false;

    game.ghost = ghost;

    scene.add(ghost);
}


function updateGhost() {

    if (
        !game.ghost ||
        !game.started ||
        game.finished ||
        !game.ghostData.length
    )
        return;

    const elapsed =
        performance.now() -
        game.startTime;

    let a =
        game.ghostData[0];

    let b =
        game.ghostData[
            game.ghostData.length - 1
        ];

    for (
        let i = 0;
        i <
        game.ghostData.length - 1;
        i++
    ) {

        if (
            game.ghostData[i].t <= elapsed &&
            game.ghostData[i+1].t >= elapsed
        ) {

            a =
                game.ghostData[i];

            b =
                game.ghostData[i+1];

            break;
        }
    }

    if (elapsed < a.t) {

        game.ghost.visible = false;
        return;
    }

    game.ghost.visible = true;

    const span =
        Math.max(
            1,
            b.t - a.t
        );

    const f =
        THREE.MathUtils.clamp(
            (elapsed - a.t) / span,
            0,
            1
        );

    game.ghost.position.set(
        THREE.MathUtils.lerp(
            a.x,
            b.x,
            f
        ),
        THREE.MathUtils.lerp(
            a.y,
            b.y,
            f
        ),
        THREE.MathUtils.lerp(
            a.z,
            b.z,
            f
        )
    );

    game.ghost.rotation.y =
        THREE.MathUtils.lerp(
            a.r,
            b.r,
            f
        );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt) {

    if (!game.car)
        return;

    const car =
        game.car;

    const forward =
        new THREE.Vector3(
            0,
            0,
            1
        );

    forward.applyQuaternion(
        car.quaternion
    );

    forward.y = 0;
    forward.normalize();


    const speed =
        Math.abs(game.speed);

    const cameraDistance =
        THREE.MathUtils.lerp(
            9,
            14,
            Math.min(
                speed / game.maxSpeed,
                1
            )
        );

    const desired =
        car.position.clone()
        .addScaledVector(
            forward,
            -cameraDistance
        );

    desired.y +=
        THREE.MathUtils.lerp(
            4.2,
            5.5,
            Math.min(
                speed / game.maxSpeed,
                1
            )
        );


    camera.position.lerp(
        desired,
        1 -
        Math.pow(
            .001,
            dt
        )
    );


    const look =
        car.position.clone();

    look.addScaledVector(
        forward,
        7
    );

    look.y += 1;

    camera.lookAt(look);
}


/* =========================================================
   TRACK LOADING
========================================================= */

function clearWorld() {

    if (game.road) {

        scene.remove(game.road);
        game.road = null;
    }

    if (game.ground) {

        scene.remove(game.ground);
        game.ground = null;
    }

    if (game.scenery) {

        scene.remove(game.scenery);
        game.scenery = null;
    }

    if (game.gates) {

        scene.remove(game.gates);
        game.gates = null;
    }

    if (game.ghost) {

        scene.remove(game.ghost);
        game.ghost = null;
    }
}


function loadTrack() {

    clearWorld();

    game.theme =
        randomChoice(themes);

    game.track =
        generateTrack();

    /*
       Checkpoints are POINT-TO-POINT.
       There is no lap.
    */

    game.track.checkpoints = [];

    const checkpointCount =
        Math.floor(
            randomRange(7, 11)
        );

    for (
        let i = 1;
        i <= checkpointCount;
        i++
    ) {

        game.track.checkpoints.push(
            i /
            (checkpointCount + 1)
        );
    }


    game.gates =
        new THREE.Group();

    scene.add(game.gates);

    createRoad();
    createGround();
    createScenery();

    for (
        const t of
        game.track.checkpoints
    ) {

        createGate(
            t,
            0xffd400,
            "CHECKPOINT"
        );
    }

    createGate(
        .99,
        0xff2020,
        "FINISH"
    );


    /*
       Create the car AFTER the track exists.
    */

    game.car =
        createCar(
            0xd71920
        );

    scene.add(game.car);


    /*
       THIS is the important starting-direction fix.
       The car reads the tangent of the track at the
       starting point and faces exactly that direction.
    */

    alignCarToTrackStart();


    game.speed = 0;
    game.steering = 0;
    game.started = false;
    game.finished = false;
    game.checkpointIndex = 0;
    game.recording = [];

    checkpointEl.textContent =
        "0 / " +
        game.track.checkpoints.length;

    trackNameEl.textContent =
        "TRACK " +
        game.trackNumber +
        " • " +
        game.theme;

    loadGhost();

    message(
        "TRACK READY — PRESS W",
        1200
    );
}

).onclick = () => {

    document.getElementById(
        "exitScreen"
    ).style.display = "flex";
};


document.getElementById(
    "finishExit"
).onclick = () => {

    document.getElementById(
        "finishScreen"
    ).style.display = "none";

    document.getElementById(
        "exitScreen"
    ).style.display = "flex";
};


document.getElementById(
    "returnRace"
).onclick = () => {

    document.getElementById(
        "exitScreen"
    ).style.display = "none";
};


document.getElementById(
    "exitNext"
).onclick = () => {

    document.getElementById(
        "exitScreen"
    ).style.display = "none";

    game.trackNumber++;

    loadTrack();
};


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================================
   MAIN LOOP
========================================================= */

function animate(now) {

    requestAnimationFrame(animate);

    const dt =
        Math.min(
            .033,
            (now - game.lastFrame) / 1000
        );

    game.lastFrame = now;

    if (game.skidTimer)
        game.skidTimer -= dt;

    updateCar(dt);

    updateSmoke(dt);

    updateGhost();

    updateCamera(dt);


    /*
       HUD speed
    */

    speedEl.textContent =
        Math.round(
            Math.abs(game.speed) * 3.6
        ) +
        " KM/H";


    /*
       Timer only runs after W starts the race.
    */

    if (
        game.started &&
        !game.finished
    ) {

        timerEl.textContent =
            formatTime(
                performance.now() -
                game.startTime
            );
    }


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   START
========================================================= */

loadTrack();

animate(
    performance.now()
);

</script>

</body>
</html>
