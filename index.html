<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Hyper Circuit Racing</title>

<style>
*{
    box-sizing:border-box;
    user-select:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#111;
    font-family:Arial,Helvetica,sans-serif;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    color:white;
    z-index:10;
}

#topLeft{
    position:absolute;
    top:18px;
    left:20px;
    padding:13px 17px;
    border-radius:10px;
    background:rgba(5,8,12,.72);
    border:1px solid rgba(255,255,255,.14);
    backdrop-filter:blur(7px);
}

#trackName{
    font-size:20px;
    font-weight:900;
    letter-spacing:1px;
}

#difficulty{
    margin-top:4px;
    color:#aaa;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:2px;
}

#stats{
    position:absolute;
    top:18px;

    background:rgba(5,8,12,.72);

}

#position{
    font-size:32px;
    font-weight:900;
}

#speed{
    font-size:28px;
    font-weight:900;
}

#speed span{
    font-size:12px;
    color:#aaa;
    margin-left:3px;
}

#gear{
    font-size:14px;
    color:#bbb;
}

#lap{
    margin-top:5px;
    font-size:13px;
    color:#aaa;
}

#countdown{
    position:absolute;
    left:50%;
    top:42%;
    transform:translate(-50%,-50%);
    font-size:92px;
    font-weight:1000;

}

#message{
    position:absolute;
    left:50%;
    top:54%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:900;
    letter-spacing:2px;
}

#controls{
    position:absolute;
    bottom:18px;

}

    bottom:18px;
    right:20px;

    font-size:12px;

    background:rgba(5,8,12,.65);

}

#miniMap{
    position:absolute;
    left:50%;
    bottom:17px;
    transform:translateX(-50%);
    width:220px;
    height:130px;
    background:rgba(5,8,12,.72);
    border:1px solid rgba(255,255,255,.14);
    border-radius:10px;
    overflow:hidden;
}

#mapCanvas{
    width:100%;
    height:100%;
}

#flash{
    position:absolute;
    inset:0;
    background:white;
    opacity:0;
}
</style>
</head>

<body>

<div id="hud">

    <div id="topLeft">
        <div id="trackName">SUNSET GP</div>
        <div id="difficulty">MEDIUM CIRCUIT</div>
    </div>

    <div id="stats">
        <div id="position">P1 / 11</div>
        <div id="speed">0<span>KM/H</span></div>
        <div id="gear">GEAR N</div>
        <div id="lap">LAP 1 / 1</div>
    </div>

    <div id="countdown">3</div>
    <div id="message"></div>

    <div id="controls">
        W / ↑ THROTTLE &nbsp; A / ← LEFT &nbsp; D / → RIGHT &nbsp;
        S / ↓ BRAKE &nbsp; SPACE HANDBRAKE &nbsp; R RESET
    </div>

    <div id="trackSelect">
        N = NEXT TRACK
    </div>

    <div id="miniMap">
        <canvas id="mapCanvas" width="440" height="260"></canvas>
    </div>

    <div id="flash"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* ============================================================
   SETUP
============================================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91a9bb);
scene.fog = new THREE.Fog(0x91a9bb, 650, 5000);

const camera = new THREE.PerspectiveCamera(
    76,
    innerWidth / innerHeight,
    0.1,
    7000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;

document.body.appendChild(renderer.domElement);


/* ============================================================
   LIGHTING
============================================================ */

const hemi = new THREE.HemisphereLight(
    0xe7f2ff,
    0x46504a,
    2.0
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    3.2
);

sun.position.set(-500,900,-700);
sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -1500;
sun.shadow.camera.right = 1500;
sun.shadow.camera.top = 1500;
sun.shadow.camera.bottom = -1500;

scene.add(sun);


/* ============================================================
   WORLD
============================================================ */

const world = new THREE.Group();
scene.add(world);

const groundMat = new THREE.MeshStandardMaterial({
    color:0x59644e,
    roughness:1
});

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(12000,12000),
    groundMat
);

ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
world.add(ground);


/* ============================================================
   TRACK DEFINITIONS
============================================================ */

const TRACKS = [

{
    name:"SUNSET GP",
    difficulty:"Medium Circuit",
    width:36,
    points:[
        [0,-600],
        [280,-600],
        [540,-520],
        [680,-330],
        [680,-50],
        [600,160],
        [410,260],
        [180,250],
        [70,120],
        [0,20],
        [-180,20],
        [-390,130],
        [-620,110],
        [-780,-40],
        [-790,-260],
        [-650,-430],
        [-390,-510]
    ]
},

{
    name:"MOUNTAIN RING",
    difficulty:"Hard Circuit",
    width:32,
    points:[
        [0,-650],
        [370,-650],
        [650,-540],
        [780,-300],
        [750,-30],
        [590,130],
        [330,140],
        [230,20],
        [300,-90],
        [180,-190],
        [-40,-180],
        [-190,-60],
        [-340,90],
        [-620,120],
        [-850,-40],
        [-930,-300],
        [-780,-500],
        [-450,-620]
    ]
},

{
    name:"GRAND PRIX LOOP",
    difficulty:"Easy Circuit",
    width:40,
    points:[
        [0,-620],
        [430,-620],
        [700,-470],
        [760,-180],
        [680,80],
        [470,220],
        [180,220],
        [40,100],
        [-120,220],
        [-430,220],
        [-680,80],
        [-770,-180],
        [-700,-460],
        [-430,-620]
    ]
},

{
    name:"HAIRPIN EXTREME",
    difficulty:"Expert Circuit",
    width:31,
    points:[
        [0,-700],
        [420,-700],
        [700,-560],
        [760,-300],
        [620,-120],
        [320,-100],
        [230,-220],
        [300,-350],
        [560,-390],
        [640,-530],
        [500,-700],
        [80,-780],
        [-320,-700],
        [-600,-530],
        [-670,-300],
        [-550,-110],
        [-250,-100],
        [-170,-230],
        [-250,-350],
        [-500,-390],
        [-620,-530],
        [-500,-700],
        [-100,-780]
    ]
}

];

let currentTrack = 0;
let trackCurve;
let trackLength = 0;
let trackSamples = [];
let trackGroup;


/* ============================================================
   MATERIALS
============================================================ */

const roadMaterial = new THREE.MeshStandardMaterial({
    color:0x55585b,
    roughness:.91,
    metalness:.02
});

const roadEdgeMaterial = new THREE.MeshStandardMaterial({
    color:0x3f4143,
    roughness:1
});

const whiteMat = new THREE.MeshStandardMaterial({
    color:0xf4f4f4,
    roughness:.8
});

const redMat = new THREE.MeshStandardMaterial({
    color:0xc71925,
    roughness:.7
});

const barrierMat = new THREE.MeshStandardMaterial({
    color:0xd8d8d8,
    roughness:.75
});

const darkBarrierMat = new THREE.MeshStandardMaterial({
    color:0x27292b,
    roughness:.8
});

const blackMat = new THREE.MeshStandardMaterial({
    color:0x090a0c,
    roughness:.75
});

const glassMat = new THREE.MeshStandardMaterial({
    color:0x06141b,
    roughness:.12,
    metalness:.6
});

const grassMat = new THREE.MeshStandardMaterial({
    color:0x526048,
    roughness:1
});


/* ============================================================
   TRACK CREATION
============================================================ */

function buildTrack(index){

    if(trackGroup){
        world.remove(trackGroup);
    }

    trackGroup = new THREE.Group();
    world.add(trackGroup);

    const def = TRACKS[index];

    const pts = def.points.map(p =>
        new THREE.Vector3(p[0],0,p[1])
    );

    trackCurve = new THREE.CatmullRomCurve3(
        pts,
        true,
        "centripetal",
        0.5
    );

    const divisions = 900;

    trackSamples = [];

    for(let i=0;i<=divisions;i++){

        const t = i/divisions;

        const p = trackCurve.getPointAt(t);
        const tangent = trackCurve.getTangentAt(t).normalize();

        const right = new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        ).normalize();

        trackSamples.push({
            t,
            p,
            tangent,
            right,
            distance:t
        });
    }

    trackLength = trackCurve.getLength();

    buildRoad(def.width);
    buildCurbs(def.width);
    buildBarriers(def.width);
    buildStartLine(def.width);
    buildGrandstands(def.width);
    buildTracksideObjects(def.width);

    updateMap();
}


/* ============================================================
   ROAD
============================================================ */

function buildRoad(width){

    const vertices = [];
    const indices = [];

    const samples = trackSamples.length;

    for(let i=0;i<samples;i++){

        const s = trackSamples[i];

        const l = s.p.clone().addScaledVector(
            s.right,
            -width/2
        );

        const r = s.p.clone().addScaledVector(
            s.right,
            width/2
        );

        l.y = .015;
        r.y = .015;

        vertices.push(
            l.x,l.y,l.z,
            r.x,r.y,r.z
        );
    }

    for(let i=0;i<samples-1;i++){

        const a=i*2;
        const b=i*2+1;
        const c=(i+1)*2;
        const d=(i+1)*2+1;

        indices.push(
            a,c,b,
            b,c,d
        );
    }

    const geo = new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(vertices,3)
    );

    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mesh = new THREE.Mesh(
        geo,
        roadMaterial
    );

    mesh.receiveShadow = true;

    trackGroup.add(mesh);


    /* outer asphalt runoff */

    const outerWidth = width + 9;

    const outerVertices = [];

    for(let i=0;i<samples;i++){

        const s=trackSamples[i];

        const l=s.p.clone().addScaledVector(
            s.right,
            -outerWidth/2
        );

        const r=s.p.clone().addScaledVector(
            s.right,
            outerWidth/2
        );

        l.y=.005;
        r.y=.005;

        outerVertices.push(
            l.x,l.y,l.z,
            r.x,r.y,r.z
        );
    }

    const outerIndices=[];

    for(let i=0;i<samples-1;i++){

        const a=i*2;
        const b=i*2+1;
        const c=(i+1)*2;
        const d=(i+1)*2+1;

        outerIndices.push(a,c,b,b,c,d);
    }

    const outerGeo=new THREE.BufferGeometry();

    outerGeo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            outerVertices,
            3
        )
    );

    outerGeo.setIndex(outerIndices);
    outerGeo.computeVertexNormals();

    const outerMesh=new THREE.Mesh(
        outerGeo,
        roadEdgeMaterial
    );

    outerMesh.receiveShadow=true;

    trackGroup.add(outerMesh);
}


/* ============================================================
   CURBS
============================================================ */

function buildCurbs(width){

    const curbWidth=4;

    for(let i=0;i<trackSamples.length-1;i+=4){

        const a=trackSamples[i];
        const b=trackSamples[i+4];

        for(const side of [-1,1]){

            const p1=a.p.clone().addScaledVector(
                a.right,
                side*(width/2+curbWidth/2)
            );

            const p2=b.p.clone().addScaledVector(
                b.right,
                side*(width/2+curbWidth/2)
            );

            const length=p1.distanceTo(p2);

            const box=new THREE.Mesh(
                new THREE.BoxGeometry(
                    curbWidth,
                    .13,
                    length
                ),
                ((i/4)%2===0)?redMat:whiteMat
            );

            box.position.copy(
                p1.clone().lerp(p2,.5)
            );

            box.position.y=.095;

            box.rotation.y=
                Math.atan2(
                    p2.x-p1.x,
                    p2.z-p1.z
                );

            box.receiveShadow=true;

            trackGroup.add(box);
        }
    }
}


/* ============================================================
   BARRIERS
============================================================ */

function buildBarriers(width){

    for(let i=0;i<trackSamples.length-1;i+=7){

        const a=trackSamples[i];
        const b=trackSamples[i+7];

        for(const side of [-1,1]){

            const offset=width/2+10;

            const p1=a.p.clone().addScaledVector(
                a.right,
                side*offset
            );

            const p2=b.p.clone().addScaledVector(
                b.right,
                side*offset
            );

            const len=p1.distanceTo(p2);

            const barrier=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .7,
                    1.15,
                    len
                ),
                barrierMat
            );

            barrier.position.copy(
                p1.clone().lerp(p2,.5)
            );

            barrier.position.y=.62;

            barrier.rotation.y=
                Math.atan2(
                    p2.x-p1.x,
                    p2.z-p1.z
                );

            barrier.castShadow=true;
            barrier.receiveShadow=true;

            trackGroup.add(barrier);

            const stripe=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .74,
                    .12,
                    len
                ),
                i%14===0?redMat:whiteMat
            );

            stripe.position.copy(barrier.position);
            stripe.position.y=.98;
            stripe.rotation.y=barrier.rotation.y;

            trackGroup.add(stripe);
        }
    }
}


/* ============================================================
   START LINE
============================================================ */

function buildStartLine(width){

    const s=trackSamples[0];

    const group=new THREE.Group();

    const squares=14;

    for(let i=0;i<squares;i++){

        const box=new THREE.Mesh(
            new THREE.BoxGeometry(
                width/squares,
                .025,
                6
            ),
            i%2===0?whiteMat:blackMat
        );

        box.position.copy(s.p);

        box.position.y=.11;

        box.position.addScaledVector(
            s.right,
            -width/2+(i+.5)*(width/squares)
        );

        box.rotation.y=
            Math.atan2(
                -s.tangent.x,
                -s.tangent.z
            );

        group.add(box);
    }

    trackGroup.add(group);


    /* gantry */

    const yaw=Math.atan2(
        -s.tangent.x,
        -s.tangent.z
    );

    const gantry=new THREE.Group();

    const pole1=new THREE.Mesh(
        new THREE.BoxGeometry(.6,9,.6),
        darkBarrierMat
    );

    const pole2=pole1.clone();

    pole1.position.set(-width/2-1,4.5,0);
    pole2.position.set(width/2+1,4.5,0);

    gantry.add(pole1,pole2);

    const top=new THREE.Mesh(
        new THREE.BoxGeometry(width+3,.8,.8),
        blackMat
    );

    top.position.y=8.6;

    gantry.add(top);

    gantry.rotation.y=yaw;
    gantry.position.copy(s.p);

    trackGroup.add(gantry);
}


/* ============================================================
   GRANDSTANDS
============================================================ */

function buildGrandstands(width){

    /*
       Stands are deliberately placed away from the barriers,
       leaving a visible grass/runoff gap.
    */

    const locations=[
        .08,.17,.29,.42,.56,.68,.81,.93
    ];

    for(const t of locations){

        const s=trackSamples[
            Math.floor(t*trackSamples.length)
            %trackSamples.length
        ];

        for(const side of [-1,1]){

            const standPos=s.p.clone().addScaledVector(
                s.right,
                side*(width/2+55)
            );

            const stand=new THREE.Group();

            const base=new THREE.Mesh(
                new THREE.BoxGeometry(
                    85,
                    3,
                    34
                ),
                new THREE.MeshStandardMaterial({
                    color:0x74787b,
                    roughness:.9
                })
            );

            base.position.y=1.5;

            stand.add(base);


            /* seating rows */

            for(let row=0;row<5;row++){

                const seats=new THREE.Mesh(
                    new THREE.BoxGeometry(
                        82-row*3,
                        2,
                        4.5
                    ),
                    new THREE.MeshStandardMaterial({
                        color:
                            row%3===0
                            ?0x33383d
                            :0x44494d
                    })
                );

                seats.position.y=3+row*2;
                seats.position.z=
                    -12+row*4.7;

                stand.add(seats);


                /* fans */

                for(let f=0;f<18;f++){

                    const fan=createFan(
                        f%5
                    );

                    fan.position.x=
                        -35+
                        (f%18)*4;

                    fan.position.y=
                        5+
                        row*2;

                    fan.position.z=
                        -10+
                        row*4.6;

                    stand.add(fan);
                }
            }


            /* roof */

            const roof=new THREE.Mesh(
                new THREE.BoxGeometry(
                    90,
                    1,
                    38
                ),
                darkBarrierMat
            );

            roof.position.y=16;

            stand.add(roof);


            stand.position.copy(standPos);

            stand.rotation.y=
                Math.atan2(
                    s.tangent.x,
                    s.tangent.z
                )+
                (side<0?Math.PI:0);

            trackGroup.add(stand);
        }
    }
}


/* ============================================================
   FAN
============================================================ */

function createFan(seed){

    const g=new THREE.Group();

    const colors=[
        0xe63946,
        0x1976d2,
        0xf1c40f,
        0x2ecc71,
        0xffffff
    ];

    const shirtMat=new THREE.MeshStandardMaterial({
        color:colors[seed%colors.length],
        roughness:.8
    });

    const body=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .32,.38,.8,8
        ),
        shirtMat
    );

    body.position.y=.4;

    g.add(body);


    const head=new THREE.Mesh(
        new THREE.SphereGeometry(.29,8,6),
        new THREE.MeshStandardMaterial({
            color:0xd9a27c,
            roughness:.9
        })
    );

    head.position.y=.98;

    g.add(head);


    const arm1=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .08,.08,.55,6
        ),
        shirtMat
    );

    arm1.rotation.z=-.8;
    arm1.position.set(-.38,.65,0);

    const arm2=arm1.clone();

    arm2.rotation.z=.8;
    arm2.position.x=.38;

    g.add(arm1,arm2);

    return g;
}


/* ============================================================
   TRACKSIDE OBJECTS
============================================================ */

function buildTracksideObjects(width){

    for(let i=20;i<trackSamples.length;i+=30){

        const s=trackSamples[i];

        if(i%90===0){

            const tree=createTree();

            const side=i%180===0?1:-1;

            tree.position.copy(
                s.p.clone().addScaledVector(
                    s.right,
                    side*(width/2+45+Math.random()*50)
                )
            );

            trackGroup.add(tree);
        }

        if(i%120===0){

            const sign=createTrackSign();

            const side=i%240===0?1:-1;

            sign.position.copy(
                s.p.clone().addScaledVector(
                    s.right,
                    side*(width/2+22)
                )
            );

            sign.rotation.y=
                Math.atan2(
                    s.tangent.x,
                    s.tangent.z
                );

            trackGroup.add(sign);
        }
    }
}


function createTree(){

    const g=new THREE.Group();

    const trunk=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .5,.7,5,8
        ),
        new THREE.MeshStandardMaterial({
            color:0x59402b
        })
    );

    trunk.position.y=2.5;

    g.add(trunk);

    const crown=new THREE.Mesh(
        new THREE.SphereGeometry(
            3.2,10,8
        ),
        new THREE.MeshStandardMaterial({
            color:0x263f29,
            roughness:1
        })
    );

    crown.position.y=6;

    g.add(crown);

    return g;
}


function createTrackSign(){

    const g=new THREE.Group();

    const pole=new THREE.Mesh(
        new THREE.CylinderGeometry(
            .12,.12,3,6
        ),
        darkBarrierMat
    );

    pole.position.y=1.5;

    g.add(pole);

    const board=new THREE.Mesh(
        new THREE.BoxGeometry(
            3,.9,.12
        ),
        whiteMat
    );

    board.position.y=3;

    g.add(board);

    return g;
}


/* ============================================================
   CAR MATERIALS
============================================================ */

function mat(color,metal=0,rough=.6){

    return new THREE.MeshStandardMaterial({
        color,
        metalness:metal,
        roughness:rough
    });
}


/* ============================================================
   CUSTOM WEDGE
============================================================ */

function wedge(
    length,
    frontWidth,
    rearWidth,
    height,
    material
){

    const zf=-length/2;
    const zr=length/2;

    const verts=[
        -frontWidth/2,0,zf,
         frontWidth/2,0,zf,
        -rearWidth/2,0,zr,
         rearWidth/2,0,zr,

        -frontWidth*.30,height,zf,
         frontWidth*.30,height,zf,
        -rearWidth*.42,height*.75,zr,
         rearWidth*.42,height*.75,zr
    ];

    const indices=[
        0,2,1,
        1,2,3,

        4,5,6,
        5,7,6,

        0,4,6,
        0,6,2,

        1,3,7,
        1,7,5,

        0,1,5,
        0,5,4,

        2,6,7,
        2,7,3
    ];

    const geo=new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            verts,
            3
        )
    );

    geo.setIndex(indices);
    geo.computeVertexNormals();

    return new THREE.Mesh(
        geo,
        material
    );
}

function createNumberTexture(number){

    const canvas=document.createElement("canvas");

    canvas.width=128;
    canvas.height=128;

    const ctx=canvas.getContext("2d");

    ctx.clearRect(0,0,128,128);

    ctx.fillStyle="#ffffff";
    ctx.font="900 100px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        number,
        64,
        66
    );

    return new THREE.CanvasTexture(canvas);
}

/* ============================================================
   PLACE CARS
============================================================ */

function resetCars(){

    const width=TRACKS[currentTrack].width;

    const start=trackSamples[0];

    const playerPos=start.p.clone();

    player.position.copy(playerPos);
    player.position.y=.2;

    playerState.yaw=
        Math.atan2(
            -start.tangent.x,
            -start.tangent.z
        );

    player.rotation.y=playerState.yaw;

    playerState.velocity.set(0,0,0);
    playerState.progress=0;
    playerState.distance=0;
    playerState.finished=false;


    /*
       PLAYER IS ALWAYS FIRST.
       AI are placed behind in staggered rows.
    */

    for(let i=0;i<aiCars.length;i++){

        const row=Math.floor(i/2);
        const lane=(i%2===0?-1:1);

        const sampleIndex=
            12+
            row*13;

        const s=
            trackSamples[
                sampleIndex%
                trackSamples.length
            ];

        const p=s.p.clone().addScaledVector(
            s.right,
            lane*5.7
        );

        aiCars[i].mesh.position.copy(p);
        aiCars[i].mesh.position.y=.2;

        aiCars[i].state.yaw=
            Math.atan2(
                -s.tangent.x,
                -s.tangent.z
            );

        aiCars[i].mesh.rotation.y=
            aiCars[i].state.yaw;

        aiCars[i].state.velocity.set(0,0,0);
        aiCars[i].state.progress=
            (sampleIndex/
            trackSamples.length);

        aiCars[i].state.distance=
            aiCars[i].state.progress*
            trackLength;

        aiCars[i].state.targetOffset=
            lane*3.5+
            (Math.random()-.5)*1.3;
    }
}

/* ============================================================
   AUDIO
============================================================ */

let audioCtx=null;
let engine1=null;
let engine2=null;
let engineGain=null;
let brakeGain=null;
let brakeNoise=null;

function initAudio(){

    if(audioCtx){

        if(audioCtx.state==="suspended"){
            audioCtx.resume();
        }

        return;
    }

    audioCtx=new AudioContext();

    engine1=audioCtx.createOscillator();
    engine2=audioCtx.createOscillator();

    engineGain=audioCtx.createGain();

    engineGain.gain.value=.0001;

    engine1.type="sawtooth";
    engine2.type="square";

    engine1.frequency.value=90;
    engine2.frequency.value=180;

    engine1.connect(engineGain);
    engine2.connect(engineGain);

    engineGain.connect(audioCtx.destination);

    engine1.start();
    engine2.start();


    /* brake noise */

    const buffer=audioCtx.createBuffer(
        1,
        audioCtx.sampleRate*2,
        audioCtx.sampleRate
    );

    const data=buffer.getChannelData(0);

    for(let i=0;i<data.length;i++){
        data[i]=Math.random()*2-1;
    }

    brakeNoise=audioCtx.createBufferSource();
    brakeNoise.buffer=buffer;
    brakeNoise.loop=true;

    const filter=audioCtx.createBiquadFilter();

    filter.type="bandpass";
    filter.frequency.value=1800;
    filter.Q.value=.8;

    brakeGain=audioCtx.createGain();
    brakeGain.gain.value=0;

    brakeNoise.connect(filter);
    filter.connect(brakeGain);
    brakeGain.connect(audioCtx.destination);

    brakeNoise.start();
}


function updateAudio(speed,throttle,braking){

    if(!audioCtx) return;

    const normalized=
        THREE.MathUtils.clamp(
            speed/170,
            0,
            1
        );

    const rpm=
        70+
        normalized*1000+
        throttle*320;

    engine1.frequency.setTargetAtTime(
        rpm,
        audioCtx.currentTime,
        .035
    );

    engine2.frequency.setTargetAtTime(
        rpm*1.98,
        audioCtx.currentTime,
        .035
    );

    const volume=
        .025+
        normalized*.08+
        throttle*.035;

    engineGain.gain.setTargetAtTime(
        volume,
        audioCtx.currentTime,
        .045
    );


    const brakeVolume=
        braking&&speed>15
        ?.055
        :0;

    brakeGain.gain.setTargetAtTime(
        brakeVolume,
        audioCtx.currentTime,
        .025
    );
}


/* ============================================================
   PLAYER PHYSICS
============================================================ */

const MAX_SPEED=172;
const ACCEL=70;
const BRAKE=145;

function updatePlayer(dt){

    if(raceState!=="running"){

        playerState.velocity.multiplyScalar(
            Math.pow(.03,dt)
        );

        return;
    }


    const throttle=
        keys.KeyW||
        keys.ArrowUp
        ?1:0;

    const braking=
        keys.KeyS||
        keys.ArrowDown
        ?1:0;


    /*
       IMPORTANT:
       A = LEFT = POSITIVE YAW
       D = RIGHT = NEGATIVE YAW
    */

    let steer=0;

    if(
        keys.KeyA||
        keys.ArrowLeft
    ){
        steer=1;
    }

    if(
        keys.KeyD||
        keys.ArrowRight
    ){
        steer=-1;
    }


    const speed=
        playerState.velocity.length();

    const speedNorm=
        THREE.MathUtils.clamp(
            speed/MAX_SPEED,
            0,
            1
        );


    /* acceleration */

    const forward=new THREE.Vector3(
        -Math.sin(playerState.yaw),
        0,
        -Math.cos(playerState.yaw)
    );

    if(throttle){

        playerState.velocity.addScaledVector(
            forward,
            ACCEL*dt*
            (1-speedNorm*.45)
        );
    }


    if(braking){

        const brakeAmount=
            Math.min(
                speed,
                BRAKE*dt
            );

        playerState.velocity.multiplyScalar(
            Math.max(
                0,
                1-brakeAmount/
                Math.max(speed,.01)
            )
        );
    }


    /* steering */

    const steerRate=
        1.65*
        (.25+.75*speedNorm);

    playerState.yaw+=
        steer*
        steerRate*
        dt;


    /*
       Reduce sideways velocity.
       This gives the car stable arcade handling
       without changing the basic mechanics.
    */

    const fwd=new THREE.Vector3(
        -Math.sin(playerState.yaw),
        0,
        -Math.cos(playerState.yaw)
    );

    const side=new THREE.Vector3(
        -fwd.z,
        0,
        fwd.x
    );

    const forwardSpeed=
        playerState.velocity.dot(fwd);

    let lateralSpeed=
        playerState.velocity.dot(side);

    lateralSpeed*=
        Math.pow(
            .018,
            dt
        );

    playerState.velocity.copy(
        fwd.clone().multiplyScalar(
            Math.max(0,forwardSpeed)
        ).add(
            side.clone().multiplyScalar(
                lateralSpeed
            )
        )
    );


    /* handbrake */

    if(keys.Space){

        playerState.velocity.multiplyScalar(
            Math.pow(.2,dt)
        );
    }


    /* top speed */

    const finalSpeed=
        playerState.velocity.length();

    if(finalSpeed>MAX_SPEED){

        playerState.velocity
            .normalize()
            .multiplyScalar(MAX_SPEED);
    }


    /* move */

    player.position.addScaledVector(
        playerState.velocity,
        dt
    );


    /* track correction */

    keepCarOnTrack(
        player,
        playerState,
        dt
    );


    player.rotation.y=
        playerState.yaw;


    updateWheels(
        player,
        playerState.velocity.length(),
        steer,
        dt
    );


    updateAudio(
        playerState.velocity.length(),
        throttle,
        braking
    );
}


/* ============================================================
   AI PHYSICS
============================================================ */

function updateAI(obj,dt){

    const state=obj.state;
    const car=obj.mesh;

    if(raceState!=="running"){

        state.velocity.multiplyScalar(
            Math.pow(.02,dt)
        );

        return;
    }


    const nearest=findNearestTrackPoint(
        car.position
    );

    const currentIndex=nearest.index;

    state.progress=
        currentIndex/
        trackSamples.length;


    /*
       LOOK FARTHER AHEAD AT SPEED.
       This makes the AI anticipate corners.
    */

    const lookDistance=
        22+
        state.velocity.length()*.48;

    const lookIndex=
        Math.floor(
            lookDistance/
            Math.max(
                trackLength/
                trackSamples.length,
                .1
            )
        );


    const targetIndex=
        (
            currentIndex+
            lookIndex
        )%
        trackSamples.length;

    const targetSample=
        trackSamples[targetIndex];


    /*
       Optimal line:
       Look at upcoming curvature and move
       slightly toward the outside on entry,
       then toward the apex.
    */

    const ahead1=
        trackSamples[
            (targetIndex+25)%
            trackSamples.length
        ];

    const ahead2=
        trackSamples[
            (targetIndex+60)%
            trackSamples.length
        ];


    const dir1=
        targetSample.tangent;

    const dir2=
        ahead1.tangent;


    const turn=
        dir1.x*dir2.z-
        dir1.z*dir2.x;


    let racingOffset=
        state.targetOffset;


    if(Math.abs(turn)>.02){

        if(turn>0){

            /* left corner: use inside/apex */
            racingOffset-=
                Math.min(
                    4,
                    Math.abs(turn)*80
                );

        }else{

            racingOffset+=
                Math.min(
                    4,
                    Math.abs(turn)*80
                );
        }
    }


    const target=
        targetSample.p.clone().addScaledVector(
            targetSample.right,
            racingOffset
        );


    const toTarget=
        target.clone().sub(
            car.position
        );

    toTarget.y=0;


    if(toTarget.lengthSq()<.01)
        return;


    const desiredYaw=
        Math.atan2(
            -toTarget.x,
            -toTarget.z
        );


    let yawDiff=
        normalizeAngle(
            desiredYaw-state.yaw
        );


    const speed=
        state.velocity.length();


    const steeringStrength=
        THREE.MathUtils.clamp(
            .9+speed/100,
            .9,
            2.1
        );


    state.yaw+=
        THREE.MathUtils.clamp(
            yawDiff,
            -steeringStrength*dt,
            steeringStrength*dt
        );


    /* corner speed */

    const tangent1=
        targetSample.tangent;

    const tangent2=
        ahead2.tangent;

    const curvature=
        tangent1.angleTo(tangent2);

    let targetSpeed=
        MAX_SPEED*
        state.speedMultiplier;


    targetSpeed*=
        THREE.MathUtils.clamp(
            1-curvature*1.35,
            .48,
            1
        );


    /* AI braking */

    if(speed>targetSpeed){

        state.velocity.multiplyScalar(
            Math.pow(.20,dt)
        );

    }else{

        const forward=new THREE.Vector3(
            -Math.sin(state.yaw),
            0,
            -Math.cos(state.yaw)
        );

        const desiredVelocity=
            forward.clone().multiplyScalar(
                targetSpeed
            );

        state.velocity.lerp(
            desiredVelocity,
            1-Math.pow(.0005,dt)
        );
    }


    if(state.velocity.length()>MAX_SPEED){

        state.velocity
            .normalize()
            .multiplyScalar(MAX_SPEED);
    }


    car.position.addScaledVector(
        state.velocity,
        dt
    );


    keepCarOnTrack(
        car,
        state,
        dt
    );


    car.rotation.y=state.yaw;


    updateWheels(
        car,
        state.velocity.length(),
        THREE.MathUtils.clamp(
            yawDiff*1.8,
            -1,
            1
        ),
        dt
    );
}


/* ============================================================
   KEEP CARS ON TRACK
============================================================ */

function keepCarOnTrack(car,state,dt){

    const nearest=
        findNearestTrackPoint(
            car.position
        );

    const sample=
        trackSamples[nearest.index];

    const offset=
        car.position.clone().sub(
            sample.p
        );

    const lateral=
        offset.dot(sample.right);

    const halfWidth=
        TRACKS[currentTrack].width/2;


    /*
       Soft correction first.
       Hard correction only near the barriers.
    */

    const safeWidth=
        halfWidth-3.0;


    if(Math.abs(lateral)>safeWidth){

        const correction=
            THREE.MathUtils.clamp(
                Math.abs(lateral)-safeWidth,
                0,
                10
            );

        car.position.addScaledVector(
            sample.right,
            -Math.sign(lateral)*
            correction*
            dt*7
        );


        /* small speed loss only at edge */

        if(Math.abs(lateral)>halfWidth){

            state.velocity.multiplyScalar(
                Math.pow(.5,dt)
            );
        }
    }
}


/* ============================================================
   TRACK SEARCH
============================================================ */

function findNearestTrackPoint(position){

    let best=0;
    let bestDist=Infinity;

    /*
       Search nearby first.
       With 900 samples and only 11 cars this is
       still cheap enough for browser racing.
    */

    const stride=2;

    for(let i=0;i<trackSamples.length;i+=stride){

        const p=trackSamples[i].p;

        const dx=position.x-p.x;
        const dz=position.z-p.z;

        const d=dx*dx+dz*dz;

        if(d<bestDist){

            bestDist=d;
            best=i;
        }
    }

    return {
        index:best,
        distance:Math.sqrt(bestDist)
    };
}


/* ============================================================
   CAR COLLISIONS
============================================================ */

function resolveCarCollisions(){

    const minDistance=3.25;

    for(let iteration=0;iteration<2;iteration++){

        for(let i=0;i<cars.length;i++){

            for(let j=i+1;j<cars.length;j++){

                const a=cars[i];
                const b=cars[j];

                const pa=a.mesh.position;
                const pb=b.mesh.position;

                const dx=pb.x-pa.x;
                const dz=pb.z-pa.z;

                let distSq=
                    dx*dx+
                    dz*dz;

                if(distSq>=minDistance*minDistance)
                    continue;

                let dist=Math.sqrt(distSq);

                if(dist<.001){

                    dist=.001;
                }

                const nx=dx/dist;
                const nz=dz/dist;

                const overlap=
                    minDistance-dist;


                /*
                   Separate the cars first.
                */

                const moveA=
                    a.player?.0.55:.5;

                const moveB=
                    b.player?.0.55:.5;

                pa.x-=nx*overlap*moveA;
                pa.z-=nz*overlap*moveA;

                pb.x+=nx*overlap*moveB;
                pb.z+=nz*overlap*moveB;


                const va=a.state.velocity;
                const vb=b.state.velocity;

                const rvx=vb.x-va.x;
                const rvz=vb.z-va.z;

                const relativeNormal=
                    rvx*nx+
                    rvz*nz;


                if(relativeNormal<0){

                    const restitution=.22;

                    const impulse=
                        -(1+restitution)*
                        relativeNormal/
                        2;

                    va.x-=nx*impulse;
                    va.z-=nz*impulse;

                    vb.x+=nx*impulse;
                    vb.z+=nz*impulse;
                }


                /*
                   Mild sideways friction during contact.
                */

                const tx=-nz;
                const tz=nx;

                const tangentRelative=
                    rvx*tx+
                    rvz*tz;

                const tangentImpulse=
                    tangentRelative*.10;

                va.x+=tx*tangentImpulse;
                va.z+=tz*tangentImpulse;

                vb.x-=tx*tangentImpulse;
                vb.z-=tz*tangentImpulse;
            }
        }
    }
}


/* ============================================================
   WHEEL ANIMATION
============================================================ */

function updateWheels(car,speed,steer,dt){

    const wheels=car.userData.wheels;

    const steeringAngle=
        steer*.38;

    for(const wheel of wheels){

        /*
           Steering and wheel rotation are on
           separate pivots so the wheels do NOT wiggle.
        */

        if(wheel.front){

            wheel.steer.rotation.y=
                steeringAngle;
        }else{

            wheel.steer.rotation.y=0;
        }


        wheel.spin.rotation.x+=
            speed*
            dt/
            .42;
    }
}


/* ============================================================
   RACE STATE
============================================================ */

let raceState="countdown";
let countdownTime=3;
let raceTime=0;
let finishTime=0;


/* ============================================================
   POSITION
============================================================ */

function getRacePosition(){

    const playerProgress=
        playerState.distance;

    let position=1;

    for(const ai of aiCars){

        const aiProgress=
            ai.state.distance;

        if(aiProgress>playerProgress){

            position++;
        }
    }

    return position;
}


/* ============================================================
   PROGRESS
============================================================ */

function updateProgress(){

    const nearest=
        findNearestTrackPoint(
            player.position
        );

    playerState.distance=
        nearest.index/
        (trackSamples.length-1)*
        trackLength;


    for(const ai of aiCars){

        const n=
            findNearestTrackPoint(
                ai.mesh.position
            );

        ai.state.distance=
            n.index/
            (trackSamples.length-1)*
            trackLength;
    }


    /*
       Finish after reaching the last section.
    */

    if(
        playerState.distance>
        trackLength*.965 &&
        raceState==="running"
    ){

        raceState="finished";
        finishTime=raceTime;

        document.getElementById(
            "message"
        ).textContent=
            "FINISHED!  TIME "+
            finishTime.toFixed(2)+"s";
    }
}


/* ============================================================
   CAMERA
============================================================ */

const cameraLook=new THREE.Vector3();

function updateCamera(dt){

    const speed=
        playerState.velocity.length();

    const forward=new THREE.Vector3(
        -Math.sin(playerState.yaw),
        0,
        -Math.cos(playerState.yaw)
    );


    /*
       MUCH CLOSER THAN THE OLD CAMERA.
    */

    const desired=
        player.position.clone()
        .addScaledVector(
            forward,
            -7.2
        );

    desired.y+=2.55;


    const smooth=
        1-
        Math.pow(.0008,dt);

    camera.position.lerp(
        desired,
        smooth
    );


    cameraLook.copy(
        player.position
    );

    cameraLook.addScaledVector(
        forward,
        18+
        speed*.055
    );

    cameraLook.y+=.85;


    camera.lookAt(cameraLook);


    const targetFov=
        72+
        THREE.MathUtils.clamp(
            speed/170,
            0,
            1
        )*17;

    camera.fov+=
        (targetFov-camera.fov)*
        Math.min(1,dt*4);

    camera.updateProjectionMatrix();


    /* tiny speed vibration */

    if(speed>110){

        const shake=
            (speed-110)/170*.035;

        camera.position.x+=
            (Math.random()-.5)*shake;

        camera.position.y+=
            (Math.random()-.5)*shake;
    }
}


/* ============================================================
   HUD
============================================================ */

function updateHUD(){

    const position=getRacePosition();

    document.getElementById(
        "position"
    ).textContent=
        "P"+position+" / 11";


    const kmh=
        Math.round(
            playerState.velocity.length()*
            3.6
        );

    document.getElementById(
        "speed"
    ).innerHTML=
        kmh+
        "<span>KM/H</span>";


    const gear=
        Math.max(
            1,
            Math.min(
                8,
                Math.floor(
                    playerState.velocity.length()/22
                )+1
            )
        );

    document.getElementById(
        "gear"
    ).textContent=
        "GEAR "+gear;


    document.getElementById(
        "lap"
    ).textContent=
        "LAP 1 / 1";


    document.getElementById(
        "trackName"
    ).textContent=
        TRACKS[currentTrack].name;

    document.getElementById(
        "difficulty"
    ).textContent=
        TRACKS[currentTrack].difficulty;


    const countdown=
        document.getElementById(
            "countdown"
        );

    if(raceState==="countdown"){

        const value=
            Math.ceil(countdownTime);

        countdown.textContent=
            value>0?value:"GO!";

    }else{

        countdown.textContent="";
    }
}


/* ============================================================
   MINIMAP
============================================================ */

const mapCanvas=
    document.getElementById("mapCanvas");

const mapCtx=
    mapCanvas.getContext("2d");

function updateMap(){

    mapCtx.clearRect(
        0,
        0,
        mapCanvas.width,
        mapCanvas.height
    );

    if(!trackSamples.length)
        return;


    let minX=Infinity;
    let maxX=-Infinity;
    let minZ=Infinity;
    let maxZ=-Infinity;

    for(const s of trackSamples){

        minX=Math.min(minX,s.p.x);
        maxX=Math.max(maxX,s.p.x);

        minZ=Math.min(minZ,s.p.z);
        maxZ=Math.max(maxZ,s.p.z);
    }


    const pad=35;

    const sx=
        (mapCanvas.width-pad*2)/
        (maxX-minX);

    const sz=
        (mapCanvas.height-pad*2)/
        (maxZ-minZ);

    const scale=Math.min(sx,sz);


    function mapPoint(p){

        return {
            x:
                pad+
                (p.x-minX)*scale,
            y:
                pad+
                (p.z-minZ)*scale
        };
    }


    mapCtx.lineWidth=22;
    mapCtx.strokeStyle="#292b2d";
    mapCtx.lineJoin="round";
    mapCtx.lineCap="round";

    mapCtx.beginPath();

    for(let i=0;i<trackSamples.length;i++){

        const q=mapPoint(
            trackSamples[i].p
        );

        if(i===0)
            mapCtx.moveTo(q.x,q.y);
        else
            mapCtx.lineTo(q.x,q.y);
    }

    mapCtx.closePath();
    mapCtx.stroke();


    mapCtx.lineWidth=3;
    mapCtx.strokeStyle="#ddd";

    mapCtx.beginPath();

    for(let i=0;i<trackSamples.length;i++){

        const q=mapPoint(
            trackSamples[i].p
        );

        if(i===0)
            mapCtx.moveTo(q.x,q.y);
        else
            mapCtx.lineTo(q.x,q.y);
    }

    mapCtx.closePath();
    mapCtx.stroke();


    /* player dot */

    if(player){

        const p=mapPoint(
            player.position
        );

        mapCtx.fillStyle="#ff7a00";

        mapCtx.beginPath();
        mapCtx.arc(
            p.x,
            p.y,
            7,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }


    /* AI dots */

    for(const ai of aiCars){

        const p=mapPoint(
            ai.mesh.position
        );

        mapCtx.fillStyle="#e6e6e6";

        mapCtx.beginPath();

        mapCtx.arc(
            p.x,
            p.y,
            3.5,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }
}


/* ============================================================
   TRACK CHANGE
============================================================ */

function nextTrack(){

    currentTrack=
        (currentTrack+1)%
        TRACKS.length;

    buildTrack(currentTrack);
    createCars();

    raceState="countdown";
    countdownTime=3;

    raceTime=0;
    finishTime=0;

    document.getElementById(
        "message"
    ).textContent="";
}


/* ============================================================
   COUNTDOWN
============================================================ */

function updateRaceState(dt){

    if(raceState==="countdown"){

        countdownTime-=dt;

        if(countdownTime<=0){

            raceState="running";
            countdownTime=0;

            document.getElementById(
                "message"
            ).textContent="";
        }

        return;
    }


    if(raceState==="running"){

        raceTime+=dt;
    }
}


/* ============================================================
   ENVIRONMENT
============================================================ */

function buildEnvironment(){

    /* distant hills */

    for(let i=0;i<40;i++){

        const hill=new THREE.Mesh(
            new THREE.ConeGeometry(
                60+Math.random()*100,
                100+Math.random()*160,
                8
            ),
            new THREE.MeshStandardMaterial({
                color:0x52604b,
                roughness:1
            })
        );

        const angle=
            Math.random()*Math.PI*2;

        const radius=
            1200+
            Math.random()*1800;

        hill.position.set(
            Math.cos(angle)*radius,
            40,
            Math.sin(angle)*radius
        );

        hill.scale.x=1.8;
        hill.scale.z=1.8;

        world.add(hill);
    }
}


/* ============================================================
   RESIZE
============================================================ */

addEventListener(
    "resize",
    ()=>{
        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* ============================================================
   MAIN LOOP
============================================================ */

let lastTime=performance.now();

function animate(now){

    requestAnimationFrame(animate);

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=Math.min(dt,.035);


    updateRaceState(dt);

    updatePlayer(dt);

    for(const ai of aiCars){

        updateAI(ai,dt);
    }


    /*
       Collision physics happens AFTER
       all cars have moved.
    */

    resolveCarCollisions();


    updateProgress();

    updateCamera(dt);

    updateHUD();

    updateMap();

    renderer.render(
        scene,
        camera
    );
}


/* ============================================================
   INITIALIZATION
============================================================ */

buildEnvironment();

buildTrack(currentTrack);

createCars();

camera.position.set(
    0,
    4,
    10
);

updateHUD();

requestAnimationFrame(
    animate
);

</script>
