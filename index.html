<body>

<div id="loading">LOADING VELOCITY GP...</div>

<div id="error">

</div>

<script>
window.addEventListener("error",function(e){
    const box=document.getElementById("error");
    const text=document.getElementById("errorText");

    if(box && text){
        box.style.display="flex";
        text.textContent=(e.message || "Unknown error")+
            (e.filename ? "\n\n"+e.filename+":"+e.lineno+":"+e.colno : "");
    }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
(function(){

"use strict";

if(typeof THREE==="undefined"){
    throw new Error(
        "Three.js could not load. Make sure your browser has internet access."
    );
}

/* =========================================================
   BASIC SETUP
========================================================= */

const scene=new THREE.Scene();

scene.background=new THREE.Color(0x87bce8);
scene.fog=new THREE.Fog(0x87bce8,220,850);

const camera=new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .1,
    1500
);

camera.position.set(0,5,10);

const renderer=new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;

document.body.appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

const hemi=new THREE.HemisphereLight(
    0xbfe5ff,
    0x46523b,
    1.7
);

scene.add(hemi);

const sun=new THREE.DirectionalLight(
    0xffffff,
    2.4
);

sun.position.set(-150,220,100);
sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-300;
sun.shadow.camera.right=300;
sun.shadow.camera.top=300;
sun.shadow.camera.bottom=-300;

scene.add(sun);

/* =========================================================
   MATERIALS
========================================================= */

const asphaltMat=new THREE.MeshStandardMaterial({
    color:0x55585d,
    roughness:.92
});

const grassMat=new THREE.MeshStandardMaterial({
    color:0x39733b,
    roughness:1
});

const curbRedMat=new THREE.MeshStandardMaterial({

});

const curbWhiteMat=new THREE.MeshStandardMaterial({

    roughness:.8
});

});

const darkMat=new THREE.MeshStandardMaterial({

});

const glassMat=new THREE.MeshStandardMaterial({
    color:0x101b25,
    metalness:.2,
    roughness:.15,
    transparent:true,

});

/* =========================================================
   TRACKS
========================================================= */

const trackDefs=[

{
    name:"SUNSET GP",
    difficulty:"MEDIUM",
    points:[
        [-120,-30],
        [-90,-85],
        [-20,-115],
        [65,-105],

},

},

{

},

{

    points:[
        [-150,-20],

        [-30,-130],
        [65,-105],

];

/* =========================================================
   GLOBAL STATE
========================================================= */

let trackIndex=0;
let trackCurve=null;
let trackSamples=[];
let trackLength=0;

const cars=[];

const keys={};

let raceStarted=false;
let countdownTime=0;
let raceFinished=false;

const TOTAL_LAPS=3;

const clock=new THREE.Clock();

/* =========================================================
   TRACK HELPERS
========================================================= */

function createTrackCurve(def){

    const points=def.points.map(function(p){
        return new THREE.Vector3(p[0],0,p[1]);
    });

    return new THREE.CatmullRomCurve3(
        points,
        true,
        "centripetal",
        .5
    );
}

function generateSamples(){

    trackSamples=[];

    const count=1000;

    let distance=0;
    let previous=null;

    for(let i=0;i<=count;i++){

        const t=i/count;

        const p=trackCurve.getPointAt(t);
        const tangent=trackCurve.getTangentAt(t).normalize();

        if(previous){
            distance+=p.distanceTo(previous);
        }

        trackSamples.push({
            t:t,
            point:p.clone(),
            tangent:tangent.clone(),
            distance:distance
        });

        previous=p;
    }

    trackLength=distance;
}

function getTrackPoint(t){

    t=((t%1)+1)%1;

    return trackCurve.getPointAt(t);
}

function getTrackTangent(t){

    t=((t%1)+1)%1;

    return trackCurve.getTangentAt(t).normalize();
}

/* =========================================================
   WORLD HELPERS
========================================================= */

function addBox(
    parent,
    x,
    y,
    z,
    sx,
    sy,
    sz,
    material,
    rotationY=0
){

    const mesh=new THREE.Mesh(
        new THREE.BoxGeometry(sx,sy,sz),
        material
    );

    mesh.position.set(x,y,z);
    mesh.rotation.y=rotationY;

    mesh.castShadow=true;
    mesh.receiveShadow=true;

    parent.add(mesh);

    return mesh;
}

function addCylinder(
    parent,
    x,
    y,
    z,
    radius,
    height,
    material
){

    const mesh=new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            10
        ),
        material
    );

    mesh.position.set(x,y,z);
    mesh.castShadow=true;
    mesh.receiveShadow=true;

    parent.add(mesh);

    return mesh;
}

/* =========================================================
   CAR CREATION
========================================================= */

function createCar(color,number,isPlayer){

    const root=new THREE.Group();

    /* Main chassis */

    const bodyMat=new THREE.MeshStandardMaterial({
        color:color,
        metalness:.25,
        roughness:.4
    });

    const body=addBox(
        root,
        0,
        .65,
        0,
        1.15,
        .42,
        3.5,
        bodyMat
    );

    /* Nose */

    const nose=new THREE.Mesh(
        new THREE.ConeGeometry(.55,2.1,4),
        bodyMat
    );

    nose.rotation.y=Math.PI/4;
    nose.rotation.z=-Math.PI/2;

    nose.scale.set(.8,.45,.8);

    nose.position.set(
        0,
        .66,
        -2.55
    );

    nose.castShadow=true;

    root.add(nose);

    /* Sidepods */

    addBox(
        root,
        -1.0,
        .67,
        -.15,
        .65,
        .38,
        1.75,
        bodyMat
    );

    addBox(
        root,
        1.0,
        .67,
        -.15,
        .65,
        .38,
        1.75,
        bodyMat
    );

    /* Cockpit */

    const cockpit=new THREE.Mesh(
        new THREE.SphereGeometry(
            .48,
            16,
            10
        ),
        glassMat
    );

    cockpit.scale.set(
        1,
        .65,
        1.35
    );

    cockpit.position.set(
        0,
        1.12,
        -.15
    );

    cockpit.castShadow=true;

    root.add(cockpit);

    /* Halo */

    const haloMat=new THREE.MeshStandardMaterial({
        color:0x101010,
        metalness:.5,
        roughness:.3
    });

    addBox(
        root,
        0,
        1.48,
        -.55,
        .1,
        .12,
        1.05,
        haloMat
    );

    addBox(
        root,
        0,
        1.48,
        .02,
        1.0,
        .1,
        .1,
        haloMat
    );

    /* Front wing */

    addBox(
        root,
        0,
        .42,
        -3.1,
        2.65,
        .1,
        .42,
        darkMat
    );

    addBox(
        root,
        -1.35,
        .48,
        -3.05,
        .12,
        .22,
        .65,
        darkMat
    );

    addBox(
        root,
        1.35,
        .48,
        -3.05,
        .12,
        .22,
        .65,
        darkMat
    );

    /* Rear wing */

    addBox(
        root,
        0,
        1.35,
        1.65,
        2.3,
        .14,
        .2,
        darkMat
    );

    addBox(
        root,
        -.95,
        1.05,
        1.65,
        .12,
        .7,
        .16,
        darkMat
    );

    addBox(
        root,
        .95,
        1.05,
        1.65,
        .12,
        .7,
        .16,
        darkMat
    );

    /* Number */

    const numberCanvas=document.createElement("canvas");
    numberCanvas.width=256;
    numberCanvas.height=256;

    const ctx=numberCanvas.getContext("2d");

    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,256,256);

    ctx.fillStyle="#111111";
    ctx.font="bold 180px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(String(number),128,135);

    const numberTexture=new THREE.CanvasTexture(numberCanvas);

    const numberMat=new THREE.MeshBasicMaterial({
        map:numberTexture
    });

    const numberPlane=new THREE.Mesh(
        new THREE.PlaneGeometry(.7,.7),
        numberMat
    );

    numberPlane.rotation.x=-Math.PI/2;
    numberPlane.position.set(
        0,
        .88,
        -.2
    );

    root.add(numberPlane);

    /* Wheels */

    const wheelData=[];

    function createWheel(x,z){

        const steerPivot=new THREE.Group();
        const spinPivot=new THREE.Group();

        steerPivot.position.set(
            x,
            .42,
            z
        );

        const tire=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .42,
                .42,
                .27,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0x080808,
                roughness:.9
            })
        );

        tire.rotation.z=Math.PI/2;

        tire.castShadow=true;

        spinPivot.add(tire);
        steerPivot.add(spinPivot);
        root.add(steerPivot);

        wheelData.push({
            steer:steerPivot,
            spin:spinPivot
        });
    }

    createWheel(-.82,-1.85);
    createWheel(.82,-1.85);
    createWheel(-.82,1.25);
    createWheel(.82,1.25);

    root.position.y=0;

    scene.add(root);

    return {
        mesh:root,
        wheels:wheelData,
        color:color,
        number:number,
        player:isPlayer,
        state:{
            t:0,
            speed:0,
            lap:1,
            progress:0,
            steer:0,
            finished:false
        }
    };
}

/* =========================================================
   BUILD TRACK
========================================================= */

let worldGroup=new THREE.Group();

scene.add(worldGroup);

function clearWorld(){

    scene.remove(worldGroup);

    worldGroup=new THREE.Group();

    scene.add(worldGroup);
}

function buildTrack(){

    clearWorld();

    const def=trackDefs[trackIndex];

    trackCurve=createTrackCurve(def);

    generateSamples();

    /* Grass */

    const grass=new THREE.Mesh(
        new THREE.PlaneGeometry(
            1300,
            1300
        ),
        grassMat
    );

    grass.rotation.x=-Math.PI/2;
    grass.position.y=-.08;

    grass.receiveShadow=true;

    worldGroup.add(grass);

    /* Asphalt */

    const roadPoints=[];

    const segments=500;

    for(let i=0;i<segments;i++){

        const t=i/segments;

        const p=getTrackPoint(t);

        roadPoints.push(
            new THREE.Vector3(
                p.x,
                0,
                p.z
            )
        );
    }

    const roadCurve=new THREE.CatmullRomCurve3(
        roadPoints,
        true,
        "centripetal",
        .5
    );

    const roadGeometry=new THREE.TubeGeometry(
        roadCurve,
        segments,
        5.5,
        8,
        true
    );

    const road=new THREE.Mesh(
        roadGeometry,
        asphaltMat
    );

    road.scale.y=.08;
    road.position.y=.01;

    road.receiveShadow=true;

    worldGroup.add(road);

    buildCurbs();
    buildBarriers();
    buildGrandstands();
    buildScenery();
    buildStartLine();

    document.getElementById("trackName").textContent=
        def.name+" • "+def.difficulty+" CIRCUIT";
}

/* =========================================================
   CURBS
========================================================= */

function buildCurbs(){

    const segments=180;

    for(let i=0;i<segments;i++){

        const t=i/segments;

        const p=getTrackPoint(t);
        const tangent=getTrackTangent(t);

        const side=new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        );

        const left=p.clone().add(
            side.clone().multiplyScalar(5.8)
        );

        const right=p.clone().add(
            side.clone().multiplyScalar(-5.8)
        );

        const material=
            i%2===0
            ? curbRedMat
            : curbWhiteMat;

        const length=trackLength/segments;

        const leftCurb=addBox(
            worldGroup,
            left.x,
            .08,
            left.z,
            .75,
            .16,
            length,
            material
        );

        leftCurb.rotation.y=
            Math.atan2(tangent.x,tangent.z);

        const rightCurb=addBox(
            worldGroup,
            right.x,
            .08,
            right.z,
            .75,
            .16,
            length,
            material
        );

        rightCurb.rotation.y=
            Math.atan2(tangent.x,tangent.z);
    }
}

/* =========================================================
   BARRIERS
========================================================= */

function buildBarriers(){

    const segments=90;

    for(let i=0;i<segments;i++){

        const t=i/segments;

        const p=getTrackPoint(t);
        const tangent=getTrackTangent(t);

        const side=new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        );

        for(const s of [-1,1]){

            const pos=p.clone().add(
                side.clone().multiplyScalar(
                    s*8.0
                )
            );

            const barrier=addBox(
                worldGroup,
                pos.x,
                1,
                pos.z,
                .35,
                1.6,
                trackLength/segments*2,
                barrierMat
            );

            barrier.rotation.y=
                Math.atan2(
                    tangent.x,
                    tangent.z
                );
        }
    }
}

/* =========================================================
   GRANDSTANDS
========================================================= */

function buildGrandstands(){

    const standMat=new THREE.MeshStandardMaterial({
        color:0x555555,
        roughness:.9
    });

    const roofMat=new THREE.MeshStandardMaterial({
        color:0x202020,
        roughness:.8
    });

    const fanColors=[
        0xffffff,
        0xff4444,
        0x3366ff,
        0xffd21f,
        0x42d66a
    ];

    const sections=[
        .08,
        .25,
        .43,
        .61,
        .79,
        .94
    ];

    for(let section=0;section<sections.length;section++){

        const t=sections[section];

        const p=getTrackPoint(t);
        const tangent=getTrackTangent(t);

        const side=new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        );

        const pos=p.clone().add(
            side.multiplyScalar(
                section%2===0 ? 22 : -22
            )
        );

        const rotation=Math.atan2(
            tangent.x,
            tangent.z
        );

        const stand=addBox(
            worldGroup,
            pos.x,
            2,
            pos.z,
            25,
            4,
            8,
            standMat,
            rotation
        );

        /* Roof */

        addBox(
            worldGroup,
            pos.x,
            5,
            pos.z,
            27,
            .35,
            10,
            roofMat,
            rotation
        );

        /* Fans */

        for(let row=0;row<3;row++){

            for(let col=0;col<14;col++){

                const fan=new THREE.Mesh(
                    new THREE.SphereGeometry(
                        .22,
                        7,
                        6
                    ),
                    new THREE.MeshStandardMaterial({
                        color:
                            fanColors[
                                (row*14+col+section)
                                %fanColors.length
                            ]
                    })
                );

                const localX=
                    (col-6.5)*1.5;

                const localZ=
                    (row-1)*1.5;

                fan.position.set(
                    pos.x+
                    Math.cos(rotation)*localX-
                    Math.sin(rotation)*localZ,

                    3+
                    row*.6,

                    pos.z+
                    Math.sin(rotation)*localX+
                    Math.cos(rotation)*localZ
                );

                fan.castShadow=true;

                worldGroup.add(fan);
            }
        }
    }
}

/* =========================================================
   SCENERY
========================================================= */

function buildScenery(){

    const treeTrunk=new THREE.MeshStandardMaterial({
        color:0x5b3820
    });

    const treeLeaves=new THREE.MeshStandardMaterial({
        color:0x286332
    });

    for(let i=0;i<70;i++){

        const angle=Math.random()*Math.PI*2;
        const radius=90+Math.random()*240;

        const x=Math.cos(angle)*radius;
        const z=Math.sin(angle)*radius;

        const trunk=addCylinder(
            worldGroup,
            x,
            2,
            z,
            .55,
            4,
            treeTrunk
        );

        const leaves=new THREE.Mesh(
            new THREE.SphereGeometry(
                3+Math.random()*2,
                9,
                7
            ),
            treeLeaves
        );

        leaves.position.set(
            x,
            5,
            z
        );

        leaves.castShadow=true;

        worldGroup.add(leaves);
    }

    /* Windmills */

    for(let i=0;i<5;i++){

        const x=-230+i*110;
        const z=-190-Math.random()*70;

        addBox(
            worldGroup,
            x,
            10,
            z,
            2,
            20,
            2,
            barrierMat
        );

        const hub=new THREE.Group();

        hub.position.set(
            x,
            18,
            z
        );

        worldGroup.add(hub);

        for(let blade=0;blade<4;blade++){

            const angle=
                blade*Math.PI/2;

            const b=addBox(
                hub,
                Math.cos(angle)*5,
                Math.sin(angle)*5,
                0,
                .5,
                9,
                .25,
                curbWhiteMat
            );

            b.rotation.z=angle;
        }
    }
}

/* =========================================================
   START LINE
========================================================= */

function buildStartLine(){

    const p=getTrackPoint(0);
    const tangent=getTrackTangent(0);

    const line=addBox(
        worldGroup,
        p.x,
        .11,
        p.z,
        10.5,
        .025,
        3,
        curbWhiteMat
    );

    line.rotation.y=
        Math.atan2(
            tangent.x,
            tangent.z
        );

    /* Grid boxes */

    for(let i=0;i<10;i++){

        const offset=-4.5+i;

        const side=new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        );

        const pos=p.clone().add(
            side.multiplyScalar(offset)
        );

        const square=addBox(
            worldGroup,
            pos.x,
            .13,
            pos.z,
            .9,
            .035,
            3,
            i%2===0
                ? darkMat
                : curbWhiteMat
        );

        square.rotation.y=
            Math.atan2(
                tangent.x,
                tangent.z
            );
    }
}

/* =========================================================
   CARS
========================================================= */

function resetCars(){

    cars.length=0;

    const colors=[
        0xff2525,
        0x246bff,
        0xeeeeee,
        0xffcc22,
        0x20c878,
        0xff7222,
        0xa044ff,
        0x00bcd4,
        0xffffff,
        0x555555,
        0xff4f9a
    ];

    for(let i=0;i<11;i++){

        const isPlayer=i===0;

        const car=createCar(
            isPlayer ? 0xff6b18 : colors[i],
            i+1,
            isPlayer
        );

        car.state.t=
            (1-(i*.007))%1;

        car.state.speed=
            isPlayer ? 0 : 80+Math.random()*15;

        cars.push(car);
    }

    positionCars();
}

function positionCars(){

    cars.forEach(function(car,index){

        const row=Math.floor(index/2);
        const col=index%2;

        const t=
            (0.015-row*.008+1)%1;

        const center=getTrackPoint(t);
        const tangent=getTrackTangent(t);

        const side=new THREE.Vector3(
            -tangent.z,
            0,
            tangent.x
        );

        const offset=
            col===0 ? -.9 : .9;

        car.mesh.position.copy(
            center.clone().add(
                side.multiplyScalar(offset)
            )
        );

        car.mesh.position.y=.03;

        car.mesh.rotation.y=
            Math.atan2(
                tangent.x,
                tangent.z
            );

        car.state.t=t;
        car.state.lap=1;
        car.state.progress=t;
    });
}

/* =========================================================
   PLAYER
========================================================= */

function updatePlayer(car,dt){

    if(raceFinished)return;

    const throttle=
        keys["w"] ||
        keys["arrowup"];

    const brake=
        keys["s"] ||
        keys["arrowdown"];

    const left=
        keys["a"] ||
        keys["arrowleft"];

    const right=
        keys["d"] ||
        keys["arrowright"];

    const steerInput=
        (left?1:0)-
        (right?1:0);

    car.state.steer=THREE.MathUtils.damp(
        car.state.steer,
        steerInput,
        10,
        dt
    );

    const maxSpeed=172;

    if(throttle){

        car.state.speed+=
            125*dt;
    }else{

        car.state.speed-=
            20*dt;
    }

    if(brake){

        car.state.speed-=
            170*dt;
    }

    car.state.speed=THREE.MathUtils.clamp(
        car.state.speed,
        0,
        maxSpeed
    );

    const speedFactor=
        Math.min(car.state.speed/maxSpeed,1);

    car.mesh.rotation.y+=
        car.state.steer*
        1.75*
        speedFactor*
        dt;

    const forward=new THREE.Vector3(
        Math.sin(car.mesh.rotation.y),
        0,
        Math.cos(car.mesh.rotation.y)
    );

    car.mesh.position.add(
        forward.multiplyScalar(
            car.state.speed*dt
        )
    );

    /* Find nearest track position */

    const info=nearestTrackInfo(
        car.mesh.position
    );

    car.state.t=info.t;

    car.state.progress=
        info.t;

    if(info.distance>6.8){

        car.state.speed*=
            Math.pow(.15,dt);
    }
}

/* =========================================================
   TRACK SEARCH
========================================================= */

function nearestTrackInfo(position){

    let best=null;
    let bestDistance=Infinity;

    for(let i=0;i<trackSamples.length;i++){

        const sample=trackSamples[i];

        const dx=
            sample.point.x-position.x;

        const dz=
            sample.point.z-position.z;

        const distance=dx*dx+dz*dz;

        if(distance<bestDistance){

            bestDistance=distance;
            best=sample;
        }
    }

    return {
        t:best.t,
        distance:Math.sqrt(bestDistance),
        point:best.point,
        tangent:best.tangent
    };
}

/* =========================================================
   AI
========================================================= */

function updateAI(car,dt){

    if(raceFinished)return;

    const info=nearestTrackInfo(
        car.mesh.position
    );

    const currentT=info.t;

    const lookAhead=
        .015+
        car.state.speed/172*.045;

    const targetT=
        (currentT+lookAhead)%1;

    const target=getTrackPoint(targetT);

    const tangent=getTrackTangent(targetT);

    const desiredYaw=
        Math.atan2(
            tangent.x,
            tangent.z
        );

    let angle=
        desiredYaw-car.mesh.rotation.y;

    while(angle>Math.PI)angle-=Math.PI*2;
    while(angle<-Math.PI)angle+=Math.PI*2;

    car.state.steer=
        THREE.MathUtils.clamp(
            angle*2,
            -1,
            1
        );

    car.mesh.rotation.y=
        THREE.MathUtils.damp(
            car.mesh.rotation.y,
            desiredYaw,
            4.5,
            dt
        );

    /* Estimate curvature */

    const before=getTrackTangent(
        (currentT-.025+1)%1
    );

    const after=getTrackTangent(
        (currentT+.025)%1
    );

    const curvature=
        1-
        THREE.MathUtils.clamp(
            before.dot(after),
            -1,
            1
        );

    const desiredSpeed=
        THREE.MathUtils.clamp(
            175-curvature*900,
            65,
            165
        );

    car.state.speed=
        THREE.MathUtils.damp(
            car.state.speed,
            desiredSpeed,
            2.8,
            dt
        );

    const forward=new THREE.Vector3(
        Math.sin(car.mesh.rotation.y),
        0,
        Math.cos(car.mesh.rotation.y)
    );

    car.mesh.position.add(
        forward.multiplyScalar(
            car.state.speed*dt
        )
    );

    /* Keep AI near racing line */

    const nearest=nearestTrackInfo(
        car.mesh.position
    );

    const lateral=
        car.mesh.position.clone()
        .sub(nearest.point);

    const lateralDistance=
        lateral.length();

    if(lateralDistance>3){

        car.mesh.position.lerp(
            nearest.point,
            Math.min(
                dt*1.4,
                .08
            )
        );
    }

    car.state.t=nearest.t;
    car.state.progress=nearest.t;
}

/* =========================================================
   COLLISIONS
========================================================= */

function resolveCollisions(){

    const minDistance=3.25;

    for(let pass=0;pass<2;pass++){

        for(let i=0;i<cars.length;i++){

            for(let j=i+1;j<cars.length;j++){

                const a=cars[i];
                const b=cars[j];

                const dx=
                    b.mesh.position.x-
                    a.mesh.position.x;

                const dz=
                    b.mesh.position.z-
                    a.mesh.position.z;

                const distanceSquared=
                    dx*dx+
                    dz*dz;

                if(
                    distanceSquared>=
                    minDistance*minDistance
                ){
                    continue;
                }

                let distance=
                    Math.sqrt(distanceSquared);

                if(distance<.001){
                    distance=.001;
                }

                const nx=dx/distance;
                const nz=dz/distance;

                const overlap=
                    minDistance-distance;

                const moveA=
                    a.player ? .55 : .5;

                const moveB=
                    b.player ? .55 : .5;

                a.mesh.position.x-=
                    nx*overlap*moveA;

                a.mesh.position.z-=
                    nz*overlap*moveA;

                b.mesh.position.x+=
                    nx*overlap*moveB;

                b.mesh.position.z+=
                    nz*overlap*moveB;

                a.state.speed*=.985;
                b.state.speed*=.985;
            }
        }
    }
}

/* =========================================================
   WHEEL ANIMATION
========================================================= */

function updateWheels(car,dt){

    const steeringAngle=
        car.state.steer*.45;

    for(let i=0;i<car.wheels.length;i++){

        const wheel=car.wheels[i];

        if(i<2){

            wheel.steer.rotation.y=
                steeringAngle;
        }

        wheel.spin.rotation.x+=
            car.state.speed*
            dt/
            .42;
    }
}

/* =========================================================
   RACE POSITION
========================================================= */

function calculatePosition(car){

    const scoreCars=cars.slice().sort(
        function(a,b){

            const scoreA=
                (a.state.lap-1)*1+
                a.state.progress;

            const scoreB=
                (b.state.lap-1)*1+
                b.state.progress;

            return scoreB-scoreA;
        }
    );

    return scoreCars.indexOf(car)+1;
}

/* =========================================================
   LAP DETECTION
========================================================= */

function updateLaps(car){

    const previous=car.state.progress;

    const info=nearestTrackInfo(
        car.mesh.position
    );

    const current=info.t;

    if(
        previous>.85 &&
        current<.15 &&
        car.state.speed>20
    ){

        car.state.lap++;

        if(car.state.lap>TOTAL_LAPS){

            car.state.finished=true;

            if(car.player){

                raceFinished=true;

                const position=
                    calculatePosition(car);

                document.getElementById(
                    "finishText"
                ).textContent=
                    "You finished "+position+
                    (position===1?"st":
                    position===2?"nd":
                    position===3?"rd":"th");

                document.getElementById(
                    "finish"
                ).style.display="flex";
            }
        }
    }

    car.state.progress=current;
}

/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    const player=cars[0];

    const position=
        calculatePosition(player);

    let suffix="th";

    if(position===1)suffix="st";
    if(position===2)suffix="nd";
    if(position===3)suffix="rd";

    document.getElementById(
        "position"
    ).textContent=
        position+suffix;

    document.getElementById(
        "lap"
    ).textContent=
        "Lap "+
        Math.min(player.state.lap,TOTAL_LAPS)+
        " / "+
        TOTAL_LAPS;

    document.getElementById(
        "speed"
    ).innerHTML=
        Math.round(
            player.state.speed*3.6
        )+
        ' <small>KM/H</small>';
}

/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    const player=cars[0];

    const forward=new THREE.Vector3(
        Math.sin(player.mesh.rotation.y),
        0,
        Math.cos(player.mesh.rotation.y)
    );

    const targetPosition=
        player.mesh.position.clone()
        .sub(
            forward.clone().multiplyScalar(9)
        );

    targetPosition.y+=4.8;

    camera.position.lerp(
        targetPosition,
        1-Math.pow(.001,dt)
    );

    const lookAt=
        player.mesh.position.clone()
        .add(
            forward.clone().multiplyScalar(14)
        );

    lookAt.y+=1.0;

    camera.lookAt(lookAt);

    camera.fov=
        THREE.MathUtils.damp(
            camera.fov,
            68+
            Math.min(
                player.state.speed/172*15,
                15
            ),
            4,
            dt
        );

    camera.updateProjectionMatrix();
}

/* =========================================================
   RESET
========================================================= */

function resetRace(){

    raceFinished=false;

    document.getElementById(
        "finish"
    ).style.display="none";

    resetCars();

    raceStarted=false;

    countdownTime=3;

    const countdown=
        document.getElementById(
            "countdown"
        );

    countdown.style.display="flex";
    countdown.textContent="3";
}

/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    function(event){

        keys[event.key.toLowerCase()]=true;

        const key=
            event.key.toLowerCase();

        if(key==="r"){

            resetRace();
        }

        if(key==="n"){

            trackIndex=
                (trackIndex+1)%
                trackDefs.length;

            buildTrack();
            resetRace();
        }
    }
);

window.addEventListener(
    "keyup",
    function(event){

        keys[event.key.toLowerCase()]=false;
    }
);

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        camera.aspect=
            innerWidth/innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown(dt){

    if(raceStarted)return;

    countdownTime-=dt;

    const countdown=
        document.getElementById(
            "countdown"
        );

    if(countdownTime>2){

        countdown.textContent="3";

    }else if(countdownTime>1){

        countdown.textContent="2";

    }else if(countdownTime>0){

        countdown.textContent="1";

    }else if(countdownTime>-.8){

        countdown.textContent="GO!";

        raceStarted=true;

    }else{

        countdown.style.display="none";
    }
}

/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    const dt=Math.min(
        clock.getDelta(),
        .05
    );

    updateCountdown(dt);

    if(raceStarted && !raceFinished){

        updatePlayer(
            cars[0],
            dt
        );

        for(let i=1;i<cars.length;i++){

            updateAI(
                cars[i],
                dt
            );
        }

        resolveCollisions();

        for(let i=0;i<cars.length;i++){

            updateLaps(cars[i]);
            updateWheels(cars[i],dt);
        }

        updateHUD();
    }

    updateCamera(dt);

    renderer.render(
        scene,
        camera
    );
}

/* =========================================================
   START
========================================================= */

buildTrack();

resetCars();

document.getElementById(
    "loading"
).style.display="none";

resetRace();

animate();

})();
</script>
