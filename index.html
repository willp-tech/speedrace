<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Rush 3D</title>
<style>
/* ============================================================
   TRACK RUSH 3D
   Original browser racing game with a PolyTrack-style arcade
   philosophy: fast point-to-point tracks, jumps, banking,
   checkpoint progression, resets, ghost runs and time attack.
============================================================ */
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87b9d7;font-family:Arial,sans-serif}
body{user-select:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 5px #000}
#top{position:absolute;top:15px;left:50%;transform:translateX(-50%);text-align:center}
#name{font-size:22px;font-weight:900;letter-spacing:3px}
#progress{font-size:13px;opacity:.75;margin-top:3px}
#timer{position:absolute;top:18px;left:20px;font-size:26px;font-weight:900}
#best{position:absolute;top:52px;left:21px;font-size:12px;opacity:.7}
#speedPanel{position:absolute;right:20px;bottom:20px;text-align:right}
#speed{font-size:48px;font-weight:1000;line-height:45px}
#speed small{font-size:13px;opacity:.65}
#checkpoint{font-size:15px;margin-top:4px}
#bar{width:190px;height:7px;background:#17222b;border-radius:8px;overflow:hidden;margin-top:8px}
#barFill{height:100%;width:100%;background:#21d4ff}
#help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.5}
#message{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-size:44px;font-weight:1000;opacity:0;z-index:10;pointer-events:none}
#countdown{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:1000;color:white;text-shadow:0 8px 40px #000;z-index:20;pointer-events:none}
#buttons{position:fixed;right:15px;top:15px;z-index:30}
button{border:0;border-radius:9px;padding:9px 14px;margin-left:4px;background:rgba(10,15,20,.7);color:white;font-weight:800;cursor:pointer;border:1px solid #ffffff22}
button:hover{background:rgba(30,45,55,.9)}
#screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(3,6,10,.72);backdrop-filter:blur(8px);z-index:100;color:white}
.card{width:min(700px,92vw);background:#111a22;border:1px solid #ffffff22;border-radius:22px;padding:35px;text-align:center;box-shadow:0 30px 100px #000}
.card h1{font-size:58px;margin:0}
.card p{opacity:.7}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:24px 0}
.stat{background:#19242d;border-radius:12px;padding:14px}
.stat b{display:block;font-size:25px}
.stat span{font-size:10px;opacity:.5}
.primary{background:#21d4ff;color:#041018}
@media(max-width:700px){#help{display:none}.card h1{font-size:40px}.stats{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="hud">
  <div id="timer">00:00.000</div>
  <div id="best">BEST --</div>
  <div id="top"><div id="name">TRACK RUSH</div><div id="progress">CHECKPOINT 0 / 8</div></div>
  <div id="speedPanel"><div id="speed">0 <small>KM/H</small></div><div id="checkpoint">NEXT CHECKPOINT</div><div id="bar"><div id="barFill"></div></div></div>
  <div id="help">W / ↑ DRIVE • S / ↓ BRAKE • A D / ← → STEER • R RESET • SHIFT BOOST • P PAUSE</div>
</div>
<div id="message"></div>
<div id="countdown"></div>
<div id="buttons"><button id="pause">PAUSE</button><button id="reset">RESET</button><button id="new">NEW TRACK</button></div>
<div id="screen">
 <div class="card">
  <h1 id="result">FINISH</h1>
  <p id="resultText">Time attack complete.</p>
  <div class="stats">
   <div class="stat"><b id="timeOut">00:00.000</b><span>TIME</span></div>
   <div class="stat"><b id="bestOut">--</b><span>BEST</span></div>
   <div class="stat"><b id="speedOut">0</b><span>TOP SPEED</span></div>
  </div>
  <button class="primary" id="again">RACE AGAIN</button>
  <button id="another">NEW TRACK</button>
 </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.min.js"></script>
<script>
"use strict";

/* ============================================================
   CORE CONSTANTS
============================================================ */
const THREE=window.THREE;
const TAU=Math.PI*2;
const SAMPLES=1400;
const TRACK_WIDTH=18;
const PLAYER_HEIGHT=1.0;
const MAX_SPEED=92;
const BOOST_MAX_SPEED=125;
const ACCEL=48;
const BRAKE=78;
const DRAG=7;
const STEER_RATE=2.9;
const CAMERA_DISTANCE=14;
const CAMERA_HEIGHT=6.5;

/* ============================================================
   DOM
============================================================ */
const el={
  timer:document.getElementById("timer"),
  best:document.getElementById("best"),
  name:document.getElementById("name"),
  progress:document.getElementById("progress"),
  speed:document.getElementById("speed"),
  checkpoint:document.getElementById("checkpoint"),
  bar:document.getElementById("barFill"),
  message:document.getElementById("message"),
  countdown:document.getElementById("countdown"),
  screen:document.getElementById("screen"),
  result:document.getElementById("result"),
  resultText:document.getElementById("resultText"),
  timeOut:document.getElementById("timeOut"),
  bestOut:document.getElementById("bestOut"),
  speedOut:document.getElementById("speedOut")
};

/* ============================================================
   RENDERER
============================================================ */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x88b9d5);
scene.fog=new THREE.Fog(0x88b9d5,170,950);

const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.05,1800);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const skyLight=new THREE.HemisphereLight(0xe7f8ff,0x41643a,1.65);
scene.add(skyLight);

const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(160,260,100);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-350;
sun.shadow.camera.right=350;
sun.shadow.camera.top=350;
sun.shadow.camera.bottom=-350;
scene.add(sun);

/* ============================================================
   STATE
============================================================ */
const game={
  seed:Math.random()*999999,
  points:[],
  trackLength:0,
  player:null,
  ghost:null,
  ghostFrames:[],
  ghostClock:0,
  boosts:[],
  ramps:[],
  checkpoints:[],
  scenery:[],
  roadObjects:[],
  time:0,
  best:null,
  running:false,
  paused:false,
  finished:false,
  countdown:3.5,
  checkpoint:0,
  progress:0,
  previousProgress:0,
  speed:0,
  topSpeed:0,
  yaw:0,
  yawRate:0,
  steer:0,
  steerTarget:0,
  verticalSpeed:0,
  airborne:false,
  nitro:100,
  cameraShake:0,
  messageTime:0,
  lastDt:.016,
  spawnT:.012,
  trackTitle:""
};

const keys={};
addEventListener("keydown",e=>{
  keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
  if(e.code==="KeyR")resetRace();
  if(e.code==="KeyP")togglePause();
  if(e.code==="Space"&&game.finished)resetRace();
});
addEventListener("keyup",e=>keys[e.code]=false);

document.getElementById("pause").onclick=togglePause;
document.getElementById("reset").onclick=resetRace;
document.getElementById("new").onclick=newTrack;
document.getElementById("again").onclick=resetRace;
document.getElementById("another").onclick=newTrack;

/* ============================================================
   UTILITY
============================================================ */
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function expLerp(a,b,k,dt){return lerp(a,b,1-Math.exp(-k*dt))}
function wrap(t){t%=1;if(t<0)t+=1;return t}
function angleWrap(a){while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a}
function nearT(a,b){let d=Math.abs(a-b);return Math.min(d,1-d)}
function fmt(t){let m=Math.floor(t/60),s=(t%60).toFixed(3).padStart(6,"0");return String(m).padStart(2,"0")+":"+s}
function hash(n){let x=Math.sin(n*127.1+game.seed*0.731)*43758.5453123;return x-Math.floor(x)}
function noise(t,scale=1){return Math.sin(t*12.9898+game.seed)*.5+.5}
function v3(x=0,y=0,z=0){return new THREE.Vector3(x,y,z)}
function forwardFromYaw(y){return v3(Math.sin(y),0,Math.cos(y))}
function rightFromYaw(y){return v3(Math.cos(y),0,-Math.sin(y))}

/* ============================================================
   TRACK CURVE
   A procedural ribbon is sampled into a closed path.  The
   geometry is deliberately designed around speed lines and
   stunt sections instead of conventional circuit racing.
============================================================ */
function generateTrack(){
  game.points=[];
  let x=0,z=0,y=0;
  let heading=0;

  const recipe=[
    [0.07,0.00,0.00],
    [0.06,0.55,0.00],
    [0.07,0.00,0.15],
    [0.08,-0.85,0.00],
    [0.07,0.20,0.80],
    [0.07,1.05,0.00],
    [0.06,-0.15,-0.70],
    [0.08,-1.15,0.00],
    [0.07,0.00,1.05],
    [0.08,0.72,0.00],
    [0.06,-0.25,-1.00],
    [0.08,0.00,0.00],
    [0.07,-0.78,0.00],
    [0.08,0.32,0.75]
  ];

  for(let i=0;i<=SAMPLES;i++){
    const t=i/SAMPLES;
    let acc=0;
    let seg=0;
    for(let j=0;j<recipe.length;j++){
      if(t>=acc&&t<=acc+recipe[j][0]){seg=j;break}
      acc+=recipe[j][0];
    }
    const r=recipe[seg];
    const local=clamp((t-acc)/r[0],0,1);

    const turn=Math.sin(local*Math.PI)*r[1];
    const bank=r[2];

    heading+=turn*.020;
    heading+=Math.sin(t*TAU*4.1+game.seed)*.0017;

    const distance=3.9;
    x+=Math.sin(heading)*distance;
    z+=Math.cos(heading)*distance;

    y=
      Math.sin(t*TAU*2.4+game.seed*.002)*3.4+
      Math.sin(t*TAU*6.7+game.seed*.004)*1.1;

    if(t<.05)y*=t/.05;
    if(t>.93)y*=(1-t)/.07;

    game.points.push({
      x,y,z,
      heading,
      bank
    });
  }

  const ox=game.points[0].x;
  const oz=game.points[0].z;
  for(const p of game.points){
    p.x-=ox;
    p.z-=oz;
  }

  const names=[
    "SKYLINE SPRINT",
    "NEON VALLEY",
    "CANYON KICK",
    "VERTIGO RUN",
    "SUNSET STRIKE",
    "RAPID RIDGE",
    "OVERDRIVE",
    "GRAVITY LOOP"
  ];
  game.trackTitle=names[Math.floor(hash(900)*names.length)];
}

function pointAt(t){
  t=wrap(t);
  const f=t*SAMPLES;
  const i=Math.floor(f);
  const a=game.points[i];
  const b=game.points[Math.min(i+1,SAMPLES)];
  const u=f-i;
  return v3(
    lerp(a.x,b.x,u),
    lerp(a.y,b.y,u),
    lerp(a.z,b.z,u)
  );
}

function tangentAt(t){
  const a=pointAt(t-.0018);
  const b=pointAt(t+.0018);
  return b.sub(a).normalize();
}

function sideAt(t){
  const d=tangentAt(t);
  return v3(d.z,0,-d.x).normalize();
}

function frameAt(t){
  return{
    point:pointAt(t),
    tangent:tangentAt(t),
    side:sideAt(t)
  };
}

function headingAt(t){
  const d=tangentAt(t);
  return Math.atan2(d.x,d.z);
}

/* ============================================================
   CLOSEST TRACK SEARCH
============================================================ */
function closestTrack(pos,guess=game.progress){
  let bestT=guess;
  let best=Infinity;

  for(let i=-90;i<=90;i++){
    const t=wrap(guess+i*.0017);
    const p=pointAt(t);
    const dx=pos.x-p.x;
    const dz=pos.z-p.z;
    const d=dx*dx+dz*dz;
    if(d<best){best=d;bestT=t}
  }

  for(let i=0;i<120;i++){
    const t=i/120;
    const p=pointAt(t);
    const dx=pos.x-p.x;
    const dz=pos.z-p.z;
    const d=dx*dx+dz*dz;
    if(d<best){best=d;bestT=t}
  }

  return bestT;
}

/* ============================================================
   WORLD CLEANUP
============================================================ */
function clearWorld(){
  while(scene.children.length){
    const obj=scene.children[scene.children.length-1];
    if(obj===skyLight||obj===sun)break;
    scene.remove(obj);
  }
  game.player=null;
  game.ghost=null;
  game.boosts=[];
  game.ramps=[];
  game.checkpoints=[];
  game.scenery=[];
  game.roadObjects=[];
}

/* ============================================================
   GROUND
============================================================ */
function createGround(){
  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(3000,3000),
    new THREE.MeshStandardMaterial({color:0x477b3e,roughness:1})
  );
  ground.rotation.x=-Math.PI/2;
  ground.position.y=-12;
  ground.receiveShadow=true;
  scene.add(ground);

  const patches=new THREE.Group();
  for(let i=0;i<100;i++){
    const r=20+hash(i*3)*70;
    const p=new THREE.Mesh(
      new THREE.CylinderGeometry(r,r,1,24),
      new THREE.MeshStandardMaterial({
        color:i%2?0x4b8040:0x527f43,
        roughness:1
      })
    );
    p.position.set(
      (hash(i*4)-.5)*1300,
      -11.5,
      (hash(i*5)-.5)*1300
    );
    patches.add(p);
  }
  scene.add(patches);
}

/* ============================================================
   ROAD RIBBON
============================================================ */
function makeQuad(a,b,c,d,material){
  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute([
    a.x,a.y,a.z,b.x,b.y,b.z,c.x,c.y,c.z,
    b.x,b.y,b.z,d.x,d.y,d.z,c.x,c.y,c.z
  ],3));
  geo.computeVertexNormals();
  const mesh=new THREE.Mesh(geo,material);
  mesh.receiveShadow=true;
  scene.add(mesh);
  game.roadObjects.push(mesh);
  return mesh;
}

function createRoad(){
  const roadMat=new THREE.MeshStandardMaterial({color:0x2b2f34,roughness:.84});
  const shoulderA=new THREE.MeshStandardMaterial({color:0xf6f6f6,roughness:.75});
  const shoulderB=new THREE.MeshStandardMaterial({color:0xff3444,roughness:.75});
  const stripeMat=new THREE.MeshBasicMaterial({color:0xffffff});

  for(let i=0;i<SAMPLES;i++){
    const t=i/SAMPLES;
    const t2=(i+1)/SAMPLES;
    const f1=frameAt(t);
    const f2=frameAt(t2);

    const half=TRACK_WIDTH/2;
    const a=f1.point.clone().addScaledVector(f1.side,-half);
    const b=f1.point.clone().addScaledVector(f1.side,half);
    const c=f2.point.clone().addScaledVector(f2.side,-half);
    const d=f2.point.clone().addScaledVector(f2.side,half);

    a.y+=.03;b.y+=.03;c.y+=.03;d.y+=.03;
    makeQuad(a,b,c,d,roadMat);

    if(i%3===0){
      const line=new THREE.Mesh(
        new THREE.BoxGeometry(.20,.035,3.5),
        stripeMat
      );
      line.position.copy(f1.point);
      line.position.y+=.08;
      line.rotation.y=headingAt(t);
      scene.add(line);
    }

    if(i%2===0){
      for(const s of [-1,1]){
        const curb=new THREE.Mesh(
          new THREE.BoxGeometry(1.0,.18,2.0),
          (i/2|0)%2===0?shoulderA:shoulderB
        );
        curb.position.copy(f1.point).addScaledVector(f1.side,s*(half+.55));
        curb.position.y+=.13;
        curb.rotation.y=headingAt(t);
        curb.receiveShadow=true;
        scene.add(curb);
      }
    }
  }

  /* Solid side rails are intentionally forgiving: they prevent
     falling without looking like a giant invisible wall. */
  for(let i=0;i<SAMPLES;i+=3){
    const t=i/SAMPLES;
    const f=frameAt(t);
    for(const s of [-1,1]){
      const rail=new THREE.Mesh(
        new THREE.BoxGeometry(.55,1.5,3.0),
        new THREE.MeshStandardMaterial({
          color:0x3e4952,
          roughness:.55
        })
      );
      rail.position.copy(f.point).addScaledVector(f.side,s*(TRACK_WIDTH/2+1.0));
      rail.position.y+=.72;
      rail.rotation.y=headingAt(t);
      scene.add(rail);
    }
  }
}

/* ============================================================
   START / FINISH ARCH
============================================================ */
function makeGate(t,color,finish=false){
  const g=new THREE.Group();
  const mat=new THREE.MeshStandardMaterial({
    color,
    emissive:color,
    emissiveIntensity:.75,
    metalness:.15
  });

  const w=TRACK_WIDTH+2;
  const h=9;

  for(const s of [-1,1]){
    const pole=new THREE.Mesh(new THREE.BoxGeometry(.65,h,.65),mat);
    pole.position.set(s*w/2,h/2,0);
    g.add(pole);
  }

  const top=new THREE.Mesh(new THREE.BoxGeometry(w,.7,.7),mat);
  top.position.y=h;
  g.add(top);

  const f=frameAt(t);
  g.position.copy(f.point);
  g.rotation.y=headingAt(t);
  scene.add(g);

  return g;
}

function createGates(){
  const ts=[.11,.21,.32,.43,.55,.66,.78,.89];
  for(let i=0;i<ts.length;i++){
    game.checkpoints.push({
      t:ts[i],
      gate:makeGate(ts[i],0xffd51f),
      passed:false
    });
  }
  game.finishGate=makeGate(.995,0xff3349,true);
}

/* ============================================================
   BOOST STRIPS
============================================================ */
function createBoost(t){
  const f=frameAt(t);
  const pad=new THREE.Mesh(
    new THREE.BoxGeometry(7.5,.09,5.5),
    new THREE.MeshStandardMaterial({
      color:0x15d5ff,
      emissive:0x009ec5,
      emissiveIntensity:2.5
    })
  );
  pad.position.copy(f.point);
  pad.position.y+=.13;
  pad.rotation.y=headingAt(t);
  scene.add(pad);

  const arrows=[];
  for(let i=-1;i<=1;i++){
    const a=new THREE.Mesh(
      new THREE.ConeGeometry(.35,.9,3),
      new THREE.MeshBasicMaterial({color:0xd9fbff})
    );
    a.rotation.x=Math.PI/2;
    a.position.set(i*2.1,.12,0);
    pad.add(a);
    arrows.push(a);
  }

  game.boosts.push({t,pad,cooldown:0});
}

function createBoosts(){
  [.075,.185,.295,.395,.505,.615,.735,.855,.945].forEach(createBoost);
}

/* ============================================================
   RAMPS / STUNT PIECES
============================================================ */
function createRamp(t,type=0){
  const f=frameAt(t);
  const ramp=new THREE.Mesh(
    new THREE.BoxGeometry(type?10:8,1.4,type?10:8),
    new THREE.MeshStandardMaterial({color:type?0xff8d16:0xf05a27,roughness:.62})
  );
  ramp.position.copy(f.point);
  ramp.position.y+=.62;
  ramp.rotation.y=headingAt(t);
  ramp.rotation.x=-.16;
  scene.add(ramp);

  const stripeMat=new THREE.MeshBasicMaterial({color:0xffffcc});
  for(let i=-2;i<=2;i++){
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(.22,1.5,7.8),stripeMat);
    stripe.position.set(i*1.4,.2,0);
    stripe.rotation.z=.15;
    ramp.add(stripe);
  }

  game.ramps.push({
    t,
    ramp,
    strength:type?1.3:1
  });
}

function createRamps(){
  createRamp(.145,0);
  createRamp(.365,1);
  createRamp(.585,0);
  createRamp(.815,1);
}

/* ============================================================
   SCENERY
============================================================ */
function makeTree(){
  const g=new THREE.Group();

  const trunk=new THREE.Mesh(
    new THREE.CylinderGeometry(.35,.55,4.5,8),
    new THREE.MeshStandardMaterial({color:0x70462a})
  );
  trunk.position.y=2.25;

  const crown=new THREE.Mesh(
    new THREE.ConeGeometry(3.2,7.0,8),
    new THREE.MeshStandardMaterial({color:0x23663b,roughness:1})
  );
  crown.position.y=7;

  g.add(trunk,crown);
  return g;
}

function createScenery(){
  for(let i=0;i<230;i++){
    const t=hash(i*2.4);
    const f=frameAt(t);
    const side=hash(i*7.7)>0.5?1:-1;
    const distance=30+hash(i*4.7)*150;
    const p=f.point.clone().addScaledVector(f.side,side*distance);
    p.y=-2;

    const tree=makeTree();
    const scale=.6+hash(i*9.3)*1.4;
    tree.scale.setScalar(scale);
    tree.position.copy(p);
    tree.rotation.y=hash(i*3.3)*TAU;
    scene.add(tree);
    game.scenery.push(tree);
  }

  /* far towers / rocks */
  for(let i=0;i<50;i++){
    const rock=new THREE.Mesh(
      new THREE.DodecahedronGeometry(5+hash(i*8)*12,1),
      new THREE.MeshStandardMaterial({color:0x687978,roughness:1})
    );
    rock.position.set(
      (hash(i*4)-.5)*900,
      -4,
      (hash(i*6)-.5)*900
    );
    scene.add(rock);
  }
}

/* ============================================================
   CAR CONSTRUCTION
============================================================ */
function wheelAssembly(){
  const steering=new THREE.Group();

  const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(.57,.57,.38,20),
    new THREE.MeshStandardMaterial({color:0x0a0b0d,roughness:.92})
  );
  tire.rotation.z=Math.PI/2;

  const hub=new THREE.Mesh(
    new THREE.CylinderGeometry(.21,.21,.42,16),
    new THREE.MeshStandardMaterial({
      color:0xb9c3ca,
      metalness:.8,
      roughness:.25
    })
  );
  hub.rotation.z=Math.PI/2;

  steering.add(tire,hub);
  return {steering,tire};
}

function createCar(color=0xf22c3c){
  const car=new THREE.Group();

  const paint=new THREE.MeshStandardMaterial({
    color,
    metalness:.3,
    roughness:.3
  });
  const black=new THREE.MeshStandardMaterial({
    color:0x11151a,
    metalness:.15,
    roughness:.28
  });
  const carbon=new THREE.MeshStandardMaterial({
    color:0x07090c,
    roughness:.72
  });

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(3.2,.62,6.1),
    paint
  );
  body.position.y=1.18;
  body.castShadow=true;
  car.add(body);

  const nose=new THREE.Mesh(
    new THREE.BoxGeometry(2.1,.36,3.2),
    paint
  );
  nose.position.set(0,1.04,4.25);
  car.add(nose);

  const cockpit=new THREE.Mesh(
    new THREE.SphereGeometry(1.15,20,12),
    black
  );
  cockpit.scale.set(.9,.42,1.2);
  cockpit.position.set(0,1.58,.45);
  car.add(cockpit);

  const driver=new THREE.Mesh(
    new THREE.SphereGeometry(.42,16,12),
    new THREE.MeshStandardMaterial({color:0xffffff})
  );
  driver.position.set(0,1.97,.25);
  car.add(driver);

  const frontWing=new THREE.Mesh(
    new THREE.BoxGeometry(4.3,.16,.45),
    carbon
  );
  frontWing.position.set(0,.84,6.0);
  car.add(frontWing);

  const rearWing=new THREE.Mesh(
    new THREE.BoxGeometry(4.15,.22,.5),
    carbon
  );
  rearWing.position.set(0,2.05,-2.6);
  car.add(rearWing);

  const sidePod=new THREE.BoxGeometry(.62,.56,2.7);
  for(const s of [-1,1]){
    const pod=new THREE.Mesh(sidePod,paint);
    pod.position.set(s*1.5,1.14,.05);
    car.add(pod);
  }

  const wheels=[];
  const pos=[
    [-1.62,.71,3.5],
    [1.62,.71,3.5],
    [-1.62,.71,-2.2],
    [1.62,.71,-2.2]
  ];

  pos.forEach((p,i)=>{
    const w=wheelAssembly();
    w.steering.position.set(p[0],p[1],p[2]);
    car.add(w.steering);
    wheels.push({group:w.steering,tire:w.tire,front:i<2});
  });

  car.userData.wheels=wheels;

  const lightMat=new THREE.MeshStandardMaterial({
    color:0xff1728,
    emissive:0xff0010,
    emissiveIntensity:1.7
  });

  for(const s of [-1,1]){
    const light=new THREE.Mesh(
      new THREE.BoxGeometry(.65,.18,.12),
      lightMat
    );
    light.position.set(s*.9,1.25,-3.12);
    car.add(light);
  }

  const stripe=new THREE.Mesh(
    new THREE.BoxGeometry(.35,.025,3.2),
    new THREE.MeshBasicMaterial({color:0xffffff})
  );
  stripe.position.set(0,1.51,.25);
  car.add(stripe);

  return car;
}

/* ============================================================
   PLAYER SETUP
============================================================ */
function createPlayer(){
  game.player=createCar(0xf12535);
  scene.add(game.player);

  const p=pointAt(game.spawnT);
  game.player.position.copy(p);
  game.player.position.y+=PLAYER_HEIGHT;
  game.yaw=headingAt(game.spawnT);
  game.player.rotation.y=game.yaw;
}

/* ============================================================
   TRACK BOUNDARY
============================================================ */
function constrainPlayer(){
  const t=closestTrack(game.player.position,game.progress);
  const f=frameAt(t);

  const relative=game.player.position.clone().sub(f.point);
  const lateral=relative.dot(f.side);

  const safe=TRACK_WIDTH/2-1.25;

  if(Math.abs(lateral)>safe){
    const excess=Math.abs(lateral)-safe;

    game.player.position.addScaledVector(
      f.side,
      -Math.sign(lateral)*excess
    );

    game.speed*=.985;
    game.yawRate+=-Math.sign(lateral)*.55;
    game.cameraShake=Math.max(game.cameraShake,.045);
  }

  if(!game.airborne){
    game.player.position.y=expLerp(
      game.player.position.y,
      f.point.y+PLAYER_HEIGHT,
      12,
      game.lastDt
    );
  }

  game.progress=t;
}

/* ============================================================
   PLAYER PHYSICS
============================================================ */
function updatePlayer(dt){
  if(!game.running||game.paused||game.finished)return;

  const accelerate=keys.KeyW||keys.ArrowUp;
  const brake=keys.KeyS||keys.ArrowDown;
  const left=keys.KeyA||keys.ArrowLeft;
  const right=keys.KeyD||keys.ArrowRight;
  const boosting=keys.ShiftLeft||keys.ShiftRight;

  if(game.countdown>0)return;

  if(accelerate)game.speed+=ACCEL*dt;
  else game.speed-=DRAG*dt;

  if(brake)game.speed-=BRAKE*dt;

  let boost=false;
  if(boosting&&game.nitro>0&&game.speed>30){
    boost=true;
    game.nitro=clamp(game.nitro-30*dt,0,100);
    game.speed+=45*dt;
  }else{
    game.nitro=clamp(game.nitro+5.5*dt,0,100);
  }

  const cap=boost?BOOST_MAX_SPEED:MAX_SPEED;
  game.speed=clamp(game.speed,0,cap);

  if(left)game.steerTarget=-1;
  else if(right)game.steerTarget=1;
  else game.steerTarget=0;

  game.steer=expLerp(
    game.steer,
    game.steerTarget,
    11,
    dt
  );

  const speedRatio=clamp(game.speed/MAX_SPEED,0,1.35);
  const steeringStrength=
    STEER_RATE*
    (0.15+speedRatio*.95);

  const desiredRate=
    game.steer*
    steeringStrength;

  game.yawRate=expLerp(
    game.yawRate,
    desiredRate,
    6.0,
    dt
  );

  game.yaw+=game.yawRate*dt;
  game.player.rotation.y=game.yaw;

  const forward=forwardFromYaw(game.yaw);
  game.player.position.addScaledVector(
    forward,
    game.speed*dt
  );

  if(game.airborne){
    game.verticalSpeed-=34*dt;
    game.player.position.y+=game.verticalSpeed*dt;

    const t=closestTrack(game.player.position,game.progress);
    const floor=pointAt(t).y+PLAYER_HEIGHT;

    if(game.player.position.y<=floor){
      game.player.position.y=floor;
      game.airborne=false;
      game.verticalSpeed=0;
      game.cameraShake=.15;
      showMessage("LAND!");
    }
  }

  constrainPlayer();
  updateBoosts();
  updateRamps();
  updateCheckpoints();

  for(const w of game.player.userData.wheels){
    if(w.front)w.group.rotation.y=game.steer*.48;
    w.tire.rotation.x-=game.speed*dt*.55;
  }

  game.topSpeed=Math.max(game.topSpeed,game.speed);

  /* Ghost recording is time-indexed so replay remains smooth. */
  if(Math.floor(game.time*40)!==Math.floor((game.time-dt)*40)){
    game.ghostFrames.push({
      x:game.player.position.x,
      y:game.player.position.y,
      z:game.player.position.z,
      r:game.yaw
    });
  }
}

/* ============================================================
   BOOSTS
============================================================ */
function updateBoosts(){
  for(const b of game.boosts){
    if(b.cooldown>0)b.cooldown-=game.lastDt;

    if(b.cooldown<=0&&nearT(game.progress,b.t)<.009){
      b.cooldown=1.0;
      game.speed=Math.min(game.speed+35,BOOST_MAX_SPEED);
      game.nitro=Math.min(100,game.nitro+12);
      game.cameraShake=.08;
      showMessage("BOOST");
    }
  }
}

/* ============================================================
   RAMPS
============================================================ */
function updateRamps(){
  if(game.airborne)return;

  for(const r of game.ramps){
    if(nearT(game.progress,r.t)<.008&&game.speed>42){
      game.airborne=true;
      game.verticalSpeed=13+game.speed*.075*r.strength;
      game.cameraShake=.06;
      showMessage("AIR");
      break;
    }
  }
}

/* ============================================================
   CHECKPOINTS
============================================================ */
function updateCheckpoints(){
  if(game.checkpoint<game.checkpoints.length){
    const c=game.checkpoints[game.checkpoint];

    if(nearT(game.progress,c.t)<.010){
      c.passed=true;
      c.gate.children.forEach(x=>{
        if(x.material)x.material.emissiveIntensity=.1;
      });

      game.checkpoint++;
      showMessage("CHECKPOINT "+game.checkpoint);
    }
  }else if(nearT(game.progress,.995)<.010){
    finishRace();
  }
}

/* ============================================================
   CAMERA
============================================================ */
const cameraLook=new THREE.Vector3();

function updateCamera(dt){
  if(!game.player)return;

  const forward=forwardFromYaw(game.yaw);
  const side=rightFromYaw(game.yaw);

  const speedRatio=clamp(game.speed/MAX_SPEED,0,1.25);

  const desired=game.player.position.clone()
    .addScaledVector(forward,-CAMERA_DISTANCE-4*speedRatio)
    .addScaledVector(side,-game.steer*.8);

  desired.y+=CAMERA_HEIGHT+speedRatio*1.8;

  camera.position.lerp(
    desired,
    1-Math.exp(-7*dt)
  );

  /* Absolute world-up is what prevents upside-down cameras. */
  camera.up.set(0,1,0);

  cameraLook.copy(game.player.position)
    .addScaledVector(forward,11+speedRatio*8);
  cameraLook.y+=1;

  camera.lookAt(cameraLook);

  camera.fov=expLerp(
    camera.fov,
    69+speedRatio*10,
    4,
    dt
  );
  camera.updateProjectionMatrix();

  if(game.cameraShake>0){
    camera.position.x+=(Math.random()-.5)*game.cameraShake;
    camera.position.y+=(Math.random()-.5)*game.cameraShake;
    game.cameraShake=Math.max(0,game.cameraShake-dt*.8);
  }
}

/* ============================================================
   GHOST SAVE / LOAD
============================================================ */
function saveGhost(){
  try{
    localStorage.setItem(
      "trackRushGhost",
      JSON.stringify(game.ghostFrames)
    );

    const old=JSON.parse(
      localStorage.getItem("trackRushBest")||"null"
    );

    if(!old||game.time<old.time){
      const record={
        time:game.time,
        speed:game.topSpeed
      };
      localStorage.setItem(
        "trackRushBest",
        JSON.stringify(record)
      );
      game.best=record;
    }
  }catch(e){}
}

function loadGhost(){
  try{
    game.ghostFrames=JSON.parse(
      localStorage.getItem("trackRushGhost")||"[]"
    );
    game.best=JSON.parse(
      localStorage.getItem("trackRushBest")||"null"
    );
  }catch(e){
    game.ghostFrames=[];
    game.best=null;
  }
}

function createGhostMesh(){
  if(game.ghostFrames.length<2)return;

  const ghost=new THREE.Group();

  const body=new THREE.Mesh(
    new THREE.BoxGeometry(3.2,.62,6.1),
    new THREE.MeshBasicMaterial({
      color:0x3edcff,
      transparent:true,
      opacity:.20
    })
  );
  body.position.y=1.18;
  ghost.add(body);

  const nose=new THREE.Mesh(
    new THREE.BoxGeometry(2.1,.35,3.0),
    new THREE.MeshBasicMaterial({
      color:0x9af4ff,
      transparent:true,
      opacity:.14
    })
  );
  nose.position.set(0,1.02,4.2);
  ghost.add(nose);

  scene.add(ghost);
  game.ghost=ghost;
}

function updateGhost(dt){
  if(!game.ghost||game.ghostFrames.length<2)return;

  game.ghostClock+=dt;
  const frame=game.ghostClock*40;
  const i=Math.floor(frame);

  if(i>=game.ghostFrames.length){
    game.ghost.visible=false;
    return;
  }

  const a=game.ghostFrames[i];
  const b=game.ghostFrames[Math.min(i+1,game.ghostFrames.length-1)];
  const u=frame-i;

  game.ghost.visible=true;

  game.ghost.position.set(
    lerp(a.x,b.x,u),
    lerp(a.y,b.y,u),
    lerp(a.z,b.z,u)
  );

  game.ghost.rotation.y=a.r;
}

/* ============================================================
   HUD
============================================================ */
function updateHUD(){
  el.timer.textContent=fmt(game.time);
  el.best.textContent="BEST "+(game.best?fmt(game.best.time):"--");
  el.name.textContent="TRACK RUSH • "+game.trackTitle;
  el.progress.textContent=
    "CHECKPOINT "+game.checkpoint+" / "+game.checkpoints.length;
  el.speed.innerHTML=
    Math.round(game.speed*3.6)+" <small>KM/H</small>";
  el.bar.style.width=game.nitro+"%";

  if(game.checkpoint<game.checkpoints.length){
    el.checkpoint.textContent="NEXT CHECKPOINT";
  }else{
    el.checkpoint.textContent="FINISH";
  }

  if(game.messageTime>0){
    game.messageTime-=game.lastDt;
    if(game.messageTime<=0)el.message.style.opacity=0;
  }
}

function showMessage(text){
  el.message.textContent=text;
  el.message.style.opacity=1;
  game.messageTime=.75;
}

/* ============================================================
   COUNTDOWN
============================================================ */
function updateCountdown(dt){
  if(!game.running||game.paused||game.finished)return;

  if(game.countdown>0){
    game.countdown-=dt;

    if(game.countdown>2.5){
      el.countdown.textContent="3";
    }else if(game.countdown>1.5){
      el.countdown.textContent="2";
    }else if(game.countdown>.5){
      el.countdown.textContent="1";
    }else if(game.countdown>0){
      el.countdown.textContent="GO!";
    }else{
      el.countdown.textContent="";
    }
  }
}

/* ============================================================
   FINISH
============================================================ */
function finishRace(){
  if(game.finished)return;

  game.finished=true;
  game.running=false;

  saveGhost();

  const isBest=game.best&&Math.abs(game.best.time-game.time)<.0001;

  el.result.textContent=isBest?"NEW BEST!":"FINISH!";
  el.resultText.textContent=
    isBest?
    "You set the fastest time on this track.":
    "Run it again and chase the ghost.";

  el.timeOut.textContent=fmt(game.time);
  el.bestOut.textContent=game.best?fmt(game.best.time):"--";
  el.speedOut.textContent=Math.round(game.topSpeed*3.6);

  el.screen.style.display="flex";
}

/* ============================================================
   RESET RACE
============================================================ */
function resetRace(){
  el.screen.style.display="none";

  if(game.ghost){
    scene.remove(game.ghost);
    game.ghost=null;
  }

  loadGhost();
  createGhostMesh();

  game.running=true;
  game.paused=false;
  game.finished=false;
  game.countdown=3.5;
  game.time=0;
  game.checkpoint=0;
  game.speed=0;
  game.topSpeed=0;
  game.nitro=100;
  game.airborne=false;
  game.verticalSpeed=0;
  game.yawRate=0;
  game.steer=0;
  game.steerTarget=0;
  game.progress=game.spawnT;
  game.previousProgress=game.spawnT;
  game.ghostClock=0;
  game.ghostFrames=[];

  for(const c of game.checkpoints){
    c.passed=false;
    c.gate.children.forEach(x=>{
      if(x.material)x.material.emissiveIntensity=.75;
    });
  }

  const p=pointAt(game.spawnT);
  game.player.position.copy(p);
  game.player.position.y+=PLAYER_HEIGHT;
  game.yaw=headingAt(game.spawnT);
  game.player.rotation.y=game.yaw;

  el.countdown.textContent="3";
}

function togglePause(){
  if(game.finished)return;
  game.paused=!game.paused;
  document.getElementById("pause").textContent=
    game.paused?"RESUME":"PAUSE";
}

  clearWorld();

/* ============================================================
   MAIN LOOP
============================================================ */
const clock=new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);

  let dt=clock.getDelta();
  dt=clamp(dt,0,.035);
  game.lastDt=dt;

  if(!game.paused&&!game.finished){
    updateCountdown(dt);

    if(game.countdown<=0&&game.running){
      game.time+=dt;
      updatePlayer(dt);
      updateGhost(dt);
    }
  }

  updateCamera(dt);
  updateHUD();

  renderer.render(scene,camera);
}

newTrack();

/* ============================================================
   EXTENDED TRACK DESIGN HELPERS
   The following functions form the reusable track toolkit.
   They are kept separate so the generator can be expanded
   without rewriting the driving model.
============================================================ */

function trackDistanceAt(t){
  const a=pointAt(t-.0005);
  const b=pointAt(t+.0005);
  return a.distanceTo(b)*1000;
}

function trackHeightAt(t){
  return pointAt(t).y;
}

function trackDirectionAt(t){
  return headingAt(t);
}

function trackWidthAt(t){
  return TRACK_WIDTH;
}

function trackSideAt(t){
  return sideAt(t);
}

function trackNormalAt(t){
  const tangent=tangentAt(t);
  const side=sideAt(t);
  return new THREE.Vector3(
    side.y*tangent.z-side.z*tangent.y,
    side.z*tangent.x-side.x*tangent.z,
    side.x*tangent.y-side.y*tangent.x
  ).normalize();
}

function signedTrackOffset(position,t){
  const f=frameAt(t);
  return position.clone().sub(f.point).dot(f.side);
}

function safeTrackPosition(position,t){
  const f=frameAt(t);
  const offset=signedTrackOffset(position,t);
  const limit=TRACK_WIDTH*.5-1.25;
  if(Math.abs(offset)<=limit)return position.clone();
  return position.clone().addScaledVector(
    f.side,
    -Math.sign(offset)*(Math.abs(offset)-limit)
  );
}

function isInsideTrack(position,t){
  return Math.abs(signedTrackOffset(position,t))<=TRACK_WIDTH*.5;
}

function trackForward(t){
  return tangentAt(t);
}

function trackRight(t){
  return sideAt(t);
}

function trackCenter(t){
  return pointAt(t);
}

function trackSampleCount(){
  return SAMPLES;
}

function trackStartPoint(){
  return pointAt(game.spawnT);
}

function trackFinishPoint(){
  return pointAt(.995);
}

function trackCheckpointCount(){
  return game.checkpoints.length;
}

function checkpointAt(index){
  if(index<0||index>=game.checkpoints.length)return null;
  return game.checkpoints[index];
}

function checkpointProgress(index){
  const c=checkpointAt(index);
  return c?c.t:null;
}

function distanceToCheckpoint(index){
  const c=checkpointAt(index);
  if(!c||!game.player)return Infinity;
  return game.player.position.distanceTo(pointAt(c.t));
}

function distanceToFinish(){
  if(!game.player)return Infinity;
  return game.player.position.distanceTo(trackFinishPoint());
}

function playerProgress01(){
  return game.progress;
}

function playerSpeedMS(){
  return game.speed;
}

function playerSpeedKPH(){
  return game.speed*3.6;
}

function playerNitro(){
  return game.nitro;
}

function playerIsAirborne(){
  return game.airborne;
}

function playerYaw(){
  return game.yaw;
}

function playerSteer(){
  return game.steer;
}

function playerPosition(){
  return game.player?game.player.position.clone():new THREE.Vector3();
}

function playerForward(){
  return forwardFromYaw(game.yaw);
}

function playerRight(){
  return rightFromYaw(game.yaw);
}

function playerTrackOffset(){
  if(!game.player)return 0;
  return signedTrackOffset(game.player.position,game.progress);
}

function resetPlayerToTrack(){
  if(!game.player)return;
  const p=pointAt(game.progress);
  game.player.position.copy(p);
  game.player.position.y+=PLAYER_HEIGHT;
  game.yaw=headingAt(game.progress);
  game.player.rotation.y=game.yaw;
  game.airborne=false;
  game.verticalSpeed=0;
}

function resetPlayerToCheckpoint(){
  let t=game.spawnT;
  if(game.checkpoint>0){
    t=game.checkpoints[
      Math.min(game.checkpoint-1,game.checkpoints.length-1)
    ].t;
  }
  game.progress=t;
  resetPlayerToTrack();
  game.speed=0;
}

function nextCheckpointT(){
  if(game.checkpoint>=game.checkpoints.length)return .995;
  return game.checkpoints[game.checkpoint].t;
}

function nextCheckpointPoint(){
  return pointAt(nextCheckpointT());
}

function passedAllCheckpoints(){
  return game.checkpoint>=game.checkpoints.length;
}

function progressDifference(a,b){
  let d=a-b;
  if(d<-.5)d+=1;
  if(d>.5)d-=1;
  return d;
}

function forwardProgressDelta(current,previous){
  let d=current-previous;
  if(d<-.5)d+=1;
  return d;
}

function hasMadeForwardProgress(){
  return forwardProgressDelta(
    game.progress,
    game.previousProgress
  )>=0;
}

function updateProgressMemory(){
  game.previousProgress=game.progress;
}

function detectWrongWay(){
  const forward=playerForward();
  const tangent=trackForward(game.progress);
  return forward.dot(tangent)<-.2;
}

function wrongWayMessage(){
  if(detectWrongWay()){
    showMessage("WRONG WAY");
  }
}

function currentTrackFrame(){
  return frameAt(game.progress);
}

function currentTrackTangent(){
  return tangentAt(game.progress);
}

function currentTrackSide(){
  return sideAt(game.progress);
}

function currentTrackPoint(){
  return pointAt(game.progress);
}

function trackCurvature(t){
  const a=tangentAt(t-.01);
  const b=tangentAt(t+.01);
  return angleWrap(Math.atan2(b.x,b.z)-Math.atan2(a.x,a.z));
}

function trackCurvatureMagnitude(t){
  return Math.abs(trackCurvature(t));
}

function isSharpCorner(t){
  return trackCurvatureMagnitude(t)>.35;
}

function isMediumCorner(t){
  const c=trackCurvatureMagnitude(t);
  return c>.16&&c<=.35;
}

function isStraight(t){
  return trackCurvatureMagnitude(t)<.08;
}

function lookAheadCurvature(t,d=.04){
  let total=0;
  for(let i=0;i<8;i++){
    total+=trackCurvatureMagnitude(wrap(t+i*d/8));
  }
  return total/8;
}

function brakingRecommendation(){
  const c=lookAheadCurvature(game.progress,.06);
  if(c>.38)return "BRAKE HARD";
  if(c>.22)return "BRAKE";
  if(c>.13)return "LIFT";
  return "FULL";
}

function optimalThrottle(){
  const recommendation=brakingRecommendation();
  if(recommendation==="BRAKE HARD")return 0;
  if(recommendation==="BRAKE")return .25;

    const b=game.points[i];
    total+=Math.hypot(
      b.x-a.x,

      b.z-a.z
    );
  }

}

function trackBoundaryLimit(){
  return TRACK_WIDTH/2-1.25;

function playerWithinBoundary(){

function boundaryCorrection(){
  if(!game.player)return new THREE.Vector3();
  const t=closestTrack(game.player.position,game.progress);
  const f=frameAt(t);
  const offset=signedTrackOffset(game.player.position,t);
  const limit=trackBoundaryLimit();
  if(Math.abs(offset)<=limit)return new THREE.Vector3();
  return f.side.clone().multiplyScalar(
    -Math.sign(offset)*(Math.abs(offset)-limit)
  );
}

function applyBoundaryCorrection(){
  const c=boundaryCorrection();
  if(c.lengthSq()>0)game.player.position.add(c);
}

function trackRailOffset(){

      10,

}

  if(!game.ghostFrames.length)return null;
  const index=clamp(

  );
  return game.ghostFrames[index];
}

}

function ghostSpeedEstimate(t){
  const a=ghostAtTime(Math.max(0,t-.05));
  const b=ghostAtTime(t+.05);
  if(!a||!b)return 0;
  return Math.hypot(
    b.x-a.x,
    b.z-a.z
  )/.1;
}

function ghostAhead(){
  if(!game.ghostFrames.length)return false;
  const g=ghostPositionAtTime(game.time);
  if(!g||!game.player)return false;
  return distanceToTrackStart(g)<distanceToTrackStart(game.player.position);
}

function distanceToTrackStart(p){
  return horizontalDistance(p,trackStartPoint());
}

function ghostTimeDelta(){
  if(!game.ghostFrames.length)return null;
  return game.time-ghostDuration();
}

function ghostStatus(){
  return{
    available:ghostHasFrames(),
    duration:ghostDuration(),
    elapsed:game.ghostClock,
    finished:ghostFinished()
  };
}

function replayReady(){
  return ghostHasFrames();
}

function restartGhost(){
  resetGhostClock();
}

function pauseGhost(){
  /* Ghost is synchronized with race state, so no separate action is needed. */
}

function resumeGhost(){
  /* Ghost is synchronized with race state, so no separate action is needed. */
}

function ghostVisible(){
  return !!game.ghost&&game.ghost.visible;
}

function ghostOpacity(){
  return .2;
}

function setGhostOpacity(value){
  if(!game.ghost)return;
  game.ghost.traverse(o=>{
    if(o.material&&"opacity" in o.material){
      o.material.opacity=value;
    }
  });
}

function pulseGate(gate){
  if(!gate)return;
  gate.scale.setScalar(1.15);
  setTimeout(()=>{
    if(gate)gate.scale.setScalar(1);
  },120);
}

function pulseCheckpoint(index){
  pulseGate(checkpointGate(index));
}

function pulseFinish(){
  pulseGate(game.finishGate);
}
