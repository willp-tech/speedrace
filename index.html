<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1.0"> <title>HyperTrack</title> <style> *{box-sizing:border-box} html,body{ margin:0; width:100%; height:100%; overflow:hidden; background:#05070a; font-family:Arial,Helvetica,sans-serif; color:white; } #game{ position:fixed; inset:0; } canvas{ display:block; width:100%; height:100%; } #hud{ position:fixed; inset:0; pointer-events:none; user-select:none; } .top{ position:absolute; top:18px; left:18px; right:18px; display:flex; justify-content:space-between; align-items:flex-start; } .panel{ background:rgba(5,8,13,.72); border:1px solid rgba(255,255,255,.15); box-shadow:0 8px 30px rgba(0,0,0,.35); backdrop-filter:blur(7px); border-radius:10px; } #raceInfo{ padding:12px 16px; min-width:210px; } #trackName{ font-size:13px; letter-spacing:2px; opacity:.7; margin-bottom:5px; } #position{ font-size:34px; font-weight:900; line-height:1; } #position small{ font-size:14px; opacity:.6; } #timeBox{ padding:12px 18px; text-align:right; min-width:180px; } #time{ font-size:25px; font-weight:bold; font-variant-numeric:tabular-nums; } #best{ margin-top:3px; opacity:.6; font-size:12px; } #speedBox{ position:absolute; left:20px; bottom:20px; padding:14px 18px; min-width:220px; } #speed{ font-size:44px; font-weight:900; line-height:.9; font-variant-numeric:tabular-nums; } #speedUnit{ font-size:11px; opacity:.55; letter-spacing:2px; } #gear{ position:absolute; right:22px; bottom:22px; width:90px; height:90px; display:flex; align-items:center; justify-content:center; font-size:42px; font-weight:900; } #controls{ position:absolute; bottom:18px; left:50%; transform:translateX(-50%); padding:8px 14px; font-size:11px; color:rgba(255,255,255,.68); letter-spacing:.3px; } #countdown{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:120px; font-weight:1000; font-style:italic; text-shadow:0 8px 30px rgba(0,0,0,.7); } #message{ position:absolute; left:50%; top:37%; transform:translate(-50%,-50%); text-align:center; font-size:42px; font-weight:900; text-shadow:0 5px 25px #000; } #message small{ display:block; font-size:14px; opacity:.7; margin-top:8px; letter-spacing:2px; } #minimap{ position:absolute; top:110px; right:18px; width:190px; height:145px; border-radius:9px; background:rgba(3,5,8,.68); border:1px solid rgba(255,255,255,.13); overflow:hidden; } #minimap canvas{ width:100%; height:100%; } #speedLines{ position:absolute; inset:0; pointer-events:none; opacity:0; background: linear-gradient(90deg,transparent 0%,rgba(255,255,255,.07) 50%,transparent 100%); mix-blend-mode:screen; } #flash{ position:absolute; inset:0; background:white; opacity:0; } </style> </head> <body> <div id="game"></div> <div id="hud"> <div class="top"> <div id="raceInfo" class="panel"> <div id="trackName">HYPERTRACK // CIRCUIT 01</div> <div id="position">1<small> / 11</small></div> </div> <div id="timeBox" class="panel"> <div id="time">00:00.000</div> <div id="best">BEST --:--.---</div> </div> </div> <div id="minimap"> <canvas id="mapCanvas" width="380" height="290"></canvas> </div> <div id="countdown">3</div> <div id="message"></div> <div id="speedBox" class="panel"> <div id="speed">0</div> <div id="speedUnit">KM/H</div> </div> <div id="gear" class="panel">N</div> <div id="controls" class="panel"> W / ↑ THROTTLE &nbsp;&nbsp; A / ← LEFT &nbsp;&nbsp; D / → RIGHT &nbsp;&nbsp; S / ↓ BRAKE &nbsp;&nbsp; SPACE HANDBRAKE &nbsp;&nbsp; R RESET &nbsp;&nbsp; N NEXT TRACK </div> <div id="speedLines"></div> <div id="flash"></div> </div> <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script> <script> "use strict"; /* ========================================================= BASIC SETUP ========================================================= */ const scene = new THREE.Scene(); scene.background = new THREE.Color(0x86b9df); scene.fog = new THREE.Fog(0x86b9df, 500, 4200); const camera = new THREE.PerspectiveCamera( 78, innerWidth / innerHeight, 0.05, 6000 ); const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:"high-performance" }); renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,1.7)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; document.getElementById("game").appendChild(renderer.domElement); /* ========================================================= LIGHTING ========================================================= */ const hemi = new THREE.HemisphereLight( 0xdcefff, 0x31402d, 2.0 ); scene.add(hemi); const sun = new THREE.DirectionalLight(0xffffff,3.0); sun.position.set(-500,800,-600); sun.castShadow = true; sun.shadow.mapSize.width = 2048; sun.shadow.mapSize.height = 2048; sun.shadow.camera.left = -1000; sun.shadow.camera.right = 1000; sun.shadow.camera.top = 1000; sun.shadow.camera.bottom = -1000; sun.shadow.camera.near = 1; sun.shadow.camera.far = 3000; scene.add(sun); /* ========================================================= CONSTANTS ========================================================= */ const ROAD_WIDTH = 40; const CURB_WIDTH = 3.5; const ROAD_HEIGHT = 2.0; const TRACK_SAMPLES = 900; const MAX_SPEED = 172; const REVERSE_SPEED = 28; const PLAYER_RADIUS = 2.25; const AI_COUNT = 10; const TOTAL_CARS = AI_COUNT + 1; const TOTAL_LAPS = 2; const clock = new THREE.Clock(); let raceStarted = false; let raceFinished = false; let countdown = 3; let countdownTimer = 0; let raceTime = 0; let currentTrack = 0; const keys = {}; window.addEventListener("keydown",e=>{ keys[e.code] = true; initAudio(); if( [ "ArrowUp","ArrowDown","ArrowLeft","ArrowRight", "Space" ].includes(e.code) ){ e.preventDefault(); } if(e.code === "KeyR"){ resetRace(); } if(e.code === "KeyN"){ nextTrack(); } }); window.addEventListener("keyup",e=>{ keys[e.code] = false; }); window.addEventListener("pointerdown",()=>{ initAudio(); }); /* ========================================================= MATERIALS ========================================================= */ function mat(color,roughness=.65,metalness=.05){ return new THREE.MeshStandardMaterial({ color, roughness, metalness }); } const roadMat = mat(0x666a6e,.94,.02); const roadDarkMat = mat(0x505458,.97,.01); const grassMat = mat(0x4d713d,1); const curbRed = mat(0xd62f35,.7); const curbWhite = mat(0xf1f1e8,.7); const barrierMat = mat(0xd8dce0,.55,.25); const blackMat = mat(0x090a0c,.35,.55); const glassMat = new THREE.MeshStandardMaterial({ color:0x07121b, roughness:.1, metalness:.65, transparent:true, opacity:.85 }); /* ========================================================= GROUND ========================================================= */ const ground = new THREE.Mesh( new THREE.PlaneGeometry(8000,8000), grassMat ); ground.rotation.x = -Math.PI/2; ground.position.y = -0.22; ground.receiveShadow = true; scene.add(ground); /* ========================================================= TRACK DATA ========================================================= */ const tracks = [ { name:"HYPERTRACK // HARBOR HAIRPIN", points:[[0,-720],[360,-720],[650,-610],[820,-380],[820,-80],[700,120],[470,220],[220,190],[70,60],[40,-100],[-80,-210],[-300,-180],[-470,-60],[-650,80],[-820,40],[-900,-160],[-860,-400],[-680,-590],[-360,-700]] }, { name:"HYPERTRACK // CANYON SWITCHBACK", points:[[0,-820],[300,-760],[560,-620],[650,-420],[560,-260],[330,-220],[120,-300],[-40,-180],[70,-20],[300,50],[420,210],[330,390],[80,470],[-180,420],[-330,270],[-520,360],[-720,500],[-900,390],[-980,140],[-920,-120],[-760,-330],[-500,-500],[-260,-650]] }, { name:"HYPERTRACK // STADIUM BOWL", points:[[0,-760],[420,-760],[700,-620],[840,-360],[850,-40],[760,260],[560,470],[300,590],[0,620],[-300,590],[-560,470],[-760,260],[-850,-40],[-840,-360],[-700,-620],[-420,-760],[-170,-690],[-80,-500],[80,-390],[260,-430],[350,-300],[330,-80],[210,40],[0,80],[-210,40],[-330,-80],[-350,-300],[-260,-430],[-80,-500],[0,-610]] }, { name:"HYPERTRACK // CLIFFSIDE RUN", points:[[0,-820],[420,-800],[720,-680],[900,-500],[940,-250],[850,-20],[700,120],[520,180],[420,330],[500,520],[650,700],[540,850],[280,900],[20,800],[-120,620],[-260,500],[-480,540],[-700,470],[-860,300],[-900,50],[-820,-180],[-650,-360],[-420,-520],[-180,-680]] }, { name:"HYPERTRACK // INDUSTRIAL 90", points:[[0,-760],[360,-760],[620,-620],[620,-350],[430,-250],[650,-100],[760,140],[680,400],[450,520],[150,520],[60,350],[-120,240],[-340,300],[-500,500],[-760,480],[-880,280],[-850,20],[-680,-120],[-500,-260],[-620,-450],[-520,-650],[-260,-760]] }, { name:"HYPERTRACK // FOREST ROLLER", points:[[0,-800],[300,-760],[520,-620],[580,-400],[470,-230],[260,-170],[110,-40],[180,140],[390,210],[500,380],[430,600],[220,730],[-40,700],[-210,560],[-250,360],[-420,270],[-650,320],[-820,180],[-870,-60],[-760,-300],[-560,-430],[-500,-620],[-300,-760]] }, { name:"HYPERTRACK // DESERT DUNES", points:[[0,-850],[460,-820],[780,-650],[900,-380],[820,-120],[620,0],[760,180],[820,440],[690,690],[400,800],[120,760],[-80,600],[-40,390],[-220,270],[-500,300],[-760,180],[-900,-60],[-850,-330],[-680,-520],[-430,-650]] }, { name:"HYPERTRACK // CITY CHICANE", points:[[0,-780],[520,-780],[780,-600],[780,-320],[580,-180],[780,-20],[820,240],[680,460],[400,540],[180,430],[60,250],[-100,180],[-300,260],[-460,450],[-720,430],[-860,230],[-820,-20],[-620,-150],[-440,-280],[-620,-430],[-700,-650],[-420,-780]] }, { name:"HYPERTRACK // FINAL GAUNTLET", points:[[0,-900],[480,-900],[760,-760],[850,-520],[720,-330],[470,-300],[300,-410],[160,-280],[260,-90],[500,-30],[650,140],[620,380],[430,560],[160,620],[-20,500],[-120,300],[-300,230],[-500,350],[-700,280],[-820,80],[-760,-160],[-600,-330],[-420,-500],[-500,-700],[-300,-850]] } ] ; let trackCurve; let trackPoints = []; let trackTangents = []; let trackLength = 0; let racingLine = []; let racingLineTangents = []; const trackGroup = new THREE.Group(); scene.add(trackGroup); /* ========================================================= TRACK GEOMETRY VALIDATION ========================================================= */ function orientation2D(a,b,c){ const v=(b.x-a.x)*(c.z-a.z)-(b.z-a.z)*(c.x-a.x); return v>0?1:v<0?-1:0; } function segmentsCross2D(a,b,c,d){ const o1=orientation2D(a,b,c),o2=orientation2D(a,b,d),o3=orientation2D(c,d,a),o4=orientation2D(c,d,b); return o1!==o2 && o3!==o4; } function validateTrackGeometry(points){ for(let i=0;i<points.length;i++){ const a=points[i], b=points[(i+1)%points.length]; for(let j=i+1;j<points.length;j++){ if(j===i || j===(i+1)%points.length || (i===0 && j===points.length-1)) continue; const c=points[j], d=points[(j+1)%points.length]; if(segmentsCross2D(a,b,c,d)) return false; } } return true; } for(const t of tracks){ if(!validateTrackGeometry(t.points.map(p=>({x:p[0],z:p[1]})))){ console.warn("Track geometry intersection detected:",t.name); } } /* ========================================================= TRACK GENERATION ========================================================= */ function buildTrack(index){ while(trackGroup.children.length){ trackGroup.remove(trackGroup.children[0]); } const data = tracks[index]; const controlPoints = data.points.map(p => new THREE.Vector3(p[0],0,p[1]) ); trackCurve = new THREE.CatmullRomCurve3( controlPoints, true, "centripetal", .45 ); trackPoints = []; trackTangents = []; for(let i=0;i<TRACK_SAMPLES;i++){ const t = i / TRACK_SAMPLES; const p = trackCurve.getPointAt(t); const tangent = trackCurve.getTangentAt(t).normalize(); trackPoints.push(p); trackTangents.push(tangent); } /* ========================================================= OPTIMIZED RACING LINE The AI does NOT drive the centerline.  This line opens the corner on entry, cuts toward the inside at the apex, then opens again on exit. */ const signedCurvature = new Float32Array(TRACK_SAMPLES); for(let i=0;i<TRACK_SAMPLES;i++){ const prev = trackTangents[(i-8+TRACK_SAMPLES)%TRACK_SAMPLES]; const next = trackTangents[(i+8)%TRACK_SAMPLES]; const crossY = prev.z*next.x - prev.x*next.z; signedCurvature[i] = crossY; } racingLine = []; racingLineTangents = []; for(let i=0;i<TRACK_SAMPLES;i++){ const prevK = signedCurvature[(i-55+TRACK_SAMPLES)%TRACK_SAMPLES]; const k = signedCurvature[i]; const nextK = signedCurvature[(i+55)%TRACK_SAMPLES]; const upcoming = Math.abs(nextK) > Math.abs(k) ? nextK : k; const fading = Math.abs(prevK) > Math.abs(k) ? prevK : k; // Before a corner: move to the outside. At the corner: cut to the inside. const entryOutside = -Math.sign(upcoming) * Math.min(6.8, Math.abs(upcoming)*250); const apexInside = -Math.sign(k) * Math.min(7.8, Math.abs(k)*420); const exitOutside = -Math.sign(fading) * Math.min(5.8, Math.abs(fading)*210); const offset = THREE.MathUtils.clamp( entryOutside*0.42 + apexInside*0.52 + exitOutside*0.22, -8.2, 8.2 ); const p = trackPoints[i].clone(); const t = trackTangents[i]; const right = new THREE.Vector3(-t.z,0,t.x).normalize(); p.addScaledVector(right,offset); racingLine.push(p); } for(let i=0;i<TRACK_SAMPLES;i++){ const a=racingLine[(i-2+TRACK_SAMPLES)%TRACK_SAMPLES]; const b=racingLine[(i+2)%TRACK_SAMPLES]; racingLineTangents.push(b.clone().sub(a).normalize()); } /* A subtle dashed racing-line guide is visible only near the apexes. */ const lineGuide = new THREE.Group(); for(let i=0;i<TRACK_SAMPLES;i+=10){ if(Math.abs(signedCurvature[i]) < 0.006) continue; const p=racingLine[i], t=racingLineTangents[i]; const guide=new THREE.Mesh( new THREE.BoxGeometry(.18,.018,3.2), new THREE.MeshBasicMaterial({color:0xffc400,transparent:true,opacity:.34}) ); guide.position.copy(p); guide.position.y=ROAD_HEIGHT + .035; guide.rotation.y=Math.atan2(-t.x,-t.z); lineGuide.add(guide); } trackGroup.add(lineGuide); trackLength = 0; for(let i=0;i<TRACK_SAMPLES;i++){ const a = trackPoints[i]; const b = trackPoints[(i+1)%TRACK_SAMPLES]; trackLength += a.distanceTo(b); } /* ROAD */ const roadPositions = []; const roadIndices = []; for(let i=0;i<TRACK_SAMPLES;i++){ const p = trackPoints[i]; const t = trackTangents[i]; const right = new THREE.Vector3( -t.z, 0, t.x ).normalize(); const leftP = p.clone().addScaledVector( right, -ROAD_WIDTH/2 ); const rightP = p.clone().addScaledVector( right, ROAD_WIDTH/2 ); const base = i*2; roadPositions.push( leftP.x,ROAD_HEIGHT,leftP.z, rightP.x,ROAD_HEIGHT,rightP.z ); roadIndices.push( base, ((i+1)%TRACK_SAMPLES)*2, base+1, base+1, ((i+1)%TRACK_SAMPLES)*2, ((i+1)%TRACK_SAMPLES)*2+1 ); } const roadGeo = new THREE.BufferGeometry(); roadGeo.setAttribute( "position", new THREE.Float32BufferAttribute(roadPositions,3) ); roadGeo.setIndex(roadIndices); roadGeo.computeVertexNormals(); const road = new THREE.Mesh(roadGeo,roadMat); road.receiveShadow = true; roadGroupAdd(road); /* RAISED ROAD DECK: solid side faces make the elevation obvious above the grass. */ const foundationPositions=[]; const foundationIndices=[]; const foundationWidth=ROAD_WIDTH+CURB_WIDTH*2+1.5; const foundationBottom=0.05; for(let i=0;i<TRACK_SAMPLES;i++){ const p=trackPoints[i], t=trackTangents[i]; const right=new THREE.Vector3(-t.z,0,t.x).normalize(); const topL=p.clone().addScaledVector(right,-foundationWidth/2); const topR=p.clone().addScaledVector(right, foundationWidth/2); const botL=topL.clone(); botL.y=foundationBottom; const botR=topR.clone(); botR.y=foundationBottom; topL.y=ROAD_HEIGHT; topR.y=ROAD_HEIGHT; foundationPositions.push( topL.x,topL.y,topL.z, topR.x,topR.y,topR.z, botL.x,botL.y,botL.z, botR.x,botR.y,botR.z ); const n=(i+1)%TRACK_SAMPLES; foundationIndices.push( i*4,n*4,i*4+1, i*4+1,n*4,n*4+1, i*4+2,i*4+3,n*4+2, i*4+3,n*4+3,n*4+2, i*4,i*4+2,n*4, i*4+2,n*4+2,n*4, i*4+1,n*4+1,i*4+3, i*4+3,n*4+1,n*4+3 ); } const foundationGeo=new THREE.BufferGeometry(); foundationGeo.setAttribute('position',new THREE.Float32BufferAttribute(foundationPositions,3)); foundationGeo.setIndex(foundationIndices); foundationGeo.computeVertexNormals(); const foundation=new THREE.Mesh(foundationGeo,mat(0x45494d,.98)); foundation.receiveShadow=true; foundation.castShadow=true; trackGroup.add(foundation); /* CENTER DASHES */ const dashGroup = new THREE.Group(); for(let i=0;i<TRACK_SAMPLES;i+=12){ const p = trackPoints[i]; const t = trackTangents[i]; const dash = new THREE.Mesh( new THREE.BoxGeometry(0.35,.025,8), mat(0xe9e7d4,.75) ); dash.position.copy(p); dash.position.y = ROAD_HEIGHT + .035; dash.rotation.y = Math.atan2(-t.x,-t.z); dashGroup.add(dash); } trackGroup.add(dashGroup); /* CURBS */ const curbGroup = new THREE.Group(); for(let i=0;i<TRACK_SAMPLES;i+=3){ const p = trackPoints[i]; const t = trackTangents[i]; const right = new THREE.Vector3( -t.z,0,t.x ).normalize(); for(const side of [-1,1]){ const curb = new THREE.Mesh( new THREE.BoxGeometry( CURB_WIDTH, .16, 6.8 ), ((Math.floor(i/3))%2===0) ? curbRed : curbWhite ); curb.position.copy(p); curb.position.y = ROAD_HEIGHT + .08; curb.position.addScaledVector( right, side*(ROAD_WIDTH/2 + CURB_WIDTH/2) ); curb.rotation.y = Math.atan2(-t.x,-t.z); curbGroup.add(curb); } } trackGroup.add(curbGroup); /* BARRIERS: continuous visible rails + continuous physical collision segments. */ const barrierGroup=new THREE.Group(); const barrierSegments=[]; const barrierDistance=ROAD_WIDTH/2+5.2; const barrierTop=ROAD_HEIGHT+1.05; const barrierMid=ROAD_HEIGHT+.48; for(const side of [-1,1]){ const topPositions=[]; const midPositions=[]; for(let i=0;i<TRACK_SAMPLES;i++){ const p=trackPoints[i], t=trackTangents[i]; const right=new THREE.Vector3(-t.z,0,t.x).normalize(); const outer=p.clone().addScaledVector(right,side*barrierDistance); topPositions.push(outer.x,barrierTop,outer.z); midPositions.push(outer.x,barrierMid,outer.z); } const topGeo=new THREE.BufferGeometry(); topGeo.setAttribute('position',new THREE.Float32BufferAttribute(topPositions,3)); const topIndices=[]; for(let i=0;i<TRACK_SAMPLES;i++){ topIndices.push(i,(i+1)%TRACK_SAMPLES); } topGeo.setIndex(topIndices); barrierGroup.add(new THREE.LineSegments(topGeo,new THREE.LineBasicMaterial({color:0xe5e8eb}))); const midGeo=new THREE.BufferGeometry(); midGeo.setAttribute('position',new THREE.Float32BufferAttribute(midPositions,3)); midGeo.setIndex(topIndices); barrierGroup.add(new THREE.LineSegments(midGeo,new THREE.LineBasicMaterial({color:0x9ca3a8}))); for(let i=0;i<TRACK_SAMPLES;i+=10){ const p=trackPoints[i], t=trackTangents[i]; const right=new THREE.Vector3(-t.z,0,t.x).normalize(); const outer=p.clone().addScaledVector(right,side*barrierDistance); const post=new THREE.Mesh(new THREE.BoxGeometry(.28,2.35,.28),barrierMat); post.position.set(outer.x,ROAD_HEIGHT+.48,outer.z); post.castShadow=true; post.receiveShadow=true; barrierGroup.add(post); } /* Mathematical collision segments cover every track segment, so there are no gaps. */ for(let i=0;i<TRACK_SAMPLES;i++){ const a=trackPoints[i], b=trackPoints[(i+1)%TRACK_SAMPLES]; const ta=trackTangents[i], tb=trackTangents[(i+1)%TRACK_SAMPLES]; const ra=new THREE.Vector3(-ta.z,0,ta.x).normalize(); const rb=new THREE.Vector3(-tb.z,0,tb.x).normalize(); const pa=a.clone().addScaledVector(ra,side*barrierDistance); const pb=b.clone().addScaledVector(rb,side*barrierDistance); barrierSegments.push({a:pa,b:pb,side}); } } trackGroup.add(barrierGroup); window._barrierSegments=barrierSegments; /* BRAKING ZONES: visible 150 / 100 / 50 boards before major corners. */ function buildBrakingZones(){ const group=new THREE.Group(); const used=[]; for(let i=0;i<TRACK_SAMPLES;i+=6){ const a=trackTangents[i]; const b=trackTangents[(i+55)%TRACK_SAMPLES]; const bend=1-THREE.MathUtils.clamp(a.dot(b),-1,1); if(bend<.105) continue; let tooClose=false; for(const u of used){ if(Math.abs(i-u)<80 || TRACK_SAMPLES-Math.abs(i-u)<80){tooClose=true;break;} } if(tooClose) continue; used.push(i); const cornerIndex=(i+45)%TRACK_SAMPLES; const p=trackPoints[cornerIndex]; const t=trackTangents[cornerIndex]; const r=new THREE.Vector3(-t.z,0,t.x).normalize(); for(let n=0;n<3;n++){ const d=18+n*16; const q=p.clone().addScaledVector(t,-d); const postL=new THREE.Mesh(new THREE.BoxGeometry(.16,2.8,.16),blackMat); const postR=postL.clone(); postL.position.copy(q).addScaledVector(r,-ROAD_WIDTH/2-2.2); postR.position.copy(q).addScaledVector(r, ROAD_WIDTH/2+2.2); postL.position.y=ROAD_HEIGHT+1.4; postR.position.y=ROAD_HEIGHT+1.4; group.add(postL,postR); const board=new THREE.Mesh(new THREE.BoxGeometry(2.8,1.45,.12),blackMat); board.position.copy(q).addScaledVector(r, n%2===0 ? -ROAD_WIDTH/2-2.2 : ROAD_WIDTH/2+2.2); board.position.y=ROAD_HEIGHT+2.25; board.rotation.y=Math.atan2(-t.x,-t.z); group.add(board); } } trackGroup.add(group); } buildBrakingZones(); /* START LINE */ const start = trackPoints[0]; const tangent = trackTangents[0]; const startLine = new THREE.Mesh( new THREE.PlaneGeometry(ROAD_WIDTH,8), new THREE.MeshBasicMaterial({ color:0xffffff, side:THREE.DoubleSide }) ); startLine.rotation.x = -Math.PI/2; startLine.rotation.z = Math.atan2(tangent.z,tangent.x); startLine.position.copy(start); startLine.position.y = ROAD_HEIGHT + .07; trackGroup.add(startLine); /* START GANTRY */ const gantry = new THREE.Group(); const postGeo = new THREE.BoxGeometry(.8,10,.8); const post1 = new THREE.Mesh(postGeo,blackMat); const post2 = new THREE.Mesh(postGeo,blackMat); const right = new THREE.Vector3( -tangent.z,0,tangent.x ).normalize(); post1.position.copy(start) .addScaledVector(right,-ROAD_WIDTH/2-3); post2.position.copy(start) .addScaledVector(right,ROAD_WIDTH/2+3); post1.position.y = 5; post2.position.y = 5; const beam = new THREE.Mesh( new THREE.BoxGeometry(ROAD_WIDTH+7,1.3,1), blackMat ); beam.position.copy(start); beam.position.y = 9.5; beam.rotation.y = Math.atan2(-tangent.x,-tangent.z); gantry.add(post1,post2,beam); /* LIGHTS */ for(let i=0;i<8;i++){ const light = new THREE.Mesh( new THREE.SphereGeometry(.45,16,12), new THREE.MeshBasicMaterial({color:0xff1818}) ); const x = -ROAD_WIDTH/2-2 + i*((ROAD_WIDTH+4)/7); const local = new THREE.Vecto position.y=ROAD_HEIGHT+.03; ai.root.rotation.y=ai.yaw; const fakeSteer=THREE.MathUtils.clamp(yawDiff*10,-1,1); updateWheels(ai,dt,fakeSteer); ai.speed=ai.velocity.length(); } /* ========================================================= WHEEL ANIMATION ========================================================= */ function updateWheels(car,dt,steer){ const steeringAngle= steer*.34; const wheelRadius=.48; for(const wheel of car.wheels){ if(wheel.front){ wheel.steeringPivot.rotation.y= steeringAngle; } /* IMPORTANT: Only spinPivot rotates for wheel rotation. This prevents the wheels from wiggling while steering. */ wheel.spinPivot.rotation.x += car.speed*dt/wheelRadius; } } /* ========================================================= BARRIER COLLISIONS Guardrails behave as solid objects. Cars are pushed back and their velocity is reflected, using the same contact style as car-to-car collisions. */ function resolveBarrierCollisions(){ const segments=window._barrierSegments; if(!segments) return; for(const car of cars){ for(const seg of segments){ const px=car.root.position.x, pz=car.root.position.z; const ax=seg.a.x, az=seg.a.z, bx=seg.b.x, bz=seg.b.z; const sx=bx-ax, sz=bz-az; const lenSq=sx*sx+sz*sz; const u=THREE.MathUtils.clamp(((px-ax)*sx+(pz-az)*sz)/Math.max(lenSq,1e-8),0,1); const qx=ax+sx*u, qz=az+sz*u; let dx=px-qx, dz=pz-qz; let dist=Math.hypot(dx,dz); const radius=car.collisionRadius+1.15; if(dist>=radius) continue; let nx,nz; if(dist<.001){ /* Segment's side tells us which direction is toward the road. */ const tx=sx/Math.max(Math.hypot(sx,sz),.001); const tz=sz/Math.max(Math.hypot(sx,sz),.001); nx=seg.side*tz; nz=-seg.side*tx; dist=.001; }else{ nx=dx/dist; nz=dz/dist; } const penetration=radius-dist; /* Hard positional correction prevents high-speed tunneling through the rail. */ car.root.position.x += nx*(penetration+.08); car.root.position.z += nz*(penetration+.08); car.root.position.y=ROAD_HEIGHT+.03; const vn=car.velocity.x*nx+car.velocity.z*nz; if(vn<0){ /* Solid rail collision, but never a brake: preserve total car speed while redirecting the velocity away from the barrier. */ const impactSpeed=car.velocity.length(); /* Low-bounce guardrail: keep almost all momentum tangent to the rail and use only a tiny normal reflection. */ const tangentX=-nz, tangentZ=nx; const tangentSpeed=car.velocity.x*tangentX+car.velocity.z*tangentZ; const normalSpeed=car.velocity.x*nx+car.velocity.z*nz; const newNormal=-normalSpeed*.10; car.velocity.x=tangentX*tangentSpeed+nx*newNormal; car.velocity.z=tangentZ*tangentSpeed+nz*newNormal; const redirectedSpeed=car.velocity.length(); if(redirectedSpeed>.001 && impactSpeed>.001){ car.velocity.multiplyScalar(impactSpeed/redirectedSpeed); } car.yaw += THREE.MathUtils.clamp((Math.random()-.5)*Math.min(impactSpeed*.002,.025),-.025,.025); if(car.isPlayer && -vn>18) document.getElementById("flash").style.opacity=".22"; } } } } /* ========================================================= CAR COLLISION PHYSICS ========================================================= */ function resolveCarCollisions(){ /* Multiple passes make stacked cars separate cleanly. */ for(let pass=0;pass<3;pass++){ for(let i=0;i<cars.length;i++){ for(let j=i+1;j<cars.length;j++){ const a=cars[i]; const b=cars[j]; const dx= b.root.position.x- a.root.position.x; const dz= b.root.position.z- a.root.position.z; let distSq= dx*dx+ dz*dz; const minDist= a.collisionRadius+ b.collisionRadius; if(distSq>=minDist*minDist) continue; let dist=Math.sqrt(distSq); if(dist<.001){ dist=.001; /* Stable separation direction. */ const angle= (i*17+j*31)*.1; const nx=Math.cos(angle); const nz=Math.sin(angle); separateCars( a,b,nx,nz,minDist,dist ); continue; } const nx=dx/dist; const nz=dz/dist; separateCars( a,b,nx,nz,minDist,dist ); } } } } function separateCars( a,b,nx,nz,minDist,dist ){ const overlap= minDist-dist; const totalMass= a.isPlayer ? 1.25 : 1; const aMove= b.isPlayer ? .42 : .5; const bMove= a.isPlayer ? .42 : .5; a.root.position.x -= nx*overlap*aMove; a.root.position.z -= nz*overlap*aMove; b.root.position.x += nx*overlap*bMove; b.root.position.z += nz*overlap*bMove; const rvx= b.velocity.x- a.velocity.x; const rvz= b.velocity.z- a.velocity.z; const closing= rvx*nx+ rvz*nz; if(closing<0){ const restitution=.24; const impulse= -(1+restitution)* closing/ (1/totalMass+1); a.velocity.x -= nx*impulse/totalMass; a.velocity.z -= nz*impulse/totalMass; b.velocity.x += nx*impulse; b.velocity.z += nz*impulse; } /* Slight tangential friction makes contact feel physical without causing cars to spin uncontrollably. */ const tx=-nz; const tz=nx; const tangentialRelative= rvx*tx+ rvz*tz; const tangentImpulse= THREE.MathUtils.clamp( tangentialRelative*.035, -2, 2 ); a.velocity.x += tx*tangentImpulse; a.velocity.z += tz*tangentImpulse; b.velocity.x -= tx*tangentImpulse; b.velocity.z -= tz*tangentImpulse; } /* ========================================================= ANGLE ========================================================= */ function normalizeAngle(a){ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; } /* ========================================================= POSITION ========================================================= */ function updateLapForCar(car){ const progress=getProgressForPosition(car.root.position); if(car.lastProgress>0.80 && progress<0.20){ car.lap=Math.min(TOTAL_LAPS,car.lap+1); } car.lastProgress=progress; car.progress=progress; } function updatePosition(){ for(const car of cars) updateLapForCar(car); const racers=cars.map(car=>({ car, score:(car.lap-1)+car.progress })); racers.sort((a,b)=>b.score-a.score); const playerPosition=racers.findIndex(x=>x.car===player)+1; document.getElementById("position").innerHTML= playerPosition+"<small> / "+TOTAL_CARS+"</small>"; document.getElementById("trackName").textContent= tracks[currentTrack].name+"  •  LAP "+Math.min(player.lap,TOTAL_LAPS)+"/"+TOTAL_LAPS; } /* ========================================================= FINISH ========================================================= */ function checkFinish(){ if(raceFinished) return; if(player.lap>=TOTAL_LAPS && player.progress>.93 && raceTime>5){ raceFinished=true; document.getElementById("message").innerHTML= "FINISH!<small>"+formatTime(raceTime)+"</small>"; flashScreen(); if(!localStorage.hyperTrackBest || raceTime<Number(localStorage.hyperTrackBest)){ localStorage.hyperTrackBest=raceTime; } } } /* ========================================================= TIMER ========================================================= */ function formatTime(t){ const min= Math.floor(t/60); const sec= Math.floor(t%60); const ms= Math.floor( (t%1)*1000 ); return String(min).padStart(2,"0")+ ":"+ String(sec).padStart(2,"0")+ "."+ String(ms).padStart(3,"0"); } function updateTimer(){ document.getElementById("time") .textContent= formatTime(raceTime); const best= localStorage.hyperTrackBest; document.getElementById("best") .textContent= best ? "BEST "+formatTime(Number(best)) : "BEST --:--.---"; } /* ========================================================= COUNTDOWN ========================================================= */ function updateCountdown(dt){ if(raceStarted) return; countdownTimer+=dt; const remaining= 3-Math.floor(countdownTimer); if(remaining>0){ document.getElementById("countdown") .textContent=remaining; }else{ document.getElementById("countdown") .textContent="GO!"; if(countdownTimer>3.7){ raceStarted=true; document.getElementById("countdown") .textContent=""; } } } /* ========================================================= SPEED / GEAR ========================================================= */ function updateSpeedHUD(){ const kmh= Math.round( player.speed*3.6 ); document.getElementById("speed") .textContent=kmh; let gear; if(kmh<5){ gear="N"; }else if(kmh<55){ gear="1"; }else if(kmh<105){ gear="2"; }else if(kmh<165){ gear="3"; }else if(kmh<240){ gear="4"; }else if(kmh<330){ gear="5"; }else if(kmh<450){ gear="6"; }else{ gear="7"; } document.getElementById("gear") .textContent=gear; const lines= document.getElementById("speedLines"); const intensity= THREE.MathUtils.clamp( (player.speed/MAX_SPEED-.45)*1.8, 0, .65 ); lines.style.opacity=intensity; } /* ========================================================= CAMERA ========================================================= */ const cameraLook=new THREE.Vector3(); function updateCamera(dt){ /* Proper third-person chase view: clearly behind and above the full car, with a fixed distance that does not change when accelerating. */ const forward=new THREE.Vector3(-Math.sin(player.yaw),0,-Math.cos(player.yaw)); const desired=player.root.position.clone().addScaledVector(forward,-9.5); desired.y=player.root.position.y+3.8; const target=player.root.position.clone().addScaledVector(forward,5.0); target.y+=1.15; const follow=1-Math.pow(.00001,dt); camera.position.lerp(desired,follow); cameraLook.lerp(target,follow); camera.lookAt(cameraLook); camera.fov=72; camera.updateProjectionMatrix(); } /* ========================================================= MINIMAP ========================================================= */ const mapCanvas= document.getElementById("mapCanvas"); const mapCtx= mapCanvas.getContext("2d"); function updateMinimap(){ mapCtx.clearRect( 0,0, mapCanvas.width, mapCanvas.height ); mapCtx.fillStyle= "rgba(8,11,15,.9)"; mapCtx.fillRect( 0,0, mapCanvas.width, mapCanvas.height ); let minX=Infinity; let maxX=-Infinity; let minZ=Infinity; let maxZ=-Infinity; for(const p of trackPoints){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z); } const pad=30; const sx= (mapCanvas.width-pad*2)/ (maxX-minX); const sz= (mapCanvas.height-pad*2)/ (maxZ-minZ); const scale= Math.min(sx,sz); function map(p){ return { x: pad+ (p.x-minX)*scale+ (mapCanvas.width- pad*2- (maxX-minX)*scale)/2, y: pad+ (p.z-minZ)*scale+ (mapCanvas.height- pad*2- (maxZ-minZ)*scale)/2 }; } mapCtx.lineWidth=10; mapCtx.strokeStyle="#777c80"; mapCtx.beginPath(); for(let i=0;i<trackPoints.length;i++){ const p=map(trackPoints[i]); if(i===0) mapCtx.moveTo(p.x,p.y); else mapCtx.lineTo(p.x,p.y); } mapCtx.closePath(); mapCtx.stroke(); mapCtx.lineWidth=3; mapCtx.strokeStyle="#f2f2f2"; mapCtx.beginPath(); for(let i=0;i<trackPoints.length;i++){ const p=map(trackPoints[i]); if(i===0) mapCtx.moveTo(p.x,p.y); else mapCtx.lineTo(p.x,p.y); } mapCtx.closePath(); mapCtx.stroke(); for(const car of cars){ const p=map(car.root.position); mapCtx.beginPath(); mapCtx.arc( p.x, p.y, car.isPlayer?5:3, 0, Math.PI*2 ); mapCtx.fillStyle= car.isPlayer ? "#ff7b18" : "#ffffff"; mapCtx.fill(); } } /* ========================================================= FLASH ========================================================= */ function flashScreen(){ const flash= document.getElementById("flash"); flash.style.opacity=".85"; setTimeout(()=>{ flash.style.opacity="0"; },100); } /* ========================================================= AUDIO ========================================================= */ let audioCtx=null; let engineOsc1=null; let engineOsc2=null; let engineGain=null; let engineFilter=null; let brakeNoise=null; let brakeGain=null; let brakeFilter=null; function initAudio(){ if(audioCtx){ if(audioCtx.state==="suspended") audioCtx.resume(); return; } try{ audioCtx= new ( window.AudioContext || window.webkitAudioContext )(); /* ENGINE */ engineOsc1= audioCtx.createOscillator(); engineOsc2= audioCtx.createOscillator(); engineGain= audioCtx.createGain(); engineFilter= audioCtx.createBiquadFilter(); engineOsc1.type="sawtooth"; engineOsc2.type="triangle"; engineFilter.type="lowpass"; engineFilter.frequency.value=1800; engineGain.gain.value=.0001; engineOsc1.connect(engineFilter); engineOsc2.connect(engineFilter); engineFilter.connect(engineGain); engineGain.connect(audioCtx.destination); engineOsc1.start(); engineOsc2.start(); /* BRAKE NOISE */ const buffer= audioCtx.createBuffer( 1, audioCtx.sampleRate*2, audioCtx.sampleRate ); const data= buffer.getChannelData(0); for(let i=0;i<data.length;i++){ data[i]=Math.random()*2-1; } brakeNoise= audioCtx.createBufferSource(); brakeNoise.buffer=buffer; brakeNoise.loop=true; brakeFilter= audioCtx.createBiquadFilter(); brakeFilter.type="bandpass"; brakeFilter.frequency.value=1500; brakeFilter.Q.value=.8; brakeGain= audioCtx.createGain(); brakeGain.gain.value=.0001; brakeNoise .connect(brakeFilter) .connect(brakeGain) .connect(audioCtx.destination); brakeNoise.start(); }catch(err){ console.warn( "Audio unavailable:", err ); } } function updateAudio(){ if(!audioCtx) return; const speedRatio= THREE.MathUtils.clamp( player.speed/MAX_SPEED, 0, 1 ); const throttle= throttleInput(); const brake= brakeInput(); const rpm= 0.08+ speedRatio*.92+ throttle*.14; const now= audioCtx.currentTime; /* High-pitched F1-style procedural engine. */ engineOsc1.frequency.setTargetAtTime( 65+ rpm*720, now, .035 ); engineOsc2.frequency.setTargetAtTime( 130+ rpm*980, now, .035 ); engineFilter.frequency.setTargetAtTime( 700+ rpm*1800, now, .04 ); const engineVolume= player.speed>1 ? .045+ speedRatio*.12+ throttle*.055 : .012; engineGain.gain.setTargetAtTime( engineVolume, now, .05 ); /* BRAKES */ const brakeAmount= brake && player.speed>15 ? .08+ speedRatio*.17 : .0001; brakeGain.gain.setTargetAtTime( brakeAmount, now, .025 ); brakeFilter.frequency.setTargetAtTime( 700+ speedRatio*2300, now, .04 ); } /* ========================================================= INITIALIZATION ========================================================= */ buildTrack(currentTrack); createCars(); document.getElementById("trackName") .textContent=tracks[currentTrack].name; resetRace(); /* ========================================================= MAIN LOOP ========================================================= */ function animate(){ requestAnimationFrame(animate); const dt= Math.min( clock.getDelta(), .033 ); updateCountdown(dt); if(raceStarted && !raceFinished){ raceTime+=dt; updatePlayer(dt); for(let i=1;i<cars.length;i++){ updateAI(cars[i],dt,i); } /* BARRIERS ARE SOLID: resolve guardrail crashes before car-to-car contacts. */ resolveBarrierCollisions(); /* Actual contact physics between ALL cars. */ resolveCarCollisions(); updatePosition(); checkFinish(); } updateTimer(); updateSpeedHUD(); updateCamera(dt); updateMinimap(); updateAudio(); renderer.render( scene, camera ); } animate(); /* ========================================================= RESIZE ========================================================= */ window.addEventListener("resize",()=>{ camera.aspect= innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize( innerWidth, innerHeight ); renderer.setPixelRatio( Math.min(devicePixelRatio,1.7) ); }); </script> </body> </html>
