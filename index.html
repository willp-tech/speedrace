<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Rush</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fcbed;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;inset:0;color:#fff;text-shadow:0 2px 5px #000;pointer-events:none}
#speed{position:absolute;left:22px;bottom:20px;font-size:46px;font-weight:900}
#speed i{font-size:14px;font-style:normal}
#time{position:absolute;top:18px;left:50%;transform:translateX(-50%);font-size:30px;font-weight:900}
#cp{position:absolute;right:22px;bottom:20px;text-align:right;font-weight:800}
#cp b{font-size:30px}
#best{position:absolute;right:22px;top:18px;text-align:right}
#help{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:13px}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#061018aa;z-index:5}
.panel{width:min(520px,90vw);padding:32px;border-radius:18px;background:#101a22f2;color:white;text-align:center;box-shadow:0 25px 90px #0008}
h1{font-size:44px;margin:0 0 8px}p{color:#cbd5db;line-height:1.5}
button{border:0;border-radius:10px;padding:13px 25px;margin:5px;font-weight:900;font-size:16px;cursor:pointer}
#finish{display:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#101820;color:#fff;z-index:20;font-size:22px}
</style>
</head>
<body>
<div id="loading">Loading Track Rush…</div>
<div id="hud">
 <div id="time">00:00.000</div>
 <div id="best">BEST<br><b>--:--.---</b></div>
 <div id="speed">0 <i>KM/H</i></div>
 <div id="cp">CHECKPOINT<br><b>0 / 8</b></div>
 <div id="help">WASD / ARROWS · R RESET · N NEW TRACK · SPACE RACE AGAIN</div>
</div>
<div id="menu" class="screen"><div class="panel">
 <h1>TRACK RUSH</h1>
 <p>Fast arcade time-trial racing. The road is fully supported and permanent barriers keep the car inside the course.</p>
 <button id="start">START RACE</button><button id="new">NEW TRACK</button>
</div></div>
<div id="finish" class="screen"><div class="panel">
 <h1>FINISH!</h1><div id="final" style="font-size:42px;font-weight:900">00:00.000</div>
 <p id="delta"></p><button id="again">RACE AGAIN</button><button id="new2">NEW TRACK</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
"use strict";
const T=THREE, scene=new T.Scene();
scene.background=new T.Color(0x91cdef);
scene.fog=new T.Fog(0x91cdef,180,650);
const cam=new T.PerspectiveCamera(72,innerWidth/innerHeight,.05,1400);
cam.up.set(0,1,0);
const ren=new T.WebGLRenderer({antialias:true});
ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;
ren.outputColorSpace=T.SRGBColorSpace;document.body.appendChild(ren.domElement);
scene.add(new T.HemisphereLight(0xe9f8ff,0x4e7147,1.8));
const sun=new T.DirectionalLight(0xffffff,2.5);
sun.position.set(-120,240,100);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-350;sun.shadow.camera.right=350;sun.shadow.camera.top=350;sun.shadow.camera.bottom=-350;
scene.add(sun);

const world=new T.Group(), road=new T.Group(), walls=new T.Group(), props=new T.Group(), gates=new T.Group();
world.add(road,walls,props,gates);scene.add(world);
const M={
 road:new T.MeshStandardMaterial({color:0x444b50,roughness:.9}),
 support:new T.MeshStandardMaterial({color:0x725c43,roughness:1}),
 wall:new T.MeshStandardMaterial({color:0xf2f2f2,roughness:.8}),
 red:new T.MeshStandardMaterial({color:0xe3292e,roughness:.7}),
 yellow:new T.MeshStandardMaterial({color:0xffd51c,emissive:0x332800,emissiveIntensity:.3}),
 cyan:new T.MeshStandardMaterial({color:0x18d8ff,emissive:0x00a9d0,emissiveIntensity:2}),
 car:new T.MeshStandardMaterial({color:0xd81722,metalness:.3,roughness:.3}),
 dark:new T.MeshStandardMaterial({color:0x131719,metalness:.4,roughness:.3}),
 glass:new T.MeshStandardMaterial({color:0x18394a,metalness:.2,roughness:.15}),
 tire:new T.MeshStandardMaterial({color:0x101010,roughness:1}),
 ghost:new T.MeshStandardMaterial({color:0x55eaff,transparent:true,opacity:.3,emissive:0x0088aa,emissiveIntensity:1})
};

const key={};addEventListener("keydown",e=>{
 key[e.code]=true;
 if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();
 if(e.code==="KeyR")reset();
 if(e.code==="KeyN")newTrack();
 if(e.code==="Space"&&game.finished)raceAgain();
});addEventListener("keyup",e=>key[e.code]=false);
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

const game={
 seed:Math.random()*1e9,started:false,finished:false,time:0,best:+localStorage.getItem("trBest")||0,
 points:[],tans:[],lengths:[],total:0,width:16,cp:[],cpIndex:0,near:0,boost:[],
 ghost:[],record:[],lastSample:0
};
let car,ghost,wheels=[],gwheels=[],vel=new T.Vector3(),yaw=0,pitch=0,roll=0,steer=0,last=performance.now();

function rng(n){let x=n|0;return()=>{x=(x+0x6D2B79F5)|0;let t=x;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
function clear(g){while(g.children.length)g.remove(g.children[0])}
function fmt(v){let ms=Math.floor(v%1*1000).toString().padStart(3,"0"),s=Math.floor(v)%60,m=Math.floor(v/60);return String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+ms}
function meshBox(x,y,z,mat){let m=new T.Mesh(new T.BoxGeometry(x,y,z),mat);m.castShadow=true;m.receiveShadow=true;return m}

function build(seed){
 clear(road);clear(walls);clear(props);clear(gates);
 game.points=[];game.tans=[];game.lengths=[];game.total=0;game.cp=[];game.boost=[];
 const r=rng(seed), c=[],N=22;
 for(let i=0;i<N;i++){
  let u=i/(N-1),a=u*Math.PI*2.15,rad=95+Math.sin(u*7)*27+r()*18;
  c.push(new T.Vector3(Math.cos(a)*rad+Math.sin(u*13)*18,4+Math.sin(u*7)*6+Math.sin(u*19)*2,Math.sin(a)*rad+Math.cos(u*8)*18));
 }
 c[0].set(-20,3,135);c[1].set(25,5,108);c[N-2].set(-90,8,-120);c[N-1].set(-18,12,-170);
 const curve=new T.CatmullRomCurve3(c,false,"catmullrom",.62), count=760;
 for(let i=0;i<count;i++){
  let u=i/(count-1),p=curve.getPoint(u),t=curve.getTangent(u).normalize();
  game.points.push(p);game.tans.push(t);game.total+=i?p.distanceTo(game.points[i-1]):0;game.lengths.push(game.total);
 }
 for(let i=0;i<count-1;i++){
  let a=game.points[i],b=game.points[i+1],d=b.clone().sub(a),len=d.length()+1;
  let mid=a.clone().add(b).multiplyScalar(.5);
  let rmesh=meshBox(game.width,.55,len,M.road);rmesh.position.copy(mid);rmesh.lookAt(b);road.add(rmesh);
  if(i%8===0){let line=meshBox(.22,.04,len*.7,M.yellow);line.position.copy(mid);line.position.y+=.31;line.lookAt(b);road.add(line)}
  let t=game.tans[i].clone();t.y=0;t.normalize(),s=new T.Vector3(t.z,0,-t.x).normalize();
  for(let side of [-1,1]){
   let p=a.clone().addScaledVector(s,side*(game.width/2+.38));p.y+=.95;
   let w=meshBox(.76,1.5,len,M.wall);w.position.copy(p);w.lookAt(new T.Vector3(b.x,p.y,b.z));walls.add(w);
   if(i%4===0){let stripe=meshBox(.82,.45,.7,M.red);stripe.position.copy(p);stripe.position.y+=.22;stripe.lookAt(new T.Vector3(b.x,p.y,b.z));walls.add(stripe)}
  }
  /* Solid physical support under every road segment. */
  if(i%2===0){let sup=meshBox(game.width+3,1.7,len+2,M.support);sup.position.copy(mid);sup.position.y-=1.05;sup.lookAt(b);road.add(sup)}
 }
 [0.13,.285,.43,.59,.735,.86].forEach(u=>{let i=Math.floor(u*(count-1));game.boost.push(i);boost(i)});
 [0.12,.25,.38,.51,.64,.77,.89].forEach((u,n)=>{let i=Math.floor(u*(count-1));game.cp.push(i);gate(i,n+1,false)});
 game.cp.push(count-5);gate(count-5,8,true);
 for(let i=0;i<115;i++){
  let u=.01+r()*.98,i2=Math.floor(u*(count-1)),p=game.points[i2],t=game.tans[i2].clone();t.y=0;t.normalize();
  let s=new T.Vector3(t.z,0,-t.x).normalize(),d=game.width/2+15+r()*55;
  p=p.clone().addScaledVector(s,(r()<.5?-1:1)*d);p.y=-7;
  if(r()<.78){
   let h=3+r()*8,tr=meshBox(.7,h,.7,new T.MeshStandardMaterial({color:0x65472f}));tr.position.set(p.x,p.y+h/2,p.z);
   let crown=new T.Mesh(new T.ConeGeometry(3+r()*2,6+r()*7,8),new T.MeshStandardMaterial({color:0x27733f}));
   crown.position.set(p.x,p.y+h+2,p.z);crown.castShadow=true;props.add(tr,crown);
  }
 }
}
function boost(i){
 let p=game.points[i],t=game.tans[i].clone();t.y=0;t.normalize(),g=new T.Group();
 let pad=meshBox(game.width*.72,.12,5.2,M.cyan);pad.position.y=.32;g.add(pad);
 for(let j=-2;j<=2;j++){let q=new T.Mesh(new T.ConeGeometry(.55,1.4,4),new T.MeshStandardMaterial({color:0xffffff}));q.rotation.x=-Math.PI/2;q.position.set(j*2.1,.43,0);g.add(q)}
 g.position.copy(p);g.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),t);gates.add(g);
}
function gate(i,n,finish){
 let p=game.points[i],t=game.tans[i].clone();t.y=0;t.normalize(),g=new T.Group(),mat=finish?M.red:M.yellow;
 let l=meshBox(.7,8,.7,mat),r=l.clone(),top=meshBox(game.width+1,.7,.7,mat);
 l.position.x=-game.width/2;r.position.x=game.width/2;top.position.y=8;g.add(l,r,top);
 g.position.copy(p);g.quaternion.setFromUnitVectors(new T.Vector3(0,0,1),t);gates.add(g);
}

function makeCar(ghostMode=false){
 let root=new T.Group(),body=meshBox(3.15,.52,5.5,ghostMode?M.ghost:M.car);body.position.y=1.05;root.add(body);
 let nose=meshBox(2.35,.42,2,M.car);if(ghostMode)nose.material=M.ghost;nose.position.set(0,1.03,3.05);root.add(nose);
 let cock=meshBox(1.7,.72,1.75,ghostMode?M.ghost:M.glass);cock.position.set(0,1.55,-.15);root.add(cock);
 let rear=meshBox(3.7,.25,.42,ghostMode?M.ghost:M.dark);rear.position.set(0,1.65,-2.5);root.add(rear);
 let wing=meshBox(4,.16,.7,ghostMode?M.ghost:M.dark);wing.position.set(0,.75,3.75);root.add(wing);
 for(let x of [-1.65,1.65])for(let z of [-1.75,2]){
  let p=new T.Group();p.position.set(x,.72,z);let w=new T.Mesh(new T.CylinderGeometry(.62,.62,.42,16),ghostMode?M.ghost:M.tire);
  w.rotation.z=Math.PI/2;w.castShadow=true;p.add(w);root.add(p);
  (ghostMode?gwheels:wheels).push({p,w,front:z>0});
 }
 return root;
}
car=makeCar();ghost=makeCar(true);ghost.visible=false;world.add(car,ghost);

function nearest(pos){
 let guess=Math.floor(game.near*759),best=guess,bd=1e30;
 for(let i=Math.max(0,guess-60);i<=Math.min(759,guess+60);i++){
  let p=game.points[i],dx=p.x-pos.x,dz=p.z-pos.z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=i}
 }
 if(bd>game.width*game.width*30)for(let i=0;i<760;i+=3){
  let p=game.points[i],dx=p.x-pos.x,dz=p.z-pos.z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=i}
 }
 game.near=best/759;return best;
}
function frame(){let i=nearest(car.position),p=game.points[i],t=game.tans[i].clone();t.y=0;t.normalize();return{i,p,t,s:new T.Vector3(t.z,0,-t.x).normalize()}}
function snap(i=2){
 let p=game.points[i],t=game.tans[i].clone();t.y=0;t.normalize();yaw=Math.atan2(t.x,t.z);
 car.position.copy(p);car.position.y+=1.08;car.rotation.set(0,yaw,0);vel.set(0,0,0);game.near=i/759;
}
function reset(){
 let i=Math.floor(game.near*759);if(game.cpIndex)i=game.cp[Math.max(0,game.cpIndex-1)]+3;
 i=Math.max(2,Math.min(755,i));snap(i);
}
function newTrack(){
 game.seed=Math.random()*1e9;build(game.seed);loadGhost();snap(2);
 game.started=false;game.finished=false;game.time=0;game.cpIndex=0;game.record=[];ghost.visible=false;
 menu.style.display="flex";finish.style.display="none";
}
function startRace(){
 game.started=true;game.finished=false;game.time=0;game.cpIndex=0;game.record=[];game.lastSample=0;raceStart=performance.now();snap(2);
 menu.style.display="none";finish.style.display="none";ghost.visible=game.ghost.length>1;
}
function raceAgain(){startRace()}

function physics(dt){
 let f=new T.Vector3(Math.sin(yaw),0,Math.cos(yaw)),right=new T.Vector3(Math.cos(yaw),0,-Math.sin(yaw));
 let throttle=key.KeyW||key.ArrowUp,brake=key.KeyS||key.ArrowDown;
 let s=(key.KeyD||key.ArrowRight?1:0)-(key.KeyA||key.ArrowLeft?1:0);
 steer+=(s-steer)*Math.min(1,dt*10);
 let sp=vel.length(),sr=Math.min(1,sp/65);
 if(throttle)vel.addScaledVector(f,(58+(game.boostTimer>0?42:0))*dt);
 if(brake)vel.addScaledVector(f,(sp>3?-78:-28)*dt);
 vel.multiplyScalar(Math.exp(-(1.8)*dt));
 yaw+=steer*(.55+sr*2.25)*dt*(sp>1?1:-.4);
 let nf=new T.Vector3(Math.sin(yaw),0,Math.cos(yaw)),long=vel.dot(nf),lat=vel.dot(right);
 vel.addScaledVector(right,-lat*Math.min(1,dt*7));
 let cap=game.boostTimer>0?92:72;if(vel.length()>cap)vel.setLength(cap);
 car.position.addScaledVector(vel,dt);

 let q=frame(),off=car.position.clone().sub(q.p).dot(q.s),allow=game.width/2-1.25;
 /* IMMOVABLE TRACK BOUNDARY: clamp before anything else. */
 if(Math.abs(off)>allow){car.position.addScaledVector(q.s,-Math.sign(off)*(Math.abs(off)-allow));vel.addScaledVector(q.s,-vel.dot(q.s)*1.2)}
 let ground=q.p.y+1.08,dy=car.position.y-ground;
 if(Math.abs(dy)<1.8&&vel.y<=0){car.position.y=ground;vel.y=0;game.air=false}
 if(Math.abs(dy)>1.8)game.air=true;
 if(game.air){vel.y-=24*dt;car.position.y+=vel.y*dt;if(car.position.y<=ground){car.position.y=ground;vel.y=0;game.air=false}}
 let desired=Math.atan2(q.t.x,q.t.z),diff=Math.atan2(Math.sin(desired-yaw),Math.cos(desired-yaw));yaw+=diff*Math.min(1,dt*1.2)*.12;
 pitch+=( -Math.atan2(q.t.y,Math.max(.01,Math.hypot(q.t.x,q.t.z)))*.35-pitch)*Math.min(1,dt*5);
 roll+=(-steer*.08-roll)*Math.min(1,dt*6);
 car.rotation.set(pitch,yaw,roll);
 wheels.forEach(x=>{x.w.rotation.x-=sp*dt*1.5;if(x.front)x.p.rotation.y=steer*.38});
 for(let b of game.boost)if(Math.abs(q.i-b)<5)game.boostTimer=.7;
 if(game.boostTimer>0)game.boostTimer-=dt;
 let n=game.cp[game.cpIndex];if(n!==undefined&&Math.abs(q.i-n)<9&&Math.abs(off)<game.width*.48)game.cpIndex++;
 if(car.position.y<-3||!Number.isFinite(car.position.x))reset();
}
game.boostTimer=0;game.air=false;

function record(){
 if(game.time-game.lastSample<.035)return;game.lastSample=game.time;
 game.record.push({time:game.time,p:car.position.clone(),r:car.rotation.clone()});
}
function updateGhost(){
 if(!ghost.visible||game.ghost.length<2)return;
 let a=game.ghost[0],b=game.ghost[game.ghost.length-1];
 for(let i=1;i<game.ghost.length;i++){if(game.ghost[i].time>=game.time){a=game.ghost[i-1];b=game.ghost[i];break}}
 let f=b.time===a.time?0:(game.time-a.time)/(b.time-a.time);f=Math.max(0,Math.min(1,f));
 ghost.position.lerpVectors(a.p,b.p,f);ghost.rotation.set(
  T.MathUtils.lerp(a.r.x,b.r.x,f),T.MathUtils.lerp(a.r.y,b.r.y,f),T.MathUtils.lerp(a.r.z,b.r.z,f));
}
function saveGhost(){
 if(game.record.length<10)return;
 game.ghost=game.record.map(x=>({time:x.time,p:x.p.clone(),r:x.r.clone()}));
 try{localStorage.setItem("trGhost",JSON.stringify(game.ghost.map(x=>({time:x.time,x:x.p.x,y:x.p.y,z:x.p.z,rx:x.r.x,ry:x.r.y,rz:x.r.z})))}catch(e){}
}
function loadGhost(){
 game.ghost=[];try{let a=JSON.parse(localStorage.getItem("trGhost")||"[]");
 game.ghost=a.map(x=>({time:x.time,p:new T.Vector3(x.x,x.y,x.z),r:new T.Euler(x.rx,x.ry,x.rz)}))}catch(e){}
}
function finishRace(){
 if(game.cpIndex<game.cp.length)return;game.finished=true;saveGhost();
 let old=game.best,msg;
 if(!old||game.time<old){game.best=game.time;localStorage.setItem("trBest",game.best);msg="NEW BEST!"}
 else msg=(game.time-old>=0?fmt(game.time-old):fmt(old-game.time))+(game.time<old?" faster":" slower")+" than best";
 document.querySelector("#final").textContent=fmt(game.time);document.querySelector("#delta").textContent=msg;
 finish.style.display="flex";ghost.visible=false;
}
function cameraUpdate(dt){
 let f=new T.Vector3(Math.sin(yaw),0,Math.cos(yaw)),sp=vel.length(),d=12.5+Math.min(8,sp*.075);
 let target=car.position.clone().addScaledVector(f,-d);target.y+=6.1+Math.min(3,sp*.025);
 cam.position.lerp(target,1-Math.pow(.0007,dt));
 let look=car.position.clone().addScaledVector(f,10);look.y+=1.15;
 /* World-up is forced every frame, so the camera cannot flip. */
 cam.up.set(0,1,0);cam.lookAt(look);
 cam.fov+=(70+Math.min(13,sp*.11)-cam.fov)*Math.min(1,dt*4);cam.updateProjectionMatrix();
}
function ui(){
 document.querySelector("#time").textContent=fmt(game.time);
 document.querySelector("#speed").innerHTML=Math.round(vel.length()*3.6)+' <i>KM/H</i>';
 document.querySelector("#cp b").textContent=game.cpIndex+" / "+game.cp.length;
 document.querySelector("#best b").textContent=game.best?fmt(game.best):"--:--.---";
}
function loop(){
 requestAnimationFrame(loop);let now=performance.now(),dt=Math.min(.035,(now-last)/1000);last=now;
 if(game.started&&!game.finished){game.time+=dt;physics(dt);record();updateGhost();if(game.cpIndex>=game.cp.length)finishRace()}
 cameraUpdate(dt);ui();ren.render(scene,cam);
}
document.querySelector("#start").onclick=startRace;
document.querySelector("#new").onclick=newTrack;
document.querySelector("#again").onclick=raceAgain;
document.querySelector("#new2").onclick=newTrack;

build(game.seed);loadGhost();snap(2);ui();
document.querySelector("#loading").style.display="none";loop();
</script>
</body>
</html>
