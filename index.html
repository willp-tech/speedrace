/* =========================================================
   HELPERS
   ========================================================= */

function box(w,h,d,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function cyl(r,h,mat,radial=16){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,radial),mat);
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function sphere(x,y,z,mat){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,18,10),mat);
  m.scale.set(x,y,z);
  m.castShadow=true;
  m.receiveShadow=true;
  return m;
}

function roundedBlock(x,y,z,mat){
  const m=sphere(x,y,z,mat);
  return m;
}

function formatTime(t){
  const min=Math.floor(t/60);
  const sec=Math.floor(t%60);
  const ms=Math.floor((t%1)*1000);
  return String(min).padStart(2,"0")+":"+
         String(sec).padStart(2,"0")+"."+
         String(ms).padStart(3,"0");
}

/* =========================================================
   TRACK SYSTEM
   ========================================================= */

const ROAD_WIDTH=48;
const CURB_WIDTH=4.5;
const TRACKS=[];

function addStraight(arr,length){
  const last=arr[arr.length-1];
  const dir=last.dir.clone();
  const count=Math.max(2,Math.floor(length/10));
  for(let i=1;i<=count;i++){
    const p=last.p.clone().add(dir.clone().multiplyScalar(length*i/count));
    arr.push({p,dir:dir.clone()});
  }
}

function addArc(arr,radius,angleDeg,left=true){
  const last=arr[arr.length-1];
  const angle=THREE.MathUtils.degToRad(angleDeg)*(left?1:-1);
  const tangent=last.dir.clone();

  const side=new THREE.Vector2(-tangent.z,tangent.x);
  if(!left)side.multiplyScalar(-1);

  const center=last.p.clone().add(
    new THREE.Vector3(side.x,0,side.y).multiplyScalar(radius)
  );

  const startRad=Math.atan2(
    last.p.z-center.z,
    last.p.x-center.x
  );

  const count=Math.max(8,Math.floor(Math.abs(angleDeg)/3));

  for(let i=1;i<=count;i++){
    const a=startRad+angle*i/count;
    const p=new THREE.Vector3(
      center.x+Math.cos(a)*radius,
      0,
      center.z+Math.sin(a)*radius
    );

    let d;
    if(left){
      d=new THREE.Vector3(-Math.sin(a),0,Math.cos(a));
    }else{
      d=new THREE.Vector3(Math.sin(a),0,-Math.cos(a));
    }

    arr.push({p,dir:d.normalize()});
  }
}

function buildTrack(def){
  const arr=[{
    p:new THREE.Vector3(0,0,0),
    dir:new THREE.Vector3(0,0,-1)
  }];

  for(const s of def){
    if(s.type==="straight") addStraight(arr,s.length);
    if(s.type==="left") addArc(arr,s.radius,s.angle,true);
    if(s.type==="right") addArc(arr,s.radius,s.angle,false);
  }

  return arr;
}

/*

 hairpins, sweepers and chicanes.
*/

TRACKS.push({
 name:"NEON SWITCHBACK",
 difficulty:"EXTREME",
 data:[
  {type:"straight",length:520},
  {type:"right",radius:150,angle:130},
  {type:"straight",length:280},
  {type:"left",radius:80,angle:160},
  {type:"straight",length:260},
  {type:"right",radius:80,angle:160},
  {type:"straight",length:400},
  {type:"left",radius:90,angle:175},
  {type:"straight",length:260},
  {type:"left",radius:90,angle:175},
  {type:"straight",length:600},
  {type:"right",radius:155,angle:135},
  {type:"straight",length:350},
  {type:"left",radius:120,angle:180},
  {type:"straight",length:700}

let trackIndex=0;
let centerline=[];
let trackGroup=new THREE.Group();
scene.add(trackGroup);

let trackFrames=[];
let trackLength=0;

function clearTrack(){
  scene.remove(trackGroup);
  trackGroup=new THREE.Group();
  scene.add(trackGroup);
}

function createRibbon(points,width,material,y=0){
  const verts=[];
  const indices=[];

  for(let i=0;i<points.length;i++){
    const p=points[i];
    const d=i===0?
      points[1].p.clone().sub(points[0].p).normalize():
      i===points.length-1?
      points[i].p.clone().sub(points[i-1].p).normalize():
      points[i+1].p.clone().sub(points[i-1].p).normalize();

    const right=new THREE.Vector3(-d.z,0,d.x).normalize();

    const l=p.p.clone().add(right.clone().multiplyScalar(width/2));
    const r=p.p.clone().sub(right.clone().multiplyScalar(width/2));

    l.y=y;r.y=y;
    verts.push(l.x,l.y,l.z,r.x,r.y,r.z);

    if(i<points.length-1){
      const n=i*2;
      indices.push(n,n+1,n+2,n+1,n+3,n+2);
    }
  }

  const geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(verts,3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  const mesh=new THREE.Mesh(geo,material);
  mesh.receiveShadow=true;
  return mesh;
}

function createCurbs(points){
  const left=[];
  const right=[];

  for(let i=0;i<points.length;i++){
    const p=points[i].p;
    const d=i===0?
      points[1].p.clone().sub(points[0].p).normalize():
      i===points.length-1?
      points[i].p.clone().sub(points[i-1].p).normalize():
      points[i+1].p.clone().sub(points[i-1].p).normalize();

    const r=new THREE.Vector3(-d.z,0,d.x).normalize();

    left.push({
      p:p.clone().add(r.clone().multiplyScalar(ROAD_WIDTH/2+CURB_WIDTH/2))
    });
    right.push({
      p:p.clone().sub(r.clone().multiplyScalar(ROAD_WIDTH/2+CURB_WIDTH/2))
    });
  }

  const segmentSize=12;

  for(let side=0;side<2;side++){
    for(let i=0;i<points.length-1;i+=segmentSize){
      const end=Math.min(i+segmentSize,points.length-1);
      const arr=(side===0?left:right).slice(i,end+1);

      if(arr.length<2)continue;

      const mat=(Math.floor(i/segmentSize)%2===0)
        ?MAT.curbRed:MAT.curbWhite;

      const curb=createRibbon(
        arr.map(x=>({p:x.p})),
        CURB_WIDTH,
        mat,
        .45
      );

      trackGroup.add(curb);
    }
  }
}

function createBarriers(points){
  for(let i=0;i<points.length;i+=18){
    const p=points[i].p;

    const d=i===0?
      points[1].p.clone().sub(points[0].p).normalize():
      i===points.length-1?
      points[i].p.clone().sub(points[i-1].p).normalize():
      points[i+1].p.clone().sub(points[i-1].p).normalize();

    const r=new THREE.Vector3(-d.z,0,d.x).normalize();

    for(const side of [-1,1]){
      const pos=p.clone().add(
        r.clone().multiplyScalar(
          side*(ROAD_WIDTH/2+CURB_WIDTH+8)
        )
      );

      const b=box(10,1.1,1.4,MAT.barrier);
      b.position.set(pos.x,.9,pos.z);
      b.rotation.y=Math.atan2(d.x,d.z);
      trackGroup.add(b);

      const post=box(.55,2.2,.55,MAT.barrierDark);
      post.position.set(pos.x,1.1,pos.z);
      trackGroup.add(post);
    }
  }
}

function createRoadMarkings(points){
  const markingMat=new THREE.MeshBasicMaterial({color:0xdde3e8});

  for(let i=0;i<points.length;i+=16){
    const p=points[i].p;
    const d=i===0?
      points[1].p.clone().sub(points[0].p).normalize():
      points[i].p.clone().sub(points[i-1].p).normalize();

    const mark=box(.32,.025,5,markingMat);
    mark.position.copy(p);
    mark.position.y=.035;
    mark.rotation.y=Math.atan2(d.x,d.z);
    trackGroup.add(mark);
  }
}

function createScenery(points){
  const field=box(10000,.4,10000,MAT.grass);
  field.position.y=-.35;
  field.receiveShadow=true;
  trackGroup.add(field);

  for(let i=0;i<points.length;i+=42){
    const p=points[i].p;
    const d=i===0?
      points[1].p.clone().sub(points[0].p).normalize():
      points[i].p.clone().sub(points[i-1].p).normalize();

    const r=new THREE.Vector3(-d.z,0,d.x).normalize();

    for(const side of [-1,1]){
      if(i%84===0){
        const pos=p.clone().add(
          r.clone().multiplyScalar(side*(ROAD_WIDTH/2+35))
        );

        const pole=cyl(.45,15,MAT.barrierDark,8);
        pole.position.set(pos.x,7,pos.z);
        trackGroup.add(pole);

        const sign=box(12,5,.35,MAT.blue);
        sign.position.set(pos.x,14,pos.z);
        sign.rotation.y=Math.atan2(d.x,d.z);
        trackGroup.add(sign);
      }
    }
  }

  // Large distant pillars
  for(let i=0;i<80;i++){
    const x=(Math.random()-.5)*8000;
    const z=(Math.random()-.5)*8000;

    const h=15+Math.random()*50;
    const pillar=box(
      8+Math.random()*15,
      h,
      8+Math.random()*15,
      MAT.barrierDark
    );
    pillar.position.set(x,h/2-0.3,z);
    trackGroup.add(pillar);
  }
}

function buildTrackWorld(){
  clearTrack();

  centerline=buildTrack(TRACKS[trackIndex].data);

  // close visual loop by connecting back to beginning
  const last=centerline[centerline.length-1];

  trackFrames=[];
  trackLength=0;

  for(let i=0;i<centerline.length;i++){
    if(i>0){
      trackLength+=centerline[i].p.distanceTo(centerline[i-1].p);
    }

    const d=i===0?
      centerline[1].p.clone().sub(centerline[0].p).normalize():
      i===centerline.length-1?
      centerline[i].p.clone().sub(centerline[i-1].p).normalize():
      centerline[i+1].p.clone().sub(centerline[i-1].p).normalize();

    const right=new THREE.Vector3(-d.z,0,d.x).normalize();

    trackFrames.push({
      p:centerline[i].p,
      tangent:d,
      right,
      distance:trackLength
    });
  }

  const road=createRibbon(centerline,ROAD_WIDTH,MAT.asphalt,0);
  trackGroup.add(road);

  // dark center racing strip
  const racing=createRibbon(centerline,14,MAT.asphaltDark,.012);
  trackGroup.add(racing);

  createCurbs(centerline);
  createBarriers(centerline);
  createRoadMarkings(centerline);
  createScenery(centerline);
  createStartFinish();
  createCheckpoints();

  resetCar();
}

function createStartFinish(){
  const p=centerline[0].p;
  const d=centerline[1].p.clone().sub(centerline[0].p).normalize();

  const line=box(ROAD_WIDTH,.04,6,MAT.white);
  line.position.set(p.x,.06,p.z);
  line.rotation.y=Math.atan2(d.x,d.z);
  trackGroup.add(line);

  const yaw=Math.atan2(-d.x,-d.z);

  for(const s of [-1,1]){
    const post=box(1.2,10,1.2,MAT.orange);
    const pos=p.clone().add(
      new THREE.Vector3(d.z,0,-d.x).multiplyScalar(s*20)
    );
    post.position.set(pos.x,5,pos.z);
    trackGroup.add(post);
  }

  const top=box(44,1.5,1.5,MAT.white);
  top.position.set(p.x,10,p.z);
  top.rotation.y=yaw;
  trackGroup.add(top);
}

let checkpointObjects=[];

function createCheckpoints(){
  checkpointObjects=[];

  const count=8;

  for(let c=1;c<=count;c++){
    const idx=Math.floor(centerline.length*c/count);
    if(idx>=centerline.length)continue;

    const f=trackFrames[idx];

    const gate=new THREE.Group();

    const pole1=box(.7,9,.7,MAT.orange);
    pole1.position.set(
      f.p.x+f.right.x*(ROAD_WIDTH/2-2),
      4.5,
      f.p.z+f.right.z*(ROAD_WIDTH/2-2)
    );

    const pole2=box(.7,9,.7,MAT.orange);
    pole2.position.set(
      f.p.x-f.right.x*(ROAD_WIDTH/2-2),
      4.5,
      f.p.z-f.right.z*(ROAD_WIDTH/2-2)
    );

    const top=box(ROAD_WIDTH-3,.5,.5,MAT.orange);
    top.position.set(f.p.x,9,f.p.z);
    top.rotation.y=Math.atan2(f.tangent.x,f.tangent.z);

    gate.add(pole1,pole2,top);
    trackGroup.add(gate);

    checkpointObjects.push({
      position:f.p.clone(),
      index:idx
    });
  }
}

/* =========================================================
   CAR
   ========================================================= */

let car=new THREE.Group();
let carVisual=new THREE.Group();
let wheels=[];

function createWheel(){
  const spinPivot=new THREE.Group();

  const tire=new THREE.Mesh(
    new THREE.CylinderGeometry(.39,.39,.25,24,1,false),
    MAT.tire
  );

  // Cylinder axis starts along Y. Rotate it so axle runs along X.
  tire.rotation.z=Math.PI/2;
  tire.castShadow=true;
  tire.receiveShadow=true;

  spinPivot.add(tire);

  const rim=new THREE.Mesh(
    new THREE.CylinderGeometry(.20,.20,.265,18),
    MAT.rim
  );
  rim.rotation.z=Math.PI/2;
  spinPivot.add(rim);

  const hub=new THREE.Mesh(
    new THREE.CylinderGeometry(.07,.07,.28,12),
    MAT.carbon2
  );
  hub.rotation.z=Math.PI/2;
  spinPivot.add(hub);

  return spinPivot;
}

function createFrontWheel(steerGroup){
  const wheel=createWheel();
  steerGroup.add(wheel);
  wheels.push({
    steer:steerGroup,
    spin:wheel,
    front:true

function createWing(width,depth,height,mat){
  const g=new THREE.Group();

  const main=box(width,height,depth,mat);
  main.position.y=0;
  g.add(main);

  const left=box(width*.42,height*.55,depth*1.35,MAT.carbon2);
  left.position.set(-width*.29,-.12,.08);
  g.add(left);

  const right=box(width*.42,height*.55,depth*1.35,MAT.carbon2);
  right.position.set(width*.29,-.12,.08);
  g.add(right);

  return g;
}

const keys={};

addEventListener("keydown",e=>{
  keys[e.code]=true;

  if(e.code==="KeyR") resetCar();
  if(e.code==="KeyN") nextTrack();

  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)){

const velocity=new THREE.Vector3();

let yaw=0;
let yawRate=0;
let wheelSpin=0;

let speed=0;
let raceTime=0;
let running=false;
let finished=false;
let countdown=3;

let trackDistance=0;
let currentCheckpoint=0;

const MAX_SPEED=170;
const REVERSE_SPEED=22;

function getForward(){
  return new THREE.Vector3(
    -Math.sin(yaw),
    0,
    -Math.cos(yaw)
  );
}

function getRight(){
  return new THREE.Vector3(
    Math.cos(yaw),
    0,
    -Math.sin(yaw)
  );
}

function nearestTrackInfo(pos){
  let best=Infinity;
  let bestIndex=0;

  // Sample most of the track. This is deliberately robust for giant circuits.
  const step=centerline.length>6000?4:1;

  for(let i=0;i<centerline.length;i+=step){
    const dx=pos.x-centerline[i].p.x;
    const dz=pos.z-centerline[i].p.z;
    const d=dx*dx+dz*dz;

    if(d<best){
      best=d;
      bestIndex=i;
    }
  }

  const f=trackFrames[bestIndex];

  return {
    index:bestIndex,
    distance:f.distance,
    lateral:pos.clone().sub(f.p).dot(f.right),
    frame:f,
    distanceSq:best
  };
}

function updatePhysics(dt){
  if(!running || finished)return;

  const throttle=keys.KeyW||keys.ArrowUp;
  const brake=keys.KeyS||keys.ArrowDown;

  /*
   IMPORTANT:
   User requested inverted steering:
   A = RIGHT
   D = LEFT

   Positive yaw in this coordinate system produces a left turn.
   Therefore:
   A -> negative yaw
   D -> positive yaw
  */
  let steer=0;

  if(keys.KeyA||keys.ArrowLeft)steer=-1;
  if(keys.KeyD||keys.ArrowRight)steer=1;

  const handbrake=keys.Space;

  const forward=getForward();
  const right=getRight();

  let forwardSpeed=velocity.dot(forward);
  let lateralSpeed=velocity.dot(right);

  /* engine */
  if(throttle){
    const accel=82*(1-Math.min(Math.abs(forwardSpeed)/MAX_SPEED,.92));
    forwardSpeed+=accel*dt;
  }

  /* rolling resistance */
  forwardSpeed*=Math.pow(.997,dt*60);

  /* braking */
  if(brake){
    if(forwardSpeed>0){
      forwardSpeed-=145*dt;
      if(forwardSpeed<0)forwardSpeed=0;
    }else{
      forwardSpeed-=55*dt;
    }
  }

  /* reverse */
  if(!throttle && forwardSpeed<0){
    forwardSpeed+=32*dt;
    if(forwardSpeed>0)forwardSpeed=0;
  }

  /* handbrake */
  const grip=handbrake?1.45:4.8;

  lateralSpeed-=lateralSpeed*grip*dt;

  /*
   Semi-drift yaw.
   Steering remains effective at enormous speeds.
  */
  const speedFactor=THREE.MathUtils.clamp(
    Math.abs(forwardSpeed)/70,.15,2.0
  );

  const steeringStrength=
    THREE.MathUtils.clamp(
      3.25/(.55+Math.abs(forwardSpeed)/90),
      .55,
      3.1
    );

  const targetYawRate=
    steer*steeringStrength*
    THREE.MathUtils.clamp(Math.abs(forwardSpeed)/28,.12,2.5);

  yawRate=THREE.MathUtils.lerp(
    yawRate,
    targetYawRate,
    1-Math.pow(.001,dt)
  );

  if(handbrake){
    yawRate+=steer*1.0*dt;
    lateralSpeed*=Math.pow(.92,dt*60);
  }

  yaw+=yawRate*dt;

  /* controlled aerodynamic velocity alignment */
  const newForward=getForward();
  const newRight=getRight();

  let newVelocity=
    newForward.clone().multiplyScalar(forwardSpeed)
    .add(newRight.clone().multiplyScalar(lateralSpeed));

  velocity.copy(newVelocity);

  /* absolute speed limit */
  const horizontalSpeed=Math.sqrt(
    velocity.x*velocity.x+
    velocity.z*velocity.z
  );

  if(horizontalSpeed>MAX_SPEED){
    velocity.multiplyScalar(MAX_SPEED/horizontalSpeed);
  }

  /* Move */
  car.position.addScaledVector(velocity,dt);

  /*
   Tiny chassis response.
  */
  const slipAngle=Math.atan2(
    lateralSpeed,
    Math.max(Math.abs(forwardSpeed),1)
  );

  carVisual.rotation.z=THREE.MathUtils.lerp(
    carVisual.rotation.z,
    -slipAngle*.34-yawRate*.035,
    1-Math.pow(.001,dt)
  );

  carVisual.rotation.x=THREE.MathUtils.lerp(
    carVisual.rotation.x,
    -Math.min(Math.abs(forwardSpeed)/MAX_SPEED,.8)*.018,
    1-Math.pow(.01,dt)
  );

  /* wheel spin */
  wheelSpin+=forwardSpeed*dt/.39;

  for(const w of wheels){
    w.spin.rotation.x=wheelSpin;

    if(w.steer){
      const visualSteer=steer*
        THREE.MathUtils.clamp(
          .52/(.35+Math.abs(forwardSpeed)/100),
          .20,
          .52
        );

      w.steer.rotation.y=THREE.MathUtils.lerp(
        w.steer.rotation.y,
        visualSteer,
        1-Math.pow(.0005,dt)
      );
    }
  }

  /* Track interaction */
  const info=nearestTrackInfo(car.position);

  const edge=Math.abs(info.lateral);

  /*
    CURBS:
    Extremely low slowdown.
    They are basically usable racing surface now.
  */
  if(edge>ROAD_WIDTH/2 && edge<ROAD_WIDTH/2+CURB_WIDTH){
    velocity.multiplyScalar(Math.pow(.995,dt*60));
  }

  /* grass */
  if(edge>ROAD_WIDTH/2+CURB_WIDTH){
    velocity.multiplyScalar(Math.pow(.965,dt*60));
    lateralSpeed*=Math.pow(.80,dt*60);
  }

  /* barriers */
  if(edge>ROAD_WIDTH/2+CURB_WIDTH+7){
    velocity.multiplyScalar(.72);
  }

  /* distance progression */
  trackDistance=info.distance;

  if(currentCheckpoint<checkpointObjects.length){
    const cp=checkpointObjects[currentCheckpoint];

    if(car.position.distanceTo(cp.position)<ROAD_WIDTH*.9){
      currentCheckpoint++;
      flash(.08);
    }
  }

  if(currentCheckpoint>=checkpointObjects.length &&
     info.index>centerline.length*.96){
    finishRace();
  }

  speed=Math.sqrt(
    velocity.x*velocity.x+
    velocity.z*velocity.z
  );
}

const cameraPos=new THREE.Vector3();
const cameraLook=new THREE.Vector3();

function updateCamera(dt){
  const forward=getForward();

  /*
   Much closer than the old camera.
   Low, aggressive chase perspective.
  */
  const speedNorm=THREE.MathUtils.clamp(speed/MAX_SPEED,0,1);

  const distance=7.7-speedNorm*1.4;
  const height=3.45-speedNorm*.45;

  const desiredPos=car.position.clone()
    .add(forward.clone().multiplyScalar(-distance))
    .add(new THREE.Vector3(0,height,0));

  cameraPos.lerp(
    desiredPos,
    1-Math.pow(.0007,dt)
  );

  camera.position.copy(cameraPos);

  const lookTarget=car.position.clone()
    .add(forward.clone().multiplyScalar(15+speedNorm*22))
    .add(new THREE.Vector3(0,1.05,0));

  cameraLook.lerp(
    lookTarget,
    1-Math.pow(.0003,dt)
  );

  camera.lookAt(cameraLook);

  /*
   Dynamic FOV makes high speed feel considerably faster.
  */
  const targetFov=68+speedNorm*28;

  camera.fov=THREE.MathUtils.lerp(
    camera.fov,
    targetFov,
    1-Math.pow(.0008,dt)
  );

  camera.updateProjectionMatrix();

  /* subtle speed vibration */
  if(speedNorm>.55){
    const shake=(speedNorm-.55)*.025;
    camera.position.x+=Math.sin(performance.now()*.035)*shake;
    camera.position.y+=Math.cos(performance.now()*.041)*shake*.7;
  }
}

let streaks=[];

function createSpeedStreaks(){
  const group=new THREE.Group();

  const mat=new THREE.LineBasicMaterial({
    color:0x9fcaff,
    transparent:true,
    opacity:.28
  });

  for(let i=0;i<90;i++){
    const geo=new THREE.BufferGeometry().setFromPoints([
      new THREE.Vector3(0,0,0),
      new THREE.Vector3(0,0,-1)
    ]);

    const line=new THREE.Line(geo,mat);
    group.add(line);
    streaks.push(line);
  }

  scene.add(group);
}

createSpeedStreaks();

function updateStreaks(){
  const amount=THREE.MathUtils.clamp(speed/MAX_SPEED,0,1);

  for(let i=0;i<streaks.length;i++){
    const s=streaks[i];

    const angle=(i/streaks.length)*Math.PI*2;
    const radius=7+((i*37)%100)/100*8;

    const x=Math.cos(angle)*radius;
    const y=1.2+Math.sin(angle)*3.2;
    const z=-8-Math.random()*8;

    s.visible=amount>.52;

    if(!s.visible)continue;

    const len=.4+amount*5;

    s.position.copy(car.position);

    const offset=new THREE.Vector3(
      x,
      y,
      z
    );

    offset.applyAxisAngle(
      new THREE.Vector3(0,1,0),
      yaw
    );

    s.position.add(offset);

    const dir=getForward().clone().multiplyScalar(-len);

    s.geometry.setFromPoints([
      new THREE.Vector3(0,0,0),
      dir
    ]);
  }
}

    bestTimes[trackIndex]===undefined ||
    raceTime<bestTimes[trackIndex]

function resetCar(){
  if(!centerline.length)return;

  const p=centerline[0].p;
  const d=centerline[1].p.clone()
    .sub(centerline[0].p)
    .normalize();

  car.position.copy(p);

  /*
   Correct starting orientation.
   Car's nose points along local -Z.
  */
  yaw=Math.atan2(-d.x,-d.z);

  car.rotation.y=yaw;
  carVisual.rotation.set(0,0,0);

  velocity.set(0,0,0);
  speed=0;
  yawRate=0;
  wheelSpin=0;
  trackDistance=0;
  currentCheckpoint=0;
  raceTime=0;

  cameraPos.copy(
    car.position.clone()
      .add(getForward().multiplyScalar(-8))
      .add(new THREE.Vector3(0,3.5,0))
  );

  cameraLook.copy(car.position);

  messageEl.textContent="";
  subEl.textContent="";

  showStart();
}

const smokeParticles=[];

function createSmokeParticle(){
  const mesh=sphere(.12,.12,.12,
    new THREE.MeshBasicMaterial({
      color:0xb8bec5,
      transparent:true,
      opacity:.18
    })
  );

  mesh.visible=false;
  scene.add(mesh);

  smokeParticles.push({
    mesh,
    life:0,
    velocity:new THREE.Vector3()
  });
}

for(let i=0;i<45;i++)createSmokeParticle();

let smokeClock=0;

function spawnSmoke(){
  const lateral=Math.abs(
    velocity.dot(getRight())
  );

  if(
    speed<55 ||
    lateral<7 ||
    smokeClock<.035
  )return;

  smokeClock=0;

  const candidates=smokeParticles.filter(p=>!p.mesh.visible);

  if(!candidates.length)return;

  const p=candidates[0];

  const side=lateral>0?1:-1;

  p.mesh.position.copy(car.position);

  p.mesh.position.add(
    getRight().multiplyScalar(side*1.1)
  );

  p.mesh.position.y=.55;

  p.life=.55;
  p.mesh.visible=true;
  p.mesh.scale.setScalar(.4);

  p.velocity.set(
    (Math.random()-.5)*2,
    2+Math.random()*1.5,
    (Math.random()-.5)*2
  );
}

function updateSmoke(dt){
  smokeClock+=dt;

  for(const p of smokeParticles){
    if(!p.mesh.visible)continue;

    p.life-=dt;

    if(p.life<=0){
      p.mesh.visible=false;
      continue;
    }

    p.mesh.position.addScaledVector(
      p.velocity,
      dt
    );

    p.velocity.y-=.5*dt;

    const t=1-p.life/.55;

    p.mesh.scale.setScalar(
      .4+t*1.8
    );

    p.mesh.material.opacity=
      .18*(1-t);
  }

  spawnSmoke();
}

   RESIZE
   ========================================================= */

addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

/* =========================================================
   EXTRA TRACK LIGHTING
   ========================================================= */

function addTrackLights(){
  for(let i=0;i<30;i++){
    const x=(Math.random()-.5)*4000;
    const z=(Math.random()-.5)*4000;

    const light=new THREE.PointLight(
      0xff5a28,
      .7,
      80
    );

    light.position.set(x,8,z);
    scene.add(light);
  }
}

addTrackLights();

/* =========================================================
   CAMERA SPEED BLUR SIMULATION
   ========================================================= */

const flashElement=document.getElementById("flash");

setInterval(()=>{
  if(speed>145){
    flashElement.style.opacity=.012;
    setTimeout(()=>{
      flashElement.style.opacity=0;
    },25);
  }
},70);

</script>
</body>
