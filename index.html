<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grand Prix Arcade</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:Arial,sans-serif}
canvas{display:block}#load,#err{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:#111;color:#fff}
#err{display:none;padding:30px;box-sizing:border-box}#err pre{white-space:pre-wrap;color:#f77}
#hud{position:fixed;inset:0;pointer-events:none;color:#fff;z-index:5}
.box{background:#090d12cc;border:1px solid #ffffff33;border-radius:10px;padding:8px 12px}
#top{position:absolute;top:15px;left:15px;display:flex;gap:8px}#pos{font-size:28px;font-weight:900}
#lap{font-weight:800}#track{position:absolute;top:15px;left:50%;transform:translateX(-50%);font-weight:900}
#count{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:100px;font-weight:900}
#speed{position:absolute;right:15px;bottom:15px;text-align:right;font-size:50px;font-weight:900}
#speed small{display:block;font-size:12px}#help{position:absolute;left:15px;bottom:15px;font-size:11px;opacity:.7}
#finish{display:none;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;padding:28px 45px;border-radius:16px;background:#090d12ee}
</style>
</head>
<body>
<div id="load">LOADING GRAND PRIX...</div><div id="err"><div><h1>GAME ERROR</h1><pre id="et"></pre></div></div>
<script>
window.addEventListener("error",e=>{let x=document.getElementById("err");document.getElementById("et").textContent=e.message||"Unknown error";x.style.display="grid"});
</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<div id="hud">
<div id="top"><div class="box" id="pos">P1</div><div class="box" id="lap">LAP 1 / 3</div></div>
<div class="box" id="track">SUNSET GP</div><div id="count">3</div>
<div id="speed" class="box">0<small>KM/H</small></div>
<div id="help">W/↑ THROTTLE &nbsp; S/↓ BRAKE &nbsp; A/← LEFT &nbsp; D/→ RIGHT &nbsp; R RESET &nbsp; N NEXT TRACK</div>
<div id="finish"><h1>FINISHED</h1><div id="finishText"></div></div>
</div>
<script>
"use strict";
if(!THREE)throw Error("Three.js did not load");
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,.1,3000);
scene.background=new THREE.Color(0x91a9bb);scene.fog=new THREE.Fog(0x91a9bb,350,1800);
const ren=new THREE.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);ren.shadowMap.enabled=true;ren.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(ren.domElement);
scene.add(new THREE.HemisphereLight(0xdceeff,0x53613c,1.7));
const sun=new THREE.DirectionalLight(0xffffff,2.3);sun.position.set(-250,400,150);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.5}),grass=mat(0x526c42),road=mat(0x55585b),run=mat(0x34383b),red=mat(0xb9272f),white=mat(0xe8e8e8),dark=mat(0x171b20),glass=new THREE.MeshStandardMaterial({color:0x07131d,roughness:.18,metalness:.2,transparent:true,opacity:.9}),tire=mat(0x090a0b),rim=new THREE.MeshStandardMaterial({color:0x9aa0a6,metalness:.7,roughness:.25});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(6000,6000),grass);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const defs=[
["SUNSET GP","MEDIUM",[[-170,-40],[-140,-170],[-30,-230],[105,-205],[185,-115],[160,-5],[225,70],[175,170],[60,220],[-70,205],[-170,145],[-235,50]]],
["MOUNTAIN RING","HARD",[[-230,-40],[-190,-180],[-40,-250],[105,-210],[210,-115],[180,-20],[95,20],[165,105],[110,225],[-35,260],[-150,205],[-230,115],[-150,40]]],
["GRAND PRIX LOOP","EASY",[[-210,-90],[-155,-205],[0,-245],[155,-205],[215,-90],[210,55],[135,175],[0,225],[-145,185],[-215,65]]],
["HAIRPIN EXTREME","EXPERT",[[-240,-25],[-210,-170],[-85,-245],[55,-220],[190,-150],[220,-50],[90,-10],[205,80],[170,205],[25,245],[-95,190],[-180,90],[-70,35]]]
];
let ti=0,curve,samples=[],cars=[],player,running=false,count=3,ct=0,last=performance.now(),keys={},finished=false;
const W=20, $=id=>document.getElementById(id);

function box(p,s,pos,m){let q=new THREE.Mesh(new THREE.BoxGeometry(s[0],s[1],s[2]),m);q.position.set(...pos);q.castShadow=true;q.receiveShadow=true;p.add(q);return q}
function wedge(w,h,l,tip,m){let x=w/2,z=l/2,g=new THREE.BufferGeometry(),v=[-x,0,-z,x,0,-z,x,0,z,-x,0,z,-x,h,-z+tip,x,h,-z+tip,x*.72,h,z*.72,-x*.72,h,z*.72],i=[0,1,2,0,2,3,4,7,6,4,6,5,0,4,5,0,5,1,1,5,6,1,6,2,2,6,7,2,7,3,4,0,3,4,3,7];g.setAttribute("position",new THREE.Float32BufferAttribute(v,3));g.setIndex(i);g.computeVertexNormals();let q=new THREE.Mesh(g,m);q.castShadow=true;p.add(q);return q}

function car(color,num,me){
 let r=new THREE.Group(),b=new THREE.Group();r.add(b);let paint=mat(color);
 box(b,[2.05,.16,4.65],[0,.48,.12],dark);
 let a=wedge(1.72,.52,3.15,.12,paint);a.position.set(0,.53,.18);
 a=wedge(.82,.30,2.05,0,paint);a.position.set(0,.69,-2.15);
 box(b,[1.15,.34,1.65],[-1.05,.68,.55],paint);box(b,[1.15,.34,1.65],[1.05,.68,.55],paint);
 let cp=new THREE.Mesh(new THREE.SphereGeometry(.55,16,10),glass);cp.scale.set(1,.62,1.4);cp.position.set(0,1.05,-.18);b.add(cp);
 let he=new THREE.Mesh(new THREE.SphereGeometry(.3,12,8),white);he.position.set(0,1.42,-.28);b.add(he);
 box(b,[1.05,.08,.1],[0,1.52,-.22],white);box(b,[.08,.42,.08],[-.48,1.33,-.22],white);box(b,[.08,.42,.08],[.48,1.33,-.22],white);
 box(b,[2.45,.1,.52],[0,.5,-3.05],dark);box(b,[2,.1,.38],[0,.4,-3.18],paint);
 box(b,[2.3,.12,.48],[0,1.15,2.12],dark);box(b,[1.65,1,.1],[0,1.63,2.28],paint);
 let ws=[];[[-1.02,.55,-2],[1.02,.55,-2],[-1.08,.58,1.62],[1.08,.58,1.62]].forEach((p,i)=>{let sp=new THREE.Group(),sw=new THREE.Group();sp.position.set(...p);let t=new THREE.Mesh(new THREE.CylinderGeometry(.48,.48,.34,18),tire);t.rotation.z=Math.PI/2;sw.add(t);let rr=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,.355,14),rim);rr.rotation.z=Math.PI/2;sw.add(rr);sp.add(sw);r.add(sp);ws.push({steer:sp,spin:sw})});
 let st={velocity:new THREE.Vector3(),speed:0,progress:0,lap:1,steer:0,yaw:0,last:.0};
 if(me){let stripe=box(b,[.18,.015,3.7],[0,1,.05],mat(0xf28a19))}
 r.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return {mesh:r,wheels:ws,state:st,player:me,number:num};
}
function info(t){t=(t%1+1)%1;return{p:curve.getPointAt(t),t:curve.getTangentAt(t).normalize()}}
function nearest(p){
 let best=1e99,s=0,sp=null,ta=null,n=null;
 for(let i=0;i<samples.length;i+=5){let q=samples[i],dx=p.x-q.p.x,dz=p.z-q.p.z,d=dx*dx+dz*dz;if(d<best){best=d;s=q.s;sp=q.p;ta=q.t;n=q.n}}
 return{s,p:sp,t:ta,n,d:Math.sqrt(best)}
}
function scenery(){
 for(let i=0;i<90;i++){let q=info(i/90),n=new THREE.Vector3(-q.t.z,0,q.t.x),side=i%2?1:-1,g=new THREE.Group();g.position.copy(q.p).addScaledVector(n,70+(i%5)*12);box(g,[.6,3,.6],[0,1.5,0],mat(0x6b4427));let l=new THREE.Mesh(new THREE.SphereGeometry(2.8,8,6),mat(0x315b31));l.position.y=4.4;g.add(l);scene.add(g)}
}
function stands(){
 for(let k=0;k<7;k++){let q=info((k+.15)/7),n=new THREE.Vector3(-q.t.z,0,q.t.x),t=new THREE.Group();t.position.copy(q.p).addScaledVector(n,48);t.rotation.y=Math.atan2(q.t.x,q.t.z);scene.add(t);box(t,[27,.8,8],[0,.5,0],dark);for(let row=0;row<5;row++){box(t,[25,.22,5],[0,1.3+row*.85,0],white);for(let j=0;j<12;j++){let f=new THREE.Group();f.position.set(-10+j*1.8,1.65+row*.85,-1.5);box(f,[.28,.55,.22],[0,0,0],mat([0xffffff,0xffcc22,0x3388dd,0xe53935,0x33aa66][(j+row)%5]));let h=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),white);h.position.y=.38;f.add(h);t.add(f)}}box(t,[27,.35,1.2],[0,6,0],dark)}
}
function build(){
 document.querySelectorAll(".world").forEach(x=>x.remove());
 curve=new THREE.CatmullRomCurve3(defs[ti][2].map(p=>new THREE.Vector3(p[0],0,p[1])),true,"centripetal",.5);
 samples=[];for(let i=0;i<1000;i++){let t=i/1000,p=curve.getPointAt(t),ta=curve.getTangentAt(t).normalize();samples.push({s:t,p,t:ta,n:new THREE.Vector3(-ta.z,0,ta.x)})}
 let pts=curve.getPoints(500),v=[],ix=[];pts.forEach((p,i)=>{let ta=curve.getTangentAt(i/499).normalize(),n=new THREE.Vector3(-ta.z,0,ta.x);v.push(p.x+n.x*W/2,.04,p.z+n.z*W/2,p.x-n.x*W/2,.04,p.z-n.z*W/2)});for(let i=0;i<pts.length-1;i++){let a=i*2;ix.push(a,a+1,a+2,a+1,a+3,a+2)}let g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(v,3));g.setIndex(ix);g.computeVertexNormals();let rm=new THREE.Mesh(g,road);rm.receiveShadow=true;rm.name="world";scene.add(rm);
 let rv=[],ri=[];pts.forEach((p,i)=>{let ta=curve.getTangentAt(i/499).normalize(),n=new THREE.Vector3(-ta.z,0,ta.x);rv.push(p.x+n.x*35,.02,p.z+n.z*35,p.x-n.x*35,.02,p.z-n.z*35)});for(let i=0;i<pts.length-1;i++){let a=i*2;ri.push(a,a+1,a+2,a+1,a+3,a+2)}g=new THREE.BufferGeometry();g.setAttribute("position",new THREE.Float32BufferAttribute(rv,3));g.setIndex(ri);let rr=new THREE.Mesh(g,run);rr.name="world";scene.add(rr);
 for(let i=0;i<pts.length-1;i+=2){let t=i/499,q=info(t),n=new THREE.Vector3(-q.t.z,0,q.t.x);[-1,1].forEach(s=>{let c=new THREE.Mesh(new THREE.BoxGeometry(1.7,.08,2.2),i%4?white:red);c.position.copy(q.p).addScaledVector(n,s*(W/2+.8));c.position.y=.1;c.rotation.y=Math.atan2(q.t.x,q.t.z);c.name="world";scene.add(c)})}
 stands();scenery();$("track").textContent=defs[ti][0]+" • "+defs[ti][1];
}
function startCars(){
 cars.forEach(c=>scene.remove(c.mesh));cars=[];let colors=[0xff7a18,0x1e65d6,0xe63131,0x18a65a,0xb53ad4,0xffc928,0xeeeeee,0x18a9a8,0x333333,0xd56a24,0x7b48d8];
 for(let i=0;i<11;i++){let c=car(colors[i],i?String(i):"5",i===0),s=.015-i*.006,q=info(s),n=new THREE.Vector3(-q.t.z,0,q.t.x);c.mesh.position.copy(q.p).addScaledVector(n,i%2? .7:-.7);c.mesh.position.y=.03;c.state.yaw=Math.atan2(-q.t.x,-q.t.z);c.mesh.rotation.y=c.state.yaw;c.state.progress=s;c.state.last=s;scene.add(c.mesh);cars.push(c)}
 player=cars[0];
}
function reset(){running=false;finished=false;count=3;ct=0;$("count").style.display="block";$("count").textContent="3";$("finish").style.display="none";startCars()}
function drive(c,dt){
 let s=c.state,th=keys.w||keys.arrowup,br=keys.s||keys.arrowdown;
 if(!running||finished){s.speed*=Math.pow(.01,dt);return}
 s.speed+=th?118*dt:-26*dt;if(br)s.speed-=155*dt;s.speed=Math.max(0,Math.min(172,s.speed));
 let st=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);s.steer=THREE.MathUtils.damp(s.steer,st,.12,dt*60);s.yaw+=s.steer*(.25+.75*Math.min(s.speed/80,1))*1.25*dt;
 let f=new THREE.Vector3(-Math.sin(s.yaw),0,-Math.cos(s.yaw));s.velocity.copy(f).multiplyScalar(s.speed);c.mesh.position.addScaledVector(s.velocity,dt);
 let q=nearest(c.mesh.position);s.progress=q.s;s.lateral=(c.mesh.position.x-q.p.x)*q.n.x+(c.mesh.position.z-q.p.z)*q.n.z;
 if(Math.abs(s.lateral)>W*.42){c.mesh.position.addScaledVector(q.n,-Math.sign(s.lateral)*Math.min((Math.abs(s.lateral)-W*.42)*2.5,30)*dt);s.speed*=Math.pow(.25,dt)}
 if(Math.abs(s.lateral)>W*.62){c.mesh.position.lerp(q.p,.06);s.speed*=.92}
 c.mesh.rotation.y=s.yaw;c.wheels[0].steer.rotation.y=c.wheels[1].steer.rotation.y=s.steer*.45;c.wheels.forEach(w=>w.spin.rotation.x+=s.speed*dt/.42);
 if(s.progress<.03&&s.last>.95)s.lap++;s.last=s.progress;
 if(s.lap>3&&!finished){finished=true;$("finish").style.display="block";$("finishText").textContent="You finished the race!"}
}
function ai(c,dt,id){
 let s=c.state;if(!running||finished){s.speed*=Math.pow(.01,dt);return}
 let q=nearest(c.mesh.position),look=.018+Math.min(s.speed/172,.8)*.025,t=info(q.s+look),far=info(q.s+look+.025),cur=Math.acos(THREE.MathUtils.clamp(t.t.dot(far.t),-1,1)),target=Math.max(70,172-Math.min(cur*1100,115));
 s.speed+=THREE.MathUtils.clamp(target-s.speed,-100*dt,65*dt);s.speed=Math.max(45,Math.min(172,s.speed));
 let yaw=Math.atan2(-(t.p.x-c.mesh.position.x),-(t.p.z-c.mesh.position.z)),d=yaw-s.yaw;while(d>Math.PI)d-=Math.PI*2;while(d<-Math.PI)d+=Math.PI*2;s.yaw+=THREE.MathUtils.clamp(d,-1.8*dt,1.8*dt);
 let f=new THREE.Vector3(-Math.sin(s.yaw),0,-Math.cos(s.yaw));s.velocity.copy(f).multiplyScalar(s.speed);c.mesh.position.addScaledVector(s.velocity,dt);
 if(Math.abs(q.d)>W*.55)c.mesh.position.lerp(q.p,.08);s.progress=q.s;if(s.progress<.03&&s.last>.95)s.lap++;s.last=s.progress;s.steer=THREE.MathUtils.damp(s.steer,Math.max(-1,Math.min(1,d*2.4)),.1,dt*60);c.mesh.rotation.y=s.yaw;c.wheels[0].steer.rotation.y=c.wheels[1].steer.rotation.y=s.steer*.45;c.wheels.forEach(w=>w.spin.rotation.x+=s.speed*dt/.42)
}
function collide(){
 for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){let a=cars[i],b=cars[j],dx=b.mesh.position.x-a.mesh.position.x,dz=b.mesh.position.z-a.mesh.position.z,d2=dx*dx+dz*dz;if(d2>=10.56)continue;let d=Math.sqrt(d2)||.001,nx=dx/d,nz=dz/d,o=3.25-d;let ma=a.player ? 0.55 : 0.5,mb=b.player ? 0.55 : 0.5;a.mesh.position.x-=nx*o*ma;a.mesh.position.z-=nz*o*ma;b.mesh.position.x+=nx*o*mb;b.mesh.position.z+=nz*o*mb;a.state.speed*=.98;b.state.speed*=.98}
}
function camUpdate(dt){let s=player.state,f=new THREE.Vector3(-Math.sin(s.yaw),0,-Math.cos(s.yaw)),want=player.mesh.position.clone().addScaledVector(f,-7.7).add(new THREE.Vector3(0,3.2,0));cam.position.lerp(want,1-Math.pow(.001,dt));cam.lookAt(player.mesh.position.clone().addScaledVector(f,5).add(new THREE.Vector3(0,.75,0)));cam.fov=66+Math.min(s.speed/172,1)*10;cam.updateProjectionMatrix()}
function frame(now){requestAnimationFrame(frame);let dt=Math.min((now-last)/1000,.035);last=now;
 if(!running){ct+=dt;if(ct>1){ct=0;count--;if(count>0)$("count").textContent=count;else if(count===0)$("count").textContent="GO!";else{running=true;$("count").style.display="none"}}}
 cars.forEach((c,i)=>c.player?drive(c,dt):ai(c,dt,i));collide();camUpdate(dt);let sorted=[...cars].sort((a,b)=>(b.state.lap-1+b.state.progress)-(a.state.lap-1+a.state.progress));$("pos").textContent="P"+(sorted.indexOf(player)+1);$("lap").textContent="LAP "+Math.min(player.state.lap,3)+" / 3";$("speed").firstChild.textContent=Math.round(player.state.speed*3.6);ren.render(scene,cam)}
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()=="r")reset();if(e.key.toLowerCase()=="n"){ti=(ti+1)%defs.length;build();reset()}});addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});
build();startCars();$("load").style.display="none";requestAnimationFrame(frame);
</script>
</body>
</html>
