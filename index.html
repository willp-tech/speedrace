/* ============================================================
   HELPERS
============================================================ */

function box(
    x,
    y,
    z,
    material
){
    const m=new THREE.Mesh(
        new THREE.BoxGeometry(
            x,y,z
        ),
        material
    );

    m.castShadow=true;
    m.receiveShadow=true;

    return m;
}

function sphere(
    x,
    y,
    z,
    material
){
    const m=new THREE.Mesh(
        new THREE.SphereGeometry(
            1,
            20,
            12
        ),
        material
    );

    m.scale.set(
        x,y,z
    );

    m.castShadow=true;
    m.receiveShadow=true;

    return m;
}

function cylinder(
    radius,
    height,
    material,
    segments=20
){
    const m=new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            segments
        ),
        material
    );

    m.castShadow=true;
    m.receiveShadow=true;

    return m;
}

function timeString(t){

    const minutes=Math.floor(t/60);

    const seconds=Math.floor(t%60);

    const milliseconds=
        Math.floor((t%1)*1000);

    return (
        String(minutes).padStart(2,"0")
        +":"+
        String(seconds).padStart(2,"0")
        +"."+
        String(milliseconds).padStart(3,"0")
    );
}

/* ============================================================
   TRACK
============================================================ */

const ROAD_WIDTH=46;
const CURB_WIDTH=4;

let centerline=[];
let frames=[];
let trackGroup;

let trackLength=0;

const trackDefinitions=[

[
    ["S",500],
    ["R",130,95],
    ["S",300],
    ["L",90,170],
    ["S",230],
    ["L",120,115],
    ["R",105,125],

    ["S",500]
],

[
    ["S",650],

    ["S",340],
    ["R",75,170],
    ["S",260],
    ["R",75,170],
    ["S",460],

],

[

    ["S",390],

    ["S",500],
    ["R",140,135],
    ["S",350],
    ["L",120,180],
    ["S",650]
]

];

let currentTrack=0;

function generateTrack(def){

    const points=[];

    let position=
        new THREE.Vector3(
            0,0,0
        );

    let direction=
        new THREE.Vector3(
            0,0,-1
        );

    points.push({
        p:position.clone(),
        d:direction.clone()
    });

    for(const section of def){

        const type=section[0];

        if(type==="S"){

            const length=section[1];

            const count=
                Math.max(
                    2,
                    Math.floor(length/9)
                );

            for(let i=1;i<=count;i++){

                const p=
                    position.clone()
                    .add(
                        direction.clone()
                        .multiplyScalar(
                            length*i/count
                        )
                    );

                points.push({
                    p:p.clone(),
                    d:direction.clone()
                });
            }

            position=
                position.clone()
                .add(
                    direction.clone()
                    .multiplyScalar(length)
                );
        }

        else{

            const radius=section[1];

            const angle=
                THREE.MathUtils.degToRad(
                    section[2]
                );

            const left=
                type==="L";

            const side=
                new THREE.Vector3(
                    -direction.z,
                    0,
                    direction.x
                ).multiplyScalar(
                    left?1:-1
                );

            const center=
                position.clone()
                .add(
                    side.clone()
                    .multiplyScalar(radius)
                );

            const startAngle=
                Math.atan2(
                    position.z-center.z,
                    position.x-center.x
                );

            const count=
                Math.max(
                    8,
                    Math.floor(
                        Math.abs(section[2])/3
                    )
                );

            for(let i=1;i<=count;i++){

                const a=
                    startAngle+
                    (left?angle:-angle)*
                    i/count;

                const p=
                    new THREE.Vector3(
                        center.x+
                        Math.cos(a)*radius,
                        0,
                        center.z+
                        Math.sin(a)*radius
                    );

                let d;

                if(left){

                    d=new THREE.Vector3(
                        -Math.sin(a),
                        0,
                        Math.cos(a)
                    );

                }else{

                    d=new THREE.Vector3(
                        Math.sin(a),
                        0,
                        -Math.cos(a)
                    );
                }

                points.push({
                    p,
                    d:d.normalize()
                });
            }

            position=
                points[points.length-1]
                .p.clone();

            direction=
                points[points.length-1]
                .d.clone();
        }
    }

    return points;
}

function makeRibbon(
    points,
    width,
    material,
    y=0
){

    const positions=[];
    const indices=[];

    for(let i=0;i<points.length;i++){

        const p=points[i].p;

        let d;

        if(i===0){

            d=
                points[1].p
                .clone()
                .sub(points[0].p)
                .normalize();

        }else if(i===points.length-1){

            d=
                points[i].p
                .clone()
                .sub(points[i-1].p)
                .normalize();

        }else{

            d=
                points[i+1].p
                .clone()
                .sub(points[i-1].p)
                .normalize();
        }

        const right=
            new THREE.Vector3(
                -d.z,
                0,
                d.x
            ).normalize();

        const leftPoint=
            p.clone()
            .add(
                right.clone()
                .multiplyScalar(width/2)
            );

        const rightPoint=
            p.clone()
            .sub(
                right.clone()
                .multiplyScalar(width/2)
            );

        leftPoint.y=y;
        rightPoint.y=y;

        positions.push(
            leftPoint.x,
            leftPoint.y,
            leftPoint.z,

            rightPoint.x,
            rightPoint.y,
            rightPoint.z
        );

        if(i<points.length-1){

            const a=i*2;

            indices.push(
                a,
                a+1,
                a+2,

                a+1,
                a+3,
                a+2
            );
        }
    }

    const geometry=
        new THREE.BufferGeometry();

    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );

    geometry.setIndex(indices);

    geometry.computeVertexNormals();

    const mesh=
        new THREE.Mesh(
            geometry,
            material
        );

    mesh.receiveShadow=true;

    return mesh;
}

function createCurbs(){

    for(let side=-1;side<=1;side+=2){

        for(let i=0;i<centerline.length-1;i+=10){

            const end=
                Math.min(
                    i+10,
                    centerline.length-1
                );

            const section=
                centerline.slice(
                    i,
                    end+1
                );

            const points=
                section.map(point=>{

                    const index=
                        centerline.indexOf(
                            point
                        );

                    const d=
                        index<centerline.length-1
                        ?
                        centerline[index+1].p
                        .clone()
                        .sub(point.p)
                        .normalize()
                        :
                        centerline[index].d;

                    const right=
                        new THREE.Vector3(
                            -d.z,
                            0,
                            d.x
                        ).normalize();

                    return {
                        p:
                            point.p.clone()
                            .add(
                                right.multiplyScalar(
                                    side*
                                    (ROAD_WIDTH/2+
                                    CURB_WIDTH/2)
                                )
                            )
                    };
                });

            const material=
                (Math.floor(i/10)%2===0)
                ?
                MAT.curbRed
                :
                MAT.curbWhite;

            trackGroup.add(
                makeRibbon(
                    points,
                    CURB_WIDTH,
                    material,
                    .04
                )
            );
        }
    }
}

function createBarriers(){

    for(let i=0;i<centerline.length;i+=18){

        const point=centerline[i];

        const d=
            i<centerline.length-1
            ?
            centerline[i+1].p
            .clone()
            .sub(point.p)
            .normalize()
            :
            point.d;

        const right=
            new THREE.Vector3(
                -d.z,
                0,
                d.x
            ).normalize();

        for(const side of [-1,1]){

            const p=
                point.p.clone()
                .add(
                    right.clone()
                    .multiplyScalar(
                        side*
                        (ROAD_WIDTH/2+
                        CURB_WIDTH+
                        7)
                    )
                );

            const barrier=
                box(
                    10,
                    1.0,
                    1.5,
                    MAT.barrier
                );

            barrier.position.set(
                p.x,
                .75,
                p.z
            );

            barrier.rotation.y=
                Math.atan2(
                    d.x,
                    d.z
                );

            trackGroup.add(
                barrier
            );
        }
    }
}

function buildTrack(){

    if(trackGroup)
        scene.remove(trackGroup);

    trackGroup=
        new THREE.Group();

    scene.add(trackGroup);

    centerline=
        generateTrack(
            trackDefinitions[currentTrack]
        );

    frames=[];
    trackLength=0;

    for(let i=0;i<centerline.length;i++){

        if(i>0){

            trackLength+=
                centerline[i].p
                .distanceTo(
                    centerline[i-1].p
                );
        }

        const d=
            i<centerline.length-1
            ?
            centerline[i+1].p
            .clone()
            .sub(centerline[i].p)
            .normalize()
            :
            centerline[i].d;

        const right=
            new THREE.Vector3(
                -d.z,
                0,
                d.x
            ).normalize();

        frames.push({
            p:centerline[i].p,
            tangent:d,
            right,
            distance:trackLength
        });
    }

    const ground=
        box(
            10000,
            .4,
            10000,
            MAT.grass
        );

    ground.position.y=-.3;

    trackGroup.add(ground);

    trackGroup.add(
        makeRibbon(
            centerline,
            ROAD_WIDTH,
            MAT.asphalt,
            0
        )
    );

    trackGroup.add(
        makeRibbon(
            centerline,
            15,
            MAT.racingLine,
            .01
        )
    );

    createCurbs();
    createBarriers();

    createTrackObjects();
    createStartFinish();

    resetRace();
}

/* ============================================================
   TRACK OBJECTS
============================================================ */

function createTrackObjects(){

    for(
        let i=30;
        i<centerline.length;
        i+=40
    ){

        const f=frames[i];

        for(const side of [-1,1]){

            if(i%80!==0)continue;

            const p=
                f.p.clone()
                .add(
                    f.right.clone()
                    .multiplyScalar(
                        side*42
                    )
                );

            const pole=
                cylinder(
                    .22,
                    12,
                    MAT.dark,
                    10
                );

            pole.position.set(
                p.x,
                6,
                p.z
            );

            trackGroup.add(pole);

            const sign=
                box(
                    10,
                    4,
                    .35,
                    MAT.blue
                );

            sign.position.set(
                p.x,
                12,
                p.z
            );

            sign.rotation.y=
                Math.atan2(
                    f.tangent.x,
                    f.tangent.z
                );

            trackGroup.add(sign);
        }
    }

    /* distant structures */

    for(let i=0;i<80;i++){

        const x=
            (Math.random()-.5)*7000;

        const z=
            (Math.random()-.5)*7000;

        const h=
            15+
            Math.random()*55;

        const building=
            box(
                10+
                Math.random()*20,
                h,
                10+
                Math.random()*20,
                MAT.dark
            );

        building.position.set(
            x,
            h/2,
            z
        );

        trackGroup.add(building);
    }
}

function createStartFinish(){

    const f=frames[0];

    const line=
        box(
            ROAD_WIDTH,
            .04,
            6,
            MAT.white
        );

    line.position.set(
        f.p.x,
        .06,
        f.p.z
    );

    line.rotation.y=
        Math.atan2(
            f.tangent.x,
            f.tangent.z
        );

    trackGroup.add(line);

    for(const side of [-1,1]){

        const post=
            box(
                1.1,
                10,
                1.1,
                MAT.orange
            );

        const p=
            f.p.clone()
            .add(
                f.right.clone()
                .multiplyScalar(
                    side*20
                )
            );

        post.position.set(
            p.x,
            5,
            p.z
        );

        trackGroup.add(post);
    }

    const top=
        box(
            43,
            1.3,
            1.2,
            MAT.white
        );

    top.position.set(
        f.p.x,
        10,
        f.p.z
    );

    top.rotation.y=
        Math.atan2(
            f.tangent.x,
            f.tangent.z
        );

    trackGroup.add(top);
}

function createWheel(){

    const wheelRoot=
        new THREE.Group();

    const tire=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .42,
                .42,
                .29,
                24
            ),
            MAT.tire
        );

    /*
      The cylinder axle is rotated onto X.
      wheelRoot rotates only around X for wheel spin.
    */

    tire.rotation.z=
        Math.PI/2;

    tire.castShadow=true;

    wheelRoot.add(tire);

    const rim=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .23,
                .23,
                .31,
                18
            ),
            MAT.rim
        );

    rim.rotation.z=
        Math.PI/2;

    wheelRoot.add(rim);

    const disc=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .17,
                .17,
                .315,
                18
            ),
            MAT.brake
        );

    disc.rotation.z=
        Math.PI/2;

    wheelRoot.add(disc);

    const hub=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .07,
                .07,
                .34,
                12
            ),
            MAT.dark
        );

    hub.rotation.z=
        Math.PI/2;

    wheelRoot.add(hub);

    return wheelRoot;
}

function createWing(width,depth,material){

    const group=
        new THREE.Group();

    const main=
        box(
            width,
            .12,
            depth,
            material
        );

    group.add(main);

    const upper=
        box(
            width*.82,
            .08,
            depth*.75,
            material
        );

    upper.position.y=.14;

    group.add(upper);

    return group;
}

function addNumber(
    parent,
    number,
    position,
    scale=.7
){

    const canvas=
        document.createElement("canvas");

    canvas.width=256;
    canvas.height=256;

    const ctx=
        canvas.getContext("2d");

    ctx.fillStyle="white";
    ctx.fillRect(
        0,0,256,256
    );

    ctx.fillStyle="#090b0e";

    ctx.font=
        "900 185px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillText(
        String(number),
        128,
        135
    );

    const texture=
        new THREE.CanvasTexture(
            canvas
        );

    texture.colorSpace=
        THREE.SRGBColorSpace;

    const material=
        new THREE.MeshBasicMaterial({
            map:texture
        });

    const mesh=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                scale,
                scale
            ),
            material
        );

    mesh.position.copy(
        position
    );

    parent.add(mesh);
}

function placeAICars(){

    for(let i=0;i<aiCars.length;i++){

        /*
          Spread them over the first portion of
          the actual track so they immediately
          look like a real grid.
        */

        const row=
            Math.floor(i/2);

        const column=
            i%2===0 ? -1 : 1;

        const index=
            14+
            row*10;

        const f=
            frames[
                Math.min(
                    index,
                    frames.length-1
                )
            ];

        const offset=
            f.right.clone()
            .multiplyScalar(
                column*6.2
            );

        aiCars[i].position.copy(
            f.p.clone()
            .add(offset)
        );

        /*
          The car points in the same direction
          as the track.
        */

        aiCars[i].rotation.y=
            Math.atan2(
                -f.tangent.x,
                -f.tangent.z
            );

        aiCars[i].userData.yaw=
            aiCars[i].rotation.y;

        aiCars[i].userData.speed=
            75+
            Math.random()*18;

        aiCars[i].userData.progress=
            f.distance;

        aiCars[i].userData.lane=
            column*6.2;

        aiCars[i].userData.skill=
            .92+
            Math.random()*.12;
    }
}

function nearestTrack(
    position
){

    let best=Infinity;
    let bestIndex=0;

    /*
      Coarse enough for performance,
      accurate enough for AI.
    */

    for(
        let i=0;
        i<centerline.length;
        i+=2
    ){

        const dx=
            position.x-
            centerline[i].p.x;

        const dz=
            position.z-
            centerline[i].p.z;

        const dist=
            dx*dx+dz*dz;

        if(dist<best){

            best=dist;
            bestIndex=i;
        }
    }

    return {
        index:bestIndex,
        frame:frames[bestIndex]
    };
}

function updateAI(dt){

    for(const ai of aiCars){

        const info=
            nearestTrack(
                ai.position
            );

        let targetIndex=
            info.index+
            28;

        if(
            targetIndex>=
            centerline.length
        ){
            targetIndex-=
                centerline.length;
        }

        const target=
            centerline[
                targetIndex
            ].p.clone();

        /*
          Gentle lane variation.
        */

        const targetFrame=
            frames[targetIndex];

        target.add(
            targetFrame.right.clone()
            .multiplyScalar(
                ai.userData.lane
            )
        );

        const desiredYaw=
            Math.atan2(
                -(target.x-ai.position.x),
                -(target.z-ai.position.z)
            );

        let difference=
            desiredYaw-
            ai.userData.yaw;

        while(
            difference>Math.PI
        )difference-=Math.PI*2;

        while(
            difference<-Math.PI
        )difference+=Math.PI*2;

        ai.userData.yaw+=
            THREE.MathUtils.clamp(
                difference,
                -.055,
                .055
            );

        /*
          Slow AI down naturally for corners.
        */

        const nextIndex=
            Math.min(
                targetIndex+25,
                centerline.length-1
            );

        const currentDirection=
            centerline[
                info.index
            ].d;

        const nextDirection=
            centerline[
                nextIndex
            ].d;

        const corner=
            Math.abs(
                currentDirection.dot(
                    nextDirection
                )
            );

        let targetSpeed=
            148*
            ai.userData.skill;

        if(corner<.93)
            targetSpeed*=.72;

        if(corner<.75)
            targetSpeed*=.60;

        if(corner<.5)
            targetSpeed*=.48;

        ai.userData.speed=
            THREE.MathUtils.lerp(
                ai.userData.speed,
                targetSpeed,
                1-Math.pow(.0005,dt)
            );

        const forward=
            new THREE.Vector3(
                -Math.sin(
                    ai.userData.yaw
                ),
                0,
                -Math.cos(
                    ai.userData.yaw
                )
            );

        ai.position.add(
            forward.multiplyScalar(
                ai.userData.speed*dt
            )
        );

        ai.rotation.y=
            ai.userData.yaw;

        ai.userData.progress=
            frames[
                info.index
            ].distance;

        /*
          Wheel animation.
        */

        const wheelSpeed=
            ai.userData.speed*dt/.42;

        for(
            const wheel
            of ai.userData.wheelData
        ){

            wheel.wheel.rotation.x+=
                wheelSpeed;

            if(wheel.steering){

                let steer=
                    THREE.MathUtils.clamp(
                        difference,
                        -.5,
                        .5
                    );

                wheel.steering.rotation.y=
                    THREE.MathUtils.lerp(
                        wheel.steering.rotation.y,
                        steer,
                        .15
                    );
            }
        }

        /*
          Car body lean.
        */

        ai.userData.visual.rotation.z=
            THREE.MathUtils.lerp(
                ai.userData.visual.rotation.z,
                -difference*.25,
                .12
            );
    }
}

const keys={};

addEventListener(
    "keydown",
    e=>{
        keys[e.code]=true;

        if(
            [
                "ArrowUp",
                "ArrowDown",
                "ArrowLeft",
                "ArrowRight",
                "Space"
            ].includes(e.code)
        ){
            e.preventDefault();
        }

        if(e.code==="KeyR")
            resetRace();

        if(e.code==="KeyN")
            nextTrack();

        if(
            e.code==="Space" &&
            raceFinished
        ){
            resetRace();
        }
    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);

function updatePlayer(dt){

    if(!raceRunning||raceFinished)
        return;

    /*
      A = LEFT
      D = RIGHT
    */

    let steering=0;

    if(
        keys.KeyA||
        keys.ArrowLeft
    ){
        steering=-1;
    }

    if(
        keys.KeyD||
        keys.ArrowRight
    ){
        steering=1;
    }

    const throttle=
        keys.KeyW||
        keys.ArrowUp;

    const brake=
        keys.KeyS||
        keys.ArrowDown;

    const handbrake=
        keys.Space;

    const forward=
        new THREE.Vector3(
            -Math.sin(playerYaw),
            0,
            -Math.cos(playerYaw)
        );

    const right=
        new THREE.Vector3(
            Math.cos(playerYaw),
            0,
            -Math.sin(playerYaw)
        );

    let forwardSpeed=
        playerVelocity.dot(
            forward
        );

    let lateralSpeed=
        playerVelocity.dot(
            right
        );

    /*
      VERY FAST acceleration.
    */

    if(throttle){

        const acceleration=
            100*
            (1-
            Math.min(
                Math.abs(forwardSpeed)/170,
                .92
            ));

        forwardSpeed+=
            acceleration*dt;
    }

    /*
      Rolling resistance.
    */

    forwardSpeed*=
        Math.pow(
            .997,
            dt*60
        );

    /*
      Brake.
    */

    if(brake){

        if(forwardSpeed>0){

            forwardSpeed-=
                165*dt;

            if(forwardSpeed<0)
                forwardSpeed=0;

        }else{

            forwardSpeed-=
                50*dt;
        }
    }

    /*
      Lateral grip.
    */

    const grip=
        handbrake
        ?1.55
        :5.2;

    lateralSpeed-=
        lateralSpeed*
        grip*
        dt;

    /*
      Speed-sensitive steering.
      Still responsive at huge speeds.
    */

    const steerStrength=
        THREE.MathUtils.clamp(
            3.8/
            (.55+
            Math.abs(forwardSpeed)/75),
            .55,
            3.5
        );

    const targetYawRate=
        steering*
        steerStrength*
        THREE.MathUtils.clamp(
            Math.abs(forwardSpeed)/26,
            .1,
            2.2
        );

    playerYawRate=
        THREE.MathUtils.lerp(
            playerYawRate,
            targetYawRate,
            1-Math.pow(.001,dt)
        );

    if(handbrake){

        playerYawRate+=
            steering*
            .8*
            dt;

        lateralSpeed*=
            Math.pow(
                .91,
                dt*60
            );
    }

    playerYaw+=
        playerYawRate*dt;

    const newForward=
        new THREE.Vector3(
            -Math.sin(playerYaw),
            0,
            -Math.cos(playerYaw)
        );

    const newRight=
        new THREE.Vector3(
            Math.cos(playerYaw),
            0,
            -Math.sin(playerYaw)
        );

    playerVelocity=
        newForward
        .clone()
        .multiplyScalar(
            forwardSpeed
        )
        .add(
            newRight
            .clone()
            .multiplyScalar(
                lateralSpeed
            )
        );

    /*
      Absolute top speed.
      170 m/s = 612 km/h.
    */

    const magnitude=
        playerVelocity.length();

    if(magnitude>170){

        playerVelocity.multiplyScalar(
            170/magnitude
        );
    }

    player.position.addScaledVector(
        playerVelocity,
        dt
    );

    /*
      Track surface.
    */

    const info=
        nearestTrack(
            player.position
        );

    const lateralDistance=
        player.position
        .clone()
        .sub(info.frame.p)
        .dot(info.frame.right);

    /*
      Curbs barely affect speed.
    */

    if(
        Math.abs(lateralDistance)>
            ROAD_WIDTH/2 &&
        Math.abs(lateralDistance)<
            ROAD_WIDTH/2+CURB_WIDTH
    ){

        playerVelocity.multiplyScalar(
            Math.pow(
                .998,
                dt*60
            )
        );
    }

    /*
      Grass is slower.
    */

    if(
        Math.abs(lateralDistance)>
            ROAD_WIDTH/2+CURB_WIDTH
    ){

        playerVelocity.multiplyScalar(
            Math.pow(
                .965,
                dt*60
            )
        );
    }

    /*
      Car body movement.
    */

    const slip=
        Math.atan2(
            lateralSpeed,
            Math.max(
                Math.abs(forwardSpeed),
                1
            )
        );

    player.userData.visual.rotation.z=
        THREE.MathUtils.lerp(
            player.userData.visual.rotation.z,
            -slip*.32-
            playerYawRate*.035,
            1-Math.pow(.001,dt)
        );

    player.userData.visual.rotation.x=
        THREE.MathUtils.lerp(
            player.userData.visual.rotation.x,
            -.035*
            Math.min(
                Math.abs(forwardSpeed)/170,
                1
            ),
            .08
        );

    /*
      Wheels.
      Steering pivot ONLY rotates Y.
      Wheel itself ONLY rotates X.
    */

    playerWheelSpin+=
        forwardSpeed*dt/.42;

    for(
        const wheel
        of player.userData.wheelData
    ){

        wheel.wheel.rotation.x=
            playerWheelSpin;

        if(wheel.steering){

            const steeringAngle=
                steering*.52;

            wheel.steering.rotation.y=
                THREE.MathUtils.lerp(
                    wheel.steering.rotation.y,
                    steeringAngle,
                    1-Math.pow(.0001,dt)
                );
        }
    }
}

/* ============================================================
   POSITION
============================================================ */

function updatePositions(){

    const playerInfo=
        nearestTrack(
            player.position
        );

    const playerProgress=
        frames[
            playerInfo.index
        ].distance;

    let place=1;

    for(const ai of aiCars){

        if(
            ai.userData.progress>
            playerProgress
        ){
            place++;
        }
    }

    /*
      Don't allow AI behind us on
      the starting grid to incorrectly
      appear ahead after reset.
    */

    place=
        Math.max(
            1,
            Math.min(
                11,
                place
            )
        );

    document.getElementById(
        "positionNumber"
    ).textContent=place;
}

/* ============================================================
   CAMERA
============================================================ */

const cameraPosition=
    new THREE.Vector3();

const cameraTarget=
    new THREE.Vector3();

function updateCamera(dt){

    const forward=
        new THREE.Vector3(
            -Math.sin(playerYaw),
            0,
            -Math.cos(playerYaw)
        );

    const velocitySpeed=
        playerVelocity.length();

    const speedRatio=
        THREE.MathUtils.clamp(
            velocitySpeed/170,
            0,
            1
        );

    /*
      Close chase camera.
    */

    const desired=
        player.position.clone()
        .add(
            forward
            .clone()
            .multiplyScalar(
                -7.2+
                speedRatio*-.8
            )
        )
        .add(
            new THREE.Vector3(
                0,
                3.15-
                speedRatio*.35,
                0
            )
        );

    cameraPosition.lerp(
        desired,
        1-Math.pow(.0004,dt)
    );

    camera.position.copy(
        cameraPosition
    );

    const target=
        player.position.clone()
        .add(
            forward
            .clone()
            .multiplyScalar(
                13+
                speedRatio*24
            )
        )
        .add(
            new THREE.Vector3(
                0,
                1.0,
                0
            )
        );

    cameraTarget.lerp(
        target,
        1-Math.pow(.0002,dt)
    );

    camera.lookAt(
        cameraTarget
    );

    /*
      Much wider FOV at high speed.
    */

    camera.fov=
        THREE.MathUtils.lerp(
            camera.fov,
            70+
            speedRatio*27,
            .08
        );

    camera.updateProjectionMatrix();

    /*
      Subtle high-speed vibration.
    */

    if(speedRatio>.55){

        const shake=
            (speedRatio-.55)*
            .018;

        camera.position.x+=
            Math.sin(
                performance.now()*.04
            )*
            shake;

        camera.position.y+=
            Math.cos(
                performance.now()*.047
            )*
            shake;
    }
}

/* ============================================================
   RACE RESET
============================================================ */

let playerYawRate=0;

function resetRace(){

    const f=frames[0];

    player.position.copy(
        f.p
        .clone()
        .add(
            f.right.clone()
            .multiplyScalar(-5)
        )
    );

    playerYaw=
        Math.atan2(
            -f.tangent.x,
            -f.tangent.z
        );

    player.rotation.y=
        playerYaw;

    playerYawRate=0;

    playerVelocity.set(
        0,0,0
    );

    playerWheelSpin=0;

    raceTime=0;
    raceRunning=false;
    raceFinished=false;

    placeAICars();

    message.textContent="";
    messageSub.textContent="";

    startCountdown();
}

function startCountdown(){

    countdown=3;

    const timer=
        setInterval(()=>{

            if(countdown>0){

                message.textContent=
                    countdown;

                messageSub.textContent=
                    "GET READY";

                countdown--;

            }else{

                clearInterval(timer);

                message.textContent=
                    "GO";

                messageSub.textContent=
                    "";

                raceRunning=true;

                setTimeout(()=>{

                    if(
                        raceRunning &&
                        !raceFinished
                    ){
                        message.textContent="";
                    }

                },700);
            }

        },700);
}

/* ============================================================
   FINISH
============================================================ */

function finishRace(){

    if(raceFinished)return;

    raceFinished=true;
    raceRunning=false;

    const best=
        Number(
            localStorage.getItem(
                "trackrushBest"
            )||0
        );

    if(
        best===0||
        raceTime<best
    ){

        localStorage.setItem(
            "trackrushBest",
            raceTime
        );

        message.textContent=
            "NEW BEST";

    }else{

        message.textContent=
            "FINISH";
    }

    messageSub.textContent=
        timeString(raceTime)+
        "   •   SPACE TO RACE AGAIN";
}

/* ============================================================
   CHECK FINISH
============================================================ */

function checkFinish(){

    if(!raceRunning||raceFinished)
        return;

    const info=
        nearestTrack(
            player.position
        );

    /*
      Need to have completed nearly
      the entire circuit.
    */

    if(
        info.index>
            centerline.length*.965
    ){

        const start=
            frames[0].p;

        if(
            player.position.distanceTo(
                start
            )<ROAD_WIDTH
        ){

            finishRace();
        }
    }
}

/* ============================================================
   SPEED PARTICLES
============================================================ */

const streakGroup=
    new THREE.Group();

scene.add(streakGroup);

const streakMaterial=
    new THREE.LineBasicMaterial({
        color:0x9bbcff,
        transparent:true,
        opacity:.24
    });

const streaks=[];

for(let i=0;i<70;i++){

    const geometry=
        new THREE.BufferGeometry();

    geometry.setFromPoints([
        new THREE.Vector3(),
        new THREE.Vector3(
            0,0,-1
        )
    ]);

    const line=
        new THREE.Line(
            geometry,
            streakMaterial
        );

    streakGroup.add(line);
    streaks.push(line);
}

function updateStreaks(){

    const speed=
        playerVelocity.length();

    const ratio=
        THREE.MathUtils.clamp(
            speed/170,
            0,
            1
        );

    for(
        let i=0;
        i<streaks.length;
        i++
    ){

        const line=streaks[i];

        line.visible=
            ratio>.48;

        if(!line.visible)
            continue;

        const angle=
            i/
            streaks.length*
            Math.PI*2;

        const radius=
            5+
            ((i*31)%100)/100*
            9;

        const local=
            new THREE.Vector3(
                Math.cos(angle)*radius,
                .7+
                Math.sin(angle)*3,
                -5
            );

        local.applyAxisAngle(
            new THREE.Vector3(
                0,1,0
            ),
            playerYaw
        );

        line.position.copy(
            player.position
        );

        line.position.add(
            local
        );

        const length=
            .25+
            ratio*5;

        const direction=
            new THREE.Vector3(
                0,
                0,
                length
            );

        direction.applyAxisAngle(
            new THREE.Vector3(
                0,1,0
            ),
            playerYaw
        );

        line.geometry.setFromPoints([
            new THREE.Vector3(),
            direction
        ]);
    }
}

/* ============================================================
   UI
============================================================ */

const timeElement=
    document.getElementById(
        "time"
    );

const bestElement=
    document.getElementById(
        "best"
    );

const speedElement=
    document.getElementById(
        "speed"
    );

const gearElement=
    document.getElementById(
        "gear"
    );

const message=
    document.getElementById(
        "message"
    );

const messageSub=
    document.getElementById(
        "messageSub"
    );

function updateUI(){

    timeElement.textContent=
        timeString(
            raceTime
        );

    const best=
        Number(
            localStorage.getItem(
                "trackrushBest"
            )||0
        );

    bestElement.textContent=
        best
        ?
        timeString(best)
        :
        "--:--.---";

    const kmh=
        Math.round(
            playerVelocity.length()*3.6
        );

    speedElement.textContent=
        kmh;

    let gear=
        Math.floor(
            playerVelocity.length()/22
        )+1;

    gear=
        Math.max(
            1,
            Math.min(
                8,
                gear
            )
        );

    if(!raceRunning&&
       playerVelocity.length()<1){

        gearElement.textContent="N";

    }else{

        gearElement.textContent=
            gear;
    }

    updatePositions();
}

/* ============================================================
   MINIMAP
============================================================ */

const mini=
    document.getElementById(
        "mini"
    );

const miniCtx=
    mini.getContext("2d");

function drawMiniMap(){

    const w=mini.width=
        mini.clientWidth*2;

    const h=mini.height=
        mini.clientHeight*2;

    miniCtx.clearRect(
        0,0,w,h
    );

    if(!centerline.length)
        return;

    let minX=Infinity;
    let maxX=-Infinity;
    let minZ=Infinity;
    let maxZ=-Infinity;

    for(
        const p
        of centerline
    ){

        minX=Math.min(
            minX,
            p.p.x
        );

        maxX=Math.max(
            maxX,
            p.p.x
        );

        minZ=Math.min(
            minZ,
            p.p.z
        );

        maxZ=Math.max(
            maxZ,
            p.p.z
        );
    }

    const scale=
        Math.min(
            (w-20)/(maxX-minX),
            (h-20)/(maxZ-minZ)
        );

    function map(p){

        return {
            x:
                10+
                (p.x-minX)*scale,

            y:
                10+
                (p.z-minZ)*scale
        };
    }

    miniCtx.beginPath();

    for(
        let i=0;
        i<centerline.length;
        i++
    ){

        const p=
            map(
                centerline[i].p
            );

        if(i===0)
            miniCtx.moveTo(
                p.x,
                p.y
            );
        else
            miniCtx.lineTo(
                p.x,
                p.y
            );
    }

    miniCtx.strokeStyle=
        "#58616c";

    miniCtx.lineWidth=8;

    miniCtx.stroke();

    /*
      Player
    */

    const pp=
        map(
            player.position
        );

    miniCtx.beginPath();

    miniCtx.arc(
        pp.x,
        pp.y,
        5,
        0,
        Math.PI*2
    );

    miniCtx.fillStyle=
        "#ff641d";

    miniCtx.fill();

    /*
      AI
    */

    for(
        const ai
        of aiCars
    ){

        const ap=
            map(
                ai.position
            );

        miniCtx.beginPath();

        miniCtx.arc(
            ap.x,
            ap.y,
            3,
            0,
            Math.PI*2
        );

        miniCtx.fillStyle=
            "#ffffff";

        miniCtx.fill();
    }
}

/* ============================================================
   NEXT TRACK
============================================================ */

function nextTrack(){

    currentTrack=
        (currentTrack+1)%
        trackDefinitions.length;

    buildTrack();
}

/* ============================================================
   MAIN LOOP
============================================================ */

let previous=
    performance.now();

function animate(now){

    requestAnimationFrame(
        animate
    );

    let dt=
        (now-previous)/1000;

    previous=now;

    dt=
        Math.min(
            dt,
            .033
        );

    if(
        raceRunning &&
        !raceFinished
    ){

        raceTime+=dt;
    }

    updatePlayer(dt);
    updateAI(dt);
    checkFinish();
    updateCamera(dt);
    updateStreaks();
    updateUI();
    drawMiniMap();

    renderer.render(
        scene,
        camera
    );
}

/* ============================================================
   RESIZE
============================================================ */

addEventListener(
    "resize",
    ()=>{
        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);

/* ============================================================
   START
============================================================ */

buildTrack();

animate(
    performance.now()
);

</script>
