<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TrackRush 3D</title>

<style>
*{
  box-sizing:border-box;
  user-select:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#79acd2;
  font-family:Arial,Helvetica,sans-serif;
}

canvas{
  display:block;
}

#hud{
  position:fixed;
  inset:0;
  pointer-events:none;
  color:white;
  text-shadow:0 2px 5px #000;
}

#top{
  position:absolute;
  top:16px;
  left:16px;
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}

.card{
  min-width:115px;
  padding:8px 12px;
  border-radius:11px;
  background:rgba(8,12,20,.75);
  border:1px solid rgba(255,255,255,.18);
  backdrop-filter:blur(5px);
}

.label{
  font-size:10px;
  opacity:.65;
  letter-spacing:1px;
  text-transform:uppercase;
}

.value{
  font-size:19px;
  font-weight:900;
}

#speed{
  font-size:25px;
}

#help{
  position:absolute;
  bottom:16px;
  left:16px;
  padding:10px 14px;
  border-radius:11px;
  background:rgba(8,12,20,.72);
  font-size:13px;
}

#message{
  position:absolute;
  left:50%;
  top:18%;
  transform:translateX(-50%);
  font-size:25px;
  font-weight:900;
  text-align:center;
  white-space:nowrap;
}

#countdown{
  position:absolute;
  left:50%;
  top:44%;
  transform:translate(-50%,-50%);
  font-size:105px;
  font-weight:1000;
  font-style:italic;
  display:none;
}

#finish{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  width:min(450px,90vw);
  padding:30px;
  border-radius:22px;
  background:rgba(7,10,18,.94);
  border:2px solid rgba(255,255,255,.2);
  box-shadow:0 25px 100px rgba(0,0,0,.55);
  text-align:center;
  display:none;
  pointer-events:auto;
}

#finish h1{
  margin:0 0 8px;
  font-size:45px;
}

#finish p{
  margin:8px;
}

.small{
  opacity:.65;
  font-size:13px;
}

button{
  border:0;
  border-radius:11px;
  padding:13px 25px;
  margin-top:15px;
  background:#ff6a00;
  color:white;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
}

button:hover{
  filter:brightness(1.15);
}
</style>
</head>

<body>

<div id="hud">

  <div id="top">

    <div class="card">
      <div class="label">Time</div>
      <div class="value" id="timer">0:00.000</div>
    </div>

    <div class="card">
      <div class="label">Best</div>
      <div class="value" id="best">--:---.---</div>
    </div>

    <div class="card">
      <div class="label">Track</div>
      <div class="value" id="track">Track 1</div>
    </div>

    <div class="card">
      <div class="label">Difficulty</div>
      <div class="value" id="difficulty">Rookie</div>
    </div>

    <div class="card">
      <div class="label">Checkpoint</div>
      <div class="value" id="checkpoint">0 / 8</div>
    </div>

    <div class="card">
      <div class="label">Speed</div>
      <div class="value" id="speed">0 km/h</div>
    </div>

  </div>

  <div id="message"></div>

  <div id="countdown">3</div>

  <div id="help">
    <b>A / D</b> steer &nbsp; • &nbsp;
    <b>W / S</b> throttle/brake &nbsp; • &nbsp;
    <b>R</b> reset &nbsp; • &nbsp;
    <b>N</b> next track
  </div>

  <div id="finish">
    <h1>FINISH!</h1>
    <p id="finishTime"></p>
    <p id="finishBest"></p>
    <p class="small">
      Press SPACE or click below to race again
    </p>
    <button id="again">RACE AGAIN</button>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   TRACKRUSH 3D
   ========================================================= */

"use strict";


/* =========================================================
   DOM
   ========================================================= */

const timerEl =

const bestEl =
  document.getElementById("best");

const trackEl =
  document.getElementById("track");

const difficultyEl =
  document.getElementById("difficulty");

const checkpointEl =
  document.getElementById("checkpoint");

const speedEl =

const countdownEl =

const finishEl =

const finishTimeEl =

/* =========================================================

const scene =

scene.background =

scene.fog =

document.body.appendChild(

/* =========================================================

const game={

/* =========================================================

const trackRoot =

scene.add(trackRoot);

/* =========================================================
   BASIC HELPERS
   ========================================================= */

function box(
  x,
  y,
  z,
  material
){

  const m =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        x,y,z
      ),
      material
    );

  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}


function cyl(
  radius,
  depth,
  material,
  segments=16
){

  const m =
    new THREE.Mesh(
      new THREE.CylinderGeometry(
        radius,
        radius,
        depth,
        segments
      ),
      material
    );

  m.castShadow=true;
  m.receiveShadow=true;

  return m;
}


/* =========================================================
   MAX-INSPIRED F1 CAR
   ========================================================= */

let wheels=[];

  wheels=[];


  const blue =

    });


  const orange =
    new THREE.MeshStandardMaterial({
      color:0xff6a00,
      metalness:.12,
      roughness:.3
    });

    new THREE.MeshStandardMaterial({
      color:0xf5c542,
      metalness:.4,
      roughness:.25
    });


  const body =
    box(

      .58,

      .08,

  centerStripe.position.set(
    0,1.36,.05
  );

  car.add(centerStripe);


  for(const s of [-1,1]){

    const side =
      box(
        .17,
        .4,
        3.3,
        red
      );

    side.position.set(
      s*1.06,
      1.18,
      -.05
    );

    car.add(side);
  }


  const nose =
    box(
      1.25,
      .32,
      1.95,
      blue
    );

  nose.position.set(
    0,
    1,
    2.65
  );

  car.add(nose);


  const noseOrange =
    box(
      .33,
      .08,
      1.6,
      orange
    );

  noseOrange.position.set(
    0,
    1.19,
    2.67
  );

  car.add(noseOrange);


  const spine =
    box(
      .72,
      .3,
      2.85,
      blue
    );

  spine.position.set(
    0,1.34,.35
  );

  car.add(spine);


  const cockpit =
    box(
      1.28,
      .55,
      1.5,
      mat.glass
    );

  cockpit.position.set(
    0,1.57,.4
  );

  car.add(cockpit);


  const halo =
    box(
      .12,
      .55,
      1.18,
      orange
    );

  halo.position.set(
    0,1.95,.38
  );

  car.add(halo);


  const helmet =
    cyl(
      .34,
      .5,

    );

  helmet.position.set(
    0,1.9,.25
  );

  car.add(helmet);


  const visor =
    box(
      .55,
      .12,
      .28,

    );

  visor.position.set(
    0,1.99,.45
  );

  for(const s of [-1,1]){

function createNumberTexture(number){

  const canvas =
    document.createElement("canvas");

  canvas.width=256;
  canvas.height=128;

  const ctx =
    canvas.getContext("2d");

  ctx.clearRect(
    0,0,256,128
  );

  ctx.font=
    "bold 110px Arial";

  ctx.textAlign="center";
  ctx.textBaseline="middle";

  ctx.fillStyle="#fff";
  ctx.strokeStyle="#101b4d";
  ctx.lineWidth=10;

  ctx.strokeText(
    number,
    128,
    64
  );

  ctx.fillText(
    number,
    128,
    64
  );

  return new THREE.CanvasTexture(canvas);
}


function createDutchFlagTexture(){

  const canvas =
    document.createElement("canvas");

  canvas.width=256;
  canvas.height=128;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle="#ae1c28";
  ctx.fillRect(0,0,256,42);

  ctx.fillStyle="#fff";
  ctx.fillRect(0,42,256,43);

  ctx.fillStyle="#21468b";
  ctx.fillRect(0,85,256,43);

  return new THREE.CanvasTexture(canvas);
}


/* =========================================================
   SEEDED RANDOM
   ========================================================= */

function random(){

  let x =
    Math.sin(game.seed++) *
    43758.5453123;

  return x-Math.floor(x);
}


/* =========================================================
   DIFFICULTY
   ========================================================= */

function difficultyName(n){

  if(n<=2)
    return "Rookie";

  if(n<=4)
    return "Club";

  if(n<=6)
    return "Pro";

  if(n<=8)
    return "Expert";

  if(n<=10)
    return "Master";

  if(n<=12)
    return "Insane";

  return "Legend";
}


function difficultySettings(){

  const d =
    game.difficulty;


  return {

    width:
      Math.max(
        14,
        22-d*.45
      ),

    length:
      135+
      d*18,

    turn:
      .35+
      d*.055,

    elevation:
      .35+
      d*.07,

    complexity:
      Math.min(
        1,
        .18+d*.055
      ),

    jump:
      Math.min(
        .8,
        d*.045
      )

  };
}


/* =========================================================
   TRACK CLEAR
   ========================================================= */

function clearTrack(){

  while(
    trackRoot.children.length
  ){

    trackRoot.remove(
      trackRoot.children[
        trackRoot.children.length-1
      ]
    );
  }


  game.points=[];
  game.frames=[];
  game.checkpoints=[];
  game.boosts=[];
  game.obstacles=[];
}


/* =========================================================
   ELABORATE TRACK GENERATOR
   ========================================================= */

function generateTrack(){

  clearTrack();


  game.seed =
    game.trackNumber*9137+77;


  const settings =
    difficultySettings();


  game.width =
    settings.width;


  const count =
    Math.floor(
      settings.length
    );


  let x=0;
  let y=0;
  let z=0;

  let heading=0;

  let bank=0;


  for(
    let i=0;
    i<=count;
    i++
  ){

    const t =
      i/count;


    /*
      Multiple overlapping waves create
      flowing track shapes instead of
      a simple sine-wave road.
    */


    const broad =
      Math.sin(
        i*.041+
        game.trackNumber
      );


    const medium =
      Math.sin(
        i*.097+
        1.7
      );


    const technical =
      Math.sin(
        i*.21+
        game.trackNumber*.7
      );


    const severity =
      settings.turn;


    heading +=
      (
        broad*.75+
        medium*.5+
        technical*
        settings.complexity
      )*
      .011*
      severity*3;


    /*
      Special sections.
    */

    const section =
      Math.floor(
        i/28
      );


    const sectionType =
      section%8;


    /* Long sweeping corner */

    if(sectionType===1){

      heading +=
        .018*
        severity;
    }


    /* Reverse sweeper */

    if(sectionType===2){

      heading -=
        .025*
        severity;
    }


    /* Technical S */

    if(sectionType===3){

      heading +=
        Math.sin(i*.45)*
        .035*
        severity;
    }


    /* Hairpin-style section */

    if(
      sectionType===5 &&
      game.difficulty>=5
    ){

      const local =
        i%28;

      heading +=
        Math.sin(
          local/28*Math.PI
        )*
        .06*
        severity;
    }


    /* Chicane */

    if(
      sectionType===6 &&
      game.difficulty>=4
    ){

      heading +=
        Math.sin(i*.65)*
        .045*
        severity;
    }


    /* Tight technical section */

    if(
      sectionType===7 &&
      game.difficulty>=7
    ){

      heading +=
        Math.sin(i*.85)*
        .06*
        severity;
    }


    const distance =
      8.2+
      Math.sin(i*.12)*.25;


    x +=
      Math.sin(heading)*
      distance;


    z +=
      Math.cos(heading)*
      distance;


    /*
      Elevation.
    */

    const climbing =
      Math.sin(i*.062)*
      settings.elevation;


    const hills =
      Math.sin(i*.145)*
      settings.elevation*.5;


    y +=
      climbing+
      hills;


    /*
      Deliberate jumps on harder tracks.
    */

    if(
      game.difficulty>=4 &&
      i%55>45 &&
      i%55<52
    ){

      y +=
        .16*
        (i%55-45);
    }


    if(
      game.difficulty>=4 &&
      i%55>=52
    ){

      y -= .18;
    }


    y =
      THREE.MathUtils.clamp(
        y,
        -5,
        28
      );


    /*
      Banked sections.
    */

    bank =
      (
        Math.sin(i*.075)*
        .08+
        Math.sin(i*.18)*
        .04
      );


    game.points.push(
      new THREE.Vector3(
        x,
        y,
        z
      )
    );


    game.frames.push({
      heading,
      bank
    });
  }


  buildRoad();

  buildFancyTrackFeatures();

  buildCheckpoints();

  buildBoosts();

  buildScenery();

  positionCarAtStart();
}


/* =========================================================
   TRACK FRAME
   ========================================================= */

function getFrame(i){

  const p =
    game.points[i];


  const prev =
    game.points[
      Math.max(0,i-1)
    ];


  const next =
    game.points[
      Math.min(
        game.points.length-1,
        i+1
      )
    ];


  const forward =
    new THREE.Vector3()
      .subVectors(
        next,
        prev
      )
      .normalize();


  const side =
    new THREE.Vector3(
      forward.z,
      0,
      -forward.x
    ).normalize();


  return {
    point:p,
    forward,
    side
  };
}


/* =========================================================
   ROAD BUILDER
   ========================================================= */

function buildRoad(){

  for(
    let i=0;
    i<game.points.length-1;
    i++
  ){

    const a =
      game.points[i];

    const b =
      game.points[i+1];


    const center =
      new THREE.Vector3()
        .addVectors(a,b)
        .multiplyScalar(.5);


    const direction =
      new THREE.Vector3()
        .subVectors(b,a);


    const length =
      direction.length();


    /*
      Main road.
    */

    const road =
      box(
        game.width,
        .55,
        length+1.3,
        mat.road
      );


    road.position.copy(center);

    road.lookAt(
      center.clone()
        .add(direction)
    );


    trackRoot.add(road);


    /*
      Deep support makes elevated
      tracks look much more dramatic.
    */

    const support =
      box(
        game.width+5,
        3.2,
        length+2.8,
        mat.support
      );


    support.position.copy(center);

    support.position.y -= 1.8;

    support.lookAt(
      center.clone()
        .add(direction)
    );


    trackRoot.add(support);


    /*
      Red/white racing strips.
    */

    if(i%6===0){

      const frame =
        getFrame(i);


      for(
        const s of [-1,1]
      ){

        const stripe =
          box(
            .35,
            .045,
            length+1.3,
            mat.red
          );


        stripe.position.copy(center);

        stripe.position.add(
          frame.side.clone()
            .multiplyScalar(
              s*
              (game.width/2-.35)
            )
        );


        stripe.position.y+=.31;


        stripe.lookAt(
          center.clone()
            .add(direction)
        );


        trackRoot.add(stripe);
      }
    }


    /*
      Large solid walls.
    */

    const frame =
      getFrame(i);


    for(
      const s of [-1,1]
    ){

      const wall =
        box(
          1.25,
          3.8,
          length+4.8,
          i%12<6
            ? mat.wall
            : mat.red
        );


      wall.position.copy(center);

      wall.position.add(
        frame.side.clone()
          .multiplyScalar(
            s*
            (game.width/2+.55)
          )
      );


      wall.position.y+=1.15;


      wall.lookAt(
        center.clone()
          .add(direction)
      );


      trackRoot.add(wall);
    }
  }
}

    );

  /*

  */

        )

          new THREE.BoxGeometry(

        );

      );


      ramp.position.y+=.45;

          frame.forward.x,
          frame.forward.z
        );


      /*

      */

      ramp.rotation.x=
        -.17-
        Math.min(
          .18,
          d*.012
        );


      trackRoot.add(ramp);
    }
  }


  /*
    Giant tunnel sections.
  */

  if(d>=5){

    for(
      let i=65;
      i<game.points.length-30;
      i+=
        Math.max(
          85,
          120-d*2
        )
    ){

      buildTunnel(i);
    }
  }


  /*

  */

  if(d>=7){

    for(
      let i=25;
      i<game.points.length;
      i+=31
    ){

        getFrame(i);


      const beam =

          game.width+2,

          .5,

        );


      beam.position.copy(

      );

      beam.position.y+=6.8;


      beam.lookAt(

          .add(frame.forward)

      trackRoot.add(beam);

  const roof =
    box(
      width,

  const left =

  left.position.y=3.5;

  for(

    i<=number;
    i++
  ){

    const index =
      Math.floor(
        game.points.length *
        (i/(number+1))
      );


    const frame =
      getFrame(index);


    const gate =
      new THREE.Group();


    const left =
      box(
        .34,
        5.6,
        .34,
        mat.yellow
      );


    const right =
      left.clone();


    left.position.x=
      -game.width/2+.5;

    right.position.x=
      game.width/2-.5;


    left.position.y=2.8;
    right.position.y=2.8;


    const top =
      box(
        game.width,
        .34,
        .34,
        mat.yellow
      );


    top.position.y=5.45;


    gate.add(
      left,
      right,
      top
    );


    gate.position.copy(
      frame.point
    );


    gate.lookAt(
      frame.point.clone()
        .add(frame.forward)
    );


    trackRoot.add(gate);


    game.checkpoints.push({
      index,
      gate
    });
  }


  /*
    Finish line.
  */

  const index =
    game.points.length-5;


  const frame =
    getFrame(index);


  const finish =
    new THREE.Group();


  const left =
    box(
      .48,
      6.5,
      .48,
      mat.red
    );


  const right =
    left.clone();


  left.position.x=
    -game.width/2+.5;

  right.position.x=
    game.width/2-.5;


  left.position.y=3.25;
  right.position.y=3.25;


  const top =
    box(
      game.width,
      .48,
      .48,
      mat.red
    );


  top.position.y=6;


  finish.add(
    left,
    right,
    top
  );


  finish.position.copy(
    frame.point
  );


  finish.lookAt(
    frame.point.clone()
      .add(frame.forward)
  );


  trackRoot.add(finish);
}


/* =========================================================
   BOOSTS
   ========================================================= */

function buildBoosts(){

  const d =
    game.difficulty;


  const count =
    5+
    Math.min(
      7,
      Math.floor(d/2)
    );


  for(
    let i=0;
    i<count;
    i++
  ){

    const fraction =
      .10+
      i/(count+1)*.82;


    const index =
      Math.floor(
        game.points.length*
        fraction
      );


    const frame =
      getFrame(index);


    /*
      Three lanes.
    */

    for(
      const lane of [-1,0,1]
    ){

      const pad =
        box(
          Math.min(
            4.8,
            game.width/3-.25
          ),
          .08,
          1.7,
          mat.cyan
        );


      pad.position.copy(
        frame.point
      );


      pad.position.y+=.34;


      pad.position.add(
        frame.side.clone()
          .multiplyScalar(
            lane*
            game.width/3
          )
      );


      pad.lookAt(
        pad.position.clone()
          .add(frame.forward)
      );


      trackRoot.add(pad);


      game.boosts.push({
        mesh:pad,
        index
      });
    }
  }
}


/* =========================================================
   SCENERY
   ========================================================= */

function buildScenery(){

  const d =
    game.difficulty;


  for(
    let i=4;
    i<game.points.length;
    i+=5
  ){

    const frame =
      getFrame(i);


    for(
      const sideSign of [-1,1]
    ){

      const distance =
        game.width/2+
        12+
        random()*25;


      const size =
        1+
        random()*3;


      const rock =
        cyl(
          size,
          2+
          random()*5,
          mat.rock,
          7
        );


      rock.position.copy(
        frame.point
      );


      rock.position.add(
        frame.side.clone()
          .multiplyScalar(
            sideSign*distance
          )
      );


      rock.position.y=
        frame.point.y-1;


      rock.rotation.y=
        random()*Math.PI;


      trackRoot.add(rock);
    }
  }


  /*
    Tall towers get more common on
    harder tracks.
  */

  const towerSpacing =
    Math.max(
      16,
      31-d
    );


  for(
    let i=12;
    i<game.points.length;
    i+=towerSpacing
  ){

    const frame =
      getFrame(i);


    const side =
      random()<.5
        ? -1
        : 1;


    const distance =
      game.width/2+
      25+
      random()*15;


    const tower =
      new THREE.Group();


    const pole =
      box(
        .4,
        15,
        .4,
        mat.support
      );


    pole.position.y=7.5;


    const top =
      box(
        4,
        .25,
        .25,
        mat.support
      );


    top.position.y=14;


    tower.add(
      pole,
      top
    );


    tower.position.copy(
      frame.point
    );


    tower.position.add(
      frame.side.clone()
        .multiplyScalar(
          side*distance
        )
    );


    trackRoot.add(tower);
  }


  /*
    Floating signs.
  */

  if(d>=6){

    for(
      let i=30;
      i<game.points.length;
      i+=45
    ){

      const frame =
        getFrame(i);


      const sign =
        box(
          7,
          2.2,
          .25,
          mat.red
        );


      sign.position.copy(
        frame.point
      );


      sign.position.y+=9;


      sign.lookAt(
        sign.position.clone()
          .add(frame.forward)
      );


      trackRoot.add(sign);
    }
  }
}

/* =========================================================
   NEAREST TRACK POINT
   ========================================================= */

function nearestTrack(){

  let best=Infinity;

  let bestIndex=
    game.currentIndex;


  const start =
    Math.max(
      0,
      game.currentIndex-20
    );


  const end =
    Math.min(
      game.points.length-1,
      game.currentIndex+35
    );


  for(
    let i=start;
    i<=end;
    i++
  ){

    const d =
      car.position.distanceToSquared(
        game.points[i]
      );


    if(d<best){

      best=d;
      bestIndex=i;
    }
  }


  return bestIndex;
}


/* =========================================================
   PHYSICS
   ========================================================= */

function updatePhysics(dt){

  if(
    !game.racing ||
    game.finished
  )
    return;


  const throttle =
    keys.KeyW ||
    keys.ArrowUp;


  const brake =
    keys.KeyS ||
    keys.ArrowDown;


  if(throttle)
    game.speed+=55*dt;
  else
    game.speed-=7*dt;


  if(brake)
    game.speed-=80*dt;


  game.speed=
    THREE.MathUtils.clamp(
      game.speed,
      -18,
      105
    );


  /*
    A = RIGHT
    D = LEFT
  */

  let steer=0;


  if(
    keys.KeyA ||
    keys.ArrowLeft
  )
    steer+=1;


  if(
    keys.KeyD ||
    keys.ArrowRight
  )
    steer-=1;


  const speedRatio =
    Math.abs(game.speed)/105;


  const steeringPower =
    (.55+
      speedRatio*2.4)*
    .9;


  car.rotation.y +=
    steer*
    steeringPower*
    dt;


  const forward =
    new THREE.Vector3(
      Math.sin(car.rotation.y),
      0,
      Math.cos(car.rotation.y)
    );


  car.position.add(
    forward.multiplyScalar(
      game.speed*dt
    )
  );


  const index =
    nearestTrack();


  game.currentIndex=
    index;


  const frame =
    getFrame(index);


  const lateral =
    car.position.clone()
      .sub(frame.point)
      .dot(frame.side);


  /*
    Wall collision.
  */

  const wallCenter =
    game.width/2+.68;


  const carHalf=
    1.45;


  const wallLimit=
    wallCenter-carHalf;


  if(lateral>wallLimit){

    car.position.add(
      frame.side.clone()
        .multiplyScalar(
          wallLimit-lateral
        )
    );

    game.speed*=.68;
  }


  if(lateral<-wallLimit){

    car.position.add(
      frame.side.clone()
        .multiplyScalar(
          -wallLimit-lateral
        )
    );

    game.speed*=.68;
  }


  /*
    Road safety boundary.
  */

  const safe=
    game.width/2-1.35;


  if(lateral>safe){

    car.position.add(
      frame.side.clone()
        .multiplyScalar(
          safe-lateral
        )
    );

    game.speed*=.88;
  }


  if(lateral<-safe){

    car.position.add(
      frame.side.clone()
        .multiplyScalar(
          -safe-lateral
        )
    );

    game.speed*=.88;
  }


  /*
    Follow track elevation.
  */

  const targetY=
    frame.point.y+.42;


  car.position.y +=
    (
      targetY-
      car.position.y
    )*
    Math.min(
      1,
      dt*8
    );


  /*
    Never fall through track.
  */

  if(
    car.position.y<
    frame.point.y-.5
  ){

    car.position.y=
      frame.point.y+.42;

    game.speed*=.55;
  }


  /*
    Wheel animation.
  */

  for(
    const wheel of wheels
  ){

    wheel.wheel.rotation.x -=
      game.speed*
      dt*
      1.8;


    if(wheel.front){

      wheel.pivot.rotation.y=
        steer*.32;
    }
  }


  /*
    Boost pads.
  */

  for(
    const boost of game.boosts
  ){

    if(
      Math.abs(
        index-
        boost.index
      )<2
    ){

      const distance=
        car.position.distanceTo(
          boost.mesh.position
        );


      if(distance<3.2){

        game.speed+=
          52*dt;
      }
    }
  }


  /*
    Checkpoints.
  */

  if(
    game.checkpoint<
    game.checkpoints.length
  ){

    const target=
      game.checkpoints[
        game.checkpoint
      ];


    if(
      Math.abs(
        index-
        target.index
      )<4
    ){

      game.checkpoint++;


      checkpointEl.textContent=
        game.checkpoint+
        " / "+
        game.checkpoints.length;


      messageEl.textContent=
        "CHECKPOINT "+
        game.checkpoint;


      setTimeout(
        ()=>{
          if(!game.finished)
            messageEl.textContent="";
        },
        800
      );
    }
  }


  /*
    Finish.
  */

  if(
    index>=
    game.points.length-7 &&
    game.checkpoint>=
    game.checkpoints.length
  ){

    finishRace();
  }
}


/* =========================================================
   CAMERA
   ========================================================= */

function updateCamera(dt){

  const forward =
    new THREE.Vector3(
      Math.sin(car.rotation.y),
      0,
      Math.cos(car.rotation.y)
    );


  const target =
    car.position.clone()
      .add(
        forward.clone()
          .multiplyScalar(2.5)
      );


  target.y+=1.1;


  const desired =
    car.position.clone()
      .add(
        forward.clone()
          .multiplyScalar(-11)
      );


  desired.y+=6;


  camera.position.lerp(
    desired,
    1-
    Math.pow(
      .001,
      dt
    )
  );


  camera.up.set(
    0,1,0
  );


  camera.lookAt(
    target
  );
}


/* =========================================================
   COUNTDOWN
   ========================================================= */

function startCountdown(){

  game.racing=false;

  game.countdown=3;


  countdownEl.style.display=
    "block";


  let n=3;


  const interval=
    setInterval(
      ()=>{

        if(n>0){

          countdownEl.textContent=
            n;

          n--;

        }
        else{

          countdownEl.textContent=
            "GO!";

          game.racing=true;


          clearInterval(
            interval
          );


          setTimeout(
            ()=>{
              countdownEl.style.display=
                "none";
            },
            650
          );
        }

      },
      800
    );
}


/* =========================================================
   RESET
   ========================================================= */

function resetRace(){

  finishEl.style.display=
    "none";


  game.time=0;

  game.speed=0;

  game.checkpoint=0;

  game.finished=false;

  game.currentIndex=2;


  checkpointEl.textContent=
    "0 / 8";


  messageEl.textContent="";


  positionCarAtStart();

  startCountdown();
}


/* =========================================================
   NEW TRACK
   ========================================================= */

function newTrack(){

  game.trackNumber++;


  /*
    Every track gets progressively
    harder.
  */

  game.difficulty=
    game.trackNumber;


  trackEl.textContent=
    "Track "+
    game.trackNumber;


  difficultyEl.textContent=
    difficultyName(
      game.difficulty
    );


  generateTrack();

  resetRace();
}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(seconds){

  const minutes=
    Math.floor(
      seconds/60
    );


  const secs=
    seconds%60;


  return (
    minutes+
    ":"+
    secs
      .toFixed(3)
      .padStart(6,"0")
  );
}


/* =========================================================
   BEST
   ========================================================= */

function bestKey(){

  return(
    "trackrush-best-"+
    game.trackNumber
  );
}


function getBest(){

  const value=
    localStorage.getItem(
      bestKey()
    );


  return value
    ? Number(value)
    : null;
}


function updateBest(){

  const best=
    getBest();


  bestEl.textContent=
    best===null
      ? "--:---.---"
      : formatTime(best);
}


/* =========================================================
   FINISH
   ========================================================= */

function finishRace(){

  if(game.finished)
    return;


  game.finished=true;

  game.racing=false;


  const finalTime=
    game.time;


  const oldBest=
    getBest();


  const isNewBest=
    oldBest===null ||
    finalTime<oldBest;


  if(isNewBest){

    localStorage.setItem(
      bestKey(),
      String(finalTime)
    );
  }


  updateBest();


  finishTimeEl.textContent=
    "Your time: "+
    formatTime(finalTime);


  finishBestEl.textContent=
    isNewBest
      ? "NEW PERSONAL BEST!"
      : "Best: "+
        formatTime(
          getBest()
        );


  finishEl.style.display=
    "block";
}

/* =========================================================
   MAIN LOOP
   ========================================================= */

let last=
  performance.now();


function animate(now){

  requestAnimationFrame(
    animate
  );


  let dt=
    (now-last)/1000;


  last=now;


  dt=
    Math.min(
      dt,
      .05
    );


  if(
    game.racing &&
    !game.finished
  ){

    game.time+=dt;
  }


  updatePhysics(dt);

  updateCamera(dt);

  updateHUD();


  renderer.render(
    scene,
    camera
  );
}


requestAnimationFrame(
  animate
);


/* =========================================================
   START RACE
   ========================================================= */

setTimeout(
  ()=>{
    resetRace();
  },
  500
);

</script>

</body>
