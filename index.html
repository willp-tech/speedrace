<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>F1 Fan Racing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070a;font-family:Arial,sans-serif}
canvas{display:block}

#hud{
 position:fixed;
 inset:0;
 pointer-events:none;
 color:white;
 text-shadow:0 2px 5px #000;
}

#title{
 position:absolute;
 top:18px;
 left:20px;
 font-size:24px;
 font-weight:900;
 letter-spacing:2px;
}

#trackName{
 position:absolute;
 top:50px;
 left:21px;
 font-size:13px;
 opacity:.85;
}

#timer{
 position:absolute;
 top:20px;
 left:50%;
 transform:translateX(-50%);
 font-size:32px;
 font-weight:bold;
}

#speed{
 position:absolute;
 bottom:25px;
 left:25px;
 font-size:27px;
 font-weight:bold;
}

#checkpoints{
 position:absolute;
 right:25px;
 bottom:25px;
 font-size:25px;
 font-weight:bold;
}

#message{
 position:absolute;
 top:90px;
 left:50%;
 transform:translateX(-50%);
 font-size:18px;
 font-weight:bold;
 text-align:center;
}

#controls{
 position:absolute;
 left:20px;
 bottom:70px;
 font-size:12px;
 opacity:.65;
}

button{
 pointer-events:auto;
 border:0;
 border-radius:7px;
 padding:10px 15px;
 margin-left:6px;
 background:#20252d;
 color:white;
 font-weight:bold;
 cursor:pointer;
}

button:hover{background:#343b46}

#buttons{
 position:absolute;
 top:16px;
 right:16px;
 pointer-events:auto;
}

#finishScreen,#exitScreen{
 position:absolute;
 inset:0;
 background:rgba(0,0,0,.72);
 display:none;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 pointer-events:auto;
}

.panel{
 text-align:center;
 background:rgba(15,18,24,.94);
 padding:35px;
 border-radius:14px;
 border:1px solid rgba(255,255,255,.15);
 box-shadow:0 15px 60px #000;
}

.panel h1{
 margin:0 0 10px;
 font-size:42px;
}

.panel p{
 margin:8px 0 22px;
 opacity:.8;
}
</style>
</head>

<body>

<div id="hud">
    <div id="title">F1 FAN RACING</div>
    <div id="trackName"></div>
    <div id="timer">00:00.000</div>

    <div id="buttons">
        <button id="nextBtn">NEXT TRACK</button>
        <button id="exitBtn">EXIT</button>
    </div>

    <div id="message">PRESS W TO START</div>
    <div id="speed">0 KM/H</div>
    <div id="checkpoints">0/0</div>

    <div id="controls">
        W — ACCELERATE &nbsp; S — BRAKE / REVERSE &nbsp;
        A/D — STEER &nbsp; R — RESET
    </div>
</div>

<div id="finishScreen">
    <div class="panel">
        <h1>RACE FINISHED</h1>
        <p id="finishTime"></p>
        <button id="againBtn">RACE AGAIN</button>
        <button id="finishNextBtn">NEXT TRACK</button>
        <button id="finishExitBtn">EXIT</button>
    </div>
</div>

<div id="exitScreen">
    <div class="panel">
        <h1>RACE PAUSED</h1>
        <p>You can return to the race or choose another track.</p>
        <button id="returnBtn">RETURN TO RACE</button>
        <button id="exitNextBtn">NEXT TRACK</button>
    </div>
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";


// ============================================================
// BASIC SETUP
// ============================================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x8db5d9);
scene.fog = new THREE.Fog(0x8db5d9,180,850);

const camera = new THREE.PerspectiveCamera(
    70,
    innerWidth/innerHeight,
    .1,
    2000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


// ============================================================
// LIGHTING
// ============================================================

const hemi = new THREE.HemisphereLight(
    0xffffff,
    0x405060,
    1.6
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.2
);

sun.position.set(150,300,100);
sun.castShadow=true;

sun.shadow.mapSize.width=2048;
sun.shadow.mapSize.height=2048;

sun.shadow.camera.left=-500;
sun.shadow.camera.right=500;
sun.shadow.camera.top=500;
sun.shadow.camera.bottom=-500;

scene.add(sun);


// ============================================================
// GAME STATE
// ============================================================

const game={
    trackNumber:1,
    track:null,

    car:null,

    speed:0,

    steering:0,

    yawRate:0,

    started:false,
    finished:false,

    startTime:0,
    finishTime:0,

    checkpoint:0,

    ghost:[],
    ghostCar:null,

    lastGhostSave:0,

    skidTimer:0,

    lateralVelocity:0
};


// ============================================================
// INPUT
// ============================================================

const keys={};

addEventListener("keydown",e=>{

    keys[e.code]=true;

    if([
        "KeyW",
        "KeyA",
        "KeyS",
        "KeyD",
        "Space"
    ].includes(e.code)){
        e.preventDefault();
    }

    if(e.code==="KeyR"){
        resetCar();
    }

    if(
        e.code==="Space" &&
        game.finished
    ){
        startRaceAgain();
    }

});

addEventListener("keyup",e=>{
    keys[e.code]=false;
});


// ============================================================
// UTILITIES
// ============================================================

const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));

const lerp=(a,b,t)=>a+(b-a)*t;

function smoothDamp(current,target,rate,dt){

    return current+
        (target-current)*
        (1-Math.exp(-rate*dt));

}


// ============================================================
// TRACK THEMES
// ============================================================

const themes=[
    {
        name:"FOREST RUN",
        sky:0x8fb9d8,
        grass:0x3d713c,
        road:0x303238
    },
    {
        name:"DESERT CHARGE",
        sky:0xdcb878,
        grass:0xb89558,
        road:0x353337
    },
    {
        name:"ALPINE RUSH",
        sky:0x9bc7e5,
        grass:0xd5d9d5,
        road:0x36383b
    },
    {
        name:"CANYON BLAST",
        sky:0xc88b65,
        grass:0x80573f,
        road:0x343236
    },
    {
        name:"COASTAL SPEEDWAY",
        sky:0x75b8d4,
        grass:0x4d8b65,
        road:0x303439
    }
];


// ============================================================
// TRACK GENERATION
// ============================================================

function generateTrack(){

    const theme=
        themes[(game.trackNumber-1)%themes.length];

    scene.background.set(theme.sky);
    scene.fog.color.set(theme.sky);

    const group=new THREE.Group();

    const points=[];

    const count=34;

    let x=0;
    let z=0;
    let y=0;

    let angle=0;

    for(let i=0;i<count;i++){

        if(i>0){

            angle +=
                (Math.random()-.5)*0.65;

            angle +=
                Math.sin(i*.65+game.trackNumber)*.11;

            x +=
                Math.sin(angle)*
                (20+Math.random()*18);

            z +=
                Math.cos(angle)*
                (20+Math.random()*18);

            y +=
                (Math.random()-.5)*7;

            y +=
                Math.sin(i*.7)*1.8;
        }

        points.push(
            new THREE.Vector3(x,y,z)
        );
    }

    const curve=
        new THREE.CatmullRomCurve3(
            points,
            false,
            "catmullrom",
            .45
        );

    const samples=720;

    const roadWidth=
        16+
        Math.random()*4;

    game.track={
        curve,
        samples,
        width:roadWidth,
        checkpoints:[],
        finishT:.985,
        theme
    };

    createRoad(group);

    createGround(group);

    createBarriers(group);

    createScenery(group);

    createGates(group);

    scene.add(group);

    return group;
}


// ============================================================
// TRACK POSITION
// ============================================================

function getTrackPoint(t){

    return game.track.curve.getPointAt(
        clamp(t,0,1)
    );
}


function getTrackTangent(t){

    return game.track.curve
        .getTangentAt(clamp(t,0,1))
        .normalize();
}


// ============================================================
// IMPORTANT:
// PHYSICS FORWARD IS +Z
//
// The car root always points +Z in the direction
// it actually drives.
//
// The visual car is built with its nose at -Z,
// so the visual group receives a 180° rotation.
//
// This means:
//
// car physics forward = +Z
// car visual forward  = +Z after visual correction
// W                  = +Z
// camera              = behind -Z
//
// Everything now agrees.
// ============================================================

function getTrackHeading(t){

    const tangent=getTrackTangent(t);

    return Math.atan2(
        tangent.x,
        tangent.z
    );
}


// ============================================================
// ROAD
// ============================================================

function createRoad(parent){

    const width=game.track.width;
    const segments=game.track.samples;

    const positions=[];
    const indices=[];

    const left=[];
    const right=[];

    for(let i=0;i<=segments;i++){

        const t=i/segments;

        const p=getTrackPoint(t);
        const tangent=getTrackTangent(t);

        const side=new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();

        const l=p.clone().addScaledVector(
            side,
            width/2
        );

        const r=p.clone().addScaledVector(
            side,
            -width/2
        );

        left.push(l);
        right.push(r);

        positions.push(
            l.x,l.y,l.z,
            r.x,r.y,r.z
        );

        if(i<segments){

            const a=i*2;
            const b=a+1;
            const c=a+2;
            const d=a+3;

            indices.push(
                a,b,c,
                b,d,c
            );
        }
    }

    const geo=new THREE.BufferGeometry();

    geo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,3
        )
    );

    geo.setIndex(indices);
    geo.computeVertexNormals();

    const mat=new THREE.MeshStandardMaterial({
        color:game.track.theme.road,
        roughness:.95
    });

    const road=new THREE.Mesh(geo,mat);

    road.receiveShadow=true;

    parent.add(road);


    // EDGE LINES

    const lineMat=new THREE.MeshBasicMaterial({
        color:0xffffff
    });

    for(const side of [left,right]){

        const pts=[];

        for(let i=0;i<side.length;i+=2){

            pts.push(
                side[i].clone().add(
                    new THREE.Vector3(0,.04,0)
                )
            );
        }

        const geo2=
            new THREE.BufferGeometry()
            .setFromPoints(pts);

        const line=
            new THREE.Line(
                geo2,
                lineMat
            );

        parent.add(line);
    }


    // CENTER DASHES

    const dashMat=new THREE.MeshBasicMaterial({
        color:0xffffff
    });

    for(let i=0;i<segments;i+=18){

        const t1=i/segments;
        const t2=(i+7)/segments;

        const p1=getTrackPoint(t1);
        const p2=getTrackPoint(t2);

        const geo3=
            new THREE.BufferGeometry()
            .setFromPoints([
                p1.clone().add(new THREE.Vector3(0,.07,0)),
                p2.clone().add(new THREE.Vector3(0,.07,0))
            ]);

        parent.add(
            new THREE.Line(
                geo3,
                dashMat
            )
        );
    }


    // CURBS

    const curbRed=
        new THREE.MeshStandardMaterial({
            color:0xd71920
        });

    const curbWhite=
        new THREE.MeshStandardMaterial({
            color:0xffffff
        });

    for(let i=0;i<segments;i+=5){

        const t=i/segments;

        const p=getTrackPoint(t);
        const tangent=getTrackTangent(t);

        const side=new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();

        const color=
            ((i/5)%2===0)
            ?curbRed
            :curbWhite;

        for(const s of [-1,1]){

            const curb=new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.8,
                    .12,
                    3
                ),
                color
            );

            curb.position.copy(p)
                .addScaledVector(
                    side,
                    s*(width/2+.85)
                );

            curb.position.y+=.07;

            curb.rotation.y=
                Math.atan2(
                    tangent.x,
                    tangent.z
                );

            curb.receiveShadow=true;

            parent.add(curb);
        }
    }
}


// ============================================================
// GROUND
// ============================================================

function createGround(parent){

    const mat=new THREE.MeshStandardMaterial({
        color:game.track.theme.grass
    });

    const ground=new THREE.Mesh(
        new THREE.PlaneGeometry(
            3000,
            3000
        ),
        mat
    );

    ground.rotation.x=-Math.PI/2;
    ground.position.y=-7;

    ground.receiveShadow=true;

    parent.add(ground);
}


// ============================================================
// BARRIERS
// ============================================================

function createBarriers(parent){

    const width=game.track.width;

    const mat=new THREE.MeshStandardMaterial({
        color:0x9ca3a8,
        metalness:.5,
        roughness:.55
    });

    for(let i=0;i<game.track.samples;i+=14){

        const t=i/game.track.samples;

        const p=getTrackPoint(t);
        const tangent=getTrackTangent(t);

        const side=new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();

        for(const s of [-1,1]){

            const barrier=new THREE.Mesh(
                new THREE.BoxGeometry(
                    .35,
                    .75,
                    3.5
                ),
                mat
            );

            barrier.position.copy(p)
                .addScaledVector(
                    side,
                    s*(width/2+2.5)
                );

            barrier.position.y+=.4;

            barrier.rotation.y=
                Math.atan2(
                    tangent.x,
                    tangent.z
                );

            barrier.castShadow=true;

            parent.add(barrier);
        }
    }
}


// ============================================================
// SCENERY
// ============================================================

function createScenery(parent){

    const theme=game.track.theme.name;

    for(let i=0;i<180;i++){

        const t=Math.random();

        const p=getTrackPoint(t);
        const tangent=getTrackTangent(t);

        const side=new THREE.Vector3(
            tangent.z,
            0,
            -tangent.x
        ).normalize();

        const sideDistance=
            35+
            Math.random()*100;

        const s=Math.random()<.5?-1:1;

        const obj=new THREE.Group();

        if(theme==="FOREST RUN"){

            const trunk=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .45,
                    .65,
                    7,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x60442e
                })
            );

            trunk.position.y=3.5;

            obj.add(trunk);

            const leaves=new THREE.Mesh(
                new THREE.ConeGeometry(
                    4,
                    10,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x245c2b
                })
            );

            leaves.position.y=9;

            obj.add(leaves);

        }else if(theme==="DESERT CHARGE"){

            const cactus=new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .7,
                    .9,
                    7,
                    8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x39733b
                })
            );

            cactus.position.y=3.5;

            obj.add(cactus);

        }else{

            const rock=new THREE.Mesh(
                new THREE.DodecahedronGeometry(
                    3+
                    Math.random()*5
                ),
                new THREE.MeshStandardMaterial({
                    color:
                        theme==="ALPINE RUSH"
                        ?0xd9dde0
                        :0x775849
                })
            );

            rock.position.y=1;

            obj.add(rock);
        }

        obj.position.copy(p)
            .addScaledVector(
                side,
                s*sideDistance
            );

        parent.add(obj);
    }
}


// ============================================================
// GATES
// ============================================================

function createGates(parent){

    const count=
        8+
        Math.floor(Math.random()*5);

    game.track.checkpoints=[];

    for(let i=1;i<=count;i++){

        const t=
            .08+
            (i/(count+1))*.86;

        game.track.checkpoints.push(t);

        createGate(
            parent,
            t,
            false
        );
    }

    createGate(
        parent,
        game.track.finishT,
        true
    );
}


function createGate(parent,t,isFinish){

    const p=getTrackPoint(t);
    const tangent=getTrackTangent(t);

    const gate=new THREE.Group();

    const color=
        isFinish
        ?0xff2020
        :0xffd600;

    const mat=new THREE.MeshStandardMaterial({
        color,
        emissive:color,
        emissiveIntensity:.35
    });

    const postGeo=
        new THREE.BoxGeometry(
            .7,
            8,
            .7
        );

    const topGeo=
        new THREE.BoxGeometry(
            game.track.width,
            .7,
            .7
        );

    const left=new THREE.Mesh(
        postGeo,
        mat
    );

    const right=new THREE.Mesh(
        postGeo,
        mat
    );

    const top=new THREE.Mesh(
        topGeo,
        mat
    );

    left.position.x=
        -game.track.width/2;

    right.position.x=
        game.track.width/2;

    top.position.y=8;

    gate.add(
        left,
        right,
        top
    );

    gate.position.copy(p);

    gate.rotation.y=
        Math.atan2(
            tangent.x,
            tangent.z
        );

    parent.add(gate);
}


// ============================================================
// CAR
// ============================================================

function createCar(){

    // ROOT = PHYSICS ORIENTATION
    //
    // +Z is always the actual forward direction.

    const root=new THREE.Group();


    // VISUAL GROUP
    //
    // Car geometry below was designed with the nose
    // toward -Z.
    //
    // Rotate the visual 180 degrees so its nose points
    // along the root's +Z direction.

    const visual=new THREE.Group();

    visual.rotation.y=Math.PI;

    root.add(visual);


    const bodyMat=new THREE.MeshStandardMaterial({
        color:0xc8141d,
        metalness:.5,
        roughness:.3
    });

    const darkMat=new THREE.MeshStandardMaterial({
        color:0x111318,
        metalness:.7,
        roughness:.25
    });

    const wingMat=new THREE.MeshStandardMaterial({
        color:0xffffff,
        metalness:.4,
        roughness:.3
    });


    // MAIN BODY

    const body=new THREE.Mesh(
        new THREE.BoxGeometry(
            2.4,
            .65,
            5.5
        ),
        bodyMat
    );

    body.position.y=1;

    body.castShadow=true;

    visual.add(body);


    // NOSE

    const nose=new THREE.Mesh(
        new THREE.ConeGeometry(
            1.15,
            3.2,
            4
        ),
        bodyMat
    );

    nose.rotation.x=-Math.PI/2;

    nose.position.set(
        0,
        1,
        -4
    );

    nose.castShadow=true;

    visual.add(nose);


    // SIDE PODS

    for(const x of [-1.35,1.35]){

        const pod=new THREE.Mesh(
            new THREE.BoxGeometry(
                1.1,
                .7,
                2.8
            ),
            bodyMat
        );

        pod.position.set(
            x,
            .95,
            .4
        );

        pod.castShadow=true;

        visual.add(pod);
    }


    // COCKPIT

    const cockpit=new THREE.Mesh(
        new THREE.BoxGeometry(
            1.25,
            .55,
            1.65
        ),
        darkMat
    );

    cockpit.position.set(
        0,
        1.65,
        .35
    );

    cockpit.castShadow=true;

    visual.add(cockpit);


    // DRIVER HELMET

    const helmet=new THREE.Mesh(
        new THREE.SphereGeometry(
            .46,
            20,
            14
        ),
        new THREE.MeshStandardMaterial({
            color:0xf1f1f1
        })
    );

    helmet.position.set(
        0,
        2.05,
        .2
    );

    helmet.castShadow=true;

    visual.add(helmet);


    // HALO

    const halo=new THREE.Mesh(
        new THREE.TorusGeometry(
            .55,
            .07,
            8,
            20,
            Math.PI
        ),
        wingMat
    );

    halo.rotation.x=Math.PI/2;

    halo.position.set(
        0,
        2.18,
        -.1
    );

    visual.add(halo);


    // FRONT WING

    const frontWing=new THREE.Mesh(
        new THREE.BoxGeometry(
            4.1,
            .14,
            .7
        ),
        wingMat
    );

    frontWing.position.set(
        0,
        .55,
        -5.15
    );

    frontWing.castShadow=true;

    visual.add(frontWing);


    // REAR WING

    const rearWing=new THREE.Mesh(
        new THREE.BoxGeometry(
            3.8,
            .18,
            .65
        ),
        wingMat
    );

    rearWing.position.set(
        0,
        2.25,
        2.55
    );

    rearWing.castShadow=true;

    visual.add(rearWing);


    // WHEELS

    const wheels=[];

    function makeWheel(x,z,front){

        const steeringPivot=
            new THREE.Group();

        steeringPivot.position.set(
            x,
            .58,
            z
        );

        visual.add(steeringPivot);


        const rollPivot=
            new THREE.Group();

        steeringPivot.add(
            rollPivot
        );


        const tire=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .58,
                .58,
                .42,
                20
            ),
            darkMat
        );

        tire.rotation.z=Math.PI/2;

        tire.castShadow=true;

        rollPivot.add(tire);


        const rim=new THREE.Mesh(
            new THREE.CylinderGeometry(
                .28,
                .28,
                .44,
                16
            ),
            new THREE.MeshStandardMaterial({
                color:0xbcc2c7,
                metalness:.8,
                roughness:.2
            })
        );

        rim.rotation.z=Math.PI/2;

        rollPivot.add(rim);


        wheels.push({
            steeringPivot,
            rollPivot,
            tire,
            front
        });
    }


    makeWheel(-1.42,-2.75,true);
    makeWheel(1.42,-2.75,true);

    makeWheel(-1.42,2.05,false);
    makeWheel(1.42,2.05,false);


    // BRAKE LIGHTS

    const brakeMaterial=
        new THREE.MeshBasicMaterial({
            color:0x550000
        });

    const brakeLights=[];

    for(const x of [-.75,.75]){

        const light=new THREE.Mesh(
            new THREE.BoxGeometry(
                .45,
                .18,
                .08
            ),
            brakeMaterial
        );

        light.position.set(
            x,
            1.1,
            2.88
        );

        visual.add(light);

        brakeLights.push(light);
    }


    // EXHAUST

    const exhausts=[];

    for(const x of [-.55,.55]){

        const glow=new THREE.Mesh(
            new THREE.SphereGeometry(
                .13,
                10,
                10
            ),
            new THREE.MeshBasicMaterial({
                color:0xff8a00
            })
        );

        glow.position.set(
            x,
            .95,
            3.05
        );

        visual.add(glow);

        exhausts.push(glow);
    }


    root.userData={
        visual,
        wheels,
        brakeLights,
        exhausts
    };


    return root;
}


// ============================================================
// RESET CAR
// ============================================================

function resetCar(){

    if(!game.car)return;

    const t=.006;

    const p=getTrackPoint(t);

    const heading=getTrackHeading(t);


    // PHYSICS ROOT POINTS ALONG TRACK

    game.car.position.copy(p);

    game.car.position.y+=.65;

    game.car.rotation.set(
        0,
        heading,
        0
    );


    // VISUAL CAR ALWAYS HAS THE 180° MODEL CORRECTION

    game.car.userData.visual.rotation.set(
        0,
        Math.PI,
        0
    );


    game.speed=0;
    game.steering=0;
    game.yawRate=0;
    game.lateralVelocity=0;

    game.started=false;
    game.finished=false;

    game.startTime=0;
    game.finishTime=0;

    game.checkpoint=0;

    document.getElementById("message").textContent=
        "PRESS W TO START";
}


// ============================================================
// CLOSEST TRACK POINT
// ============================================================

function closestTrackPoint(position){

    let bestT=0;
    let bestDist=Infinity;

    const samples=game.track.samples;

    for(let i=0;i<=samples;i+=3){

        const t=i/samples;

        const p=getTrackPoint(t);

        const d=
            p.distanceToSquared(position);

        if(d<bestDist){

            bestDist=d;
            bestT=t;
        }
    }

    return bestT;
}


// ============================================================
// CHECKPOINTS
// ============================================================

function updateCheckpoints(){

    if(game.finished)return;

    const t=closestTrackPoint(
        game.car.position
    );

    const cps=game.track.checkpoints;

    if(
        game.checkpoint<cps.length &&
        t>
        cps[game.checkpoint]-.012
    ){

        game.checkpoint++;
    }

    document.getElementById("checkpoints").textContent=
        `${game.checkpoint}/${cps.length}`;
}


// ============================================================
// FINISH
// ============================================================

function checkFinish(){

    if(game.finished)return;

    const t=closestTrackPoint(
        game.car.position
    );

    if(
        game.checkpoint>=
        game.track.checkpoints.length &&
        t>game.track.finishT-.02
    ){

        game.finished=true;

        game.speed=0;

        game.finishTime=
            performance.now()-
            game.startTime;

        document.getElementById("finishTime")
            .textContent=
            formatTime(game.finishTime);

        document.getElementById("finishScreen")
            .style.display="flex";

        saveGhost();
    }
}


// ============================================================
// TIME
// ============================================================

function formatTime(ms){

    const total=ms/1000;

    const minutes=
        Math.floor(total/60);

    const seconds=
        Math.floor(total%60);

    const milli=
        Math.floor(
            (total%1)*1000
        );

    return `${String(minutes).padStart(2,"0")}:`+
           `${String(seconds).padStart(2,"0")}.`+
           `${String(milli).padStart(3,"0")}`;
}


// ============================================================
// GHOST
// ============================================================

function saveGhost(){

    if(!game.ghost.length)return;

    try{

        localStorage.setItem(
            "f1ghost_"+game.trackNumber,
            JSON.stringify(game.ghost)
        );

    }catch(e){}
}


function loadGhost(){

    game.ghost=[];

    try{

        const raw=
            localStorage.getItem(
                "f1ghost_"+game.trackNumber
            );

        if(raw){

            game.ghost=
                JSON.parse(raw);
        }

    }catch(e){

        game.ghost=[];
    }
}


// ============================================================
// GHOST CAR
// ============================================================

function createGhost(){

    if(game.ghostCar){

        scene.remove(
            game.ghostCar
        );
    }

    if(!game.ghost.length){

        game.ghostCar=null;
        return;
    }

    const car=createCar();

    car.traverse(obj=>{

        if(obj.isMesh){

            obj.material=
                obj.material.clone();

            obj.material.transparent=true;
            obj.material.opacity=.25;
        }
    });

    scene.add(car);

    game.ghostCar=car;
}


function updateGhost(){

    if(
        !game.ghostCar ||
        !game.ghost.length ||
        !game.started
    )return;

    const elapsed=
        performance.now()-
        game.startTime;

    const seconds=
        elapsed/1000;

    let a=null;
    let b=null;

    for(let i=0;i<game.ghost.length-1;i++){

        if(
            game.ghost[i].time<=seconds &&
            game.ghost[i+1].time>=seconds
        ){

            a=game.ghost[i];
            b=game.ghost[i+1];

            break;
        }
    }

    if(!a)return;

    const span=b.time-a.time;

    const t=
        span<=0
        ?0
        :(seconds-a.time)/span;

    game.ghostCar.position.lerpVectors(
        new THREE.Vector3(
            a.x,a.y,a.z
        ),
        new THREE.Vector3(
            b.x,b.y,b.z
        ),
        t
    );

    game.ghostCar.rotation.y=
        THREE.MathUtils.lerp(
            a.rotation,
            b.rotation,
            t
        );
}


// ============================================================
// SKID MARKS
// ============================================================

function createSkidMarks(){

    const speed=Math.abs(game.speed);

    if(
        speed<30 ||
        Math.abs(game.steering)<.65
    )return;

    game.skidTimer-=.016;

    if(game.skidTimer>0)return;

    game.skidTimer=.055;

    const forward=new THREE.Vector3(
        0,0,1
    ).applyQuaternion(
        game.car.quaternion
    );

    const side=new THREE.Vector3(
        forward.z,
        0,
        -forward.x
    ).normalize();

    const p=game.car.position.clone();

    for(const s of [-1,1]){

        const mark=new THREE.Mesh(
            new THREE.PlaneGeometry(
                .3,
                2.5
            ),
            new THREE.MeshBasicMaterial({
                color:0x080808,
                transparent:true,
                opacity:.5,
                depthWrite:false
            })
        );

        mark.rotation.x=-Math.PI/2;

        mark.position.copy(p)
            .addScaledVector(
                side,
                s*1.05
            );

        mark.position.y=.04;

        mark.rotation.z=
            Math.atan2(
                forward.x,
                forward.z
            );

        scene.add(mark);

        setTimeout(()=>{

            scene.remove(mark);

        },5000);
    }
}


// ============================================================
// START RACE
// ============================================================

function startRace(){

    if(!game.started){

        game.started=true;

        game.startTime=
            performance.now();

        game.ghost=[];

        document.getElementById("message")
            .textContent="";
    }
}


function startRaceAgain(){

    document.getElementById("finishScreen")
        .style.display="none";

    resetCar();

    game.started=true;

    game.startTime=
        performance.now();

    game.ghost=[];

    document.getElementById("message")
        .textContent="";
}


// ============================================================
// PHYSICS
// ============================================================

function updatePhysics(dt){

    if(game.finished)return;


    const accelerating=
        keys["KeyW"];

    const braking=
        keys["KeyS"];

    const left=
        keys["KeyA"];

    const right=
        keys["KeyD"];


    // START WHEN W IS PRESSED

    if(
        accelerating &&
        !game.started
    ){

        startRace();
    }


    // --------------------------------------------------------
    // STEERING INPUT
    // --------------------------------------------------------

    let steeringInput=0;

    if(left)steeringInput-=1;
    if(right)steeringInput+=1;


    // Natural steering response.

    const steerRate=
        steeringInput===0
        ?11
        :7.5;

    game.steering +=
        (
            steeringInput-
            game.steering
        )*
        (
            1-
            Math.exp(
                -steerRate*dt
            )
        );


    // --------------------------------------------------------
    // ACCELERATION
    // --------------------------------------------------------

    const maxForwardSpeed=
        125; // 450 km/h

    const maxReverseSpeed=
        20;


    if(accelerating){

        const acceleration=
            game.speed<90
            ?42
            :26;

        game.speed +=
            acceleration*dt;
    }


    // --------------------------------------------------------
    // BRAKING
    // --------------------------------------------------------

    if(braking){

        if(game.speed>2){

            game.speed-=
                75*dt;

        }else{

            game.speed-=
                18*dt;
        }
    }


    // DRAG

    if(
        !accelerating &&
        !braking
    ){

        game.speed *=
            Math.pow(.992,dt*60);
    }


    game.speed=
        clamp(
            game.speed,
            -maxReverseSpeed,
            maxForwardSpeed
        );


    // --------------------------------------------------------
    // SPEED-SENSITIVE STEERING
    // --------------------------------------------------------

    const speedAbs=
        Math.abs(game.speed);

    const speed01=
        clamp(
            speedAbs/110,
            0,
            1
        );


    const maxSteerAngle=
        THREE.MathUtils.degToRad(
            lerp(
                34,
                12,
                speed01
            )
        );


    const steerAngle=
        game.steering*
        maxSteerAngle;


    // FRONT WHEELS

    for(const wheel of
        game.car.userData.wheels){

        if(wheel.front){

            wheel.steeringPivot.rotation.y=
                steerAngle;
        }
    }


    // --------------------------------------------------------
    // NATURAL YAW
    // --------------------------------------------------------

    if(speedAbs>1){

        const forwardSpeed=
            Math.max(
                Math.abs(game.speed),
                1
            );


        // Bicycle-model-inspired arcade steering.
        // Lower steering rate at very high speed.

        const wheelBase=4.7;

        const desiredYaw=
            Math.tan(
                steerAngle
            )*
            (
                forwardSpeed/
                wheelBase
            );


        const direction=
            game.speed>=0
            ?1
            :-1;


        const desiredYawRate=
            desiredYaw*
            direction;


        const yawResponse=
            1-
            Math.exp(
                -5.5*dt
            );


        game.yawRate +=
            (
                desiredYawRate-
                game.yawRate
            )*
            yawResponse;


        // Slight stability at very high speeds.

        const stability=
            lerp(
                1,
                .65,
                clamp(
                    speedAbs/125,
                    0,
                    1
                )
            );

        game.yawRate*=
            Math.pow(
                stability,
                dt
            );


        game.car.rotation.y +=
            game.yawRate*dt;
    }


    // --------------------------------------------------------
    // LATERAL GRIP
    // --------------------------------------------------------

    const forward=
        new THREE.Vector3(
            0,0,1
        ).applyQuaternion(
            game.car.quaternion
        );


    const side=
        new THREE.Vector3(
            forward.z,
            0,
            -forward.x
        ).normalize();


    const steeringSlip=
        game.steering*
        speedAbs*
        .018;


    game.lateralVelocity +=
        (
            steeringSlip-
            game.lateralVelocity
        )*
        (
            1-
            Math.exp(
                -7*dt
            )
        );


    // --------------------------------------------------------
    // POSITION
    // --------------------------------------------------------

    const movement=
        forward.clone()
        .multiplyScalar(
            game.speed*dt
        );


    const lateral=
        side.clone()
        .multiplyScalar(
            game.lateralVelocity*dt
        );


    game.car.position.add(
        movement
    );

    game.car.position.add(
        lateral
    );


    // --------------------------------------------------------
    // KEEP CAR ABOVE TRACK
    // --------------------------------------------------------

    const trackT=
        closestTrackPoint(
            game.car.position
        );

    const trackPoint=
        getTrackPoint(trackT);

    const targetY=
        trackPoint.y+.65;

    game.car.position.y=
        smoothDamp(
            game.car.position.y,
            targetY,
            7,
            dt
        );


    // --------------------------------------------------------
    // OFF TRACK SLOWDOWN
    // --------------------------------------------------------

    const distanceXZ=
        Math.hypot(
            game.car.position.x-
            trackPoint.x,

            game.car.position.z-
            trackPoint.z
        );


    if(
        distanceXZ>
        game.track.width*.72
    ){

        game.speed=
            smoothDamp(
                game.speed,
                0,
                2.5,
                dt
            );
    }


    // --------------------------------------------------------
    // WHEEL ROLLING
    // --------------------------------------------------------

    const roll=
        game.speed*
        dt/
        .58;

    for(const wheel of
        game.car.userData.wheels){

        wheel.rollPivot.rotation.x -=
            roll;
    }


    // --------------------------------------------------------
    // BRAKE LIGHTS
    // --------------------------------------------------------

    for(const light of
        game.car.userData.brakeLights){

        light.material.color.set(
            braking
            ?0xff0000
            :0x550000
        );
    }


    // --------------------------------------------------------
    // EXHAUST
    // --------------------------------------------------------

    for(const exhaust of
        game.car.userData.exhausts){

        const glow=
            accelerating
            ?1
            :0.2;

        exhaust.scale.setScalar(
            glow+
            Math.random()*.25
        );
    }


    // --------------------------------------------------------
    // SKIDS
    // --------------------------------------------------------

    if(
        Math.abs(game.steering)>.65 &&
        speedAbs>35
    ){

        createSkidMarks();
    }


    // --------------------------------------------------------
    // GHOST RECORDING
    // --------------------------------------------------------

    if(
        game.started &&
        !game.finished
    ){

        const elapsed=
            (
                performance.now()-
                game.startTime
            )/1000;

        if(
            elapsed-
            game.lastGhostSave>
            .06
        ){

            game.lastGhostSave=elapsed;

            game.ghost.push({

                time:elapsed,

                x:game.car.position.x,
                y:game.car.position.y,
                z:game.car.position.z,

                rotation:game.car.rotation.y
            });
        }
    }


    updateCheckpoints();

    checkFinish();
}


// ============================================================
// CAMERA
// ============================================================

function updateCamera(dt){

    if(!game.car)return;


    // IMPORTANT:
    // +Z is car forward.
    // Camera goes BEHIND the car along -Z.

    const forward=new THREE.Vector3(
        0,0,1
    ).applyQuaternion(
        game.car.quaternion
    );


    const speed01=
        clamp(
            Math.abs(game.speed)/125,
            0,
            1
        );


    const cameraDistance=
        lerp(
            10,
            15,
            speed01
        );


    const cameraHeight=
        lerp(
            5,
            7,
            speed01
        );


    const desired=
        game.car.position.clone()
        .addScaledVector(
            forward,
            -cameraDistance
        );

    desired.y+=cameraHeight;


    camera.position.lerp(
        desired,
        1-
        Math.exp(-6*dt)
    );


    const lookAt=
        game.car.position.clone()
        .addScaledVector(
            forward,
            10
        );

    lookAt.y+=1;


    const currentLook=
        new THREE.Vector3();

    camera.getWorldDirection(
        currentLook
    );

    const targetDirection=
        lookAt.clone()
        .sub(camera.position)
        .normalize();


    const newDirection=
        currentLook.lerp(
            targetDirection,
            1-
            Math.exp(-7*dt)
        );


    const targetQuaternion=
        new THREE.Quaternion()
        .setFromUnitVectors(
            new THREE.Vector3(0,0,-1),
            newDirection
        );


    camera.quaternion.slerp(
        targetQuaternion,
        1-
        Math.exp(-7*dt)
    );
}


// ============================================================
// LOAD TRACK
// ============================================================

function loadTrack(){

    if(game.track){

        // Remove previous track objects.

        while(scene.children.length>2){

            const obj=scene.children[
                scene.children.length-1
            ];

            if(
                obj!==sun &&
                obj!==hemi
            ){

                scene.remove(obj);

            }else{
                break;
            }
        }
    }


    game.track=null;

    game.car=null;

    game.checkpoint=0;


    const trackGroup=
        generateTrack();


    // CAR

    game.car=createCar();

    scene.add(
        game.car
    );


    resetCar();


    loadGhost();

    createGhost();


    document.getElementById("trackName")
        .textContent=
        `TRACK ${game.trackNumber} — `+
        `${game.track.theme.name}`;

    document.getElementById("checkpoints")
        .textContent=
        `0/${game.track.checkpoints.length}`;
}


// ============================================================
// NEXT TRACK
// ============================================================

function nextTrack(){

    document.getElementById("finishScreen")
        .style.display="none";

    document.getElementById("exitScreen")
        .style.display="none";

    game.trackNumber++;

    loadTrack();
}


// ============================================================
// EXIT
// ============================================================

function exitRace(){

    document.getElementById("exitScreen")
        .style.display="flex";
}

// BUTTONS
// ============================================================

document.getElementById("nextBtn")
    .onclick=nextTrack;

document.getElementById("exitBtn")
    .onclick=exitRace;

document.getElementById("againBtn")
    .onclick=startRaceAgain;

document.getElementById("finishNextBtn")
    .onclick=nextTrack;

document.getElementById("finishExitBtn")
    .onclick=exitRace;

document.getElementById("exitNextBtn")
    .onclick=nextTrack;

document.getElementById("returnBtn")
    .onclick=()=>{

        document.getElementById("exitScreen")
            .style.display="none";
    };


// ============================================================
// RESIZE
// ============================================================

addEventListener("resize",()=>{

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

});


// ============================================================
// ANIMATION
// ============================================================

let previousTime=
    performance.now();


function animate(){

    requestAnimationFrame(
        animate
    );


    const now=
        performance.now();


    let dt=
        (now-previousTime)/
        1000;


    previousTime=now;


    dt=
        Math.min(
            dt,
            .033
        );


    updatePhysics(dt);

    updateGhost();

    updateCamera(dt);


    // SPEED HUD

    document.getElementById("speed")
        .textContent=
        `${Math.round(
            Math.abs(game.speed)*3.6
        )} KM/H`;


    // TIMER

    if(
        game.started &&
        !game.finished
    ){

        const elapsed=
            now-game.startTime;

        document.getElementById("timer")
            .textContent=
            formatTime(elapsed);
    }


    renderer.render(
        scene,
        camera
    );
}


// ============================================================
// START
// ============================================================

loadTrack();

animate();

</script>
