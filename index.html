<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrackRush 3D</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #07101b;
        font-family: Arial, Helvetica, sans-serif;
    }

    canvas {
        display: block;
    }

    #hud {
        position: fixed;
        top: 18px;
        left: 18px;
        color: white;
        z-index: 10;
        pointer-events: none;
        text-shadow: 0 2px 5px #000;
    }

    #title {
        font-size: 25px;
        font-weight: 900;
        letter-spacing: 2px;
        margin-bottom: 8px;
    }

    #stats {
        background: rgba(0,0,0,.48);
        border: 1px solid rgba(255,255,255,.2);
        border-radius: 12px;
        padding: 12px 15px;
        min-width: 190px;
        backdrop-filter: blur(5px);
    }

    .row {
        margin: 4px 0;
    }

    #countdown {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 100px;
        font-weight: 900;
        z-index: 20;
        pointer-events: none;
        text-shadow: 0 6px 20px #000;
    }

    #message {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        color: white;
        font-size: 42px;
        font-weight: 900;
        text-align: center;
        z-index: 15;
        pointer-events: none;
        text-shadow: 0 5px 15px #000;
        display: none;
    }

    #controls {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,.5);
        color: white;
        padding: 9px 16px;
        border-radius: 12px;
        font-size: 13px;
        z-index: 10;
        text-align: center;
    }
</style>
</head>

<body>

<div id="hud">
    <div id="title">TRACKRUSH 3D</div>

    <div id="stats">
        <div class="row">TIME: <b id="time">0.00</b></div>
        <div class="row">BEST: <b id="best">--</b></div>
        <div class="row">TRACK: <b id="track">1</b></div>
        <div class="row">DIFFICULTY: <b id="difficulty">EASY</b></div>
        <div class="row">CHECKPOINT: <b id="checkpoint">1/1</b></div>
        <div class="row">SPEED: <b id="speed">0</b> km/h</div>
    </div>
</div>

<div id="countdown"></div>
<div id="message"></div>

<div id="controls">
    W / ↑ Accelerate &nbsp; | &nbsp;
    S / ↓ Brake &nbsp; | &nbsp;
    A / ← Right &nbsp; | &nbsp;
    D / → Left &nbsp; | &nbsp;
    R Reset &nbsp; | &nbsp;
    N Next Track
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* ============================================================
   SCENE
============================================================ */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x87b8d8);

scene.fog = new THREE.Fog(
    0x87b8d8,
    180,
    850
);

const camera = new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    2000
);

const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

document.body.appendChild(renderer.domElement);


/* ============================================================
   LIGHTING
============================================================ */

const hemi = new THREE.HemisphereLight(
    0xbfe8ff,
    0x49603e,
    1.7
);

scene.add(hemi);

const sun = new THREE.DirectionalLight(
    0xffffff,
    2.3
);

sun.position.set(
    180,
    260,
    120
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -400;
sun.shadow.camera.right = 400;
sun.shadow.camera.top = 400;
sun.shadow.camera.bottom = -400;

scene.add(sun);


/* ============================================================
   GAME STATE
============================================================ */

const game = {

    trackNumber: 1,

    difficulty: 0,

    width: 36,

    points: [],

    checkpoints: [],

    boosts: [],

    startTime: 0,

    elapsed: 0,

    best: null,

    racing: false,

    finished: false,

    countdown: true,

    speed: 0,

    heading: 0,

    checkpointIndex: 0
};


/* ============================================================
   TRACK ROOT
============================================================ */

const trackRoot = new THREE.Group();

scene.add(trackRoot);


/* ============================================================
   CAR
============================================================ */

const car = new THREE.Group();

scene.add(car);

const wheels = [];


/* ============================================================
   HELPERS
============================================================ */

function box(
    w,
    h,
    d,
    material,
    x = 0,
    y = 0,
    z = 0
) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
    );

    mesh.position.set(x, y, z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}


function cyl(
    radius,
    height,
    material,
    x = 0,
    y = 0,
    z = 0
) {

    const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(
            radius,
            radius,
            height,
            16
        ),
        material
    );

    mesh.position.set(x, y, z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}


/* ============================================================
   CAR MATERIALS
============================================================ */

function buildCar() {

    car.clear();

    wheels.length = 0;

    const blue =
        new THREE.MeshStandardMaterial({
            color: 0x111a4c,
            metalness: .35,
            roughness: .25
        });

    const red =
        new THREE.MeshStandardMaterial({
            color: 0xd71920,
            metalness: .2,
            roughness: .28
        });

    const orange =
        new THREE.MeshStandardMaterial({
            color: 0xff6500,
            metalness: .15,
            roughness: .3
        });

    const black =
        new THREE.MeshStandardMaterial({
            color: 0x090909,
            metalness: .15,
            roughness: .5
        });

    const carbon =
        new THREE.MeshStandardMaterial({
            color: 0x161616,
            metalness: .4,
            roughness: .3
        });

    const gold =
        new THREE.MeshStandardMaterial({
            color: 0xf5c542,
            metalness: .5,
            roughness: .22
        });

    /* Main body */

    const body = box(
        2.45,
        .45,
        5.2,
        blue
    );

    body.position.y = .75;

    car.add(body);


    /* Orange center stripe */

    const stripe = box(
        .45,
        .03,
        4.7,
        orange
    );

    stripe.position.set(
        0,
        1.0,
        0
    );

    car.add(stripe);


    /* Nose */

    const nose = box(
        1.25,
        .25,
        2.4,
        red
    );

    nose.position.set(
        0,
        .83,
        -3.3
    );

    car.add(nose);


    /* Cockpit */

    const cockpit = box(
        1.15,
        .32,
        1.45,
        black
    );

    cockpit.position.set(
        0,
        1.13,
        -.25
    );

    car.add(cockpit);


    /* Driver helmet */

    const helmet = new THREE.Mesh(
        new THREE.SphereGeometry(
            .42,
            20,
            16
        ),
        gold
    );

    helmet.position.set(
        0,
        1.48,
        -.25
    );

    helmet.scale.set(
        .9,
        1,
        .9
    );

    car.add(helmet);


    /* Helmet visor */

    const visorMat =
        new THREE.MeshStandardMaterial({
            color: 0x101a28,
            metalness: .7,
            roughness: .12
        });

    const visor = box(
        .72,
        .14,
        .18,
        visorMat
    );

    visor.position.set(
        0,
        1.53,
        -.57
    );

    car.add(visor);


    /* Halo */

    const haloMat =
        new THREE.MeshStandardMaterial({
            color: 0x111111,
            metalness: .7,
            roughness: .2
        });

    const haloBar = box(
        .12,
        .12,
        1.35,
        haloMat
    );

    haloBar.position.set(
        0,
        1.68,
        -.18
    );

    haloBar.rotation.x =
        THREE.MathUtils.degToRad(90);

    car.add(haloBar);


    /* Sidepods */

    const sideL = box(
        .7,
        .42,
        2.2,
        red
    );

    sideL.position.set(
        -1.15,
        .8,
        .35
    );

    car.add(sideL);


    const sideR = sideL.clone();

    sideR.position.x = 1.15;

    car.add(sideR);


    /* Front wing */

    const frontWing = box(
        4.2,
        .14,
        .32,
        carbon
    );

    frontWing.position.set(
        0,
        .48,
        -4.35
    );

    car.add(frontWing);


    const frontWing2 = box(
        3.3,
        .1,
        .25,
        orange
    );

    frontWing2.position.set(
        0,
        .62,
        -4.2
    );

    car.add(frontWing2);


    /* Rear wing */

    const rearWing = box(
        3.4,
        .18,
        .3,
        red
    );

    rearWing.position.set(
        0,
        1.65,
        2.45
    );

    car.add(rearWing);


    const rearSupportL = box(
        .12,
        .8,
        .12,
        carbon
    );

    rearSupportL.position.set(
        -.85,
        1.25,
        2.35
    );

    car.add(rearSupportL);


    const rearSupportR = rearSupportL.clone();

    rearSupportR.position.x = .85;

    car.add(rearSupportR);


    /* Wheels */

    const wheelMat =
        new THREE.MeshStandardMaterial({
            color: 0x070707,
            roughness: .7
        });

    const tirePositions = [
        [-1.42, .55, -2.55],
        [ 1.42, .55, -2.55],
        [-1.42, .55,  2.15],
        [ 1.42, .55,  2.15]
    ];

    tirePositions.forEach(p => {

        const wheel = new THREE.Mesh(
            new THREE.CylinderGeometry(
                .55,
                .55,
                .34,
                20
            ),
            wheelMat
        );

        wheel.rotation.z =
            Math.PI / 2;

        wheel.position.set(
            p[0],
            p[1],
            p[2]
        );

        wheel.castShadow = true;

        car.add(wheel);

        wheels.push(wheel);
    });


    /* Dutch flag */

    const flagCanvas =
        document.createElement("canvas");

    flagCanvas.width = 120;
    flagCanvas.height = 80;

    const ctx =
        flagCanvas.getContext("2d");

    ctx.fillStyle = "#ae1c28";
    ctx.fillRect(0, 0, 120, 26);

    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 26, 120, 28);

    ctx.fillStyle = "#21468b";
    ctx.fillRect(0, 54, 120, 26);

    const flagTexture =
        new THREE.CanvasTexture(flagCanvas);

    const flagMaterial =
        new THREE.MeshBasicMaterial({
            map: flagTexture
        });

    const flag = new THREE.Mesh(
        new THREE.PlaneGeometry(
            .6,
            .4
        ),
        flagMaterial
    );

    flag.position.set(
        .9,
        1.03,
        -.3
    );

    flag.rotation.x =
        -Math.PI / 2;

    car.add(flag);


    /* Number 3 */

    const numberCanvas =
        document.createElement("canvas");

    numberCanvas.width = 256;
    numberCanvas.height = 256;

    const nctx =
        numberCanvas.getContext("2d");

    nctx.fillStyle = "#ffffff";
    nctx.font = "bold 210px Arial";
    nctx.textAlign = "center";
    nctx.textBaseline = "middle";

    nctx.fillText(
        "3",
        128,
        135
    );

    const numberTexture =
        new THREE.CanvasTexture(
            numberCanvas
        );

    const numberMaterial =
        new THREE.MeshBasicMaterial({
            map: numberTexture,
            transparent: true
        });

    const number = new THREE.Mesh(
        new THREE.PlaneGeometry(
            .8,
            .8
        ),
        numberMaterial
    );

    number.position.set(
        0,
        1.04,
        .7
    );

    number.rotation.x =
        -Math.PI / 2;

    car.add(number);
}

buildCar();


/* ============================================================
   DIFFICULTY
============================================================ */

function difficultyName(d) {

    if (d <= 1) return "EASY";

    if (d <= 3) return "MEDIUM";

    if (d <= 5) return "HARD";

    if (d <= 7) return "EXTREME";

    return "INSANE";
}


function difficultySettings() {

    const d = game.difficulty;

    return {

        /* NEVER GETS NARROW */

        width: 36,

        /* Longer tracks at higher levels */

        length:
            190 + d * 28,

        /* More intense turns */

        turnStrength:
            .20 + d * .055,

        segments:
            75 + d * 14,

        hairpins:
            Math.min(
                1 + Math.floor(d / 2),
                5
            ),

        chicanes:
            1 + Math.floor(d * .7),

        switchbacks:
            Math.floor(d / 2),

        sharpTurns:
            2 + d,

        scenery:
            25 + d * 8
    };
}


/* ============================================================
   TRACK GENERATION
   COMPLETELY FLAT
============================================================ */

function generateTrack() {

    clearTrack();

    const s =
        difficultySettings();

    game.width = s.width;

    game.points = [];

    let x = 0;
    let z = 0;

    let heading = 0;

    const points = [];

    function addPoint() {

        points.push(
            new THREE.Vector3(
                x,
                0,
                z
            )
        );
    }


    /*
        Opening straight
    */

    for (let i = 0; i < 12; i++) {

        x += Math.sin(heading) * 9;
        z += Math.cos(heading) * 9;

        addPoint();
    }


    /*
        Randomized major sections
    */

    for (
        let section = 0;
        section < 7 + game.difficulty;
        section++
    ) {

        const type =
            section %
            6;


        /* ========================================
           HUGE SWEEPING TURN
        ======================================== */

        if (type === 0) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            const turn =
                THREE.MathUtils.clamp(
                    .85 +
                    game.difficulty * .08,
                    .85,
                    1.45
                );

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                heading +=
                    direction *
                    turn /
                    18;

                x += Math.sin(heading) * 9;
                z += Math.cos(heading) * 9;

                addPoint();
            }
        }


        /* ========================================
           HAIRPIN
        ======================================== */

        else if (type === 1) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            /*
                160 degree hairpin.
            */

            const totalAngle =
                THREE.MathUtils.degToRad(
                    165 +
                    Math.min(
                        game.difficulty * 3,
                        20
                    )
                );

            for (
                let i = 0;
                i < 30;
                i++
            ) {

                heading +=
                    direction *
                    totalAngle /
                    30;

                x += Math.sin(heading) * 7.5;
                z += Math.cos(heading) * 7.5;

                addPoint();
            }

            /* Exit */

            for (
                let i = 0;
                i < 8;
                i++
            ) {

                x +=
                    Math.sin(heading) * 8;

                z +=
                    Math.cos(heading) * 8;

                addPoint();
            }
        }


        /* ========================================
           EXTREME S-CURVE
        ======================================== */

        else if (type === 2) {

            const first =
                section % 2 === 0
                ? 1
                : -1;

            for (
                let i = 0;
                i < 14;
                i++
            ) {

                heading +=
                    first * .075;

                x += Math.sin(heading) * 8;
                z += Math.cos(heading) * 8;

                addPoint();
            }

            for (
                let i = 0;
                i < 14;
                i++
            ) {

                heading -=
                    first * .115;

                x += Math.sin(heading) * 8;
                z += Math.cos(heading) * 8;

                addPoint();
            }

            for (
                let i = 0;
                i < 12;
                i++
            ) {

                heading +=
                    first * .08;

                x += Math.sin(heading) * 8;
                z += Math.cos(heading) * 8;

                addPoint();
            }
        }


        /* ========================================
           CHICANE
        ======================================== */

        else if (type === 3) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            for (
                let i = 0;
                i < 8;
                i++
            ) {

                heading +=
                    direction * .13;

                x += Math.sin(heading) * 7;
                z += Math.cos(heading) * 7;

                addPoint();
            }

            for (
                let i = 0;
                i < 8;
                i++
            ) {

                heading -=
                    direction * .19;

                x += Math.sin(heading) * 7;
                z += Math.cos(heading) * 7;

                addPoint();
            }

            for (
                let i = 0;
                i < 8;
                i++
            ) {

                heading +=
                    direction * .14;

                x += Math.sin(heading) * 7;
                z += Math.cos(heading) * 7;

                addPoint();
            }
        }


        /* ========================================
           SWITCHBACK
        ======================================== */

        else if (type === 4) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            for (
                let i = 0;
                i < 16;
                i++
            ) {

                heading +=
                    direction * .105;

                x += Math.sin(heading) * 7.5;
                z += Math.cos(heading) * 7.5;

                addPoint();
            }

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                heading -=
                    direction * .125;

                x += Math.sin(heading) * 7.5;
                z += Math.cos(heading) * 7.5;

                addPoint();
            }

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                heading +=
                    direction * .125;

                x += Math.sin(heading) * 7.5;
                z += Math.cos(heading) * 7.5;

                addPoint();
            }
        }


        /* ========================================
           RAPID HAIRPIN COMBO
        ======================================== */

        else {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            /* First hairpin */

            for (
                let i = 0;
                i < 18;
                i++
            ) {

                heading +=
                    direction * .115;

                x += Math.sin(heading) * 7;
                z += Math.cos(heading) * 7;

                addPoint();
            }

            /* Short straight */

            for (
                let i = 0;
                i < 5;
                i++
            ) {

                x += Math.sin(heading) * 8;
                z += Math.cos(heading) * 8;

                addPoint();
            }

            /* Opposite hairpin */

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                heading -=
                    direction * .125;

                x += Math.sin(heading) * 7;
                z += Math.cos(heading) * 7;

                addPoint();
            }
        }
    }


    /*
        Final run back toward starting area.
    */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        x += Math.sin(heading) * 9;
        z += Math.cos(heading) * 9;

        addPoint();
    }


    game.points = points;

    buildRoad();

    buildFancyTrackFeatures();

    buildCheckpoints();

    buildBoosts();

    buildScenery();

    positionCarAtStart();
}


/* ============================================================
   CLEAR TRACK
============================================================ */

function clearTrack() {

    while (
        trackRoot.children.length
    ) {

        trackRoot.remove(
            trackRoot.children[
                trackRoot.children.length - 1
            ]
        );
    }

    game.checkpoints = [];
    game.boosts = [];
}


/* ============================================================
   TRACK FRAME
============================================================ */

function getFrame(index) {

    const p =
        game.points[
            Math.max(
                0,
                Math.min(
                    game.points.length - 1,
                    index
                )
            )
        ];

    const prev =
        game.points[
            Math.max(
                0,
                index - 1
            )
        ];

    const next =
        game.points[
            Math.min(
                game.points.length - 1,
                index + 1
            )
        ];

    const forward =
        new THREE.Vector3()
            .subVectors(
                next,
                prev
            )
            .normalize();

    forward.y = 0;
    forward.normalize();

    const side =
        new THREE.Vector3(
            forward.z,
            0,
            -forward.x
        );

    return {
        p,
        forward,
        side
    };
}


/* ============================================================
   ROAD
============================================================ */

function buildRoad() {

    const roadMat =
        new THREE.MeshStandardMaterial({
            color: 0x303238,
            roughness: .85,
            metalness: .05
        });

    const lineMat =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const curbRed =
        new THREE.MeshStandardMaterial({
            color: 0xd71920,
            roughness: .65
        });

    const curbWhite =
        new THREE.MeshStandardMaterial({
            color: 0xf0f0f0,
            roughness: .65
        });


    for (
        let i = 0;
        i < game.points.length - 1;
        i++
    ) {

        const a =
            game.points[i];

        const b =
            game.points[i + 1];

        const mid =
            new THREE.Vector3()
                .addVectors(a, b)
                .multiplyScalar(.5);

        const dx =
            b.x - a.x;

        const dz =
            b.z - a.z;

        const length =
            Math.sqrt(
                dx * dx +
                dz * dz
            );

        const angle =
            Math.atan2(
                dx,
                dz
            );


        /* Road */

        const road =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    game.width,
                    .18,
                    length + .25
                ),
                roadMat
            );

        road.position.copy(mid);

        road.position.y = 0;

        road.rotation.y =
            angle;

        road.receiveShadow = true;

        trackRoot.add(road);


        /* Center line */

        if (i % 2 === 0) {

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .22,
                        .025,
                        length * .55
                    ),
                    lineMat
                );

            line.position.copy(mid);

            line.position.y = .105;

            line.rotation.y =
                angle;

            trackRoot.add(line);
        }


        /* Curbs */

        const frame =
            getFrame(i);

        const curbWidth = .8;

        const left =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    curbWidth,
                    .12,
                    length
                ),
                i % 2 === 0
                ? curbRed
                : curbWhite
            );

        left.position.copy(mid);

        left.position.y = .12;

        left.position.addScaledVector(
            frame.side,
            game.width / 2 - curbWidth / 2
        );

        left.rotation.y =
            angle;

        trackRoot.add(left);


        const right =
            left.clone();

        right.position.copy(mid);

        right.position.y = .12;

        right.position.addScaledVector(
            frame.side,
            -(game.width / 2 - curbWidth / 2)
        );

        trackRoot.add(right);


        /* SOLID WALLS */

        const wallMat =
            new THREE.MeshStandardMaterial({
                color: 0x20242a,
                roughness: .65
            });

        const wallHeight = 1.4;

        const wallLeft =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .65,
                    wallHeight,
                    length
                ),
                wallMat
            );

        wallLeft.position.copy(mid);

        wallLeft.position.y =
            wallHeight / 2;

        wallLeft.position.addScaledVector(
            frame.side,
            game.width / 2 + .55
        );

        wallLeft.rotation.y =
            angle;

        wallLeft.castShadow = true;
        wallLeft.receiveShadow = true;

        trackRoot.add(wallLeft);


        const wallRight =
            wallLeft.clone();

        wallRight.position.copy(mid);

        wallRight.position.y =
            wallHeight / 2;

        wallRight.position.addScaledVector(
            frame.side,
            -(game.width / 2 + .55)
        );

        trackRoot.add(wallRight);
    }
}


/* ============================================================
   TRACK FEATURES
============================================================ */

function buildFancyTrackFeatures() {

    /*
        NO RAMPS.
        NO BUMPS.
        NO JUMPS.
        Everything stays perfectly flat.
    */

    const featureCount =
        Math.floor(
            game.points.length / 18
        );


    for (
        let i = 1;
        i <= featureCount;
        i++
    ) {

        const index =
            Math.min(
                game.points.length - 4,
                i * 18
            );

        const frame =
            getFrame(index);


        /* Overhead gate */

        const gateMat =
            new THREE.MeshStandardMaterial({
                color:
                    i % 2 === 0
                    ? 0xff6a00
                    : 0x1565c0,
                metalness: .3,
                roughness: .3
            });

        const postL =
            box(
                .55,
                5,
                .55,
                gateMat
            );

        postL.position.copy(
            frame.p
        );

        postL.position.addScaledVector(
            frame.side,
            -game.width / 2 + 2
        );

        postL.position.y = 2.5;

        trackRoot.add(postL);


        const postR =
            postL.clone();

        postR.position.copy(
            frame.p
        );

        postR.position.addScaledVector(
            frame.side,
            game.width / 2 - 2
        );

        postR.position.y = 2.5;

        trackRoot.add(postR);


        const beam =
            box(
                game.width - 4,
                .55,
                .55,
                gateMat
            );

        beam.position.copy(
            frame.p
        );

        beam.position.y = 5;

        beam.rotation.y =
            Math.atan2(
                frame.forward.x,
                frame.forward.z
            );

        trackRoot.add(beam);
    }
}


/* ============================================================
   TUNNELS
============================================================ */

function buildTunnel(index) {

    const frame =
        getFrame(index);

    const tunnelMat =
        new THREE.MeshStandardMaterial({
            color: 0x181b22,
            roughness: .7
        });

    const width =
        game.width + 5;

    const left =
        box(
            2,
            7,
            2,
            tunnelMat
        );

    left.position.copy(
        frame.p
    );

    left.position.addScaledVector(
        frame.side,
        -width / 2
    );

    left.position.y = 3.5;

    trackRoot.add(left);


    const right =
        left.clone();

    right.position.copy(
        frame.p
    );

    right.position.addScaledVector(
        frame.side,
        width / 2
    );

    right.position.y = 3.5;

    trackRoot.add(right);


    const roof =
        box(
            width,
            2,
            2,
            tunnelMat
        );

    roof.position.copy(
        frame.p
    );

    roof.position.y = 7;

    trackRoot.add(roof);
}


/* ============================================================
   CHECKPOINTS
============================================================ */

function buildCheckpoints() {

    game.checkpoints = [];

    const spacing =
        Math.max(
            22,
            Math.floor(
                game.points.length / 10
            )
        );

    for (
        let i = spacing;
        i < game.points.length;
        i += spacing
    ) {

        const frame =
            getFrame(i);

        const gate =
            new THREE.Group();

        const material =
            new THREE.MeshStandardMaterial({
                color: 0x00e5ff,
                emissive: 0x004c55,
                emissiveIntensity: 2
            });

        const left =
            box(
                .25,
                5,
                .25,
                material
            );

        left.position.copy(
            frame.p
        );

        left.position.addScaledVector(
            frame.side,
            -game.width / 2 + 1
        );

        left.position.y = 2.5;

        gate.add(left);


        const right =
            left.clone();

        right.position.copy(
            frame.p
        );

        right.position.addScaledVector(
            frame.side,
            game.width / 2 - 1
        );

        gate.add(right);


        const top =
            box(
                game.width - 2,
                .25,
                .25,
                material
            );

        top.position.copy(
            frame.p
        );

        top.position.y = 5;

        gate.add(top);

        trackRoot.add(gate);

        game.checkpoints.push({
            index: i,
            group: gate
        });
    }
}


/* ============================================================
   BOOST PADS
============================================================ */

function buildBoosts() {

    const boostMat =
        new THREE.MeshBasicMaterial({
            color: 0x00ffcc,
            emissive: 0x00aa88
        });

    for (
        let i = 15;
        i < game.points.length - 15;
        i += 45
    ) {

        const frame =
            getFrame(i);

        const pad =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    7,
                    .08,
                    5
                ),
                boostMat
            );

        pad.position.copy(
            frame.p
        );

        pad.position.y =
            .12;

        pad.rotation.y =
            Math.atan2(
                frame.forward.x,
                frame.forward.z
            );

        trackRoot.add(pad);

        game.boosts.push({
            index: i,
            mesh: pad
        });
    }
}


/* ============================================================
   SCENERY
============================================================ */

function buildScenery() {

    const settings =
        difficultySettings();

    const treeMat =
        new THREE.MeshStandardMaterial({
            color: 0x236b35
        });

    const trunkMat =
        new THREE.MeshStandardMaterial({
            color: 0x684321
        });

    for (
        let i = 0;
        i < settings.scenery;
        i++
    ) {

        const index =
            Math.floor(
                Math.random() *
                game.points.length
            );

        const frame =
            getFrame(index);

        const side =
            Math.random() > .5
            ? 1
            : -1;

        const distance =
            game.width / 2 +
            18 +
            Math.random() * 35;

        const tree =
            new THREE.Group();

        const trunk =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .35,
                    .5,
                    4,
                    8
                ),
                trunkMat
            );

        trunk.position.y = 2;

        tree.add(trunk);


        const leaves =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    2.8,
                    6,
                    9
                ),
                treeMat
            );

        leaves.position.y = 6;

        tree.add(leaves);


        tree.position.copy(
            frame.p
        );

        tree.position.addScaledVector(
            frame.side,
            side * distance
        );

        tree.scale.setScalar(
            .7 +
            Math.random() * .8
        );

        tree.traverse(
            object => {

                if (object.isMesh) {

                    object.castShadow = true;
                    object.receiveShadow = true;
                }
            }
        );

        trackRoot.add(tree);
    }


    /* Windmill-style scenery */

    for (
        let i = 20;
        i < game.points.length;
        i += 55
    ) {

        const frame =
            getFrame(i);

        const side =
            i % 2 === 0
            ? 1
            : -1;

        const distance =
            game.width / 2 +
            25;

        const tower =
            box(
                2,
                12,
                2,
                new THREE.MeshStandardMaterial({
                    color: 0xe5e1d7
                })
            );

        tower.position.copy(
            frame.p
        );

        tower.position.addScaledVector(
            frame.side,
            side * distance
        );

        tower.position.y = 6;

        trackRoot.add(tower);


        const rotor =
            new THREE.Group();

        rotor.position.copy(
            tower.position
        );

        rotor.position.y = 10;

        for (
            let j = 0;
            j < 4;
            j++
        ) {

            const blade =
                box(
                    .35,
                    .35,
                    6,
                    new THREE.MeshStandardMaterial({
                        color: 0xffffff
                    })
                );

            blade.position.z = 3;

            blade.rotation.y =
                j * Math.PI / 2;

            rotor.add(blade);
        }

        trackRoot.add(rotor);
    }
}


/* ============================================================
   POSITION CAR
============================================================ */

function positionCarAtStart() {

    const frame =
        getFrame(2);

    car.position.copy(
        frame.p
    );

    car.position.y =
        .42;

    car.rotation.y =
        Math.atan2(
            frame.forward.x,
            frame.forward.z
        );

    game.heading =
        car.rotation.y;

    game.speed = 0;
}


/* ============================================================
   INPUT
============================================================ */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[e.key.toLowerCase()] = true;

        if (
            e.key.toLowerCase() === "r"
        ) {
            resetRace();
        }

        if (
            e.key.toLowerCase() === "n"
        ) {
            nextTrack();
        }

        if (
            e.code === "Space" &&
            game.finished
        ) {
            resetRace();
        }
    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[e.key.toLowerCase()] = false;
    }
);


/* ============================================================
   NEAREST TRACK
============================================================ */

function nearestTrack() {

    let best =
        Infinity;

    let index = 0;

    for (
        let i = 0;
        i < game.points.length;
        i++
    ) {

        const p =
            game.points[i];

        const dx =
            p.x -
            car.position.x;

        const dz =
            p.z -
            car.position.z;

        const dist =
            dx * dx +
            dz * dz;

        if (
            dist < best
        ) {

            best = dist;
            index = i;
        }
    }

    return {
        index,
        distance: Math.sqrt(best)
    };
}


/* ============================================================
   PHYSICS
============================================================ */

function updatePhysics(dt) {

    if (
        !game.racing ||
        game.finished
    ) {
        return;
    }


    const throttle =
        keys["w"] ||
        keys["arrowup"];

    const brake =
        keys["s"] ||
        keys["arrowdown"];


    /*
        Car speed.
    */

    if (throttle) {

        game.speed +=
            32 * dt;
    }
    else {

        game.speed -=
            7 * dt;
    }


    if (brake) {

        game.speed -=
            55 * dt;
    }


    game.speed =
        THREE.MathUtils.clamp(
            game.speed,
            0,
            95
        );


    /*
        Steering.

        A and D intentionally use
        the requested reversed setup.
    */

    let steer = 0;

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        steer = 1;
    }

    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        steer = -1;
    }


    /*
        Steering becomes more intense
        at higher speed.
    */

    const steeringPower =
        1.55 *
        (0.35 +
        game.speed / 80);


    game.heading +=
        steer *
        steeringPower *
        dt;


    /*
        Move.
    */

    car.position.x +=
        Math.sin(game.heading) *
        game.speed *
        dt;

    car.position.z +=
        Math.cos(game.heading) *
        game.speed *
        dt;


    /*
        FLAT TRACK:
        car never rises or falls.
    */

    car.position.y =
        .42;


    /*
        Wheel rotation.
    */

    wheels.forEach(
        wheel => {

            wheel.rotation.x -=
                game.speed *
                dt *
                .35;
        }
    );


    /*
        Track correction.

        Wide road makes the car
        forgiving but the walls
        remain solid.
    */

    const near =
        nearestTrack();

    const frame =
        getFrame(
            near.index
        );

    const lateral =
        new THREE.Vector3()
            .subVectors(
                car.position,
                frame.p
            )
            .dot(
                frame.side
            );


    const limit =
        game.width / 2 - 1.7;


    if (
        Math.abs(lateral) >
        limit
    ) {

        /*
            Solid wall collision.
        */

        const correction =
            lateral > 0
            ? limit - lateral
            : -limit - lateral;

        car.position.addScaledVector(
            frame.side,
            correction * .35
        );

        game.speed *= .72;
    }


    /*
        Boost pads.
    */

    for (
        const boost of game.boosts
    ) {

        const p =
            game.points[
                boost.index
            ];

        const dx =
            car.position.x -
            p.x;

        const dz =
            car.position.z -
            p.z;

        if (
            dx * dx +
            dz * dz <
            25
        ) {

            game.speed =
                Math.min(
                    110,
                    game.speed + 42
                );
        }
    }


    /*
        Checkpoints.
    */

    if (
        game.checkpoints.length > 0
    ) {

        const next =
            game.checkpoints[
                game.checkpointIndex
            ];

        if (next) {

            const p =
                game.points[
                    next.index
                ];

            const dx =
                car.position.x -
                p.x;

            const dz =
                car.position.z -
                p.z;

            if (
                dx * dx +
                dz * dz <
                160
            ) {

                game.checkpointIndex++;

                if (
                    game.checkpointIndex >=
                    game.checkpoints.length
                ) {

                    finishRace();
                }
            }
        }
    }


    /*
        Finish fallback.
    */

    const last =
        game.points[
            game.points.length - 5
        ];

    const fdX =
        car.position.x -
        last.x;

    const fdZ =
        car.position.z -
        last.z;

    if (
        fdX * fdX +
        fdZ * fdZ <
        180
    ) {

        finishRace();
    }
}


/* ============================================================
   CAMERA
============================================================ */

function updateCamera(dt) {

    const forward =
        new THREE.Vector3(
            Math.sin(game.heading),
            0,
            Math.cos(game.heading)
        );


    const target =
        car.position.clone()
            .addScaledVector(
                forward,
                -12
            );

    target.y += 7;


    camera.position.lerp(
        target,
        1 -
        Math.pow(
            .001,
            dt
        )
    );


    const look =
        car.position.clone();

    look.y += 1;


    camera.lookAt(
        look
    );
}


/* ============================================================
   RESET RACE
============================================================ */

function resetRace() {

    game.finished = false;

    game.racing = false;

    game.countdown = true;

    game.elapsed = 0;

    game.checkpointIndex = 0;

    game.speed = 0;

    positionCarAtStart();

    document.getElementById(
        "message"
    ).style.display = "none";

    startCountdown();
}


/* ============================================================
   NEW TRACK
============================================================ */

function nextTrack() {

    game.trackNumber++;

    game.difficulty =
        Math.floor(
            (game.trackNumber - 1) / 1
        );

    generateTrack();

    loadBest();

    resetRace();
}


/* ============================================================
   COUNTDOWN
============================================================ */

function startCountdown() {

    const element =
        document.getElementById(
            "countdown"
        );

    let count = 3;

    element.textContent =
        count;

    const timer =
        setInterval(
            () => {

                count--;

                if (
                    count > 0
                ) {

                    element.textContent =
                        count;
                }

                else {

                    element.textContent =
                        "GO!";

                    game.racing = true;

                    game.startTime =
                        performance.now();

                    setTimeout(
                        () => {

                            element.textContent =
                                "";

                        },
                        600
                    );

                    clearInterval(timer);
                }

            },
            800
        );
}


/* ============================================================
   FINISH
============================================================ */

function finishRace() {

    if (
        game.finished
    ) {
        return;
    }

    game.finished = true;

    game.racing = false;

    const message =
        document.getElementById(
            "message"
        );

    message.innerHTML =
        `
        FINISH!<br>
        <span style="font-size:22px">
        ${game.elapsed.toFixed(2)} seconds
        </span>
        <br>
        <span style="font-size:16px">
        Press SPACE to race again
        </span>
        `;

    message.style.display =
        "block";


    if (
        game.best === null ||
        game.elapsed < game.best
    ) {

        game.best =
            game.elapsed;

        localStorage.setItem(
            "trackrush_best_" +
            game.trackNumber,
            game.best
        );
    }
}


/* ============================================================
   BEST TIME
============================================================ */

function loadBest() {

    const value =
        localStorage.getItem(
            "trackrush_best_" +
            game.trackNumber
        );

    game.best =
        value
        ? Number(value)
        : null;
}


/* ============================================================
   HUD
============================================================ */

function updateHUD() {

    document.getElementById(
        "time"
    ).textContent =
        game.elapsed.toFixed(2);


    document.getElementById(
        "best"
    ).textContent =
        game.best !== null
        ? game.best.toFixed(2)
        : "--";


    document.getElementById(
        "track"
    ).textContent =
        game.trackNumber;


    document.getElementById(
        "difficulty"
    ).textContent =
        difficultyName(
            game.difficulty
        );


    document.getElementById(
        "checkpoint"
    ).textContent =
        `${Math.min(
            game.checkpointIndex + 1,
            game.checkpoints.length
        )}/${game.checkpoints.length}`;


    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            game.speed * 3.6
        );
}


/* ============================================================
   GROUND
============================================================ */

const groundMat =
    new THREE.MeshStandardMaterial({
        color: 0x4b713e,
        roughness: 1
    });

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            4000,
            4000
        ),
        groundMat
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y =
    -.12;

ground.receiveShadow = true;

scene.add(ground);


/* ============================================================
   START
============================================================ */

game.difficulty = 0;

generateTrack();

loadBest();

resetRace();


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* ============================================================
   MAIN LOOP
============================================================ */

let last =
    performance.now();


function animate(now) {

    requestAnimationFrame(
        animate
    );

    const dt =
        Math.min(
            .05,
            (now - last) / 1000
        );

    last = now;


    if (
        game.racing &&
        !game.finished
    ) {

        game.elapsed =
            (now -
            game.startTime) /
            1000;
    }


    updatePhysics(dt);

    updateCamera(dt);

    updateHUD();

    renderer.render(
        scene,
        camera
    );
}


animate(
    performance.now()
);

</script>
