/* ============================================================
   HELPERS
============================================================ */

function box(
    w,
    h,
    d,
    material,
    x = 0,
    y = 0,
    z = 0
) {

    const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d),
        material
    );

    mesh.position.set(x, y, z);

    mesh.castShadow = true;
    mesh.receiveShadow = true;

    return mesh;
}

/* ============================================================
   DIFFICULTY
============================================================ */

function difficultyName(d) {

    if (d <= 1) return "EASY";

    if (d <= 3) return "MEDIUM";

    if (d <= 5) return "HARD";

    if (d <= 7) return "EXTREME";

    return "INSANE";
}


function difficultySettings() {

    const d =
        game.difficulty;

    return {

        width: 36,

        length:
            190 + d * 28,

        segments:
            75 + d * 14
    };
}


/* ============================================================
   CLEAR TRACK
============================================================ */

function clearTrack() {

    while (
        trackRoot.children.length
    ) {

        trackRoot.remove(
            trackRoot.children[
                trackRoot.children.length - 1
            ]
        );
    }

    game.checkpoints = [];

    game.boosts = [];
}


/* ============================================================
   TRACK GENERATION
============================================================ */

function generateTrack() {

    clearTrack();

    const settings =
        difficultySettings();

    game.width =
        settings.width;

    const points = [];

    let x = 0;

    let z = 0;

    /*
        IMPORTANT:

        The track starts facing +Z.

        This gives the car a clear,
        straight starting direction.
    */

    let heading = 0;


    function addPoint() {

        points.push(
            new THREE.Vector3(
                x,
                0,
                z
            )
        );
    }


    /*
        LONG STARTING STRAIGHT

        This guarantees that the
        starting direction is obvious.
    */

    for (
        let i = 0;
        i < 20;
        i++
    ) {

        x +=
            Math.sin(heading) * 9;

        z +=
            Math.cos(heading) * 9;

        addPoint();
    }


    /*
        HARD TRACK SECTIONS
    */

    for (
        let section = 0;
        section < 7 + game.difficulty;
        section++
    ) {

        const type =
            section % 6;


        /* ========================================
           SWEEPING TURN
        ======================================== */

        if (type === 0) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            const amount =
                .9 +
                game.difficulty * .06;

            for (
                let i = 0;
                i < 22;
                i++
            ) {

                heading +=
                    direction *
                    amount / 22;

                x +=
                    Math.sin(heading) * 9;

                z +=
                    Math.cos(heading) * 9;

                addPoint();
            }
        }


        /* ========================================
           HAIRPIN
        ======================================== */

        else if (type === 1) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            const angle =
                THREE.MathUtils.degToRad(
                    170
                );

            for (
                let i = 0;
                i < 34;
                i++
            ) {

                heading +=
                    direction *
                    angle / 34;

                x +=
                    Math.sin(heading) * 7.5;

                z +=
                    Math.cos(heading) * 7.5;

                addPoint();
            }


            /*
                Exit straight.
            */

            for (
                let i = 0;
                i < 10;
                i++
            ) {

                x +=
                    Math.sin(heading) * 8;

                z +=
                    Math.cos(heading) * 8;

                addPoint();
            }
        }


        /* ========================================
           S CURVE
        ======================================== */

        else if (type === 2) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                heading +=
                    direction * .08;

                x +=
                    Math.sin(heading) * 8;

                z +=
                    Math.cos(heading) * 8;

                addPoint();
            }

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                heading -=
                    direction * .12;

                x +=
                    Math.sin(heading) * 8;

                z +=
                    Math.cos(heading) * 8;

                addPoint();
            }

            for (
                let i = 0;
                i < 15;
                i++
            ) {

                heading +=
                    direction * .08;

                x +=
                    Math.sin(heading) * 8;

                z +=
                    Math.cos(heading) * 8;

                addPoint();
            }
        }


        /* ========================================
           CHICANE
        ======================================== */

        else if (type === 3) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            for (
                let i = 0;
                i < 10;
                i++
            ) {

                heading +=
                    direction * .12;

                x +=
                    Math.sin(heading) * 7;

                z +=
                    Math.cos(heading) * 7;

                addPoint();
            }

            for (
                let i = 0;
                i < 12;
                i++
            ) {

                heading -=
                    direction * .19;

                x +=
                    Math.sin(heading) * 7;

                z +=
                    Math.cos(heading) * 7;

                addPoint();
            }

            for (
                let i = 0;
                i < 10;
                i++
            ) {

                heading +=
                    direction * .12;

                x +=
                    Math.sin(heading) * 7;

                z +=
                    Math.cos(heading) * 7;

                addPoint();
            }
        }


        /* ========================================
           SWITCHBACK
        ======================================== */

        else if (type === 4) {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            for (
                let i = 0;
                i < 20;
                i++
            ) {

                heading +=
                    direction * .10;

                x +=
                    Math.sin(heading) * 7;

                z +=
                    Math.cos(heading) * 7;

                addPoint();
            }

            for (
                let i = 0;
                i < 24;
                i++
            ) {

                heading -=
                    direction * .12;

                x +=
                    Math.sin(heading) * 7;

                z +=
                    Math.cos(heading) * 7;

                addPoint();
            }
        }


        /* ========================================
           DOUBLE HAIRPIN
        ======================================== */

        else {

            const direction =
                section % 2 === 0
                ? 1
                : -1;

            for (
                let i = 0;
                i < 26;
                i++
            ) {

                heading +=
                    direction * .11;

                x +=
                    Math.sin(heading) * 7;

                z +=
                    Math.cos(heading) * 7;

                addPoint();
            }

            for (
                let i = 0;
                i < 7;
                i++
            ) {

                x +=
                    Math.sin(heading) * 8;

                z +=
                    Math.cos(heading) * 8;

                addPoint();
            }

            for (
                let i = 0;
                i < 28;
                i++
            ) {

                heading -=
                    direction * .115;

                x +=
                    Math.sin(heading) * 7;

                z +=
                    Math.cos(heading) * 7;

                addPoint();
            }
        }
    }


    /*
        Final straight.
    */

    for (
        let i = 0;
        i < 25;
        i++
    ) {

        x +=
            Math.sin(heading) * 9;

        z +=
            Math.cos(heading) * 9;

        addPoint();
    }


    game.points =
        points;

    buildRoad();

    buildFeatures();

    buildCheckpoints();

    buildBoosts();

    buildScenery();

    positionCarAtStart();
}


/* ============================================================
   TRACK FRAME
============================================================ */

function getFrame(index) {

    const safe =
        Math.max(
            0,
            Math.min(
                game.points.length - 1,
                index
            )
        );

    const current =
        game.points[safe];

    const previous =
        game.points[
            Math.max(
                0,
                safe - 1
            )
        ];

    const next =
        game.points[
            Math.min(
                game.points.length - 1,
                safe + 1
            )
        ];


    /*
        Track direction is calculated
        from neighboring points.
    */

    const forward =
        new THREE.Vector3()
            .subVectors(
                next,
                previous
            );

    forward.y = 0;

    forward.normalize();


    /*
        Correct perpendicular vector.
    */

    const side =
        new THREE.Vector3(
            forward.z,
            0,
            -forward.x
        );

    return {
        p: current,
        forward,
        side
    };
}


/* ============================================================
   ROAD
============================================================ */

function buildRoad() {

    const roadMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x303238,
            roughness: .85
        });

    const white =
        new THREE.MeshBasicMaterial({
            color: 0xffffff
        });

    const red =
        new THREE.MeshStandardMaterial({
            color: 0xd71920
        });


    for (
        let i = 0;
        i < game.points.length - 1;
        i++
    ) {

        const a =
            game.points[i];

        const b =
            game.points[i + 1];


        const middle =
            new THREE.Vector3()
                .addVectors(
                    a,
                    b
                )
                .multiplyScalar(.5);


        const dx =
            b.x - a.x;

        const dz =
            b.z - a.z;

        const length =
            Math.sqrt(
                dx * dx +
                dz * dz
            );


        /*
            IMPORTANT:

            Road rotation uses the exact
            direction between points.
        */

        const angle =
            Math.atan2(
                dx,
                dz
            );


        const road =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    game.width,
                    .18,
                    length + .3
                ),
                roadMaterial
            );

        road.position.copy(
            middle
        );

        road.rotation.y =
            angle;

        road.receiveShadow = true;

        trackRoot.add(road);


        /*
            Center line.
        */

        if (
            i % 2 === 0
        ) {

            const line =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        .18,
                        .025,
                        length * .55
                    ),
                    white
                );

            line.position.copy(
                middle
            );

            line.position.y =
                .105;

            line.rotation.y =
                angle;

            trackRoot.add(line);
        }


        /*
            Side walls.
        */

        const frame =
            getFrame(i);

        const wallMaterial =
            new THREE.MeshStandardMaterial({
                color: 0x20242a,
                roughness: .65
            });


        const wall =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .6,
                    1.4,
                    length
                ),
                wallMaterial
            );

        wall.position.copy(
            middle
        );

        wall.position.y =
            .7;

        wall.position.addScaledVector(
            frame.side,
            game.width / 2 + .55
        );

        wall.rotation.y =
            angle;

        wall.castShadow = true;

        trackRoot.add(wall);


        const opposite =
            wall.clone();

        opposite.position.copy(
            middle
        );

        opposite.position.y =
            .7;

        opposite.position.addScaledVector(
            frame.side,
            -game.width / 2 - .55
        );

        trackRoot.add(opposite);
    }
}


/* ============================================================
   FEATURES
============================================================ */

function buildFeatures() {

    for (
        let i = 30;
        i < game.points.length;
        i += 30
    ) {

        const frame =
            getFrame(i);

        const material =
            new THREE.MeshStandardMaterial({
                color:
                    i % 2
                    ? 0xff6500
                    : 0x1769aa,
                metalness: .3,
                roughness: .3
            });


        const left =
            box(
                .5,
                5,
                .5,
                material
            );

        left.position.copy(
            frame.p
        );

        left.position.addScaledVector(
            frame.side,
            -game.width / 2 + 2
        );

        left.position.y =
            2.5;

        trackRoot.add(left);


        const right =
            left.clone();

        right.position.copy(
            frame.p
        );

        right.position.addScaledVector(
            frame.side,
            game.width / 2 - 2
        );

        trackRoot.add(right);


        const top =
            box(
                game.width - 4,
                .5,
                .5,
                material
            );

        top.position.copy(
            frame.p
        );

        top.position.y =
            5;

        top.rotation.y =
            Math.atan2(
                frame.forward.x,
                frame.forward.z
            );

        trackRoot.add(top);
    }
}


/* ============================================================
   CHECKPOINTS
============================================================ */

function buildCheckpoints() {

    game.checkpoints = [];

    const spacing =
        Math.max(
            28,
            Math.floor(
                game.points.length / 9
            )
        );


    for (
        let i = spacing;
        i < game.points.length;
        i += spacing
    ) {

        const frame =
            getFrame(i);

        const material =
            new THREE.MeshStandardMaterial({
                color: 0x00e5ff,
                emissive: 0x005566,
                emissiveIntensity: 2
            });


        const gate =
            new THREE.Group();


        const left =
            box(
                .25,
                5,
                .25,
                material
            );

        left.position.copy(
            frame.p
        );

        left.position.addScaledVector(
            frame.side,
            -game.width / 2 + 1
        );

        left.position.y =
            2.5;

        gate.add(left);


        const right =
            left.clone();

        right.position.copy(
            frame.p
        );

        right.position.addScaledVector(
            frame.side,
            game.width / 2 - 1
        );

        gate.add(right);


        const top =
            box(
                game.width - 2,
                .25,
                .25,
                material
            );

        top.position.copy(
            frame.p
        );

        top.position.y =
            5;

        top.rotation.y =
            Math.atan2(
                frame.forward.x,
                frame.forward.z
            );

        gate.add(top);

        trackRoot.add(gate);

        game.checkpoints.push({
            index: i
        });
    }
}


/* ============================================================
   BOOSTS
============================================================ */

function buildBoosts() {

    const material =
        new THREE.MeshBasicMaterial({
            color: 0x00ffcc
        });


    for (
        let i = 25;
        i < game.points.length - 20;
        i += 50
    ) {

        const frame =
            getFrame(i);

        const pad =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    8,
                    .08,
                    5
                ),
                material
            );

        pad.position.copy(
            frame.p
        );

        pad.position.y =
            .12;

        pad.rotation.y =
            Math.atan2(
                frame.forward.x,
                frame.forward.z
            );

        trackRoot.add(pad);

        game.boosts.push({
            index: i,
            mesh: pad
        });
    }
}


/* ============================================================
   SCENERY
============================================================ */

function buildScenery() {

    const treeMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x236b35
        });

    const trunkMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x684321
        });


    for (
        let i = 0;
        i < 45;
        i++
    ) {

        const index =
            Math.floor(
                Math.random() *
                game.points.length
            );

        const frame =
            getFrame(index);

        const side =
            Math.random() > .5
            ? 1
            : -1;

        const distance =
            game.width / 2 +
            18 +
            Math.random() * 35;


        const tree =
            new THREE.Group();


        const trunk =
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .35,
                    .5,
                    4,
                    8
                ),
                trunkMaterial
            );

        trunk.position.y =
            2;

        tree.add(trunk);


        const leaves =
            new THREE.Mesh(
                new THREE.ConeGeometry(
                    2.8,
                    6,
                    9
                ),
                treeMaterial
            );

        leaves.position.y =
            6;

        tree.add(leaves);


        tree.position.copy(
            frame.p
        );

        tree.position.addScaledVector(
            frame.side,
            side * distance
        );

        trackRoot.add(tree);
    }
}


/* ============================================================
   START POSITION
============================================================ */

function positionCarAtStart() {

    /*
        Use the first THREE points rather
        than an arbitrary heading.

        This guarantees the car points
        exactly where the track goes.
    */

    const frame =
        getFrame(3);


    /*
        Car position.
    */

    car.position.copy(
        frame.p
    );

    car.position.y =
        .42;


    /*
        Three.js car nose points
        toward -Z.

        Track forward points toward +Z
        at the beginning.

        Therefore rotate by the
        negative of the track angle.
    */

    const trackAngle =
        Math.atan2(
            frame.forward.x,
            frame.forward.z
        );


    car.rotation.y =
        trackAngle;


    /*
        Store the exact starting
        heading for physics.
    */

    game.heading =
        trackAngle;

    game.speed = 0;

    game.steering = 0;
}


/* ============================================================
   INPUT
============================================================ */

const keys = {};

window.addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;


        if (
            e.key.toLowerCase() === "r"
        ) {

            resetRace();
        }


        if (
            e.key.toLowerCase() === "n"
        ) {

            nextTrack();
        }


        if (
            e.code === "Space" &&
            game.finished
        ) {

            resetRace();
        }
    }
);


window.addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;
    }
);


/* ============================================================
   NEAREST TRACK
============================================================ */

function nearestTrack() {

    let closest =
        Infinity;

    let index = 0;


    for (
        let i = 0;
        i < game.points.length;
        i++
    ) {

        const p =
            game.points[i];

        const dx =
            p.x -
            car.position.x;

        const dz =
            p.z -
            car.position.z;

        const dist =
            dx * dx +
            dz * dz;


        if (
            dist < closest
        ) {

            closest = dist;

            index = i;
        }
    }


    return {
        index,
        distance:
            Math.sqrt(closest)
    };
}


/* ============================================================
   NATURAL CAR PHYSICS
============================================================ */

function updatePhysics(dt) {

    if (
        !game.racing ||
        game.finished
    ) {
        return;
    }


    /*
        THROTTLE
    */

    const accelerating =
        keys["w"] ||
        keys["arrowup"];


    const braking =
        keys["s"] ||
        keys["arrowdown"];


    /*
        Natural acceleration.
    */

    if (
        accelerating
    ) {

        game.speed +=
            38 * dt;
    }
    else {

        /*
            Engine drag.
        */

        game.speed -=
            5.5 * dt;
    }


    /*
        Brake.
    */

    if (
        braking
    ) {

        game.speed -=
            65 * dt;
    }


    game.speed =
        THREE.MathUtils.clamp(
            game.speed,
            0,
            100
        );


    /* ========================================================
       NATURAL STEERING
    ======================================================== */

    let steeringInput = 0;


    /*
        A = LEFT
        D = RIGHT
    */

    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        steeringInput = -1;
    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        steeringInput = 1;
    }


    /*
        Smooth steering.

        Instead of instantly snapping
        from left to right, the steering
        wheel moves naturally.
    */

    const steeringResponse =
        7.5;


    game.steering =
        THREE.MathUtils.lerp(
            game.steering,
            steeringInput,
            1 -
            Math.exp(
                -steeringResponse * dt
            )
        );


    /*
        Steering becomes stronger
        as the car gets faster.

        This prevents the car from
        spinning around at low speed.
    */

    const speedFactor =
        THREE.MathUtils.clamp(
            game.speed / 70,
            .05,
            1
        );


    /*
        Natural racing-car steering.

        Maximum yaw rate is limited,
        preventing instant 180° spins.
    */

    const maxTurnRate =
        1.75 *
        speedFactor;


    game.heading +=
        game.steering *
        maxTurnRate *
        dt;


    /*
        Keep the visual car rotation
        synchronized with physics.
    */

    car.rotation.y =
        game.heading;


    /* ========================================================
       MOVEMENT
    ======================================================== */

    const forward =
        new THREE.Vector3(
            Math.sin(
                game.heading
            ),
            0,
            Math.cos(
                game.heading
            )
        );


    car.position.addScaledVector(
        forward,
        game.speed * dt
    );


    /*
        Completely flat track.
    */

    car.position.y =
        .42;


    /* ========================================================
       WHEEL ROTATION
    ======================================================== */

    wheels.forEach(
        wheel => {

            wheel.rotation.x -=
                game.speed *
                dt *
                .32;
        }
    );


    /* ========================================================
       TRACK POSITION
    ======================================================== */

    const near =
        nearestTrack();

    const frame =
        getFrame(
            near.index
        );


    const offset =
        new THREE.Vector3()
            .subVectors(
                car.position,
                frame.p
            );


    const lateral =
        offset.dot(
            frame.side
        );


    /*
        Wide track.

        The car gets pushed back
        gently rather than teleporting.
    */

    const maximum =
        game.width / 2 - 1.8;


    if (
        Math.abs(lateral) >
        maximum
    ) {

        const amount =
            Math.abs(lateral) -
            maximum;


        const direction =
            lateral > 0
            ? -1
            : 1;


        car.position.addScaledVector(
            frame.side,
            direction *
            amount *
            Math.min(
                1,
                dt * 8
            )
        );


        /*
            Wall friction.
        */

        game.speed *=
            Math.pow(
                .35,
                dt
            );
    }


    /* ========================================================
       BOOST
    ======================================================== */

    for (
        const boost of game.boosts
    ) {

        const p =
            game.points[
                boost.index
            ];


        const dx =
            car.position.x -
            p.x;

        const dz =
            car.position.z -
            p.z;


        if (
            dx * dx +
            dz * dz <
            30
        ) {

            game.speed =
                Math.min(
                    115,
                    game.speed + 45
                );
        }
    }


    /* ========================================================
       CHECKPOINTS
    ======================================================== */

    if (
        game.checkpoints.length
    ) {

        const checkpoint =
            game.checkpoints[
                game.checkpointIndex
            ];


        if (
            checkpoint
        ) {

            const p =
                game.points[
                    checkpoint.index
                ];


            const dx =
                car.position.x -
                p.x;

            const dz =
                car.position.z -
                p.z;


            if (
                dx * dx +
                dz * dz <
                180
            ) {

                game.checkpointIndex++;


                if (
                    game.checkpointIndex >=
                    game.checkpoints.length
                ) {

                    finishRace();
                }
            }
        }
    }
}


/* ============================================================
   CAMERA
============================================================ */

function updateCamera(dt) {

    const forward =
        new THREE.Vector3(
            Math.sin(
                game.heading
            ),
            0,
            Math.cos(
                game.heading
            )
        );


    /*
        Camera follows behind
        the actual car direction.
    */

    const desired =
        car.position.clone()
            .addScaledVector(
                forward,
                -13
            );


    desired.y += 7;


    camera.position.lerp(
        desired,
        1 -
        Math.exp(
            -6 * dt
        )
    );


    const lookAt =
        car.position.clone();

    lookAt.y += 1;


    camera.lookAt(
        lookAt
    );
}


/* ============================================================
   RESET
============================================================ */

function resetRace() {

    game.finished = false;

    game.racing = false;

    game.elapsed = 0;

    game.checkpointIndex = 0;

    game.speed = 0;

    game.steering = 0;


    /*
        Recalculate starting direction
        every time the race resets.
    */

    positionCarAtStart();


    document.getElementById(
        "message"
    ).style.display =
        "none";


    startCountdown();
}


/* ============================================================
   NEXT TRACK
============================================================ */

function nextTrack() {

    game.trackNumber++;

    game.difficulty =
        game.trackNumber - 1;


    generateTrack();

    loadBest();

    resetRace();
}


/* ============================================================
   COUNTDOWN
============================================================ */

function startCountdown() {

    const element =
        document.getElementById(
            "countdown"
        );


    let number = 3;

    element.textContent =
        number;


    const interval =
        setInterval(
            () => {

                number--;


                if (
                    number > 0
                ) {

                    element.textContent =
                        number;
                }
                else {

                    element.textContent =
                        "GO!";


                    game.racing = true;


                    game.startTime =
                        performance.now();


                    setTimeout(
                        () => {

                            element.textContent =
                                "";

                        },
                        600
                    );


                    clearInterval(
                        interval
                    );
                }

            },
            800
        );
}


/* ============================================================
   FINISH
============================================================ */

function finishRace() {

    if (
        game.finished
    ) {
        return;
    }


    game.finished = true;

    game.racing = false;


    const message =
        document.getElementById(
            "message"
        );


    message.innerHTML =
        `
        FINISH!<br>
        <span style="font-size:22px">
        ${game.elapsed.toFixed(2)} seconds
        </span>
        <br>
        <span style="font-size:16px">
        Press SPACE to race again
        </span>
        `;


    message.style.display =
        "block";


    if (
        game.best === null ||
        game.elapsed <
        game.best
    ) {

        game.best =
            game.elapsed;


        localStorage.setItem(
            "trackrush_best_" +
            game.trackNumber,
            game.best
        );
    }
}


/* ============================================================
   BEST TIME
============================================================ */

function loadBest() {

    const value =
        localStorage.getItem(
            "trackrush_best_" +
            game.trackNumber
        );


    game.best =
        value
        ? Number(value)
        : null;
}


/* ============================================================
   HUD
============================================================ */

function updateHUD() {

    document.getElementById(
        "time"
    ).textContent =
        game.elapsed.toFixed(2);


    document.getElementById(
        "best"
    ).textContent =
        game.best !== null
        ? game.best.toFixed(2)
        : "--";


    document.getElementById(
        "track"
    ).textContent =
        game.trackNumber;


    document.getElementById(
        "difficulty"
    ).textContent =
        difficultyName(
            game.difficulty
        );


    document.getElementById(
        "checkpoint"
    ).textContent =
        `${Math.min(
            game.checkpointIndex + 1,
            game.checkpoints.length
        )}/${game.checkpoints.length}`;


    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            game.speed * 3.6
        );
}


/* ============================================================
   GROUND
============================================================ */

const ground =
    new THREE.Mesh(
        new THREE.PlaneGeometry(
            4000,
            4000
        ),
        new THREE.MeshStandardMaterial({
            color: 0x4b713e,
            roughness: 1
        })
    );

ground.rotation.x =
    -Math.PI / 2;

ground.position.y =
    -.12;

ground.receiveShadow = true;

scene.add(ground);


/* ============================================================
   INITIALIZE
============================================================ */

generateTrack();

loadBest();

resetRace();


/* ============================================================
   RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            innerWidth /
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* ============================================================
   LOOP
============================================================ */

let last =
    performance.now();


function animate(now) {

    requestAnimationFrame(
        animate
    );


    const dt =
        Math.min(
            .05,
            (now - last) / 1000
        );


    last = now;


    if (
        game.racing &&
        !game.finished
    ) {

        game.elapsed =
            (now -
            game.startTime) /
            1000;
    }


    updatePhysics(dt);

    updateCamera(dt);

    updateHUD();


    renderer.render(
        scene,
        camera
    );
}


animate(
    performance.now()
);

</script>
