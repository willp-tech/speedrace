const key=(a,b)=>keys[a]||keys[b];
const bk=()=>"htBest_"+cur,loadBest=()=>{try{const v=localStorage.getItem(bk());return v?Number(v):null}catch(e){return null}},saveBest=t=>{try{localStorage.setItem(bk(),String(t))}catch(e){}};
function near(c){let best=c.idx,bd=1e18;const p=c.root.position;for(let k=-25;k<=25;k++){const i=(c.idx+k+N)%N,dx=pts[i].x-p.x,dz=pts[i].z-p.z,d=dx*dx+dz*dz;if(d<bd){bd=d;best=i}}return best;}
function place(c,idx,off){const i=((idx%N)+N)%N,p=P(i,off,.03),t=tans[i];c.root.position.copy(p);c.yaw=Math.atan2(-t.x,-t.z);c.root.rotation.y=c.yaw;c.vel.set(0,0,0);c.speed=0;c.idx=i;}
function reset(){
 started=false;done=false;cdT=0;rt=0;snap=true;
 place(player,0,0);player.lap=1;player.last=0;player.prog=0;
 const seg=len/N;
 for(let i=1;i<cars.length;i++){const c=cars[i],row=Math.floor((i-1)/2),s=(i-1)%2?1:-1;place(c,-Math.round((32+row*27)/seg),s*5.8);c.lane=s*4;c.lap=0;c.prog=c.last=c.idx/N;c.skill=D.sk[0]+Math.random()*(D.sk[1]-D.sk[0]);}
 $("msg").innerHTML="";$("cd").textContent="3";upd();
}
function setTrack(k){cur=(k+tracks.length)%tracks.length;buildTrack(cur);reset();}
addEventListener("keydown",e=>{keys[e.code]=true;aud();if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code))e.preventDefault();if(e.code==="KeyR"&&!done&&!paused)reset();if(e.code==="Enter"&&ovMode==="next"&&rnd<tracks.length)nextRace();});
addEventListener("keyup",e=>{keys[e.code]=false});addEventListener("pointerdown",()=>aud());
function wheelsSpin(c,dt){for(const w of c.wheels)w.rotation.x-=c.speed*dt/.48;}
function updPlayer(dt){
 const th=key("KeyW","ArrowUp"),br=key("KeyS","ArrowDown"),hb=keys.Space,st=(key("KeyA","ArrowLeft")?1:0)-(key("KeyD","ArrowRight")?1:0);
 let y=player.yaw,f=new V(-Math.sin(y),0,-Math.cos(y)),r=new V(Math.cos(y),0,-Math.sin(y));
 let fs=player.vel.dot(f),ls=player.vel.dot(r);
 if(th)fs+=92*dt;else fs-=Math.sign(fs)*Math.min(Math.abs(fs),8*dt);
 if(br)fs=Math.max(-28,fs-(fs>0?130:25)*dt);
 if(hb){fs*=Math.pow(.35,dt);ls*=Math.pow(.95,dt);}
 const sr=THREE.MathUtils.lerp(2.5,1.1,clamp(Math.abs(fs)/MAXV,0,1));
 player.yaw+=st*sr*dt*clamp(Math.abs(fs)/25,.18,1)*(fs<0?-1:1);
 ls*=Math.pow(hb?.72:.16,dt);
 y=player.yaw;f.set(-Math.sin(y),0,-Math.cos(y));r.set(Math.cos(y),0,-Math.sin(y));
 player.vel.copy(f.multiplyScalar(fs).add(r.multiplyScalar(ls)));
 if(player.vel.length()>MAXV)player.vel.setLength(MAXV);
 const cp=pts[player.idx],dc=Math.hypot(player.root.position.x-cp.x,player.root.position.z-cp.z);
 if(dc>W/2+C+2)player.vel.multiplyScalar(Math.pow(.35,dt));else if(dc>W/2-1)player.vel.multiplyScalar(Math.pow(.96,dt));
 player.root.position.addScaledVector(player.vel,dt);player.speed=player.vel.length();
}
let vp=[],rl=[];
function buildAI(){
 const seg=len/N,sg=[],kk=[];
 for(let i=0;i<N;i++){const a=tans[(i-3+N)%N],b=tans[(i+3)%N],cy=a.z*b.x-a.x*b.z;sg.push(cy);kk.push(Math.abs(Math.asin(clamp(cy,-1,1)))/(6*seg));}
 vp=kk.map(x=>clamp(Math.sqrt(D.al/Math.max(x,1e-4)),38,MAXV));
 for(let i=N*2-1;i>=0;i--){const a=i%N,b=(a+1)%N;vp[a]=Math.min(vp[a],Math.sqrt(vp[b]*vp[b]+2*D.br*seg));}
 rl=[];for(let i=0;i<N;i++){let t=0;for(let j=-30;j<=30;j++)t+=sg[(i+j+N)%N];rl.push(clamp(-t/61*160,-9,9));}
}
function updAI(c,dt){
 const i=c.idx,L=clamp(Math.round(c.speed*.5/(len/N)),4,16);
 c.adj=clamp(1+((player.lap+player.prog)-(c.lap+c.prog))*len/12000,D.adj[0],D.adj[1]);
 const to=P(i+L,clamp(rl[(i+L)%N]*1.0+c.lane*.4+c.dodge,-15,15),0).sub(c.root.position);
 c.yaw+=clamp(nA(Math.atan2(-to.x,-to.z)-c.yaw),-D.st*dt,D.st*dt);
 let ts=vp[i]*c.skill*c.adj,dg=0;
 const fx=-Math.sin(c.yaw),fz=-Math.cos(c.yaw);
 for(const o of cars){if(o===c)continue;const dx=o.root.position.x-c.root.position.x,dz=o.root.position.z-c.root.position.z,ah=dx*fx+dz*fz,sd=dx*Math.cos(c.yaw)-dz*Math.sin(c.yaw);
  if(ah>0&&ah<24&&Math.abs(sd)<5.5){dg=sd>0?-6:6;if(ah<9)ts=Math.min(ts,o.speed*.97);}}
 c.dodge+=(dg-c.dodge)*Math.min(1,3*dt);
 const f=new V(fx,0,fz),r=new V(Math.cos(c.yaw),0,-Math.sin(c.yaw));
 let fs=c.vel.dot(f),ls=c.vel.dot(r);fs+=fs<ts?102*dt:-(D.br+25)*dt;fs=clamp(fs,0,MAXV);ls*=Math.pow(.16,dt);
 c.vel.copy(f.multiplyScalar(fs).add(r.multiplyScalar(ls)));c.root.position.addScaledVector(c.vel,dt);c.speed=c.vel.length();
}
function walls(c){
 const p=pts[c.idx],t=tans[c.idx],px=c.root.position.x-p.x,pz=c.root.position.z-p.z,rx=-t.z,rz=t.x,d=px*rx+pz*rz,lim=BL-1.4;
 if(Math.abs(d)>lim){const s=Math.sign(d),o=Math.abs(d)-lim;c.root.position.x-=rx*s*o;c.root.position.z-=rz*s*o;const vr=c.vel.x*rx+c.vel.z*rz;if(vr*s>0){c.vel.x-=rx*vr*1.1;c.vel.z-=rz*vr*1.1;}}
}
function carHits(){
 for(let a=0;a<cars.length;a++)for(let b=a+1;b<cars.length;b++){
  const A=cars[a],B=cars[b],dx=B.root.position.x-A.root.position.x,dz=B.root.position.z-A.root.position.z,d=Math.hypot(dx,dz),m=2*R;
  if(d>=m||d<1e-3)continue;const nx=dx/d,nz=dz/d,o=(m-d)/2;
  A.root.position.x-=nx*o;A.root.position.z-=nz*o;B.root.position.x+=nx*o;B.root.position.z+=nz*o;
  const cl=(B.vel.x-A.vel.x)*nx+(B.vel.z-A.vel.z)*nz;
  if(cl<0){const j=-1.24*cl/2;A.vel.x-=nx*j;A.vel.z-=nz*j;B.vel.x+=nx*j;B.vel.z+=nz*j;}
 }
}
function lapCheck(c){c.prog=c.idx/N;if(c.last>.8&&c.prog<.2)c.lap++;else if(c.last<.2&&c.prog>.8)c.lap--;c.last=c.prog;}
function rank(){return cars.map(c=>({c,s:c.lap+c.prog})).sort((a,b)=>b.s-a.s).findIndex(x=>x.c===player)+1;}
const fmt=t=>String(Math.floor(t/60)).padStart(2,"0")+":"+String(Math.floor(t%60)).padStart(2,"0")+"."+String(Math.floor((t%1)*1000)).padStart(3,"0");
function upd(){
 $("pos").innerHTML=rank()+"<small> / "+cars.length+"</small>";
 $("trk").textContent=tracks[cur][0]+" • LAP "+clamp(player.lap,1,LAPS)+"/"+LAPS;
 const b=loadBest();$("best").textContent=b?"BEST "+fmt(b):"BEST --:--.---";$("time").textContent=fmt(rt);
}
function finish(){
 done=true;const q=cars.map(c=>({c,d:c.lap+c.prog})).sort((a,b)=>b.d-a.d),gain={};
 q.forEach((x,i)=>{const g=PTS[i]||0;gain[x.c.code]=g;tot[x.c.code]=(tot[x.c.code]||0)+g;});
 const pp=q.findIndex(x=>x.c===player)+1;rnd++;svSave();
 if(rnd>=tracks.length){try{localStorage.removeItem("htChamp")}catch(e){}}
 $("msg").innerHTML="FINISH! P"+pp+"<small>"+fmt(rt)+" • +"+gain.VER+" PTS</small>";
 const b=loadBest();if(!b||rt<b)saveBest(rt);
 setTimeout(()=>standings(q,gain),2800);
}
function hud(){
 const kmh=Math.round(player.speed*1.9);$("speed").textContent=kmh;
 $("gear").textContent=kmh<5?"N":kmh<60?"1":kmh<120?"2":kmh<180?"3":kmh<240?"4":kmh<290?"5":kmh<320?"6":"7";
}
function updCam(dt){
 const f=new V(-Math.sin(player.yaw),0,-Math.cos(player.yaw)),p=player.root.position;
 const want=p.clone().addScaledVector(f,-9.5);want.y=p.y+3.8;
 const look=p.clone().addScaledVector(f,5);look.y+=1.15;
 const k=snap?1:1-Math.pow(1e-5,dt);snap=false;
 cam.position.lerp(want,k);cam.userLook=(cam.userLook||look.clone()).lerp(look,k);cam.lookAt(cam.userLook);
}
const mc=$("mm").getContext("2d");
function minimap(){
 mc.fillStyle="rgba(8,11,15,.9)";mc.fillRect(0,0,380,290);
 const m=p=>[mb.ox+(p.x-mb.a)*mb.sc,mb.oy+(p.z-mb.c)*mb.sc];
 for(const [w,col] of[[10,"#777c80"],[3,"#f2f2f2"]]){mc.lineWidth=w;mc.strokeStyle=col;mc.beginPath();for(let i=0;i<N;i+=4){const q=m(pts[i]);i?mc.lineTo(q[0],q[1]):mc.moveTo(q[0],q[1]);}mc.closePath();mc.stroke();}
 for(const c of cars){const q=m(c.root.position);mc.beginPath();mc.arc(q[0],q[1],c.player?6:3.5,0,7);mc.fillStyle=c.player?"#ff7b18":"#fff";mc.fill();}
}
let ac,o1,g1;
function aud(){if(ac){if(ac.state==="suspended")ac.resume();return}try{ac=new(window.AudioContext||window.webkitAudioContext)();o1=ac.createOscillator();const f=ac.createBiquadFilter();g1=ac.createGain();o1.type="sawtooth";f.type="lowpass";f.frequency.value=1200;g1.gain.value=.0001;o1.connect(f);f.connect(g1);g1.connect(ac.destination);o1.start();}catch(e){}}
function audio(){if(!ac)return;const s=clamp(player.speed/MAXV,0,1),t=ac.currentTime;o1.frequency.setTargetAtTime(50+s*480,t,.05);g1.gain.setTargetAtTime(started?.02+s*.06:.005,t,.08);}
const DIFF={semi:{n:"SEMI-PRO",sk:[.85,.91],al:115,br:100,adj:[.98,1.02],st:2.2},pro:{n:"PRO",sk:[.94,.98],al:140,br:110,adj:[.98,1.04],st:2.6},robot:{n:"ROBOT",sk:[1,1],al:185,br:125,adj:[.99,1.06],st:3.2}};
let D=DIFF.pro,dk="pro",rnd=0,tot={},paused=true,ovMode="";const PTS=[25,18,15,12,10,8,6,4,2,1],ov=$("ov");
const hx=i=>tc[i][0].toString(16).padStart(6,"0");
function svSave(){try{localStorage.setItem("htChamp",JSON.stringify({dk,rnd,tot}))}catch(e){}}
function menu(){
 ovMode="menu";paused=true;let sv=null;try{sv=JSON.parse(localStorage.getItem("htChamp")||"null")}catch(e){}
 if(sv&&!(DIFF[sv.dk]&&sv.rnd<tracks.length))sv=null;
 ov.style.display="flex";
 ov.innerHTML='<div class="card"><h1>HYPERTRACK</h1><div class="sub">2026 CHAMPIONSHIP • 24 ROUNDS • 3 LAPS EACH</div><div class="sub">SELECT AI DIFFICULTY TO START</div><div>'+Object.keys(DIFF).map(k=>'<button data-d="'+k+'">'+DIFF[k].n+'</button>').join("")+'</div>'+(sv?'<div><button id="cont">CONTINUE: ROUND '+(sv.rnd+1)+' • '+DIFF[sv.dk].n+'</button></div>':'')+'</div>';
 ov.querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>startChamp(b.dataset.d,0,{}));
 const c=$("cont");if(c)c.onclick=()=>startChamp(sv.dk,sv.rnd,sv.tot);
}
function startChamp(k,r,t){dk=k;D=DIFF[k];rnd=r;tot=t;codes.forEach(c=>{if(tot[c]==null)tot[c]=0});svSave();nextRace();}
function nextRace(){ov.style.display="none";ovMode="";paused=false;setTrack(rnd);}
function standings(q,gain){
 ovMode="next";paused=true;
 const rows=codes.map((c,i)=>({c,i,t:tot[c]||0})).sort((a,b)=>b.t-a.t||a.i-b.i),lead=rows[0].t,fin=rnd>=tracks.length,pos={};
 q.forEach((x,i)=>pos[x.c.code]=i+1);
 ov.style.display="flex";
 ov.innerHTML='<div class="card"><div class="sub">'+(fin?'FINAL STANDINGS':'ROUND '+rnd+' / '+tracks.length+' • '+tracks[rnd-1][0].replace(/^R\d+ /,''))+'</div><h2>DRIVERS\' CHAMPIONSHIP</h2><table><tr><th>POS</th><th></th><th>DRIVER</th><th>RACE</th><th>PTS</th><th>GAP</th></tr>'+
 rows.map((r,k)=>'<tr'+(r.c==="VER"?' class="me"':'')+'><td>'+(k+1)+'</td><td><i style="background:#'+hx(r.i)+'"></i></td><td>'+r.c+'</td><td>P'+pos[r.c]+' <b>+'+gain[r.c]+'</b></td><td>'+r.t+'</td><td>'+(k?'-'+(lead-r.t):'')+'</td></tr>').join("")+'</table>'+
 (fin?'<div class="sub">CHAMPION: '+rows[0].c+'</div><button id="nx">NEW CHAMPIONSHIP</button>':'<button id="nx">NEXT RACE ▶ (ENTER)</button>')+'</div>';
 $("nx").onclick=fin?menu:nextRace;
}
const clock=new THREE.Clock();
function loop(){
 requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);
 if(paused){}else if(!started){cdT+=dt;const rem=3-Math.floor(cdT);$("cd").textContent=rem>0?rem:"GO!";if(cdT>3.7){started=true;$("cd").textContent="";}}
 else if(!done){
  rt+=dt;for(const c of cars)c.idx=near(c);
  updPlayer(dt);for(let i=1;i<cars.length;i++)updAI(cars[i],dt);
  for(const c of cars)walls(c);carHits();
  for(const c of cars){c.root.position.y=.03;c.root.rotation.y=c.yaw;wheelsSpin(c,dt);c.idx=near(c);lapCheck(c);}
  upd();if(player.lap>LAPS&&rt>5)finish();
 }
 $("time").textContent=fmt(rt);board(dt);hud();updCam(dt);minimap();audio();ren.render(scene,cam);
}
addEventListener("resize",()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
setTrack(0);menu();loop();
</script></body></html>
