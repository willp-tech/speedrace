<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Fan Racing</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050505;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:20;
}

#title{
    position:absolute;
    left:22px;
    top:18px;
    font-size:23px;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:0 3px 8px #000;
}

#trackName{
    display:block;
    font-size:12px;
    margin-top:5px;
    opacity:.8;
    letter-spacing:1px;
}

#topButtons{
    position:absolute;
    top:18px;
    right:18px;
    display:flex;
    gap:8px;
    pointer-events:auto;
}

button{
    padding:10px 15px;
    border-radius:5px;
    border:1px solid rgba(255,255,255,.3);
    background:rgba(10,10,10,.85);
    color:white;
    font-weight:bold;
    cursor:pointer;
    letter-spacing:1px;
}

button:hover{
    background:#333;
}

#timer{
    position:absolute;
    top:72px;
    left:50%;
    transform:translateX(-50%);
    font-family:monospace;
    font-size:30px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
}

#message{
    position:absolute;
    top:125px;
    left:50%;
    transform:translateX(-50%);
    font-size:21px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
    white-space:nowrap;
}

#speed{
    position:absolute;
    bottom:20px;
    left:20px;
    font-family:monospace;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
}

#speedValue{
    font-size:43px;
}

#checkpoint{
    position:absolute;
    right:20px;
    bottom:20px;
    font-size:27px;
    font-weight:bold;
    text-shadow:0 3px 8px #000;
}

#controls{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    text-align:center;
    font-size:11px;
    line-height:1.5;
    opacity:.75;
    text-shadow:0 3px 8px #000;
}

#customization{
    position:fixed;
    z-index:30;
    right:18px;
    top:110px;
    width:185px;
    padding:14px;
    background:rgba(0,0,0,.7);
    border:1px solid rgba(255,255,255,.25);
    border-radius:8px;
    backdrop-filter:blur(8px);
}

#customization h3{
    margin:0 0 10px;
    font-size:13px;
}

#customization label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin:7px 0;
    font-size:11px;
}

#customization input{
    width:50px;
    height:25px;
    border:0;
    padding:0;
    cursor:pointer;
}

.overlay{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(7px);
}

.panel{
    width:370px;
    padding:32px;
    background:rgba(8,8,8,.96);
    border:1px solid rgba(255,255,255,.3);
    border-radius:14px;
    text-align:center;
    box-shadow:0 25px 100px #000;
}

.panel h1{
    margin:0 0 15px;
    font-size:42px;
}

.panel p{
    font-family:monospace;
    font-size:22px;
}

.panel button{
    width:100%;
    margin-top:10px;
}

#loading{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#050505;
    font-size:25px;
    font-weight:bold;
}

@media(max-width:700px){
    #customization{
        width:145px;
        right:8px;
        top:105px;
    }

    #title{
        font-size:16px;
    }

    #timer{
        font-size:22px;
    }

    #controls{
        font-size:8px;
    }
}
</style>
</head>

<body>

<div id="loading">LOADING RACING GAME...</div>

<div id="hud">

    <div id="title">
        F1 FAN RACING
        <span id="trackName">GENERATING TRACK...</span>
    </div>

    <div id="topButtons">
        <button id="nextTrack">NEXT TRACK</button>
        <button id="exitButton">EXIT</button>
    </div>

    <div id="timer">00:00.000</div>

    <div id="message">PRESS W TO START</div>

    <div id="speed">
        <span id="speedValue">0</span> KM/H
    </div>

    <div id="checkpoint">0/10</div>

    <div id="controls">
        W — ACCELERATE<br>
        S — BRAKE<br>
        A — LEFT &nbsp;&nbsp; D — RIGHT<br>
        R — RESET &nbsp;&nbsp; SPACE — RACE AGAIN
    </div>

</div>


<div id="customization">

    <h3>CAR SETUP</h3>

    <label>
        BODY
        <input type="color" id="bodyColor" value="#e10600">
    </label>

    <label>
        FRONT WING
        <input type="color" id="frontColor" value="#111111">
    </label>

    <label>
        REAR WING
        <input type="color" id="rearColor" value="#111111">
    </label>

</div>


<div id="finishScreen" class="overlay">

    <div class="panel">

        <h1>FINISH!</h1>

        <p id="finalTime">
            TIME: 00:00.000
        </p>

        <button id="raceAgain">
            RACE AGAIN
        </button>

        <button id="finishNext">
            NEXT TRACK
        </button>

        <button id="finishExit">
            EXIT
        </button>

    </div>

</div>


<div id="exitScreen" class="overlay">

    <div class="panel">

        <h1>RACE PAUSED</h1>

        <button id="returnRace">
            RETURN TO RACE
        </button>

    </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.161/build/three.module.js";


/* =========================================================
   SCENE
========================================================= */

const scene = new THREE.Scene();

scene.background =
    new THREE.Color(0x79a9d0);

scene.fog =
    new THREE.Fog(
        0x79a9d0,
        180,
        1100
    );


const camera =
    new THREE.PerspectiveCamera(
        68,
        innerWidth / innerHeight,
        0.1,
        3000
    );


const renderer =
    new THREE.WebGLRenderer({
        antialias:true
    });

renderer.setSize(
    innerWidth,
    innerHeight
);

renderer.setPixelRatio(
    Math.min(devicePixelRatio,2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

document.body.appendChild(
    renderer.domElement
);


/* =========================================================
   LIGHTING
========================================================= */

const hemi =
    new THREE.HemisphereLight(
        0xffffff,
        0x263238,
        1.6
    );

scene.add(hemi);


const sun =
    new THREE.DirectionalLight(
        0xffffff,
        2.5
    );

sun.position.set(
    250,
    400,
    150
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

scene.add(sun);


/* =========================================================
   GAME STATE
========================================================= */

const game = {

    trackNumber:1,

    track:null,

    curve:null,

    road:null,

    ground:null,

    scenery:[],

    gates:[],

    car:null,

    ghost:null,

    ghostData:null,

    checkpoint:0,

    running:false,

    finished:false,

    paused:false,

    startTime:0,

    elapsed:0,

    speed:0,

    steering:0,

    lateralVelocity:0,

    keys:{},

    recorded:[],

    smoke:[],

    skidMarks:[],

    body:"#e10600",

    front:"#111111",

    rear:"#111111",

    trackWidth:18

};


/* =========================================================
   RANDOM HELPERS
========================================================= */

function random(min,max){

    return min +
        Math.random() *
        (max-min);

}


function randomChoice(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];

}


/* =========================================================
   PROCEDURAL "AI GENERATED" TRACK
========================================================= */

function generateTrack(){

    const themes = [
        {
            name:"FOREST",
            ground:0x356f35,
            sky:0x7eafd4
        },
        {
            name:"DESERT",
            ground:0xc59450,
            sky:0xdca86b
        },
        {
            name:"ALPINE",
            ground:0xe3edf4,
            sky:0x9fc6df
        },
        {
            name:"CANYON",
            ground:0x88543b,
            sky:0xd29b72
        },
        {
            name:"COAST",
            ground:0x55924b,
            sky:0x72b4df
        }
    ];


    const theme =
        randomChoice(themes);


    const points=[];

    let x=0;
    let z=0;
    let y=0;

    let heading=0;

    const numberOfPoints =
        24 + Math.floor(
            Math.random()*10
        );


    for(
        let i=0;
        i<numberOfPoints;
        i++
    ){

        const distance =
            random(45,75);

        const turn =
            random(-0.55,0.55);

        heading += turn;

        if(i<2)
            heading*=0.2;


        x +=
            Math.sin(heading) *
            distance;

        z +=
            -Math.cos(heading) *
            distance;


        y += random(-8,8);

        if(theme.name==="ALPINE")
            y += random(2,9);


        y =
            THREE.MathUtils.clamp(
                y,
                -20,
                150
            );


        points.push([
            x,
            y,
            z
        ]);

    }


    return {

        name:
            "TRACK "+
            game.trackNumber+
            " — "+
            theme.name,

        theme:theme,

        width:
            random(16,20),

        points:points

    };

}


/* =========================================================
   MATERIAL
========================================================= */

function mat(color,roughness=.8){

    return new THREE.MeshStandardMaterial({

        color:color,

        roughness:roughness,

        metalness:.05

    });

}


/* =========================================================
   CLEAR OLD TRACK
========================================================= */

function clearTrack(){

    if(game.road){

        scene.remove(
            game.road
        );

        game.road.geometry.dispose();

        game.road.material.dispose();

        game.road=null;

    }


    if(game.ground){

        scene.remove(
            game.ground
        );

        game.ground.geometry.dispose();

        game.ground.material.dispose();

        game.ground=null;

    }


    for(
        const object of game.scenery
    ){

        scene.remove(object);

    }

    game.scenery=[];


    for(
        const gate of game.gates
    ){

        scene.remove(gate);

    }

    game.gates=[];


    if(game.ghost){

        scene.remove(
            game.ghost
        );

        game.ghost=null;

    }

}


/* =========================================================
   CURVE
========================================================= */

function createCurve(track){

    return new THREE.CatmullRomCurve3(

        track.points.map(
            p =>
            new THREE.Vector3(
                p[0],
                p[1],
                p[2]
            )
        ),

        false,

        "catmullrom",

        .45

    );

}


/* =========================================================
   ROAD
========================================================= */

function createRoad(curve,width){

    const segments=900;

    const positions=[];
    const uvs=[];
    const indices=[];


    for(
        let i=0;
        i<=segments;
        i++
    ){

        const t=
            i/segments;


        const p=
            curve.getPointAt(t);


        const tangent=
            curve
            .getTangentAt(t)
            .normalize();


        const side=
            new THREE.Vector3(
                -tangent.z,
                0,
                tangent.x
            ).normalize();


        const left=
            p.clone().add(
                side.clone()
                .multiplyScalar(
                    width/2
                )
            );


        const right=
            p.clone().add(
                side.clone()
                .multiplyScalar(
                    -width/2
                )
            );


        positions.push(
            left.x,
            left.y,
            left.z,

            right.x,
            right.y,
            right.z
        );


        uvs.push(
            0,
            i/20,

            1,
            i/20
        );

    }


    for(
        let i=0;
        i<segments;
        i++
    ){

        const a=i*2;

        indices.push(
            a,
            a+2,
            a+1,

            a+1,
            a+2,
            a+3
        );

    }


    const geometry=
        new THREE.BufferGeometry();


    geometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(
            positions,
            3
        )
    );


    geometry.setAttribute(
        "uv",
        new THREE.Float32BufferAttribute(
            uvs,
            2
        )
    );


    geometry.setIndex(indices);

    geometry.computeVertexNormals();


    const road=
        new THREE.Mesh(
            geometry,
            mat(0x292929,.95)
        );


    road.receiveShadow=true;

    scene.add(road);

    return road;

}


/* =========================================================
   ROAD EDGE STRIPES
========================================================= */

function createRoadEdge(curve,width){

    for(
        const sideSign of [-1,1]
    ){

        const points=[];


        for(
            let i=0;
            i<=450;
            i++
        ){

            const t=i/450;

            const p=
                curve.getPointAt(t);

            const tangent=
                curve
                .getTangentAt(t)
                .normalize();

            const side=
                new THREE.Vector3(
                    -tangent.z,
                    0,
                    tangent.x
                ).normalize();


            p.add(
                side.multiplyScalar(
                    sideSign*
                    (width/2+.15)
                )
            );


            points.push(p);

        }


        const geometry=
            new THREE.BufferGeometry()
            .setFromPoints(points);


        const line=
            new THREE.Line(
                geometry,
                new THREE.LineBasicMaterial({
                    color:0xffffff
                })
            );


        scene.add(line);

        game.scenery.push(line);

    }

}


/* =========================================================
   GROUND
========================================================= */

function createGround(track){

    const ground=
        new THREE.Mesh(
            new THREE.PlaneGeometry(
                3500,
                3500
            ),
            mat(track.theme.ground)
        );


    ground.rotation.x=
        -Math.PI/2;

    ground.position.y=-25;

    ground.receiveShadow=true;

    scene.add(ground);

    game.ground=ground;

}


/* =========================================================
   TREE
========================================================= */

function createTree(position){

    const group=
        new THREE.Group();


    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .7,
                1.2,
                7,
                8
            ),
            mat(0x583a24)
        );


    trunk.position.y=3.5;

    trunk.castShadow=true;


    const crown=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                5.5,
                13,
                8
            ),
            mat(0x174d22)
        );


    crown.position.y=11;

    crown.castShadow=true;


    group.add(
        trunk,
        crown
    );


    group.position.copy(
        position
    );


    scene.add(group);

    game.scenery.push(group);

}


/* =========================================================
   CACTUS
========================================================= */

function createCactus(position){

    const group=
        new THREE.Group();


    const body=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                1.2,
                1.5,
                9,
                8
            ),
            mat(0x27743b)
        );


    body.position.y=4.5;


    const arm=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .6,
                .7,
                4,
                8
            ),
            mat(0x27743b)
        );


    arm.rotation.z=
        Math.PI/2;

    arm.position.set(
        2,
        4.5,
        0
    );


    group.add(
        body,
        arm
    );


    group.position.copy(
        position
    );


    scene.add(group);

    game.scenery.push(group);

}


/* =========================================================
   ROCK
========================================================= */

function createRock(position){

    const rock=
        new THREE.Mesh(
            new THREE.DodecahedronGeometry(
                random(3,9)
            ),
            mat(0x754832)
        );


    rock.position.copy(
        position
    );

    rock.position.y+=4;

    rock.castShadow=true;

    scene.add(rock);

    game.scenery.push(rock);

}


/* =========================================================
   SNOW TREE
========================================================= */

function createSnowTree(position){

    const group=
        new THREE.Group();


    const trunk=
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .6,
                1,
                7,
                7
            ),
            mat(0x543a27)
        );

    trunk.position.y=3.5;


    const snow=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                5,
                14,
                8
            ),
            mat(0xf4f8ff)
        );

    snow.position.y=11;


    group.add(
        trunk,
        snow
    );


    group.position.copy(
        position
    );


    scene.add(group);

    game.scenery.push(group);

}


/* =========================================================
   SCENERY GENERATOR
========================================================= */

function generateScenery(){

    const theme=
        game.track.theme.name;


    for(
        let i=0;
        i<220;
        i++
    ){

        const t=Math.random();


        const center=
            game.curve
            .getPointAt(t);


        const tangent=
            game.curve
            .getTangentAt(t)
            .normalize();


        const side=
            new THREE.Vector3(
                -tangent.z,
                0,
                tangent.x
            ).normalize();


        const distance=
            random(
                game.track.width/2+18,
                130
            );


        const position=
            center.clone().add(
                side.multiplyScalar(
                    Math.random()>.5
                    ? distance
                    : -distance
                )
            );


        if(theme==="FOREST")
            createTree(position);

        else if(theme==="DESERT")
            createCactus(position);

        else if(theme==="ALPINE")
            createSnowTree(position);

        else
            createRock(position);

    }

}


/* =========================================================
   CHECKPOINT GATE
========================================================= */

function createGate(
    position,
    tangent,
    color
){

    const group=
        new THREE.Group();


    const materialGate=
        new THREE.MeshStandardMaterial({
            color:color,
            emissive:color,
            emissiveIntensity:.35
        });


    const left=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .75,
                11,
                .75
            ),
            materialGate
        );


    left.position.set(
        -7,
        5.5,
        0
    );


    const right=
        left.clone();

    right.position.x=7;


    const top=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                14.75,
                .75,
                .75
            ),
            materialGate
        );


    top.position.y=11;


    group.add(
        left,
        right,
        top
    );


    group.position.copy(
        position
    );


    group.rotation.y=
        Math.atan2(
            tangent.x,
            tangent.z
        );


    scene.add(group);

    game.gates.push(group);

    return group;

}


/* =========================================================
   CAR
========================================================= */

function createCar(){

    const car=
        new THREE.Group();


    /* MAIN BODY */

    const body=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2.1,
                .5,
                4.8
            ),
            mat(game.body,.32)
        );


    body.position.y=.75;

    body.castShadow=true;

    car.add(body);

    car.userData.body=body;


    /* SIDE PODS */

    const sidePodGeometry=
        new THREE.BoxGeometry(
            .65,
            .55,
            2.4
        );


    const leftPod=
        new THREE.Mesh(
            sidePodGeometry,
            mat(game.body,.35)
        );


    leftPod.position.set(
        -1.1,
        .75,
        -.1
    );


    const rightPod=
        leftPod.clone();

    rightPod.position.x=1.1;


    car.add(
        leftPod,
        rightPod
    );


    /* NOSE */

    const nose=
        new THREE.Mesh(
            new THREE.ConeGeometry(
                .7,
                3,
                4
            ),
            mat(game.body,.3)
        );


    nose.rotation.z=
        -Math.PI/2;

    nose.rotation.y=
        Math.PI/4;

    nose.position.set(
        0,
        .7,
        -3.15
    );


    car.add(nose);


    /* COCKPIT */

    const cockpit=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .75,
                20,
                12
            ),
            new THREE.MeshStandardMaterial({
                color:0x07090d,
                roughness:.12,
                metalness:.35
            })
        );


    cockpit.scale.set(
        1,
        .48,
        1.4
    );


    cockpit.position.set(
        0,
        1.12,
        -.35
    );


    car.add(cockpit);


    /* HALO */

    const halo=
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .5,
                .08,
                8,
                16,
                Math.PI
            ),
            mat(0xd0d0d0,.35)
        );


    halo.rotation.x=
        Math.PI/2;

    halo.position.set(
        0,
        1.5,
        -.35
    );


    car.add(halo);


    /* FRONT WING */

    const frontWing=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.8,
                .11,
                .55
            ),
            mat(game.front,.45)
        );


    frontWing.position.set(
        0,
        .43,
        -4.05
    );


    car.add(frontWing);

    car.userData.front=frontWing;


    /* FRONT WING ELEMENT */

    const frontElement=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.4,
                .08,
                .25
            ),
            mat(game.front,.45)
        );


    frontElement.position.set(
        0,
        .62,
        -3.85
    );


    car.add(frontElement);


    /* REAR WING */

    const rearWing=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.45,
                .18,
                .5
            ),
            mat(game.rear,.4)
        );


    rearWing.position.set(
        0,
        1.7,
        2.15
    );


    car.add(rearWing);

    car.userData.rear=rearWing;


    /* REAR WING SUPPORT */

    const support=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .18,
                1.1,
                .2
            ),
            mat(game.rear)
        );


    support.position.set(
        0,
        1.2,
        2.15
    );


    car.add(support);


    /* WHEELS */

    const wheelPositions=[

        [-1.22,.43,-1.75],
        [1.22,.43,-1.75],

        [-1.22,.43,1.65],
        [1.22,.43,1.65]

    ];


    car.userData.wheels=[];


    for(
        const position of wheelPositions
    ){

        const tire=
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .47,
                    .47,
                    .36,
                    20
                ),
                new THREE.MeshStandardMaterial({
                    color:0x050505,
                    roughness:.9
                })
            );


        tire.rotation.z=
            Math.PI/2;


        tire.position.set(
            position[0],
            position[1],
            position[2]
        );


        tire.castShadow=true;

        car.add(tire);

        car.userData.wheels.push(
            tire
        );

    }


    /* BRAKE LIGHTS */

    car.userData.brakeLights=[];


    for(
        const x of [-.8,.8]
    ){

        const light=
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .42,
                    .12,
                    .08
                ),
                new THREE.MeshBasicMaterial({
                    color:0x330000
                })
            );


        light.position.set(
            x,
            .9,
            2.58
        );


        car.add(light);

        car.userData.brakeLights.push(
            light
        );

    }


    /* EXHAUST */

    for(
        const x of [-.35,.35]
    ){

        const exhaust=
            new THREE.Mesh(
                new THREE.CylinderGeometry(
                    .09,
                    .09,
                    .4,
                    8
                ),
                mat(0x222222,.25)
            );


        exhaust.rotation.x=
            Math.PI/2;

        exhaust.position.set(
            x,
            .82,
            2.75
        );


        car.add(exhaust);

    }


    scene.add(car);

    return car;

}


/* =========================================================
   LOAD NEW PROCEDURAL TRACK
========================================================= */

function loadTrack(){

    clearTrack();


    game.track=
        generateTrack();


    game.trackWidth=
        game.track.width;


    game.curve=
        createCurve(
            game.track
        );


    game.road=
        createRoad(
            game.curve,
            game.track.width
        );


    createRoadEdge(
        game.curve,
        game.track.width
    );


    createGround(
        game.track
    );


    generateScenery();


    document.getElementById(
        "trackName"
    ).textContent=
        game.track.name;


    /* CHECKPOINTS */

    game.gates=[];


    const checkpointCount=9;


    game.checkpoints=[];


    for(
        let i=1;
        i<=checkpointCount;
        i++
    ){

        const t=
            i/(checkpointCount+1);


        const position=
            game.curve
            .getPointAt(t);


        const tangent=
            game.curve
            .getTangentAt(t)
            .normalize();


        const gate=
            createGate(
                position,
                tangent,
                0xffff00
            );


        game.checkpoints.push({
            position:position,
            gate:gate,
            finish:false
        });

    }


    /* FINISH */

    const finishPosition=
        game.curve
        .getPointAt(.99);


    const finishTangent=
        game.curve
        .getTangentAt(.99)
        .normalize();


    const finishGate=
        createGate(
            finishPosition,
            finishTangent,
            0xff0000
        );


    game.checkpoints.push({
        position:finishPosition,
        gate:finishGate,
        finish:true
    });


    document.getElementById(
        "checkpoint"
    ).textContent=
        "0/"+game.checkpoints.length;


    /* GHOST */

    game.ghostData=
        JSON.parse(
            localStorage.getItem(
                "f1ghost_"+game.trackNumber
            ) || "null"
        );


    if(game.ghostData){

        game.ghost=
            createCar();


        game.ghost.traverse(
            object=>{

                if(object.material){

                    object.material=
                        object.material.clone();

                    object.material.transparent=true;

                    object.material.opacity=.18;

                }

            }
        );

    }


    resetCar();

}


/* =========================================================
   RESET CAR
========================================================= */

function resetCar(){

    const position=
        game.curve.getPointAt(0);


    const tangent=
        game.curve
        .getTangentAt(0)
        .normalize();


    game.car.position.copy(
        position
    );


    game.car.position.y+=.7;


    game.car.rotation.y=
        Math.atan2(
            tangent.x,
            tangent.z
        );


    game.speed=0;

    game.steering=0;

    game.lateralVelocity=0;

    game.running=false;

    game.finished=false;

    game.elapsed=0;

    game.checkpoint=0;

    game.recorded=[];


    document.getElementById(
        "message"
    ).textContent=
        "PRESS W TO START";


    document.getElementById(
        "checkpoint"
    ).textContent=
        "0/"+game.checkpoints.length;

}


/* =========================================================
   INPUT
========================================================= */

addEventListener(
    "keydown",
    event=>{

        game.keys[event.code]=true;


        if(event.code==="KeyA"){
            game.keys.left=true;
        }


        if(event.code==="KeyD"){
            game.keys.right=true;
        }


        if(event.code==="KeyR"){
            resetCar();
        }


        if(
            event.code==="KeyW" &&
            !game.running &&
            !game.finished
        ){

            startRace();

        }


        if(
            event.code==="Space" &&
            game.finished
        ){

            raceAgain();

        }

    }
);


addEventListener(
    "keyup",
    event=>{

        game.keys[event.code]=false;


        if(event.code==="KeyA"){
            game.keys.left=false;
        }


        if(event.code==="KeyD"){
            game.keys.right=false;
        }

    }
);


/* =========================================================
   START RACE
========================================================= */

function startRace(){

    game.running=true;

    game.startTime=
        performance.now();


    document.getElementById(
        "message"
    ).textContent="";

}


/* =========================================================
   CLOSEST TRACK POINT
========================================================= */

function closestTrackPoint(){

    let best=null;

    let bestDistance=Infinity;


    for(
        let i=0;
        i<=500;
        i++
    ){

        const t=i/500;


        const p=
            game.curve
            .getPointAt(t);


        const distance=
            p.distanceToSquared(
                game.car.position
            );


        if(
            distance<bestDistance
        ){

            bestDistance=distance;

            best={
                point:p,
                t:t
            };

        }

    }


    return best;

}


/* =========================================================
   CAR PHYSICS
========================================================= */

function updateCar(dt){

    if(!game.running)
        return;


    const accelerate=
        !!game.keys["KeyW"];


    const brake=
        !!game.keys["KeyS"];


    /* ACCELERATION */

    if(accelerate){

        game.speed+=
            75*dt;

    }
    else{

        game.speed-=
            8*dt;

    }


    /* BRAKING */

    if(brake){

        game.speed-=
            115*dt;

    }


    game.speed=
        THREE.MathUtils.clamp(
            game.speed,
            0,
            125
        );


    /*
       IMPORTANT:
       A = LEFT
       D = RIGHT
    */

    let targetSteering=0;


    if(game.keys.left)
        targetSteering=-1;


    if(game.keys.right)
        targetSteering=1;


    game.steering=
        THREE.MathUtils.lerp(
            game.steering,
            targetSteering,
            dt*10
        );


    /* STEERING */

    const speedFactor=
        THREE.MathUtils.clamp(
            game.speed/45,
            0,
            1
        );


    const steeringStrength=
        .85*
        speedFactor;


    game.car.rotation.y +=
        game.steering*
        steeringStrength*
        dt;


    /* FORWARD */

    const forward=
        new THREE.Vector3(
            0,
            0,
            -1
        )
        .applyQuaternion(
            game.car.quaternion
        )
        .normalize();


    /*
       SMALL DRIFT EFFECT
    */

    if(
        brake &&
        Math.abs(game.steering)>.25 &&
        game.speed>30
    ){

        game.car.rotation.y +=
            game.steering*
            .20*
            dt;

    }


    game.car.position.add(
        forward.multiplyScalar(
            game.speed*dt
        )
    );


    /* TRACK HEIGHT */

    const closest=
        closestTrackPoint();


    if(closest){

        const tangent=
            game.curve
            .getTangentAt(
                closest.t
            )
            .normalize();


        const side=
            new THREE.Vector3(
                -tangent.z,
                0,
                tangent.x
            ).normalize();


        const lateral=
            game.car.position
            .clone()
            .sub(
                closest.point
            )
            .dot(side);


        if(
            Math.abs(lateral)>
            game.track.width/2+3
        ){

            game.speed*=.35;

            document.getElementById(
                "message"
            ).textContent=
                "OFF TRACK — PRESS R TO RESET";

        }
        else{

            document.getElementById(
                "message"
            ).textContent="";

        }


        /*
           Keeps the car attached to
           hills and banked sections.
        */

        game.car.position.y=
            THREE.MathUtils.lerp(
                game.car.position.y,
                closest.point.y+.7,
                dt*9
            );

    }


    updateWheels(dt);

    updateBrakeLights(brake);

    createDrivingEffects(brake);

    updateCheckpoints();


    /* RECORD GHOST */

    game.recorded.push({

        time:
            performance.now()-
            game.startTime,

        position:[
            game.car.position.x,
            game.car.position.y,
            game.car.position.z
        ],

        rotation:
            game.car.rotation.y

    });

}


/* =========================================================
   WHEELS
========================================================= */

function updateWheels(dt){

    const wheels=
        game.car.userData.wheels;


    for(
        let i=0;
        i<wheels.length;
        i++
    ){

        wheels[i].rotation.x -=
            game.speed*
            dt*
            1.6;


        /* FRONT WHEELS TURN */

        if(i<2){

            wheels[i].rotation.y=
                game.steering*.42;

        }

    }

}


/* =========================================================
   BRAKE LIGHTS
========================================================= */

function updateBrakeLights(braking){

    for(
        const light of
        game.car.userData.brakeLights
    ){

        light.material.color.setHex(
            braking
            ? 0xff0000
            : 0x330000
        );

    }

}


/* =========================================================
   SMOKE AND SKIDS
========================================================= */

function createDrivingEffects(braking){

    const hardTurn=
        Math.abs(game.steering)>.45;


    if(
        hardTurn &&
        game.speed>35
    ){

        /*
           Smoke from outer front wheel
        */

        if(Math.random()<.22){

            const index=
                game.steering>0
                ? 0
                : 1;


            const wheel=
                game.car.userData.wheels[
                    index
                ];


            const smoke=
                new THREE.Mesh(
                    new THREE.SphereGeometry(
                        .16,
                        7,
                        7
                    ),
                    new THREE.MeshBasicMaterial({
                        color:0xb0b0b0,
                        transparent:true,
                        opacity:.45
                    })
                );


            smoke.position.copy(
                wheel.getWorldPosition(
                    new THREE.Vector3()
                )
            );


            smoke.userData.life=1;


            scene.add(smoke);

            game.smoke.push(smoke);

        }

    }


    /*
       Skid marks
    */

    if(
        braking &&
        hardTurn &&
        game.speed>25 &&
        Math.random()<.18
    ){

        for(
            const wheel of
            game.car.userData.wheels
        ){

            const mark=
                new THREE.Mesh(
                    new THREE.PlaneGeometry(
                        .35,
                        1.4
                    ),
                    new THREE.MeshBasicMaterial({
                        color:0x030303,
                        transparent:true,
                        opacity:.65,
                        side:THREE.DoubleSide
                    })
                );


            mark.rotation.x=
                -Math.PI/2;


            mark.position.copy(
                wheel.getWorldPosition(
                    new THREE.Vector3()
                )
            );


            mark.position.y+=.04;


            scene.add(mark);

            game.skidMarks.push(mark);

        }

    }


    /* UPDATE SMOKE */

    for(
        let i=game.smoke.length-1;
        i>=0;
        i--
    ){

        const smoke=
            game.smoke[i];


        smoke.userData.life-=.025;

        smoke.scale.multiplyScalar(
            1.04
        );

        smoke.material.opacity=
            smoke.userData.life*.4;


        if(
            smoke.userData.life<=0
        ){

            scene.remove(smoke);

            game.smoke.splice(i,1);

        }

    }

}


/* =========================================================
   CHECKPOINTS
========================================================= */

function updateCheckpoints(){

    if(
        game.checkpoint>=
        game.checkpoints.length
    )
        return;


    const checkpoint=
        game.checkpoints[
            game.checkpoint
        ];


    const distance=
        game.car.position.distanceTo(
            checkpoint.position
        );


    if(distance<14){

        game.checkpoint++;


        document.getElementById(
            "checkpoint"
        ).textContent=
            game.checkpoint+
            "/"+
            game.checkpoints.length;


        if(checkpoint.finish){

            finishRace();

        }

    }

}


/* =========================================================
   FINISH
========================================================= */

function finishRace(){

    game.running=false;

    game.finished=true;


    game.elapsed=
        performance.now()-
        game.startTime;


    localStorage.setItem(
        "f1ghost_"+game.trackNumber,
        JSON.stringify(
            game.recorded
        )
    );


    document.getElementById(
        "finalTime"
    ).textContent=
        "TIME: "+
        formatTime(
            game.elapsed
        );


    document.getElementById(
        "finishScreen"
    ).style.display=
        "flex";

}


/* =========================================================
   RACE AGAIN
========================================================= */

function raceAgain(){

    document.getElementById(
        "finishScreen"
    ).style.display=
        "none";


    resetCar();

    startRace();

}


/* =========================================================
   GHOST
========================================================= */

function updateGhost(){

    if(
        !game.ghost ||
        !game.ghostData ||
        !game.running
    )
        return;


    const elapsed=
        performance.now()-
        game.startTime;


    let a=null;
    let b=null;


    for(
        let i=0;
        i<game.ghostData.length-1;
        i++
    ){

        if(
            elapsed>=
            game.ghostData[i].time &&

            elapsed<=
            game.ghostData[i+1].time
        ){

            a=game.ghostData[i];

            b=game.ghostData[i+1];

            break;

        }

    }


    if(!a || !b)
        return;


    const alpha=
        (elapsed-a.time)/
        (b.time-a.time);


    game.ghost.position.set(

        THREE.MathUtils.lerp(
            a.position[0],
            b.position[0],
            alpha
        ),

        THREE.MathUtils.lerp(
            a.position[1],
            b.position[1],
            alpha
        ),

        THREE.MathUtils.lerp(
            a.position[2],
            b.position[2],
            alpha
        )

    );


    game.ghost.rotation.y=
        THREE.MathUtils.lerp(
            a.rotation,
            b.rotation,
            alpha
        );

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(dt){

    const forward=
        new THREE.Vector3(
            0,
            0,
            -1
        )
        .applyQuaternion(
            game.car.quaternion
        );


    /*
       Camera moves farther away
       at high speed.
    */

    const cameraDistance=
        11+
        game.speed*.035;


    const desired=
        game.car.position
        .clone()
        .add(
            forward
            .clone()
            .multiplyScalar(
                -cameraDistance
            )
        );


    desired.y+=
        5+
        game.speed*.012;


    camera.position.lerp(
        desired,
        dt*5
    );


    const lookAt=
        game.car.position
        .clone()
        .add(
            forward
            .clone()
            .multiplyScalar(13)
        );


    lookAt.y+=1;


    camera.lookAt(
        lookAt
    );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD(){

    let time=0;


    if(game.running){

        time=
            performance.now()-
            game.startTime;

    }
    else if(game.finished){

        time=game.elapsed;

    }


    document.getElementById(
        "timer"
    ).textContent=
        formatTime(time);


    document.getElementById(
        "speedValue"
    ).textContent=
        Math.round(
            game.speed*3.6
        );

}


function formatTime(ms){

    const minutes=
        Math.floor(ms/60000);


    const seconds=
        Math.floor(
            (ms%60000)/1000
        );


    const milliseconds=
        Math.floor(ms%1000);


    return(
        String(minutes).padStart(2,"0")
        +":"
        +String(seconds).padStart(2,"0")
        +"."
        +String(milliseconds).padStart(3,"0")
    );

}


/* =========================================================
   NEXT TRACK
========================================================= */

function nextTrack(){

    game.trackNumber++;

    loadTrack();

}

   BUTTONS
========================================================= */

document.getElementById(

};


document.getElementById(
    "returnRace"
).onclick=()=>{

    document.getElementById(
        "exitScreen"
    ).style.display=

};


document.getElementById(
    "raceAgain"
).onclick=

document.getElementById(

).onclick=()=>{

};


document.getElementById(

    document.getElementById(
        "finishScreen"
    ).style.display=

    document.getElementById(
        "exitScreen"

};

   CAR COLORS
========================================================= */

document.getElementById(

).oninput=e=>{

    game.car.userData.body
        .material.color.set(
            game.body
        );

};

    "frontColor"
).oninput=e=>{

    game.front=e.target.value;

    game.car.userData.front
        .material.color.set(
            game.front
        );

};


document.getElementById(
    "rearColor"
).oninput=e=>{

    game.rear=e.target.value;

    game.car.userData.rear
        .material.color.set(
            game.rear
        );

};


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );

    }
);


/* =========================================================
   START
========================================================= */

game.car=
    createCar();


loadTrack();


document.getElementById(
    "loading"
).style.display=
    "none";


/* =========================================================
   MAIN LOOP
========================================================= */

let lastTime=
    performance.now();


function animate(){

    requestAnimationFrame(
        animate
    );


    const now=
        performance.now();


    const dt=
        Math.min(
            (now-lastTime)/1000,
            .05
        );


    lastTime=now;


    updateCar(dt);

    updateGhost();

    updateCamera(dt);

    updateHUD();


    renderer.render(
        scene,
        camera
    );

}


animate();

</script>
