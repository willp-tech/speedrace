<body>
<div id="game"></div>

<div id="hud">
    <div class="top">
        <div id="raceInfo" class="panel">
            <div id="trackName">HYPERTRACK // CIRCUIT 01</div>
            <div id="position">1<small> / 11</small></div>

    </div>

    <div id="controls" class="panel">
        W / ↑ THROTTLE &nbsp;&nbsp; A / ← LEFT &nbsp;&nbsp; D / → RIGHT &nbsp;&nbsp;

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   BASIC SETUP
========================================================= */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x86b9df);
scene.fog = new THREE.Fog(0x86b9df, 500, 4200);

const camera = new THREE.PerspectiveCamera(
    78,
    innerWidth / innerHeight,
    0.05,
    6000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true,
    powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

document.getElementById("game").appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

const hemi = new THREE.HemisphereLight(
    0xdcefff,
    0x31402d,
    2.0
);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffffff,3.0);
sun.position.set(-500,800,-600);
sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.left = -1000;
sun.shadow.camera.right = 1000;
sun.shadow.camera.top = 1000;
sun.shadow.camera.bottom = -1000;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 3000;

scene.add(sun);

/* =========================================================
   CONSTANTS
========================================================= */

const ROAD_WIDTH = 40;
const CURB_WIDTH = 3.5;
const TRACK_SAMPLES = 900;

const MAX_SPEED = 172;
const REVERSE_SPEED = 28;

const PLAYER_RADIUS = 2.25;
const AI_COUNT = 10;
const TOTAL_CARS = AI_COUNT + 1;

const clock = new THREE.Clock();

let raceStarted = false;
let raceFinished = false;
let countdown = 3;
let countdownTimer = 0;
let raceTime = 0;

let currentTrack = 0;

const keys = {};

window.addEventListener("keydown",e=>{
    keys[e.code] = true;

    initAudio();

    if(
        [
            "ArrowUp","ArrowDown","ArrowLeft","ArrowRight",
            "Space"
        ].includes(e.code)
    ){
        e.preventDefault();
    }

    if(e.code === "KeyR"){
        resetRace();
    }

    if(e.code === "KeyN"){
        nextTrack();
    }
});

window.addEventListener("keyup",e=>{
    keys[e.code] = false;
});

window.addEventListener("pointerdown",()=>{
    initAudio();
});

/* =========================================================
   MATERIALS
========================================================= */

function mat(color,roughness=.65,metalness=.05){
    return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness
    });
}

const roadMat = mat(0x24272b,.92);
const roadDarkMat = mat(0x1b1d20,.95);
const grassMat = mat(0x4d713d,1);
const curbRed = mat(0xd62f35,.7);
const curbWhite = mat(0xf1f1e8,.7);
const barrierMat = mat(0xd8dce0,.55,.25);
const blackMat = mat(0x090a0c,.35,.55);
const glassMat = new THREE.MeshStandardMaterial({
    color:0x07121b,
    roughness:.1,
    metalness:.65,
    transparent:true,
    opacity:.85
});

/* =========================================================
   GROUND
========================================================= */

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(8000,8000),
    grassMat
);

ground.rotation.x = -Math.PI/2;
ground.position.y = -0.08;
ground.receiveShadow = true;
scene.add(ground);

/* =========================================================
   TRACK DATA
========================================================= */

const tracks = [
    {
        name:"HYPERTRACK // CIRCUIT 01",
        points:[
            [0,-650],
            [380,-650],
            [650,-590],
            [790,-390],
            [800,-100],
            [720,120],
            [540,250],
            [270,270],
            [130,170],
            [100,20],
            [-20,-40],
            [-210,0],
            [-390,150],
            [-650,170],
            [-820,50],
            [-860,-190],
            [-730,-390],
            [-490,-520],
            [-220,-600]
        ]
    },
    {
        name:"HYPERTRACK // DESERT RUN",
        points:[
            [0,-700],
            [420,-700],
            [720,-570],
            [840,-300],
            [820,-40],
            [690,100],
            [430,130],
            [250,20],
            [80,-70],
            [-90,-20],
            [-170,120],
            [-400,250],
            [-700,240],
            [-850,80],
            [-870,-180],
            [-710,-400],
            [-470,-560],
            [-190,-670]
        ]
    },
    {
        name:"HYPERTRACK // GRAND LOOP",
        points:[
            [0,-760],
            [400,-760],
            [700,-690],
            [900,-500],
            [930,-210],
            [850,40],
            [650,190],
            [360,230],
            [170,120],
            [100,-30],
            [-40,-90],
            [-220,-40],
            [-350,110],
            [-600,250],
            [-880,220],
            [-1040,40],
            [-1040,-240],
            [-880,-470],
            [-590,-620],
            [-280,-720]
        ]
    }
];

let trackCurve;
let trackPoints = [];
let trackTangents = [];
let trackLength = 0;

const trackGroup = new THREE.Group();
scene.add(trackGroup);

/* =========================================================
   TRACK GENERATION
========================================================= */

function buildTrack(index){

    while(trackGroup.children.length){
        trackGroup.remove(trackGroup.children[0]);
    }

    const data = tracks[index];

    const controlPoints = data.points.map(p =>
        new THREE.Vector3(p[0],0,p[1])
    );

    trackCurve = new THREE.CatmullRomCurve3(
        controlPoints,
        true,
        "centripetal",
        .45
    );

    trackPoints = [];
    trackTangents = [];

    for(let i=0;i<TRACK_SAMPLES;i++){

        const t = i / TRACK_SAMPLES;

        const p = trackCurve.getPointAt(t);
        const tangent = trackCurve.getTangentAt(t).normalize();

        trackPoints.push(p);
        trackTangents.push(tangent);
    }

    trackLength = 0;

    for(let i=0;i<TRACK_SAMPLES;i++){
        const a = trackPoints[i];
        const b = trackPoints[(i+1)%TRACK_SAMPLES];
        trackLength += a.distanceTo(b);
    }

    /* ROAD */

    const roadPositions = [];
    const roadIndices = [];

    for(let i=0;i<TRACK_SAMPLES;i++){

        const p = trackPoints[i];
        const t = trackTangents[i];

        const right = new THREE.Vector3(
            -t.z,
            0,
            t.x
        ).normalize();

        const leftP = p.clone().addScaledVector(
            right,
            -ROAD_WIDTH/2
        );

        const rightP = p.clone().addScaledVector(
            right,
            ROAD_WIDTH/2
        );

        const base = i*2;

        roadPositions.push(
            leftP.x,0,leftP.z,
            rightP.x,0,rightP.z
        );

        roadIndices.push(
            base,
            ((i+1)%TRACK_SAMPLES)*2,
            base+1,

            base+1,
            ((i+1)%TRACK_SAMPLES)*2,
            ((i+1)%TRACK_SAMPLES)*2+1
        );
    }

    const roadGeo = new THREE.BufferGeometry();

    roadGeo.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(roadPositions,3)
    );

    roadGeo.setIndex(roadIndices);
    roadGeo.computeVertexNormals();

    const road = new THREE.Mesh(roadGeo,roadMat);
    road.receiveShadow = true;
    roadGroupAdd(road);

    /* CENTER DASHES */

    const dashGroup = new THREE.Group();

    for(let i=0;i<TRACK_SAMPLES;i+=12){

        const p = trackPoints[i];
        const t = trackTangents[i];

        const dash = new THREE.Mesh(
            new THREE.BoxGeometry(0.35,.025,8),
            mat(0xe9e7d4,.75)
        );

        dash.position.copy(p);
        dash.position.y = .035;

        dash.rotation.y = Math.atan2(-t.x,-t.z);

        dashGroup.add(dash);
    }

    trackGroup.add(dashGroup);

    /* CURBS */

    const curbGroup = new THREE.Group();

    for(let i=0;i<TRACK_SAMPLES;i+=3){

        const p = trackPoints[i];
        const t = trackTangents[i];

        const right = new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        for(const side of [-1,1]){

            const curb = new THREE.Mesh(
                new THREE.BoxGeometry(
                    CURB_WIDTH,
                    .16,
                    6.8
                ),
                ((Math.floor(i/3))%2===0)
                    ? curbRed
                    : curbWhite
            );

            curb.position.copy(p);
            curb.position.y = .08;

            curb.position.addScaledVector(
                right,
                side*(ROAD_WIDTH/2 + CURB_WIDTH/2)
            );

            curb.rotation.y =
                Math.atan2(-t.x,-t.z);

            curbGroup.add(curb);
        }
    }

    trackGroup.add(curbGroup);

    /* BARRIERS */

    const barrierGroup = new THREE.Group();

    for(let i=0;i<TRACK_SAMPLES;i+=8){

        const p = trackPoints[i];
        const t = trackTangents[i];

        const right = new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        for(const side of [-1,1]){

            const barrier = new THREE.Mesh(
                new THREE.BoxGeometry(
                    .65,
                    1.15,
                    12
                ),
                barrierMat
            );

            barrier.position.copy(p);
            barrier.position.y = .65;

            barrier.position.addScaledVector(
                right,
                side*(ROAD_WIDTH/2 + 7)
            );

            barrier.rotation.y =
                Math.atan2(-t.x,-t.z);

            barrier.castShadow = true;
            barrier.receiveShadow = true;

            barrierGroup.add(barrier);
        }
    }

    trackGroup.add(barrierGroup);

    /* START LINE */

    const start = trackPoints[0];
    const tangent = trackTangents[0];

    const startLine = new THREE.Mesh(
        new THREE.PlaneGeometry(ROAD_WIDTH,8),
        new THREE.MeshBasicMaterial({
            color:0xffffff,
            side:THREE.DoubleSide
        })
    );

    startLine.rotation.x = -Math.PI/2;
    startLine.rotation.z =
        Math.atan2(tangent.z,tangent.x);

    startLine.position.copy(start);
    startLine.position.y = .07;

    trackGroup.add(startLine);

    /* START GANTRY */

    const gantry = new THREE.Group();

    const postGeo = new THREE.BoxGeometry(.8,10,.8);

    const post1 = new THREE.Mesh(postGeo,blackMat);
    const post2 = new THREE.Mesh(postGeo,blackMat);

    const right = new THREE.Vector3(
        -tangent.z,0,tangent.x
    ).normalize();

    post1.position.copy(start)
        .addScaledVector(right,-ROAD_WIDTH/2-3);

    post2.position.copy(start)
        .addScaledVector(right,ROAD_WIDTH/2+3);

    post1.position.y = 5;
    post2.position.y = 5;

    const beam = new THREE.Mesh(
        new THREE.BoxGeometry(ROAD_WIDTH+7,1.3,1),
        blackMat
    );

    beam.position.copy(start);
    beam.position.y = 9.5;
    beam.rotation.y =
        Math.atan2(-tangent.x,-tangent.z);

    gantry.add(post1,post2,beam);

    /* LIGHTS */

    for(let i=0;i<8;i++){

        const light = new THREE.Mesh(
            new THREE.SphereGeometry(.45,16,12),
            new THREE.MeshBasicMaterial({color:0xff1818})
        );

        const x =
            -ROAD_WIDTH/2-2 +
            i*((ROAD_WIDTH+4)/7);

        const local = new THREE.Vector3(x,0,0);

        local.applyAxisAngle(
            new THREE.Vector3(0,1,0),
            Math.atan2(-tangent.x,-tangent.z)
        );

        light.position.copy(start).add(local);
        light.position.y = 9.3;

        gantry.add(light);
    }

    trackGroup.add(gantry);

    /* SCENERY */

    buildScenery();
}

/* helper */
function roadGroupAdd(o){
    trackGroup.add(o);
}

/* =========================================================
   SCENERY
========================================================= */

function buildScenery(){

    const scenery = new THREE.Group();

    for(let i=0;i<130;i++){

        const index =
            Math.floor(Math.random()*TRACK_SAMPLES);

        const p = trackPoints[index];
        const t = trackTangents[index];

        const right = new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        const side = Math.random()<.5 ? -1 : 1;

        const distance =
            ROAD_WIDTH/2 +
            35 +
            Math.random()*260;

        const obj = new THREE.Group();

        const type = Math.random();

        if(type < .6){

            const trunk = new THREE.Mesh(
                new THREE.CylinderGeometry(.35,.55,4,8),
                mat(0x604630)
            );

            trunk.position.y=2;

            const leaves = new THREE.Mesh(
                new THREE.ConeGeometry(
                    3.0+Math.random()*2,
                    7+Math.random()*5,
                    8
                ),
                mat(
                    0x24572d + Math.floor(Math.random()*3)*0x111111
                )
            );

            leaves.position.y=6;

            obj.add(trunk,leaves);

        }else{

            const building = new THREE.Mesh(
                new THREE.BoxGeometry(
                    10+Math.random()*15,
                    7+Math.random()*12,
                    10+Math.random()*15
                ),
                mat(
                    [0x7c8589,0xa29b87,0x6e7479][
                        Math.floor(Math.random()*3)
                    ]
                )
            );

            building.position.y =
                building.geometry.parameters.height/2;

            obj.add(building);
        }

        obj.position.copy(p);
        obj.position.addScaledVector(right,side*distance);

        scenery.add(obj);
    }

    trackGroup.add(scenery);
}

/* =========================================================
   WEDGE GEOMETRY
========================================================= */

function wedgeGeometry(
    length,
    height,
    frontWidth,
    rearWidth
){

    const z1 = -length/2;
    const z2 = length/2;

    const verts = [
        -frontWidth/2,0,z1,
         frontWidth/2,0,z1,
        -rearWidth/2,0,z2,
         rearWidth/2,0,z2,

        -frontWidth/2,height,z1,
         frontWidth/2,height,z1,
        -rearWidth/2,height*.78,z2,
         rearWidth/2,height*.78,z2
    ];

    const indices = [
        0,2,1,
        1,2,3,

        4,5,6,
        5,7,6,

        0,4,2,
        2,4,6,

        1,3,5,
        3,7,5,

        0,1,4,
        1,5,4,

        2,6,3,
        3,6,7
    ];

    const g = new THREE.BufferGeometry();

    g.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(verts,3)
    );

    g.setIndex(indices);
    g.computeVertexNormals();

    return g;
}

/* =========================================================
   CAR CREATION
========================================================= */

const carColors = [
    0xf27b20,
    0x1877d2,
    0xd71920,
    0xeeeeee,
    0x19a65a,
    0x111111,
    0xffd21f,
    0x783bd1,
    0x00a6a6,
    0xff4b91,
    0x9b6b36
];

function createCar(color,number,isPlayer=false){

    const root = new THREE.Group();

    const bodyMat = mat(color,.35,.3);
    const dark = mat(0x08090b,.3,.65);
    const carbon = mat(0x17191c,.45,.5);
    const white = mat(0xf1f2ed,.4,.15);
    const tireMat = mat(0x070708,.96,.02);
    const rimMat = mat(0x9ca4aa,.22,.8);

    /* floor */

    const floor = new THREE.Mesh(
        new THREE.BoxGeometry(2.15,.18,5.15),
        carbon
    );

    floor.position.y=.42;
    root.add(floor);

    /* main body */

    const body = new THREE.Mesh(
        wedgeGeometry(4.6,.78,.95,1.72),
        bodyMat
    );

    body.position.y=.53;
    root.add(body);

    /* nose */

    const nose = new THREE.Mesh(
        wedgeGeometry(2.9,.55,.38,.95),
        bodyMat
    );

    nose.position.set(0,.66,-3.0);
    root.add(nose);

    /* center stripe */

    const stripe = new THREE.Mesh(
        new THREE.BoxGeometry(.28,.025,5.2),
        white
    );

    stripe.position.set(0,1.005,-.15);
    root.add(stripe);

    /* sidepods */

    for(const side of [-1,1]){

        const sidepod = new THREE.Mesh(
            wedgeGeometry(2.4,.48,.75,1.05),
            bodyMat
        );

        sidepod.position.set(
            side*.78,
            .62,
            .35
        );

        sidepod.rotation.y =
            side * -.035;

        root.add(sidepod);
    }

    /* engine cover */

    const engineCover = new THREE.Mesh(
        new THREE.CylinderGeometry(
            .62,.78,2.0,12
        ),
        bodyMat
    );

    engineCover.rotation.x=Math.PI/2;
    engineCover.position.set(0,.95,1.15);
    root.add(engineCover);

    /* cockpit */

    const cockpit = new THREE.Mesh(
        new THREE.BoxGeometry(
            1.02,.28,1.3
        ),
        glassMat
    );

    cockpit.position.set(0,1.03,-.15);
    root.add(cockpit);

    /* seat */

    const seat = new THREE.Mesh(
        new THREE.BoxGeometry(.55,.4,.65),
        dark
    );

    seat.position.set(0,.98,.15);
    root.add(seat);

    /* halo */

    const haloGroup = new THREE.Group();

    const haloBar = new THREE.Mesh(
        new THREE.TorusGeometry(
            .47,.055,8,20,
            Math.PI
        ),
        carbon
    );

    haloBar.rotation.z=Math.PI/2;
    haloBar.rotation.x=Math.PI/2;
    haloBar.position.y=1.25;
    haloGroup.add(haloBar);

    const haloFront = new THREE.Mesh(
        new THREE.BoxGeometry(.09,.52,.09),
        carbon
    );

    haloFront.position.set(0,1.22,-.7);
    haloGroup.add(haloFront);

    root.add(haloGroup);

    /* FRONT WING */

    const frontWing = new THREE.Mesh(
        new THREE.BoxGeometry(3.25,.13,.48),
        carbon
    );

    frontWing.position.set(0,.42,-4.25);
    root.add(frontWing);

    const wingBlade = new THREE.Mesh(
        new THREE.BoxGeometry(3.7,.08,.22),
        bodyMat
    );

    wingBlade.position.set(0,.3,-4.32);
    root.add(wingBlade);

    /* REAR WING */

    const rearSupports = new THREE.Group();

    for(const side of [-1,1]){

        const support = new THREE.Mesh(
            new THREE.BoxGeometry(.12,.9,.12),
            carbon
        );

        support.position.set(side*.62,1.25,2.65);
        rearSupports.add(support);
    }

    const rearWing = new THREE.Mesh(
        new THREE.BoxGeometry(2.65,.18,.38),
        bodyMat
    );

    rearWing.position.set(0,1.65,2.7);

    rearSupports.add(rearWing);
    root.add(rearSupports);

    /* REAR LIGHT */

    const rearLight = new THREE.Mesh(
        new THREE.BoxGeometry(.18,.12,.08),
        new THREE.MeshBasicMaterial({
            color:0xff2020
        })
    );

    rearLight.position.set(0,1.03,2.95);
    root.add(rearLight);

    /* NUMBER PLATE */

    const numberCanvas = document.createElement("canvas");
    numberCanvas.width=128;
    numberCanvas.height=128;

    const ctx = numberCanvas.getContext("2d");

    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,128,128);

    ctx.fillStyle="#111111";
    ctx.font="900 92px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText(number,64,68);

    const numberTexture =
        new THREE.CanvasTexture(numberCanvas);

    const numberMat =
        new THREE.MeshBasicMaterial({
            map:numberTexture,
            transparent:true
        });

    const numberPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(.7,.7),
        numberMat
    );

    numberPlane.position.set(
        isPlayer ? -.92 : -.91,
        .95,
        .35
    );

    numberPlane.rotation.y =
        -Math.PI/2;

    root.add(numberPlane);

    /* WHEELS */

    const wheels=[];

    const wheelPositions=[
        [-1.08,.48,-2.35,true],
        [ 1.08,.48,-2.35,true],
        [-1.08,.48, 2.05,false],
        [ 1.08,.48, 2.05,false]
    ];

    for(const wp of wheelPositions){

        const x=wp[0];
        const y=wp[1];
        const z=wp[2];
        const front=wp[3];

        const steeringPivot = new THREE.Group();
        steeringPivot.position.set(x,y,z);

        const spinPivot = new THREE.Group();

        const tire = new THREE.Mesh(
            new THREE.CylinderGeometry(
                .48,.48,.34,18
            ),
            tireMat
        );

        /*
           The tire itself is rotated so its axle is X.
           Rolling happens on spinPivot, while steering
           happens on steeringPivot. They never interfere.
        */
        tire.rotation.z=Math.PI/2;

        const rim = new THREE.Mesh(
            new THREE.CylinderGeometry(
                .27,.27,.355,12
            ),
            rimMat
        );

        rim.rotation.z=Math.PI/2;

        const disc = new THREE.Mesh(
            new THREE.CylinderGeometry(
                .19,.19,.37,12
            ),
            mat(0x4e5256,.3,.8)
        );

        disc.rotation.z=Math.PI/2;

        spinPivot.add(tire,rim,disc);
        steeringPivot.add(spinPivot);

        root.add(steeringPivot);

        wheels.push({
            steeringPivot,
            spinPivot,
            front
        });
    }

    /* SUSPENSION ARMS */

    for(const side of [-1,1]){

        const arm = new THREE.Mesh(
            new THREE.BoxGeometry(
                1.45,.06,.06
            ),
            carbon
        );

        arm.position.set(
            side*.62,
            .63,
            -2.25
        );

        arm.rotation.z =
            side*.18;

        root.add(arm);
    }

    root.scale.setScalar(1);

    root.traverse(o=>{
        if(o.isMesh){
            o.castShadow=true;
            o.receiveShadow=true;
        }
    });

    return {
        root,
        wheels,
        velocity:new THREE.Vector3(),
        yaw:0,
        speed:0,
        progress:0,
        targetProgress:0,
        laneOffset:0,
        aiSkill:.8+Math.random()*.18,
        aiTimer:0,
        collisionRadius:PLAYER_RADIUS,
        number,
        isPlayer
    };
}

   CARS

/* =========================================================
   TRACK POSITION HELPERS
========================================================= */

function getTrackPointAtDistance(distance){

    distance =
        ((distance%trackLength)+trackLength)%trackLength;

    let accumulated=0;

    for(let i=0;i<TRACK_SAMPLES;i++){

        const a=trackPoints[i];
        const b=trackPoints[(i+1)%TRACK_SAMPLES];

        const len=a.distanceTo(b);

        if(accumulated+len>=distance){

            const f =
                (distance-accumulated)/len;

            return new THREE.Vector3().lerpVectors(
                a,b,f
            );
        }

        accumulated+=len;
    }

    return trackPoints[0].clone();
}

function getTrackIndexNearPosition(position){

    let best=0;
    let bestDist=Infinity;

    /*
       Checking every point is fine for this size.
       It also keeps the collision/AI behavior stable.
    */

    for(let i=0;i<TRACK_SAMPLES;i++){

        const dx=trackPoints[i].x-position.x;
        const dz=trackPoints[i].z-position.z;

        const d=dx*dx+dz*dz;

        if(d<bestDist){
            bestDist=d;
            best=i;
        }
    }

    return best;
}

function getProgressForPosition(position){

    const index=getTrackIndexNearPosition(position);

    return index/TRACK_SAMPLES;
}

function getWorldDistanceForIndex(index){

    return index/TRACK_SAMPLES*trackLength;
}

/* =========================================================
   RESET
========================================================= */

function resetRace(){

    raceStarted=false;
    raceFinished=false;

    countdown=3;
    countdownTimer=0;
    raceTime=0;

    const start=trackPoints[0];
    const tangent=trackTangents[0];

    const yaw =
        Math.atan2(-tangent.x,-tangent.z);

    /* PLAYER IS ALWAYS P1 */

    player.root.position.copy(start);

    player.root.position.y=.03;

    player.yaw=yaw;
    player.root.rotation.y=yaw;

    player.velocity.set(0,0,0);
    player.speed=0;

    /*
       Ten AI cars behind the player.
       Two cars per row.
    */

    for(let i=1;i<cars.length;i++){

        const ai=cars[i];

        const row=Math.floor((i-1)/2);
        const side=((i-1)%2===0)?-1:1;

        const distanceBehind=
            32+
            row*27;

        const pos=
            getTrackPointAtDistance(
                trackLength-distanceBehind
            );

        const idx=getTrackIndexNearPosition(pos);
        const t=trackTangents[idx];

        const right=new THREE.Vector3(
            -t.z,0,t.x
        ).normalize();

        pos.addScaledVector(
            right,
            side*5.8
        );

        ai.root.position.copy(pos);
        ai.root.position.y=.03;

        ai.yaw=
            Math.atan2(-t.x,-t.z);

        ai.root.rotation.y=ai.yaw;

        ai.velocity.set(0,0,0);
        ai.speed=0;

        ai.laneOffset=side*3.2;
        ai.targetProgress=0;
        ai.aiTimer=0;
    }

    document.getElementById("message").innerHTML="";
    document.getElementById("countdown").textContent="3";

    updatePosition();
}

function nextTrack(){

    currentTrack=
        (currentTrack+1)%tracks.length;

    buildTrack(currentTrack);

    document.getElementById("trackName")
        .textContent=tracks[currentTrack].name;

    resetRace();
}

/* =========================================================
   INPUT
========================================================= */

function throttleInput(){

    return (
        keys["KeyW"] ||
        keys["ArrowUp"]
    ) ? 1 : 0;
}

function brakeInput(){

    return (
        keys["KeyS"] ||
        keys["ArrowDown"]
    ) ? 1 : 0;
}

function steerInput(){

    /*
       IMPORTANT:
       A = LEFT
       D = RIGHT

       The car's forward direction is local -Z.
       Positive Three.js Y rotation turns -Z toward -X,
       which is the LEFT direction.
    */

    let s=0;

    if(keys["KeyA"] || keys["ArrowLeft"])
        s += 1;

    if(keys["KeyD"] || keys["ArrowRight"])
        s -= 1;

    return THREE.MathUtils.clamp(s,-1,1);
}

/* =========================================================
   PLAYER PHYSICS
========================================================= */

function updatePlayer(dt){

    if(!raceStarted || raceFinished)
        return;

    const throttle=throttleInput();
    const brake=brakeInput();
    const steer=steerInput();

    let forward=new THREE.Vector3(
        -Math.sin(player.yaw),
        0,
        -Math.cos(player.yaw)
    );

    let right=new THREE.Vector3(
        Math.cos(player.yaw),
        0,
        -Math.sin(player.yaw)
    );

    let forwardSpeed=
        player.velocity.dot(forward);

    let lateralSpeed=
        player.velocity.dot(right);

    /* ENGINE */

    const acceleration=
        throttle
            ? 92
            : -8;

    forwardSpeed +=
        acceleration*dt;

    /* BRAKES */

    if(brake){

        forwardSpeed *=
            Math.pow(.10,dt);

        player.velocity.multiplyScalar(
            Math.pow(.88,dt)
        );
    }

    /* HANDBRAKE */

    if(keys["Space"]){

        forwardSpeed *=
            Math.pow(.35,dt);

        lateralSpeed *=
            Math.pow(.95,dt);
    }

    /* STEERING */

    const speedRatio=
        THREE.MathUtils.clamp(
            Math.abs(forwardSpeed)/MAX_SPEED,
            0,
            1
        );

    const steerRate=
        THREE.MathUtils.lerp(
            2.5,
            .95,
            speedRatio
        );

    /*
       A gives +steer = LEFT.
       D gives -steer = RIGHT.
    */

    player.yaw +=
        steer *
        steerRate *
        dt *
        THREE.MathUtils.clamp(
            Math.abs(forwardSpeed)/25,
            .18,
            1
        );

    /* DRIFT / LATERAL FRICTION */

    lateralSpeed *=
        Math.pow(
            keys["Space"] ? .72 : .16,
            dt
        );

    forward=new THREE.Vector3(
        -Math.sin(player.yaw),
        0,
        -Math.cos(player.yaw)
    );

    right=new THREE.Vector3(
        Math.cos(player.yaw),
        0,
        -Math.sin(player.yaw)
    );

    player.velocity.copy(
        forward.multiplyScalar(forwardSpeed)
        .add(
            right.multiplyScalar(lateralSpeed)
        )
    );

    /* TOP SPEED */

    if(player.velocity.length()>MAX_SPEED){

        player.velocity.setLength(
            MAX_SPEED
        );
    }

    /* REVERSE */

    if(!throttle && !brake && forwardSpeed<0){

        forwardSpeed += 15*dt;
    }

    /* TRACK EDGE */

    const nearest=
        getTrackIndexNearPosition(
            player.root.position
        );

    const center=trackPoints[nearest];

    const distanceToCenter=
        Math.hypot(
            player.root.position.x-center.x,
            player.root.position.z-center.z
        );

    /*
       Curbs barely slow the car.
       Leaving the track causes a stronger slowdown.
    */

    if(distanceToCenter >
        ROAD_WIDTH/2+CURB_WIDTH+2){

        player.velocity.multiplyScalar(
            Math.pow(.35,dt)
        );
    }else if(
        distanceToCenter >
        ROAD_WIDTH/2-1
    ){

        player.velocity.multiplyScalar(
            Math.pow(.96,dt)
        );
    }

    player.root.position.addScaledVector(
        player.velocity,
        dt
    );

    player.root.rotation.y=player.yaw;

    updateWheels(
        player,
        dt,
        steer
    );

    player.speed=
        player.velocity.length();
}

/* =========================================================
   AI
========================================================= */

function updateAI(ai,dt,index){

    if(!raceStarted || raceFinished)
        return;

    const nearest=
        getTrackIndexNearPosition(
            ai.root.position
        );

    const targetIndex=
        (nearest+
        Math.floor(
            22+
            ai.aiSkill*25
        ))%TRACK_SAMPLES;

    const target=
        trackPoints[targetIndex].clone();

    const tangent=
        trackTangents[targetIndex];

    const right=new THREE.Vector3(
        -tangent.z,
        0,
        tangent.x
    ).normalize();

    target.addScaledVector(
        right,
        ai.laneOffset
    );

    const desiredDirection=
        new THREE.Vector3()
            .subVectors(
                target,
                ai.root.position
            )
            .normalize();

    const desiredYaw=
        Math.atan2(
            -desiredDirection.x,
            -desiredDirection.z
        );

    let yawDiff=
        normalizeAngle(
            desiredYaw-ai.yaw
        );

    const maxTurn=
        (1.6+
        ai.aiSkill*.6)*dt;

    yawDiff=
        THREE.MathUtils.clamp(
            yawDiff,
            -maxTurn,
            maxTurn
        );

    ai.yaw+=yawDiff;

    /* AI speed */

    const targetSpeed=
        MAX_SPEED*
        (.72+
        ai.aiSkill*.18);

    const forward=
        new THREE.Vector3(
            -Math.sin(ai.yaw),
            0,
            -Math.cos(ai.yaw)
        );

    const desiredVelocity=
        forward.multiplyScalar(
            targetSpeed
        );

    ai.velocity.lerp(
        desiredVelocity,
        1-Math.pow(.045,dt)
    );

    /* Avoid going too fast around sharp turns */

    const curveA=
        trackTangents[
            nearest
        ];

    const curveB=
        trackTangents[
            (nearest+18)%TRACK_SAMPLES
        ];

    const bend=
        1-Math.max(
            -1,
            Math.min(
                1,
                curveA.dot(curveB)
            )
        );

    if(bend>.05){

        ai.velocity.multiplyScalar(
            Math.max(
                .72,
                1-bend*2.2*dt
            )
        );
    }

    /* Track boundaries */

    const center=
        trackPoints[nearest];

    const dist=
        Math.hypot(
            ai.root.position.x-center.x,
            ai.root.position.z-center.z
        );

    if(
        dist >
        ROAD_WIDTH/2+CURB_WIDTH+2
    ){

        ai.velocity.multiplyScalar(
            Math.pow(.3,dt)
        );
    }

    ai.root.position.addScaledVector(
        ai.velocity,
        dt
    );

    ai.root.rotation.y=ai.yaw;

    const fakeSteer=
        THREE.MathUtils.clamp(
            yawDiff*10,
            -1,
            1
        );

    updateWheels(
        ai,
        dt,
        fakeSteer
    );

    ai.speed=
        ai.velocity.length();
}

/* =========================================================
   WHEEL ANIMATION
========================================================= */

function updateWheels(car,dt,steer){

    const steeringAngle=
        steer*.34;

    const wheelRadius=.48;

    for(const wheel of car.wheels){

        if(wheel.front){

            wheel.steeringPivot.rotation.y=
                steeringAngle;
        }

        /*
           IMPORTANT:
           Only spinPivot rotates for wheel rotation.
           This prevents the wheels from wiggling while steering.
        */

        wheel.spinPivot.rotation.x +=
            car.speed*dt/wheelRadius;
    }
}

/* =========================================================
   CAR COLLISION PHYSICS
========================================================= */

function resolveCarCollisions(){

    /*
       Multiple passes make stacked cars separate cleanly.
    */

    for(let pass=0;pass<3;pass++){

        for(let i=0;i<cars.length;i++){

            for(let j=i+1;j<cars.length;j++){

                const a=cars[i];
                const b=cars[j];

                const dx=
                    b.root.position.x-
                    a.root.position.x;

                const dz=
                    b.root.position.z-
                    a.root.position.z;

                let distSq=
                    dx*dx+
                    dz*dz;

                const minDist=
                    a.collisionRadius+
                    b.collisionRadius;

                if(distSq>=minDist*minDist)
                    continue;

                let dist=Math.sqrt(distSq);

                if(dist<.001){

                    dist=.001;

                    /*
                       Stable separation direction.
                    */

                    const angle=
                        (i*17+j*31)*.1;

                    const nx=Math.cos(angle);
                    const nz=Math.sin(angle);

                    separateCars(
                        a,b,nx,nz,minDist,dist
                    );

                    continue;
                }

                const nx=dx/dist;
                const nz=dz/dist;

                separateCars(
                    a,b,nx,nz,minDist,dist
                );
            }
        }
    }
}

function separateCars(
    a,b,nx,nz,minDist,dist
){

    const overlap=
        minDist-dist;

    const totalMass=
        a.isPlayer ? 1.25 : 1;

    const aMove=
        b.isPlayer
            ? .42
            : .5;

    const bMove=
        a.isPlayer
            ? .42
            : .5;

    a.root.position.x -=
        nx*overlap*aMove;

    a.root.position.z -=
        nz*overlap*aMove;

    b.root.position.x +=
        nx*overlap*bMove;

    b.root.position.z +=
        nz*overlap*bMove;

    const rvx=
        b.velocity.x-
        a.velocity.x;

    const rvz=
        b.velocity.z-
        a.velocity.z;

    const closing=
        rvx*nx+
        rvz*nz;

    if(closing<0){

        const restitution=.24;

        const impulse=
            -(1+restitution)*
            closing/
            (1/totalMass+1);

        a.velocity.x -=
            nx*impulse/totalMass;

        a.velocity.z -=
            nz*impulse/totalMass;

        b.velocity.x +=
            nx*impulse;

        b.velocity.z +=
            nz*impulse;
    }

    /*
       Slight tangential friction makes contact feel
       physical without causing cars to spin uncontrollably.
    */

    const tx=-nz;
    const tz=nx;

    const tangentialRelative=
        rvx*tx+
        rvz*tz;

    const tangentImpulse=
        THREE.MathUtils.clamp(
            tangentialRelative*.035,
            -2,
            2
        );

    a.velocity.x +=
        tx*tangentImpulse;

    a.velocity.z +=
        tz*tangentImpulse;

    b.velocity.x -=
        tx*tangentImpulse;

    b.velocity.z -=
        tz*tangentImpulse;
}

/* =========================================================
   ANGLE
========================================================= */

function normalizeAngle(a){

    while(a>Math.PI)
        a-=Math.PI*2;

    while(a<-Math.PI)
        a+=Math.PI*2;

    return a;
}

/* =========================================================
   POSITION
========================================================= */

function updatePosition(){

    const progress=
        getProgressForPosition(
            player.root.position
        );

    player.progress=progress;

    const racers=cars.map(car=>{

        const p=
            getProgressForPosition(
                car.root.position
            );

        return {
            car,
            progress:p
        };
    });

    racers.sort((a,b)=>{

        if(a.progress>b.progress)
            return -1;

        return 1;
    });

    const playerPosition=
        racers.findIndex(
            x=>x.car===player
        )+1;

    document.getElementById("position")
        .innerHTML=
        playerPosition+
        "<small> / "+
        TOTAL_CARS+
        "</small>";
}

/* =========================================================
   FINISH
========================================================= */

function checkFinish(){

    if(raceFinished)
        return;

    const progress=
        getProgressForPosition(
            player.root.position
        );

    /*
       Do not allow finishing immediately at the starting line.
    */

    if(
        progress>.96 &&
        raceTime>5
    ){

        raceFinished=true;

        document.getElementById("message")
            .innerHTML=
            "FINISH!<small>"+
            formatTime(raceTime)+
            "</small>";

        flashScreen();

        if(
            !localStorage.hyperTrackBest ||
            raceTime<
            Number(localStorage.hyperTrackBest)
        ){

            localStorage.hyperTrackBest=
                raceTime;
        }
    }
}

/* =========================================================
   TIMER
========================================================= */

function formatTime(t){

    const min=
        Math.floor(t/60);

    const sec=
        Math.floor(t%60);

    const ms=
        Math.floor(
            (t%1)*1000
        );

    return String(min).padStart(2,"0")+
        ":"+
        String(sec).padStart(2,"0")+
        "."+
        String(ms).padStart(3,"0");
}

function updateTimer(){

    document.getElementById("time")
        .textContent=
        formatTime(raceTime);

    const best=
        localStorage.hyperTrackBest;

    document.getElementById("best")
        .textContent=
        best
            ? "BEST "+formatTime(Number(best))
            : "BEST --:--.---";
}

/* =========================================================
   COUNTDOWN
========================================================= */

function updateCountdown(dt){

    if(raceStarted)
        return;

    countdownTimer+=dt;

    const remaining=
        3-Math.floor(countdownTimer);

    if(remaining>0){

        document.getElementById("countdown")
            .textContent=remaining;

    }else{

        document.getElementById("countdown")
            .textContent="GO!";

        if(countdownTimer>3.7){

            raceStarted=true;

            document.getElementById("countdown")
                .textContent="";
        }
    }
}

/* =========================================================
   SPEED / GEAR
========================================================= */

function updateSpeedHUD(){

    const kmh=
        Math.round(
            player.speed*3.6
        );

    document.getElementById("speed")
        .textContent=kmh;

    let gear;

    if(kmh<5){
        gear="N";
    }else if(kmh<55){
        gear="1";
    }else if(kmh<105){
        gear="2";
    }else if(kmh<165){
        gear="3";
    }else if(kmh<240){
        gear="4";
    }else if(kmh<330){
        gear="5";
    }else if(kmh<450){
        gear="6";
    }else{
        gear="7";
    }

    document.getElementById("gear")
        .textContent=gear;

    const lines=
        document.getElementById("speedLines");

    const intensity=
        THREE.MathUtils.clamp(
            (player.speed/MAX_SPEED-.45)*1.8,
            0,
            .65
        );

    lines.style.opacity=intensity;
}

/* =========================================================
   CAMERA
========================================================= */

const cameraLook=new THREE.Vector3();

function updateCamera(dt){

    const speedRatio=
        THREE.MathUtils.clamp(
            player.speed/MAX_SPEED,
            0,
            1
        );

    const forward=
        new THREE.Vector3(
            -Math.sin(player.yaw),
            0,
            -Math.cos(player.yaw)
        );

    const cameraTarget=
        player.root.position.clone()
            .addScaledVector(
                forward,
                10
            );

    const desired=
        player.root.position.clone()
            .addScaledVector(
                forward,
                -10.5
            );

    desired.y=
        player.root.position.y+
        4.2+
        speedRatio*1.2;

    camera.position.lerp(
        desired,
        1-Math.pow(.0005,dt)
    );

    cameraLook.lerp(
        cameraTarget,
        1-Math.pow(.0003,dt)
    );

    camera.lookAt(cameraLook);

    camera.fov=
        THREE.MathUtils.lerp(
            72,
            96,
            speedRatio
        );

    camera.updateProjectionMatrix();
}

/* =========================================================
   MINIMAP
========================================================= */

const mapCanvas=
    document.getElementById("mapCanvas");

const mapCtx=
    mapCanvas.getContext("2d");

function updateMinimap(){

    mapCtx.clearRect(
        0,0,
        mapCanvas.width,
        mapCanvas.height
    );

    mapCtx.fillStyle=
        "rgba(8,11,15,.9)";

    mapCtx.fillRect(
        0,0,
        mapCanvas.width,
        mapCanvas.height
    );

    let minX=Infinity;
    let maxX=-Infinity;
    let minZ=Infinity;
    let maxZ=-Infinity;

    for(const p of trackPoints){

        minX=Math.min(minX,p.x);
        maxX=Math.max(maxX,p.x);

        minZ=Math.min(minZ,p.z);
        maxZ=Math.max(maxZ,p.z);
    }

    const pad=30;

    const sx=
        (mapCanvas.width-pad*2)/
        (maxX-minX);

    const sz=
        (mapCanvas.height-pad*2)/
        (maxZ-minZ);

    const scale=
        Math.min(sx,sz);

    function map(p){

        return {
            x:
                pad+
                (p.x-minX)*scale+
                (mapCanvas.width-
                pad*2-
                (maxX-minX)*scale)/2,

            y:
                pad+
                (p.z-minZ)*scale+
                (mapCanvas.height-
                pad*2-
                (maxZ-minZ)*scale)/2
        };
    }

    mapCtx.lineWidth=10;
    mapCtx.strokeStyle="#33383d";
    mapCtx.beginPath();

    for(let i=0;i<trackPoints.length;i++){

        const p=map(trackPoints[i]);

        if(i===0)
            mapCtx.moveTo(p.x,p.y);
        else
            mapCtx.lineTo(p.x,p.y);
    }

    mapCtx.closePath();
    mapCtx.stroke();

    mapCtx.lineWidth=3;
    mapCtx.strokeStyle="#f2f2f2";
    mapCtx.beginPath();

    for(let i=0;i<trackPoints.length;i++){

        const p=map(trackPoints[i]);

        if(i===0)
            mapCtx.moveTo(p.x,p.y);
        else
            mapCtx.lineTo(p.x,p.y);
    }

    mapCtx.closePath();
    mapCtx.stroke();

    for(const car of cars){

        const p=map(car.root.position);

        mapCtx.beginPath();

        mapCtx.arc(
            p.x,
            p.y,
            car.isPlayer?5:3,
            0,
            Math.PI*2
        );

        mapCtx.fillStyle=
            car.isPlayer
                ? "#ff7b18"
                : "#ffffff";

        mapCtx.fill();
    }
}

/* =========================================================
   AUDIO
========================================================= */

let audioCtx=null;

let engineOsc1=null;
let engineOsc2=null;
let engineGain=null;
let engineFilter=null;

let brakeNoise=null;
let brakeGain=null;
let brakeFilter=null;

function initAudio(){

    if(audioCtx){

        if(audioCtx.state==="suspended")
            audioCtx.resume();

        return;
    }

    try{

        audioCtx=
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

        /* ENGINE */

        engineOsc1=
            audioCtx.createOscillator();

        engineOsc2=
            audioCtx.createOscillator();

        engineGain=
            audioCtx.createGain();

        engineFilter=
            audioCtx.createBiquadFilter();

        engineOsc1.type="sawtooth";
        engineOsc2.type="triangle";

        engineFilter.type="lowpass";
        engineFilter.frequency.value=1800;

        engineGain.gain.value=.0001;

        engineOsc1.connect(engineFilter);
        engineOsc2.connect(engineFilter);
        engineFilter.connect(engineGain);
        engineGain.connect(audioCtx.destination);

        engineOsc1.start();
        engineOsc2.start();

        /* BRAKE NOISE */

        const buffer=
            audioCtx.createBuffer(
                1,
                audioCtx.sampleRate*2,
                audioCtx.sampleRate
            );

        const data=
            buffer.getChannelData(0);

        for(let i=0;i<data.length;i++){
            data[i]=Math.random()*2-1;
        }

        brakeNoise=
            audioCtx.createBufferSource();

        brakeNoise.buffer=buffer;
        brakeNoise.loop=true;

        brakeFilter=
            audioCtx.createBiquadFilter();

        brakeFilter.type="bandpass";
        brakeFilter.frequency.value=1500;
        brakeFilter.Q.value=.8;

        brakeGain=
            audioCtx.createGain();

        brakeGain.gain.value=.0001;

        brakeNoise
            .connect(brakeFilter)
            .connect(brakeGain)
            .connect(audioCtx.destination);

        brakeNoise.start();

    }catch(err){

        console.warn(
            "Audio unavailable:",
            err
        );
    }
}

function updateAudio(){

    if(!audioCtx)
        return;

    const speedRatio=
        THREE.MathUtils.clamp(
            player.speed/MAX_SPEED,
            0,
            1
        );

    const throttle=
        throttleInput();

    const brake=
        brakeInput();

    const rpm=
        0.08+
        speedRatio*.92+
        throttle*.14;

    const now=
        audioCtx.currentTime;

    /*
       High-pitched F1-style procedural engine.
    */

    engineOsc1.frequency.setTargetAtTime(
        65+
        rpm*720,
        now,
        .035
    );

    engineOsc2.frequency.setTargetAtTime(
        130+
        rpm*980,
        now,
        .035
    );

    engineFilter.frequency.setTargetAtTime(
        700+
        rpm*1800,
        now,
        .04
    );

    const engineVolume=
        player.speed>1
            ? .045+
              speedRatio*.12+
              throttle*.055
            : .012;

    engineGain.gain.setTargetAtTime(
        engineVolume,
        now,
        .05
    );

    /* BRAKES */

    const brakeAmount=
        brake &&
        player.speed>15
            ? .08+
              speedRatio*.17
            : .0001;

    brakeGain.gain.setTargetAtTime(
        brakeAmount,
        now,
        .025
    );

    brakeFilter.frequency.setTargetAtTime(
        700+
        speedRatio*2300,
        now,
        .04
    );
}

/* =========================================================
   INITIALIZATION
========================================================= */

buildTrack(currentTrack);
createCars();

document.getElementById("trackName")
    .textContent=tracks[currentTrack].name;

resetRace();

/* =========================================================
   MAIN LOOP
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    const dt=
        Math.min(
            clock.getDelta(),
            .033
        );

    updateCountdown(dt);

    if(raceStarted && !raceFinished){

        raceTime+=dt;

        updatePlayer(dt);

        for(let i=1;i<cars.length;i++){
            updateAI(cars[i],dt,i);
        }

        /*
           Actual contact physics between ALL cars.
        */
        resolveCarCollisions();

        updatePosition();
        checkFinish();
    }

    updateTimer();
    updateSpeedHUD();
    updateCamera(dt);
    updateMinimap();
    updateAudio();

    renderer.render(
        scene,
        camera
    );
}

animate();

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener("resize",()=>{

    camera.aspect=
        innerWidth/innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        innerWidth,
        innerHeight
    );

    renderer.setPixelRatio(
        Math.min(devicePixelRatio,1.7)
    );
});
